name: Search Core format diagnostic

on:
  push:
    branches:
      - agent/search-core-performance-profile

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Print exact Prettier diff
        shell: bash
        run: |
          npx prettier --write components/search-core-workspace.tsx
          git diff -- components/search-core-workspace.tsx
          exit 1
