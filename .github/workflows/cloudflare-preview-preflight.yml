name: Cloudflare Preview preflight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-preview-provider
  cancel-in-progress: false

jobs:
  preflight:
    name: read-only provider inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Require protected Cloudflare credentials
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" || -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "Cloudflare Preview credentials are not configured."
            exit 1
          fi

      - name: Verify Cloudflare identity
        run: npx wrangler whoami

      - name: Inventory private R2 buckets
        run: npx wrangler r2 bucket list

      - name: Inventory Queues and DLQs
        run: npx wrangler queues list

      - name: Validate Worker bundle without deployment
        run: npm run worker:dry-run
