name: Cloudflare Preview provider

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/cloudflare-preview-preflight.yml"
      - "wrangler.jsonc"
      - "worker-configuration.d.ts"
      - "workers/import-queue/**"
      - "lib/hosted-cloudflare-import-queue-consumer.ts"
      - "lib/hosted-cloudflare-import-queue-consumer.test.ts"
      - "lib/hosted-import-queue-consumer.ts"
      - "lib/hosted-import-queue-consumer.test.ts"
      - "lib/hosted-import-preview-worker-runtime.ts"
      - "lib/neon-durable-import-preview-staging-repository.ts"
      - "lib/durable-import-preview-staging-sink.ts"
      - "lib/bounded-import-preview-processor.ts"
      - "tests/hosted-preview-connected-queue-worker.test.ts"
      - "lib/hosted-import-activation-worker.ts"
      - "lib/hosted-import-activation-worker.test.ts"
      - "lib/hosted-aggregate-refresh-worker.ts"
      - "lib/hosted-aggregate-refresh-worker.test.ts"
      - "lib/cloudflare-import-queue-producer.ts"
      - "lib/cloudflare-import-queue-producer.test.ts"
      - "lib/neon-import-activation-repository.ts"
      - "lib/neon-import-activation-repository.test.ts"
      - "lib/neon-aggregate-refresh-repository.ts"
      - "lib/neon-aggregate-refresh-repository.test.ts"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: cloudflare-preview-worker-commission
  cancel-in-progress: false

env:
  EXPECTED_ACCOUNT_BUCKET: dna-racing-import-preview
  EXPECTED_ACTIVATION_QUEUE: dna-racing-import-preview
  EXPECTED_ACTIVATION_QUEUE_ID: df7408e1d697475db4dbcdda1aa3e247
  EXPECTED_ACTIVATION_DLQ: dna-racing-import-preview-dlq
  EXPECTED_ACTIVATION_DLQ_ID: d944db6239104c3fa94beb3c7bd158ff
  EXPECTED_DATABASE_OWNER_ID: ae7e0493-eb8d-4de8-b1f6-9815d1c0c8a3
  EXPECTED_DATABASE_ROLE: dna_app_runtime
  EXPECTED_DATABASE_NAME: neondb
  EXPECTED_WORKER_NAME: dna-racing-import-preview

jobs:
  preflight:
    name: Runtime and provider preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUTHORIZED_CLERK_USER_ID: ${{ secrets.AUTHORIZED_CLERK_USER_ID }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DNA_DATABASE_OWNER_ID: ${{ secrets.DNA_DATABASE_OWNER_ID }}
      DNA_CONNECTED_PREVIEW_ACCEPTANCE: "1"
      DNA_IMPORT_DEAD_LETTER_QUEUE_NAME: dna-racing-import-preview-dlq
      DNA_IMPORT_QUEUE_ID: df7408e1d697475db4dbcdda1aa3e247
      DNA_IMPORT_QUEUE_NAME: dna-racing-import-preview
      DNA_R2_BUCKET_NAME: dna-racing-import-preview
      DNA_R2_ACCESS_KEY_ID: ${{ secrets.DNA_R2_ACCESS_KEY_ID }}
      DNA_R2_SECRET_ACCESS_KEY: ${{ secrets.DNA_R2_SECRET_ACCESS_KEY }}
      WORKER_SECRETS_FILE: /tmp/dna-racing-preview-worker-secrets.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Validate runtime secret contract
        run: |
          node --input-type=module <<'NODE'
          const required = [
            "AUTHORIZED_CLERK_USER_ID",
            "CLOUDFLARE_ACCOUNT_ID",
            "CLOUDFLARE_API_TOKEN",
            "DATABASE_URL",
            "DNA_DATABASE_OWNER_ID",
            "DNA_R2_ACCESS_KEY_ID",
            "DNA_R2_SECRET_ACCESS_KEY",
          ];
          for (const name of required) {
            const value = process.env[name];
            if (!value || value.trim() !== value || value.length > 4096) {
              throw new Error(name + " is missing, padded, or unexpectedly large");
            }
          }
          if (!process.env.AUTHORIZED_CLERK_USER_ID.startsWith("user_")) {
            throw new Error("AUTHORIZED_CLERK_USER_ID must be a Clerk user ID");
          }
          if (process.env.DNA_DATABASE_OWNER_ID !== process.env.EXPECTED_DATABASE_OWNER_ID) {
            throw new Error("DNA_DATABASE_OWNER_ID does not match the commissioned Preview owner");
          }
          if (!/^[a-f0-9]{32}$/.test(process.env.CLOUDFLARE_ACCOUNT_ID)) {
            throw new Error("CLOUDFLARE_ACCOUNT_ID has an unexpected shape");
          }
          const databaseUrl = new URL(process.env.DATABASE_URL);
          if (!["postgres:", "postgresql:"].includes(databaseUrl.protocol)) {
            throw new Error("DATABASE_URL is not PostgreSQL");
          }
          if (decodeURIComponent(databaseUrl.username) !== process.env.EXPECTED_DATABASE_ROLE) {
            throw new Error("DATABASE_URL does not authenticate as the runtime role");
          }
          if (!databaseUrl.password) {
            throw new Error("DATABASE_URL has no runtime credential");
          }
          if (!databaseUrl.hostname.includes("-pooler.") || !databaseUrl.hostname.endsWith(".neon.tech")) {
            throw new Error("DATABASE_URL is not a pooled Neon connection");
          }
          if (databaseUrl.pathname !== "/" + process.env.EXPECTED_DATABASE_NAME) {
            throw new Error("DATABASE_URL targets the wrong database");
          }
          if (databaseUrl.searchParams.get("sslmode") !== "require") {
            throw new Error("DATABASE_URL must require TLS");
          }
          console.log("Validated seven bounded Preview runtime secrets.");
          NODE
      - name: Verify least-privilege Neon runtime
        run: |
          node --input-type=module <<'NODE'
          import { neon } from "@neondatabase/serverless";
          const sql = neon(process.env.DATABASE_URL);
          const rows = await sql.query(
            "SELECT current_user::text AS current_user, current_database()::text AS current_database, rolcanlogin, rolsuper, rolcreatedb, rolcreaterole, rolinherit, rolreplication, rolbypassrls, rolconnlimit FROM pg_catalog.pg_roles WHERE rolname = current_user",
          );
          if (rows.length !== 1) {
            throw new Error("Runtime role was not visible through the runtime connection");
          }
          const role = rows[0];
          if (
            role.current_user !== process.env.EXPECTED_DATABASE_ROLE ||
            role.current_database !== process.env.EXPECTED_DATABASE_NAME ||
            role.rolcanlogin !== true ||
            role.rolsuper !== false ||
            role.rolcreatedb !== false ||
            role.rolcreaterole !== false ||
            role.rolinherit !== false ||
            role.rolreplication !== false ||
            role.rolbypassrls !== false ||
            Number(role.rolconnlimit) !== 10
          ) {
            throw new Error("Neon runtime role does not match the commissioned least-privilege contract");
          }
          console.log("Verified pooled Preview connectivity and least-privilege Neon role.");
          NODE
      - name: Verify private empty R2 bucket access
        run: |
          node --input-type=module <<'NODE'
          import { ListObjectsV2Command, S3Client } from "@aws-sdk/client-s3";
          const client = new S3Client({
            region: "auto",
            endpoint: "https://" + process.env.CLOUDFLARE_ACCOUNT_ID + ".r2.cloudflarestorage.com",
            credentials: {
              accessKeyId: process.env.DNA_R2_ACCESS_KEY_ID,
              secretAccessKey: process.env.DNA_R2_SECRET_ACCESS_KEY,
            },
          });
          const response = await client.send(
            new ListObjectsV2Command({
              Bucket: process.env.EXPECTED_ACCOUNT_BUCKET,
              MaxKeys: 1,
            }),
          );
          if (Number(response.KeyCount ?? 0) !== 0) {
            throw new Error("Preview R2 bucket is not empty before first owner-approved upload");
          }
          console.log("Verified bucket-scoped R2 credentials and empty Preview storage.");
          NODE
      - name: Verify Cloudflare queue inventory
        run: |
          node --input-type=module <<'NODE'
          const headers = {
            Authorization: "Bearer " + process.env.CLOUDFLARE_API_TOKEN,
            "Content-Type": "application/json",
          };
          const base =
            "https://api.cloudflare.com/client/v4/accounts/" +
            process.env.CLOUDFLARE_ACCOUNT_ID;
          async function read(path) {
            const response = await fetch(base + path, { headers });
            const body = await response.json();
            if (!response.ok || body.success !== true) {
              throw new Error("Cloudflare read failed for " + path);
            }
            return body.result;
          }
          const queue = await read(
            "/queues/" + process.env.EXPECTED_ACTIVATION_QUEUE_ID,
          );
          const dlq = await read(
            "/queues/" + process.env.EXPECTED_ACTIVATION_DLQ_ID,
          );
          if (queue.queue_name !== process.env.EXPECTED_ACTIVATION_QUEUE) {
            throw new Error("Activation queue identity changed");
          }
          if (dlq.queue_name !== process.env.EXPECTED_ACTIVATION_DLQ) {
            throw new Error("Activation DLQ identity changed");
          }
          const consumers = await read(
            "/queues/" + process.env.EXPECTED_ACTIVATION_QUEUE_ID + "/consumers",
          );
          const unexpected = consumers.filter(
            (consumer) =>
              consumer.type !== "worker" ||
              consumer.queue_name !== process.env.EXPECTED_ACTIVATION_QUEUE ||
              (consumer.script_name != null &&
                consumer.script_name !== process.env.EXPECTED_WORKER_NAME),
          );
          if (unexpected.length > 0 || consumers.length > 1) {
            throw new Error("Activation queue has an unexpected consumer");
          }
          console.log("Verified immutable Queue/DLQ identities and safe consumer inventory.");
          NODE
      - name: Validate Worker bundle without deployment
        run: npm run worker:dry-run
      - name: Materialize ephemeral Worker secrets
        if: github.event_name == 'workflow_dispatch'
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";
          const names = [
            "AUTHORIZED_CLERK_USER_ID",
            "CLOUDFLARE_ACCOUNT_ID",
            "CLOUDFLARE_API_TOKEN",
            "DATABASE_URL",
            "DNA_DATABASE_OWNER_ID",
            "DNA_R2_ACCESS_KEY_ID",
            "DNA_R2_SECRET_ACCESS_KEY",
          ];
          const secrets = Object.fromEntries(
            names.map((name) => {
              const value = process.env[name];
              if (!value) throw new Error("Missing " + name);
              return [name, value];
            }),
          );
          writeFileSync(process.env.WORKER_SECRETS_FILE, JSON.stringify(secrets), {
            encoding: "utf8",
            mode: 0o600,
          });
          NODE
      - name: Deploy protected queue-only Worker
        if: github.event_name == 'workflow_dispatch'
        run: >
          npx wrangler deploy
          --config wrangler.jsonc
          --strict
          --experimental-provision=false
          --experimental-auto-create=false
          --secrets-file "${WORKER_SECRETS_FILE}"
      - name: Remove ephemeral Worker secrets
        if: always() && github.event_name == 'workflow_dispatch'
        run: rm -f -- "${WORKER_SECRETS_FILE}"
      - name: Verify deployed secret bindings
        if: github.event_name == 'workflow_dispatch'
        run: |
          npx wrangler secret list --config wrangler.jsonc > "${RUNNER_TEMP}/worker-secret-list.json"
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const expected = new Set([
            "AUTHORIZED_CLERK_USER_ID",
            "CLOUDFLARE_ACCOUNT_ID",
            "CLOUDFLARE_API_TOKEN",
            "DATABASE_URL",
            "DNA_DATABASE_OWNER_ID",
            "DNA_R2_ACCESS_KEY_ID",
            "DNA_R2_SECRET_ACCESS_KEY",
          ]);
          const bindings = JSON.parse(
            readFileSync(process.env.RUNNER_TEMP + "/worker-secret-list.json", "utf8"),
          );
          const actual = new Set(bindings.map((binding) => binding.name));
          if (
            actual.size !== expected.size ||
            [...expected].some((name) => !actual.has(name))
          ) {
            throw new Error("Deployed Worker secret bindings do not match the runtime contract");
          }
          console.log("Verified seven deployed Worker secret bindings without reading their values.");
          NODE
      - name: Verify exact queue consumer controls
        if: github.event_name == 'workflow_dispatch'
        run: |
          node --input-type=module <<'NODE'
          const response = await fetch(
            "https://api.cloudflare.com/client/v4/accounts/" +
              process.env.CLOUDFLARE_ACCOUNT_ID +
              "/queues/" +
              process.env.EXPECTED_ACTIVATION_QUEUE_ID +
              "/consumers",
            {
              headers: {
                Authorization: "Bearer " + process.env.CLOUDFLARE_API_TOKEN,
                "Content-Type": "application/json",
              },
            },
          );
          const body = await response.json();
          if (!response.ok || body.success !== true) {
            throw new Error("Could not verify the deployed activation consumer");
          }
          const consumers = body.result.filter(
            (consumer) =>
              consumer.type === "worker" &&
              consumer.queue_name === process.env.EXPECTED_ACTIVATION_QUEUE &&
              (consumer.script_name == null ||
                consumer.script_name === process.env.EXPECTED_WORKER_NAME),
          );
          if (body.result.length !== 1 || consumers.length !== 1) {
            throw new Error("Activation queue does not have exactly one expected Worker consumer");
          }
          const consumer = consumers[0];
          const settings = consumer.settings ?? {};
          const deadLetterQueue =
            consumer.dead_letter_queue ?? consumer.dead_letter_queue_name;
          if (
            deadLetterQueue !== process.env.EXPECTED_ACTIVATION_DLQ ||
            Number(settings.batch_size) !== 1 ||
            Number(settings.max_concurrency) !== 1 ||
            Number(settings.max_retries) !== 3 ||
            Number(settings.max_wait_time_ms) !== 5000
          ) {
            throw new Error("Deployed queue consumer controls differ from the protected contract");
          }
          console.log("Verified queue-only Worker, DLQ, retry, batch, wait, and concurrency controls.");
          NODE
      - name: Record deployed Worker inventory
        if: github.event_name == 'workflow_dispatch'
        run: npx wrangler deployments list --config wrangler.jsonc
      - name: Prove cleanup-bounded live Queue and Worker path
        if: github.event_name == 'workflow_dispatch'
        run: npx vitest run tests/hosted-preview-connected-queue-worker.test.ts
      - name: Record commissioning outcome on Issue 120
        if: always() && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh issue comment 120
          --body "Cloudflare Preview Worker commissioning run
          https://github.com/LatinMaestro/DNA-Racing-Intelligence/actions/runs/${{ github.run_id }}
          completed with job status ${{ job.status }}. No secret values are included."
