name: Temporary format breeding foundation

on:
  push:
    branches:
      - codex/breeding-elite-performance-foundation

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/breeding-elite-performance-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write domain/breeding-recommendation.ts tests/breeding-recommendation.test.ts
      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet -- domain/breeding-recommendation.ts tests/breeding-recommendation.test.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add domain/breeding-recommendation.ts tests/breeding-recommendation.test.ts
          git commit -m "Format breeding recommendation foundation"
          git push origin HEAD:codex/breeding-elite-performance-foundation
