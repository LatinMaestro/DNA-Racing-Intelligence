name: TEMPORARY chat extra pairs
on:
  push:
    branches: [temporary/chat-breeding-program-2026-09-11]
    paths:
      - tests/temporary-chat-extra-pairs.test.ts
      - .github/workflows/temporary-chat-extra-pairs.yml
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      TEMP_EXTRA_PAIRS: '1'
      DNA_OPEN_LAB_API_KEY_1: ${{ secrets.DNA_OPEN_LAB_API_KEY_1 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci --ignore-scripts
      - run: npx vitest run tests/temporary-chat-extra-pairs.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: temporary-chat-extra-pairs
          path: artifacts/temporary-chat-extra-pairs.json
          retention-days: 3