name: Race preactivation evidence manifest migration

on:
  pull_request:
    paths:
      - "database/migrations/**"
      - ".github/workflows/race-preactivation-evidence-manifest-migration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dna_racing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dna_racing_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: dna_racing_test
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply complete migration chain
        run: |
          for migration in database/migrations/*.up.sql; do
            psql --set ON_ERROR_STOP=1 --file "$migration"
          done
      - name: Run Race preactivation evidence manifest smoke test
        run: >-
          psql --set ON_ERROR_STOP=1 --file
          database/migrations/0068_race_preactivation_evidence_manifest.smoke.sql
      - name: Reverse Race preactivation evidence manifest migration
        run: >-
          psql --set ON_ERROR_STOP=1 --file
          database/migrations/0068_race_preactivation_evidence_manifest.down.sql
      - name: Verify Race preactivation evidence manifest rollback
        run: >-
          psql --set ON_ERROR_STOP=1 --file
          database/migrations/0068_race_preactivation_evidence_manifest.removal.sql
