name: TEMPORARY chat refined breeding pairs
on:
  push:
    branches: [temporary/chat-breeding-program-2026-09-11]
    paths:
      - tests/temporary-chat-refined-breeding-pairs-2026-09-12.test.ts
      - .github/workflows/temporary-chat-refined-breeding-pairs-2026-09-12.yml
permissions:
  contents: read
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TEMP_REFINED_PAIRS: '1'
      DNA_OPEN_LAB_API_KEY_1: ${{ secrets.DNA_OPEN_LAB_API_KEY_1 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx vitest run tests/temporary-chat-refined-breeding-pairs-2026-09-12.test.ts --reporter=verbose
      - uses: actions/upload-artifact@v4
        with:
          name: temporary-chat-refined-breeding-pairs
          path: artifacts/temporary-chat-refined-breeding-pairs-2026-09-12.json
          retention-days: 3
          if-no-files-found: error
