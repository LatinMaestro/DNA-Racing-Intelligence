name: DNA population history read-only audit

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact current main commit to audit
        required: true
        type: string
      execute_read_only_audit:
        description: Confirm private read-only population history audit
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: dna-population-history-read-only-audit
  cancel-in-progress: false

jobs:
  exact-main-read-only-audit:
    name: Exact-main private all-mode population audit
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      AUTHORIZED_CLERK_USER_ID: ${{ secrets.AUTHORIZED_CLERK_USER_ID }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ANALYTICS_API_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_API_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DNA_POPULATION_HISTORY_READ_ONLY_AUDIT: "1"
      DNA_DATABASE_OWNER_ID: ${{ secrets.DNA_DATABASE_OWNER_ID }}
      DNA_R2_ACCESS_KEY_ID: ${{ secrets.DNA_R2_ACCESS_KEY_ID }}
      DNA_R2_BUCKET_NAME: dna-racing-import-preview
      DNA_R2_SECRET_ACCESS_KEY: ${{ secrets.DNA_R2_SECRET_ACCESS_KEY }}
      DNA_R2_STORAGE_CLASS: Standard
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
    steps:
      - name: Require exact main and explicit read-only arm
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "This private audit may only run from main."
            exit 1
          fi
          if [[ "${{ inputs.execute_read_only_audit }}" != "true" ]]; then
            echo "The private read-only audit was not explicitly armed."
            exit 1
          fi
          if [[ ! "${{ inputs.expected_main_sha }}" =~ ^[a-f0-9]{40}$ ]] || \
             [[ "${{ inputs.expected_main_sha }}" != "${GITHUB_SHA}" ]]; then
            echo "The expected main commit does not match the dispatched commit."
            exit 1
          fi
      - name: Checkout exact head
        uses: actions/checkout@v4
      - name: Prove audit head is current main
        shell: bash
        run: |
          git fetch --no-tags origin main
          if [[ "$(git rev-parse HEAD)" != "${GITHUB_SHA}" ]] || \
             [[ "$(git rev-parse origin/main)" != "${GITHUB_SHA}" ]]; then
            echo "The read-only audit head is no longer current main."
            exit 1
          fi
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Validate private configuration without exposure
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const required = [
            "AUTHORIZED_CLERK_USER_ID",
            "CLOUDFLARE_ACCOUNT_ID",
            "CLOUDFLARE_ANALYTICS_API_TOKEN",
            "CLOUDFLARE_API_TOKEN",
            "DATABASE_URL",
            "DNA_DATABASE_OWNER_ID",
            "DNA_R2_ACCESS_KEY_ID",
            "DNA_R2_BUCKET_NAME",
            "DNA_R2_SECRET_ACCESS_KEY",
            "DNA_R2_STORAGE_CLASS",
            "NEON_API_KEY",
            "NEON_PROJECT_ID",
          ];
          const invalid = required.filter((name) => {
            const value = process.env[name];
            return !value || value.trim() !== value || value.length > 4096;
          });
          if (invalid.length > 0) {
            throw new Error("Missing or invalid private settings: " + invalid.join(", "));
          }
          if (process.env.DNA_R2_STORAGE_CLASS !== "Standard") {
            throw new Error("Only R2 Standard storage is allowed.");
          }
          console.log("Validated private read-only settings without printing values.");
          NODE
      - name: Audit durable all-mode population authority
        run: >-
          npx vitest run --no-file-parallelism
          tests/hosted-preview-connected-population-history-audit.test.ts
      - name: Prove exact main remained unchanged
        if: always()
        shell: bash
        run: |
          git fetch --no-tags origin main
          if [[ "$(git rev-parse origin/main)" != "${GITHUB_SHA}" ]]; then
            echo "Main changed during the read-only audit."
            exit 1
          fi
