name: Temporary aggregate target source format

on:
  pull_request:
    paths:
      - "lib/neon-aggregate-refresh-target-source.ts"
      - ".github/workflows/tmp-aggregate-target-source-format.yml"

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Print canonical source
        run: npx prettier lib/neon-aggregate-refresh-target-source.ts
