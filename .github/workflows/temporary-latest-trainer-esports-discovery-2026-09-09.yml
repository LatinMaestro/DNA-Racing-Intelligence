name: TEMPORARY latest Trainer and Esports discovery 2026-09-09

on:
  push:
    branches:
      - temporary/r2-evidence-analysis-do-not-merge-2026-09-05
    paths:
      - tests/temporary-latest-trainer-esports-discovery-2026-09-09.test.ts
      - .github/workflows/temporary-latest-trainer-esports-discovery-2026-09-09.yml

permissions:
  contents: read

concurrency:
  group: temporary-latest-trainer-esports-discovery-2026-09-09
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DNA_OPEN_LAB_API_KEY_1: ${{ secrets.DNA_OPEN_LAB_API_KEY_1 }}
      DNA_TEMP_LATEST_DISCOVERY_20260909: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx vitest run --no-file-parallelism tests/temporary-latest-trainer-esports-discovery-2026-09-09.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: temporary-latest-trainer-esports-discovery-${{ github.run_id }}
          path: /tmp/temporary-latest-trainer-esports-discovery-2026-09-09.json
          if-no-files-found: error
          retention-days: 3
