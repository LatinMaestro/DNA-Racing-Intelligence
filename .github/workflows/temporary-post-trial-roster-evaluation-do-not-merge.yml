name: TEMPORARY post-trial roster evaluation - DO NOT MERGE
on:
  push:
    branches: [temporary/r2-evidence-analysis-do-not-merge-2026-09-05]
    paths:
      - tests/temporary-post-trial-roster-evaluation-do-not-merge.test.ts
      - .github/workflows/temporary-post-trial-roster-evaluation-do-not-merge.yml
permissions:
  contents: read
jobs:
  evaluate:
    name: TEMPORARY ONLY - post-trial roster evaluation - DO NOT MERGE
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEMP_POST_TRIAL_ROSTER_EVAL: '1'
      DNA_OPEN_LAB_API_KEY_1: ${{ secrets.DNA_OPEN_LAB_API_KEY_1 }}
    steps:
      - name: Guard temporary branch
        run: '[[ "$GITHUB_REF" == "refs/heads/temporary/r2-evidence-analysis-do-not-merge-2026-09-05" ]]'
      - uses: actions/checkout@v4
        with:
          ref: temporary/r2-evidence-analysis-do-not-merge-2026-09-05
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx vitest run tests/temporary-post-trial-roster-evaluation-do-not-merge.test.ts --reporter=verbose
      - run: git diff --exit-code && git diff --cached --exit-code
      - uses: actions/upload-artifact@v4
        with:
          name: TEMPORARY-DO-NOT-MERGE-post-trial-roster-evaluation-${{ github.run_id }}
          path: artifacts/temporary-post-trial-roster-evaluation.json
          retention-days: 1
          if-no-files-found: error
