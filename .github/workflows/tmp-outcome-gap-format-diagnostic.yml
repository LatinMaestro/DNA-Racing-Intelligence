name: Temporary outcome gap format diagnostic

on:
  push:
    branches:
      - codex/race-merge-outcome-gap-reconciliation

permissions:
  contents: read

jobs:
  format-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Show exact Prettier delta
        shell: bash
        run: |
          npx prettier --write lib/dna-population-core-outcome-gap-plan.ts
          git diff --no-ext-diff --unified=8 -- lib/dna-population-core-outcome-gap-plan.ts
