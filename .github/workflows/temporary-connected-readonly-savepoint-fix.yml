name: Temporary connected read-only savepoint fix

on:
  push:
    branches:
      - agent/hosted-archive-aggregate-worker-composition
    paths:
      - .github/workflows/temporary-connected-readonly-savepoint-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: agent/hosted-archive-aggregate-worker-composition
          fetch-depth: 0

      - name: Patch connected rollback-only session and remove this temporary workflow
        shell: python
        run: |
          from pathlib import Path

          test_path = Path("tests/hosted-preview-connected-queue-worker.test.ts")
          text = test_path.read_text()
          old = '        if (normalized === "BEGIN ISOLATION LEVEL SERIALIZABLE") {\n'
          new = (
              '        if (\n'
              '          normalized === "BEGIN ISOLATION LEVEL SERIALIZABLE" ||\n'
              '          normalized === "BEGIN ISOLATION LEVEL SERIALIZABLE READ ONLY"\n'
              '        ) {\n'
          )
          if text.count(old) != 1:
              raise SystemExit("Expected exactly one connected BEGIN transaction guard")
          test_path.write_text(text.replace(old, new, 1))
          Path(".github/workflows/temporary-connected-readonly-savepoint-fix.yml").unlink()

      - name: Commit the focused repair
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/hosted-preview-connected-queue-worker.test.ts .github/workflows/temporary-connected-readonly-savepoint-fix.yml
          git diff --cached --exit-code && { echo "No repair delta was produced"; exit 1; } || true
          git commit -m "Fix connected read-only transaction harness"
          git push origin HEAD:agent/hosted-archive-aggregate-worker-composition
