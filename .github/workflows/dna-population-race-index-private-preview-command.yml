name: DNA population race index bounded private Preview command

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact current main commit to advance
        required: true
        type: string
      maximum_receipts:
        description: Maximum immutable P5 receipts in this bounded slice
        required: true
        default: "100"
        type: choice
        options:
          - "25"
          - "50"
          - "100"
      execute_bounded_private_preview_index:
        description: Confirm bounded persistent writes to private Preview only
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: dna-population-race-index-bounded-private-preview
  cancel-in-progress: false

jobs:
  exact-main-bounded-private-preview-index:
    name: Exact-main bounded private Preview population index
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: preview
    outputs:
      terminal_status: ${{ steps.terminal.outputs.status }}
    env:
      AUTHORIZED_CLERK_USER_ID: ${{ secrets.AUTHORIZED_CLERK_USER_ID }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ANALYTICS_API_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_API_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DNA_DATABASE_OWNER_ID: ${{ secrets.DNA_DATABASE_OWNER_ID }}
      DNA_POPULATION_RACE_INDEX_MAXIMUM_RECEIPTS: ${{ github.event_name == 'schedule' && '100' || inputs.maximum_receipts }}
      DNA_POPULATION_RACE_INDEX_PRIVATE_PREVIEW_COMMAND: "1"
      DNA_POPULATION_R2_COMPACTION_PRIVATE_PREVIEW_COMMAND: "1"
      DNA_POPULATION_R2_IDENTITY_BACKFILL_PRIVATE_PREVIEW_COMMAND: "1"
      DNA_R2_ACCESS_KEY_ID: ${{ secrets.DNA_R2_ACCESS_KEY_ID }}
      DNA_R2_BUCKET_NAME: dna-racing-import-preview
      DNA_R2_SECRET_ACCESS_KEY: ${{ secrets.DNA_R2_SECRET_ACCESS_KEY }}
      DNA_R2_STORAGE_CLASS: Standard
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
    steps:
      - name: Require current main and authorized private Preview trigger
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "This bounded private Preview index may only run from main."
            exit 1
          fi
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ "${{ inputs.execute_bounded_private_preview_index }}" != "true" ]]; then
              echo "The bounded private Preview index was not explicitly armed."
              exit 1
            fi
            if [[ ! "${{ inputs.expected_main_sha }}" =~ ^[a-f0-9]{40}$ ]] || \
               [[ "${{ inputs.expected_main_sha }}" != "${GITHUB_SHA}" ]]; then
              echo "The expected main commit does not match the dispatched commit."
              exit 1
            fi
          elif [[ "${GITHUB_EVENT_NAME}" != "schedule" ]]; then
            echo "The private Preview index trigger is not authorized."
            exit 1
          fi
      - name: Checkout exact head
        uses: actions/checkout@v4
      - name: Prove dispatch head is current main
        shell: bash
        run: |
          git fetch --no-tags origin main
          if [[ "$(git rev-parse HEAD)" != "${GITHUB_SHA}" ]] || \
             [[ "$(git rev-parse origin/main)" != "${GITHUB_SHA}" ]]; then
            echo "The population index head is no longer current main."
            exit 1
          fi
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Validate private Preview configuration without exposure
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const required = [
            "AUTHORIZED_CLERK_USER_ID",
            "CLOUDFLARE_ACCOUNT_ID",
            "CLOUDFLARE_ANALYTICS_API_TOKEN",
            "CLOUDFLARE_API_TOKEN",
            "DATABASE_URL",
            "DNA_DATABASE_OWNER_ID",
            "DNA_POPULATION_RACE_INDEX_MAXIMUM_RECEIPTS",
            "DNA_R2_ACCESS_KEY_ID",
            "DNA_R2_BUCKET_NAME",
            "DNA_R2_SECRET_ACCESS_KEY",
            "DNA_R2_STORAGE_CLASS",
            "NEON_API_KEY",
            "NEON_PROJECT_ID",
          ];
          const invalid = required.filter((name) => {
            const value = process.env[name];
            return !value || value.trim() !== value || value.length > 4096;
          });
          if (invalid.length > 0) {
            throw new Error("Missing or invalid private Preview settings: " + invalid.join(", "));
          }
          if (!/^(?:25|50|100)$/.test(process.env.DNA_POPULATION_RACE_INDEX_MAXIMUM_RECEIPTS)) {
            throw new Error("The receipt bound is invalid.");
          }
          if (process.env.DNA_R2_STORAGE_CLASS !== "Standard") {
            throw new Error("Only R2 Standard storage is allowed.");
          }
          console.log("Validated private Preview settings without printing values.");
          NODE
      - name: Install PostgreSQL client
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
      - name: Acquire masked short-lived Preview migration binding
        shell: bash
        run: |
          runtime_identity="$(node --input-type=module <<'NODE'
          const parsed = new URL(process.env.DATABASE_URL);
          const name = decodeURIComponent(parsed.pathname.replace(/^\//, ""));
          if (!/^[a-zA-Z0-9_]{1,63}$/.test(name)) {
            throw new Error("The private Preview database name is invalid.");
          }
          const endpoint = parsed.hostname.split(".")[0]?.replace(/-pooler$/, "");
          if (!/^ep-[a-z0-9-]{3,128}$/.test(endpoint ?? "")) {
            throw new Error("The private Preview endpoint identity is invalid.");
          }
          process.stdout.write(`${name}\t${endpoint}`);
          NODE
          )"
          IFS=$'\t' read -r database_name endpoint_id <<< "${runtime_identity}"
          export DNA_RUNTIME_ENDPOINT_ID="${endpoint_id}"
          branch_id="$(npx --yes neon@6.0.0 api \
            "/projects/${NEON_PROJECT_ID}/endpoints" \
            --output json --no-color 2>/dev/null | node --input-type=module -e '
              let body = "";
              for await (const chunk of process.stdin) body += chunk;
              const parsed = JSON.parse(body);
              const matches = (parsed.endpoints ?? []).filter(
                (endpoint) => endpoint?.id === process.env.DNA_RUNTIME_ENDPOINT_ID,
              );
              if (matches.length !== 1 ||
                  !/^[a-z0-9-]{3,128}$/.test(matches[0]?.branch_id ?? "")) {
                throw new Error("The runtime Preview branch is unavailable.");
              }
              process.stdout.write(matches[0].branch_id);
            ')"
          migration_url="$(npx --yes neon@6.0.0 connection-string "${branch_id}" \
            --project-id "${NEON_PROJECT_ID}" \
            --role-name neondb_owner \
            --database-name "${database_name}" \
            --no-color 2>/dev/null)"
          if [[ ! "${migration_url}" =~ ^postgres(ql)?://[^[:space:]]+$ ]]; then
            echo "The short-lived Preview migration binding is invalid."
            exit 1
          fi
          echo "::add-mask::${migration_url}"
          echo "DNA_MIGRATION_DATABASE_URL=${migration_url}" >> "${GITHUB_ENV}"
      - name: Apply population index migrations only when absent
        shell: bash
        run: |
          installed="$(psql "${DNA_MIGRATION_DATABASE_URL}" -At --set ON_ERROR_STOP=1 \
            --command "SELECT to_regprocedure('dna.read_dna_population_race_index_generation(uuid,text)') IS NOT NULL")"
          if [[ "${installed}" != "t" ]]; then
            psql "${DNA_MIGRATION_DATABASE_URL}" --set ON_ERROR_STOP=1 \
              --file database/migrations/0112_dna_population_race_index_generation.up.sql
          fi
          psql "${DNA_MIGRATION_DATABASE_URL}" --set ON_ERROR_STOP=1 \
            --file database/migrations/0113_dna_population_race_index_storage_relief.up.sql
          compact_installed="$(psql "${DNA_MIGRATION_DATABASE_URL}" -At --set ON_ERROR_STOP=1 \
            --command "SELECT to_regprocedure('dna.finalize_dna_population_race_index_r2_compaction(uuid,text,text,timestamp with time zone)') IS NOT NULL")"
          if [[ "${compact_installed}" != "t" ]]; then
            psql "${DNA_MIGRATION_DATABASE_URL}" --set ON_ERROR_STOP=1 \
              --file database/migrations/0114_dna_population_race_index_r2_compaction.up.sql
          fi
      - name: Prove population index migrations on private Preview
        shell: bash
        run: |
          psql "${DNA_MIGRATION_DATABASE_URL}" --set ON_ERROR_STOP=1 \
            --set skip_runtime_role=1 --file \
            database/migrations/0112_dna_population_race_index_generation.smoke.sql
          psql "${DNA_MIGRATION_DATABASE_URL}" --set ON_ERROR_STOP=1 \
            --file database/migrations/0113_dna_population_race_index_storage_relief.smoke.sql
          psql "${DNA_MIGRATION_DATABASE_URL}" --set ON_ERROR_STOP=1 \
            --set skip_runtime_role=1 --file \
            database/migrations/0114_dna_population_race_index_r2_compaction.smoke.sql
      - name: Compact legacy Neon race payload into R2
        id: compact
        shell: bash
        run: |
          deadline_epoch="$(( $(date +%s) + 1200 ))"
          status=""
          chunk_number=0
          while (( $(date +%s) < deadline_epoch )); do
            chunk_number="$(( chunk_number + 1 ))"
            echo "Starting bounded R2 population compaction chunk ${chunk_number}."
            output_file="$(mktemp)"
            DNA_POPULATION_R2_COMPACTION_ATTEMPTED_AT="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" \
              npx vitest run --no-file-parallelism \
                tests/hosted-preview-connected-population-r2-compaction-command.test.ts \
              | tee "${output_file}"
            progress_json="$(sed -n 's/^.*DNA_POPULATION_R2_COMPACTION_PROGRESS=//p' "${output_file}" | tail -n 1)"
            rm -f "${output_file}"
            status="$(PROGRESS_JSON="${progress_json}" node --input-type=module <<'NODE'
          const progress = JSON.parse(process.env.PROGRESS_JSON ?? "");
          if (!["advanced", "complete", "held"].includes(progress.status)) {
            throw new Error("The R2 compaction emitted an invalid progress status.");
          }
          if (progress.status === "advanced" &&
              !(progress.afterCompactedRaceCount > progress.beforeCompactedRaceCount)) {
            throw new Error("The R2 compaction did not advance its durable count.");
          }
          if (progress.status === "complete" &&
              (progress.afterCompactedRaceCount !== progress.uniqueRaceCount ||
               progress.storageLayout !== "r2_chunked_v1")) {
            throw new Error("The R2 compaction completion proof is inconsistent.");
          }
          if (progress.status === "held" &&
              progress.afterCompactedRaceCount !== progress.beforeCompactedRaceCount) {
            throw new Error("The R2 compaction capacity hold changed durable counts.");
          }
          process.stdout.write(progress.status);
          NODE
            )"
            if [[ "${status}" == "complete" || "${status}" == "held" ]]; then
              break
            fi
            git fetch --quiet --no-tags origin main
            if [[ "$(git rev-parse origin/main)" != "${GITHUB_SHA}" ]]; then
              echo "Main changed during R2 population compaction."
              exit 1
            fi
          done
          if [[ ! "${status}" =~ ^(advanced|complete|held)$ ]]; then
            echo "The R2 compaction did not emit a terminal status."
            exit 1
          fi
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
      - name: Retire verified legacy Neon population payload
        id: retire
        if: steps.compact.outputs.status == 'complete'
        shell: bash
        run: |
          generation_id="$(psql "${DNA_MIGRATION_DATABASE_URL}" -At --set ON_ERROR_STOP=1 \
            --set owner_id="${DNA_DATABASE_OWNER_ID}" \
            --command "SELECT generation_id FROM dna.dna_population_race_index_generation WHERE owner_id = :'owner_id'::uuid")"
          if [[ ! "${generation_id}" =~ ^[a-f0-9]{64}$ ]]; then
            echo "The population generation authority is unavailable."
            exit 1
          fi
          retired="$(psql "${DNA_MIGRATION_DATABASE_URL}" -At --set ON_ERROR_STOP=1 \
            --set owner_id="${DNA_DATABASE_OWNER_ID}" \
            --set generation_id="${generation_id}" \
            --command "SELECT legacy_storage_retired_at IS NOT NULL FROM dna.dna_population_race_index_generation WHERE owner_id = :'owner_id'::uuid AND generation_id = :'generation_id'")"
          if [[ "${retired}" == "f" ]]; then
            proof="$(psql "${DNA_MIGRATION_DATABASE_URL}" -AtF '|' --set ON_ERROR_STOP=1 \
              --set owner_id="${DNA_DATABASE_OWNER_ID}" \
              --set generation_id="${generation_id}" \
              --command "SELECT generation_count, compact_identity_count, r2_manifest_row_count, legacy_race_count FROM dna.retire_dna_population_race_index_legacy_storage(:'owner_id'::uuid, :'generation_id', clock_timestamp())")"
            IFS='|' read -r generations identities manifest_rows legacy_rows <<< "${proof}"
            if [[ "${generations}" != "1" ]] || [[ "${identities}" != "0" ]] || \
               [[ ! "${manifest_rows}" =~ ^[1-9][0-9]*$ ]] || \
               [[ "${manifest_rows}" != "${legacy_rows}" ]]; then
              echo "The legacy retirement equivalence proof is invalid."
              exit 1
            fi
          elif [[ "${retired}" != "t" ]]; then
            echo "The legacy retirement state is invalid."
            exit 1
          fi
          remaining="$(psql "${DNA_MIGRATION_DATABASE_URL}" -At --set ON_ERROR_STOP=1 \
            --command "SELECT count(*) FROM dna.dna_population_race_index_race")"
          if [[ "${remaining}" != "0" ]]; then
            echo "Legacy Neon race payload remains after verified retirement."
            exit 1
          fi
          echo "Verified R2 cutover; legacy Neon payload rows are 0."
          echo "status=complete" >> "${GITHUB_OUTPUT}"
      - name: Remove migration binding from subsequent steps
        if: always()
        shell: bash
        run: echo "DNA_MIGRATION_DATABASE_URL=" >> "${GITHUB_ENV}"
      - name: Rebuild compact identities from verified R2 chunks
        id: identity
        if: steps.retire.outputs.status == 'complete'
        shell: bash
        run: |
          deadline_epoch="$(( $(date +%s) + 1200 ))"
          status=""
          chunk_number=0
          while (( $(date +%s) < deadline_epoch )); do
            chunk_number="$(( chunk_number + 1 ))"
            echo "Starting bounded R2 identity chunk ${chunk_number}."
            output_file="$(mktemp)"
            DNA_POPULATION_R2_IDENTITY_BACKFILL_ATTEMPTED_AT="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" \
              npx vitest run --no-file-parallelism \
                tests/hosted-preview-connected-population-r2-identity-backfill-command.test.ts \
              | tee "${output_file}"
            progress_json="$(sed -n 's/^.*DNA_POPULATION_R2_IDENTITY_BACKFILL_PROGRESS=//p' "${output_file}" | tail -n 1)"
            rm -f "${output_file}"
            status="$(PROGRESS_JSON="${progress_json}" node --input-type=module <<'NODE'
          const progress = JSON.parse(process.env.PROGRESS_JSON ?? "");
          if (!["advanced", "complete", "held"].includes(progress.status)) {
            throw new Error("The R2 identity backfill emitted an invalid status.");
          }
          if (progress.status === "advanced" &&
              progress.afterIdentityChunkCount !== progress.beforeIdentityChunkCount + 1) {
            throw new Error("The R2 identity checkpoint did not advance exactly once.");
          }
          if (progress.status === "complete" &&
              progress.afterIdentityChunkCount !== progress.r2ChunkCount) {
            throw new Error("The R2 identity completion proof is inconsistent.");
          }
          if (progress.status === "held" &&
              progress.afterIdentityChunkCount !== progress.beforeIdentityChunkCount) {
            throw new Error("The R2 identity capacity hold changed durable counts.");
          }
          process.stdout.write(progress.status);
          NODE
            )"
            if [[ "${status}" == "complete" || "${status}" == "held" ]]; then
              break
            fi
            git fetch --quiet --no-tags origin main
            if [[ "$(git rev-parse origin/main)" != "${GITHUB_SHA}" ]]; then
              echo "Main changed during R2 identity backfill."
              exit 1
            fi
          done
          if [[ ! "${status}" =~ ^(advanced|complete|held)$ ]]; then
            echo "The R2 identity backfill did not emit a terminal status."
            exit 1
          fi
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
      - name: Advance bounded immutable P5 slices for at most 20 minutes
        if: steps.identity.outputs.status == 'complete'
        id: advance
        shell: bash
        run: |
          deadline_epoch="$(( $(date +%s) + 1200 ))"
          slice_number=0
          status=""
          while (( $(date +%s) < deadline_epoch )); do
            slice_number="$(( slice_number + 1 ))"
            echo "Starting durable population-index slice ${slice_number}."
            output_file="$(mktemp)"
            DNA_POPULATION_RACE_INDEX_ATTEMPTED_AT="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" \
              npx vitest run --no-file-parallelism \
                tests/hosted-preview-connected-population-race-index-command.test.ts \
              | tee "${output_file}"
            progress_json="$(sed -n 's/^.*DNA_POPULATION_RACE_INDEX_PROGRESS=//p' "${output_file}" | tail -n 1)"
            rm -f "${output_file}"
            status="$(PROGRESS_JSON="${progress_json}" node --input-type=module <<'NODE'
          const progress = JSON.parse(process.env.PROGRESS_JSON ?? "");
          if (progress.status !== "advanced" &&
              progress.status !== "complete" &&
              progress.status !== "held") {
            throw new Error("The population index emitted an invalid progress status.");
          }
          if (progress.status === "advanced" &&
              !(progress.afterRequestOrdinal > progress.beforeRequestOrdinal)) {
            throw new Error("The population index did not advance its durable checkpoint.");
          }
          if (progress.status === "held" &&
              (!/^provider_capacity_[a-z0-9_]+$/.test(progress.reason ?? "") ||
               progress.processedReceiptCount !== 0 ||
               progress.afterRequestOrdinal !== progress.beforeRequestOrdinal)) {
            throw new Error("The population index emitted an invalid capacity hold.");
          }
          process.stdout.write(progress.status);
          NODE
            )"
            if [[ "${status}" == "complete" ]]; then
              echo "The immutable P5 population index is complete."
              break
            fi
            if [[ "${status}" == "held" ]]; then
              echo "The immutable P5 population index held safely at the free-capacity guard; a later schedule will retry."
              break
            fi
            git fetch --quiet --no-tags origin main
            if [[ "$(git rev-parse origin/main)" != "${GITHUB_SHA}" ]]; then
              echo "Main changed between durable population-index slices."
              exit 1
            fi
          done
          if [[ ! "${status}" =~ ^(advanced|complete|held)$ ]]; then
            echo "The population index did not emit a terminal status."
            exit 1
          fi
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
      - name: Select continuation status
        id: terminal
        if: always()
        shell: bash
        env:
          COMPACTION_STATUS: ${{ steps.compact.outputs.status }}
          IDENTITY_STATUS: ${{ steps.identity.outputs.status }}
          ADVANCE_STATUS: ${{ steps.advance.outputs.status }}
        run: |
          if [[ "${COMPACTION_STATUS}" != "complete" ]]; then
            status="${COMPACTION_STATUS}"
          elif [[ "${IDENTITY_STATUS}" != "complete" ]]; then
            status="${IDENTITY_STATUS}"
          else
            status="${ADVANCE_STATUS}"
          fi
          if [[ ! "${status}" =~ ^(advanced|complete|held)$ ]]; then
            echo "The population continuation status is unavailable."
            exit 1
          fi
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
      - name: Prove exact main remained unchanged
        if: always()
        shell: bash
        run: |
          git fetch --no-tags origin main
          if [[ "$(git rev-parse origin/main)" != "${GITHUB_SHA}" ]]; then
            echo "Main changed during the private Preview population index command."
            exit 1
          fi

  requeue-private-preview-index:
    name: Requeue unfinished private Preview population index
    needs: exact-main-bounded-private-preview-index
    if: >-
      ${{ needs['exact-main-bounded-private-preview-index'].result == 'success' &&
          (needs['exact-main-bounded-private-preview-index'].outputs.terminal_status == 'advanced' ||
           needs['exact-main-bounded-private-preview-index'].outputs.terminal_status == 'held') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
      - name: Wait before bounded continuation
        shell: bash
        env:
          TERMINAL_STATUS: ${{ needs['exact-main-bounded-private-preview-index'].outputs.terminal_status }}
        run: |
          if [[ "${TERMINAL_STATUS}" == "held" ]]; then
            sleep_seconds=300
          else
            sleep_seconds=60
          fi
          echo "Waiting ${sleep_seconds} seconds before the next bounded private Preview attempt."
          sleep "${sleep_seconds}"
      - name: Requeue only unchanged main without a competing run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags origin main
          if [[ "$(git rev-parse HEAD)" != "${GITHUB_SHA}" ]] || \
             [[ "$(git rev-parse origin/main)" != "${GITHUB_SHA}" ]]; then
            echo "Main changed before continuation; the next exact-main run must restart the chain."
            exit 0
          fi

          active_other_count="$(gh api \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/dna-population-race-index-private-preview-command.yml/runs?per_page=20" \
            --jq "[.workflow_runs[] | select(.id != ${GITHUB_RUN_ID} and .status != \"completed\")] | length")"
          if [[ ! "${active_other_count}" =~ ^[0-9]+$ ]]; then
            echo "The competing-run proof was invalid."
            exit 1
          fi
          if (( active_other_count > 0 )); then
            echo "Another population-index run is already active; no duplicate continuation was dispatched."
            exit 0
          fi

          jq -n --arg sha "${GITHUB_SHA}" '{
            ref: "main",
            inputs: {
              expected_main_sha: $sha,
              maximum_receipts: "100",
              execute_bounded_private_preview_index: "true"
            }
          }' | gh api --method POST \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/dna-population-race-index-private-preview-command.yml/dispatches" \
            --input -
          echo "Dispatched the next exact-main bounded private Preview attempt."
