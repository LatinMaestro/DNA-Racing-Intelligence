name: temporary live DNA team endpoint audit

on:
  push:
    branches:
      - temporary/chat-live-map-audit-2026-09-20-do-not-merge

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test vault-header preset status reads
        run: |
          node <<'NODE'
          const fs=require('fs');
          async function post(body){
            const r=await fetch('https://api.dnaracing.run/fbike/esports/preset/status',{
              method:'POST',
              headers:{'content-type':'application/json','x-vault':'0x5a29c2f20faf3f5160d27efa5100aa10e9bb934d'},
              body:JSON.stringify(body)
            });
            return {status:r.status,text:await r.text()};
          }
          (async()=>{
            const team_id='953adec8ad';
            const result={fetchedAt:new Date().toISOString(),team_id,maps:{}};
            for(const map_name of ['Anchor','Glory','Measure','Miracles']){
              result.maps[map_name]=await post({team_id,map_name});
            }
            fs.writeFileSync('vault-header-preset-status.json',JSON.stringify(result,null,2));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: vault-header-preset-status
          path: vault-header-preset-status.json
          retention-days: 1
