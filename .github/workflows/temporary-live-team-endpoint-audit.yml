name: temporary live DNA team endpoint audit

on:
  push:
    branches:
      - temporary/chat-live-map-audit-2026-09-20-do-not-merge

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Pull public Latin Racing event assignment state
        run: |
          node <<'NODE'
          const fs=require('fs');
          const base='https://api.dnaracing.run/fbike/esports';
          async function post(path,body){
            const r=await fetch(base+path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
            const text=await r.text(); let json=null; try{json=JSON.parse(text)}catch{}
            return {status:r.status,text,json};
          }
          (async()=>{
            const team_id='953adec8ad';
            const events=await post('/team/events',{team_id});
            const result={fetchedAt:new Date().toISOString(),team_id,events,assignments:{}};
            const list=events?.json?.result??[];
            for(const e of list){
              const event_id=e.event_id??e.id;
              if(!event_id) continue;
              result.assignments[event_id]={event:await post('/event',{event_id}),slots:{}};
              for(const map_slot of [1,2,3]){
                result.assignments[event_id].slots[map_slot]=await post('/event/assign_status',{event_id,map_slot});
              }
            }
            fs.writeFileSync('public-event-assignments.json',JSON.stringify(result,null,2));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: public-event-assignments
          path: public-event-assignments.json
          retention-days: 1
