name: temporary live DNA team endpoint audit

on:
  push:
    branches:
      - temporary/chat-live-map-audit-2026-09-20-do-not-merge

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Pull raw public Latin Racing events
        run: |
          node <<'NODE'
          const fs=require('fs');
          (async()=>{
            const r=await fetch('https://api.dnaracing.run/fbike/esports/team/events',{
              method:'POST',
              headers:{'content-type':'application/json'},
              body:JSON.stringify({team_id:'953adec8ad'})
            });
            const text=await r.text();
            let json=null; try{json=JSON.parse(text)}catch{}
            fs.writeFileSync('latin-racing-events-raw.json',JSON.stringify({
              fetchedAt:new Date().toISOString(),status:r.status,text,json
            },null,2));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: latin-racing-events-raw
          path: latin-racing-events-raw.json
          retention-days: 1
