name: DNA Open Lab supplemental Core read-model migration

on:
  pull_request:
    paths:
      - "database/migrations/**"
      - ".github/workflows/dna-open-lab-supplemental-core-read-model-migration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dna_racing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dna_racing_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: dna_racing_test
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply complete migration chain
        run: |
          for migration in database/migrations/*.up.sql; do
            psql --set ON_ERROR_STOP=1 --file "$migration"
          done
      - name: Run supplemental Core read-model smoke test
        run: >-
          psql --set ON_ERROR_STOP=1 --file
          database/migrations/0073_dna_open_lab_supplemental_core_read_model.smoke.sql
      - name: Reverse supplemental Core read-model migration
        run: >-
          psql --set ON_ERROR_STOP=1 --file
          database/migrations/0073_dna_open_lab_supplemental_core_read_model.down.sql
      - name: Verify supplemental Core read-model removal
        run: >-
          psql --set ON_ERROR_STOP=1 --file
          database/migrations/0073_dna_open_lab_supplemental_core_read_model.removal.sql
