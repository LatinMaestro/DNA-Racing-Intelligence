name: Temporary Prettier canonicalizer

on:
  push:
    branches:
      - agent/spillable-race-archive-reconstruction

permissions:
  contents: write

jobs:
  canonicalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply canonical formatting and remove temporary workflow
        run: |
          npx prettier --write lib/race-archive-external-sort.ts
          rm .github/workflows/temporary-prettier-diagnostic.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/race-archive-external-sort.ts .github/workflows/temporary-prettier-diagnostic.yml
          git commit -m "Apply canonical external-sort formatting"
          git push origin HEAD:agent/spillable-race-archive-reconstruction
