name: Temporary Prettier diagnostic

on:
  pull_request:
    paths:
      - "tests/dna-owner-car-1v1-tournament-refresh-workflow.test.ts"
      - "tests/dna-owner-dispatch-relay-workflow.test.ts"
      - "tests/hosted-owner-car-1v1-tournament-refresh.test.ts"
      - ".github/workflows/pr-prettier-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Print exact Prettier diff
        shell: bash
        run: |
          npx prettier --write             tests/dna-owner-car-1v1-tournament-refresh-workflow.test.ts             tests/dna-owner-dispatch-relay-workflow.test.ts             tests/hosted-owner-car-1v1-tournament-refresh.test.ts
          git diff --             tests/dna-owner-car-1v1-tournament-refresh-workflow.test.ts             tests/dna-owner-dispatch-relay-workflow.test.ts             tests/hosted-owner-car-1v1-tournament-refresh.test.ts
