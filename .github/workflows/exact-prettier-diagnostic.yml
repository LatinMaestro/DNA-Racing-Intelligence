name: Exact Prettier diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/exact-prettier-diagnostic.yml"
      - "tests/hosted-preview-connected-queue-worker.test.ts"

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Emit exact formatted file
        run: |
          npx prettier tests/hosted-preview-connected-queue-worker.test.ts --write
          base64 -w 0 tests/hosted-preview-connected-queue-worker.test.ts
