name: Temporary protected Preview Worker recommission

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/temporary-preview-worker-recommission.yml"

permissions:
  contents: read

concurrency:
  group: cloudflare-preview-worker-commission
  cancel-in-progress: false

env:
  EXPECTED_ACCOUNT_BUCKET: dna-racing-import-preview
  EXPECTED_ACTIVATION_QUEUE: dna-racing-import-preview
  EXPECTED_ACTIVATION_QUEUE_ID: df7408e1d697475db4dbcdda1aa3e247
  EXPECTED_ACTIVATION_DLQ: dna-racing-import-preview-dlq
  EXPECTED_ACTIVATION_DLQ_ID: d944db6239104c3fa94beb3c7bd158ff
  EXPECTED_DATABASE_OWNER_ID: ae7e0493-eb8d-4de8-b1f6-9815d1c0c8a3
  EXPECTED_DATABASE_ROLE: dna_app_runtime
  EXPECTED_DATABASE_NAME: neondb
  EXPECTED_WORKER_NAME: dna-racing-import-preview
  WORKER_SECRETS_FILE: /tmp/dna-racing-preview-worker-secrets.json

jobs:
  recommission:
    name: Recommission queue-only Worker
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'LatinMaestro' &&
      github.head_ref == 'agent/hosted-archive-aggregate-worker-composition'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUTHORIZED_CLERK_USER_ID: ${{ secrets.AUTHORIZED_CLERK_USER_ID }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DNA_DATABASE_OWNER_ID: ${{ secrets.DNA_DATABASE_OWNER_ID }}
      DNA_CONNECTED_PREVIEW_ACCEPTANCE: "1"
      DNA_IMPORT_DEAD_LETTER_QUEUE_NAME: dna-racing-import-preview-dlq
      DNA_IMPORT_QUEUE_ID: df7408e1d697475db4dbcdda1aa3e247
      DNA_IMPORT_QUEUE_NAME: dna-racing-import-preview
      DNA_R2_BUCKET_NAME: dna-racing-import-preview
      DNA_R2_ACCESS_KEY_ID: ${{ secrets.DNA_R2_ACCESS_KEY_ID }}
      DNA_R2_SECRET_ACCESS_KEY: ${{ secrets.DNA_R2_SECRET_ACCESS_KEY }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Validate protected Preview contract
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const required = [
            "AUTHORIZED_CLERK_USER_ID",
            "CLOUDFLARE_ACCOUNT_ID",
            "CLOUDFLARE_API_TOKEN",
            "DATABASE_URL",
            "DNA_DATABASE_OWNER_ID",
            "DNA_R2_ACCESS_KEY_ID",
            "DNA_R2_SECRET_ACCESS_KEY",
          ];
          for (const name of required) {
            const value = process.env[name];
            if (!value || value.trim() !== value || value.length > 4096) {
              throw new Error(name + " is missing, padded, or unexpectedly large");
            }
          }
          if (!process.env.AUTHORIZED_CLERK_USER_ID.startsWith("user_")) {
            throw new Error("AUTHORIZED_CLERK_USER_ID must be a Clerk user ID");
          }
          if (process.env.DNA_DATABASE_OWNER_ID !== process.env.EXPECTED_DATABASE_OWNER_ID) {
            throw new Error("DNA_DATABASE_OWNER_ID targets the wrong Preview owner");
          }
          if (!/^[a-f0-9]{32}$/.test(process.env.CLOUDFLARE_ACCOUNT_ID)) {
            throw new Error("CLOUDFLARE_ACCOUNT_ID has an unexpected shape");
          }
          const databaseUrl = new URL(process.env.DATABASE_URL);
          if (
            decodeURIComponent(databaseUrl.username) !== process.env.EXPECTED_DATABASE_ROLE ||
            !databaseUrl.password ||
            !databaseUrl.hostname.includes("-pooler.") ||
            !databaseUrl.hostname.endsWith(".neon.tech") ||
            databaseUrl.pathname !== "/" + process.env.EXPECTED_DATABASE_NAME ||
            databaseUrl.searchParams.get("sslmode") !== "require"
          ) {
            throw new Error("DATABASE_URL is outside the protected pooled Preview contract");
          }
          console.log("Validated protected Preview recommission contract.");
          NODE
      - name: Recover unregistered synthetic Preview evidence
        env:
          DNA_CONNECTED_PREVIEW_EVIDENCE_RESIDUE_CLEANUP: "1"
        run: >-
          npx vitest run --no-file-parallelism
          tests/hosted-preview-connected-evidence-residue-cleanup.test.ts
      - name: Verify queue and DLQ identity before deployment
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const headers = {
            Authorization: "Bearer " + process.env.CLOUDFLARE_API_TOKEN,
            "Content-Type": "application/json",
          };
          const base = "https://api.cloudflare.com/client/v4/accounts/" + process.env.CLOUDFLARE_ACCOUNT_ID;
          async function read(path) {
            const response = await fetch(base + path, { headers });
            const body = await response.json();
            if (!response.ok || body.success !== true) throw new Error("Cloudflare read failed for " + path);
            return body.result;
          }
          const queue = await read("/queues/" + process.env.EXPECTED_ACTIVATION_QUEUE_ID);
          const dlq = await read("/queues/" + process.env.EXPECTED_ACTIVATION_DLQ_ID);
          if (queue.queue_name !== process.env.EXPECTED_ACTIVATION_QUEUE) throw new Error("Preview queue identity changed");
          if (dlq.queue_name !== process.env.EXPECTED_ACTIVATION_DLQ) throw new Error("Preview DLQ identity changed");
          console.log("Verified protected Queue/DLQ identities.");
          NODE
      - name: Validate Worker bundle
        run: npm run worker:dry-run
      - name: Materialize ephemeral Worker secrets
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";
          const names = [
            "AUTHORIZED_CLERK_USER_ID",
            "CLOUDFLARE_ACCOUNT_ID",
            "CLOUDFLARE_API_TOKEN",
            "DATABASE_URL",
            "DNA_DATABASE_OWNER_ID",
            "DNA_R2_ACCESS_KEY_ID",
            "DNA_R2_SECRET_ACCESS_KEY",
          ];
          const secrets = Object.fromEntries(names.map((name) => {
            const value = process.env[name];
            if (!value) throw new Error("Missing " + name);
            return [name, value];
          }));
          writeFileSync(process.env.WORKER_SECRETS_FILE, JSON.stringify(secrets), { encoding: "utf8", mode: 0o600 });
          NODE
      - name: Deploy protected queue-only Worker
        run: >
          npx wrangler deploy
          --config wrangler.jsonc
          --strict
          --experimental-provision=false
          --experimental-auto-create=false
          --secrets-file "${WORKER_SECRETS_FILE}"
      - name: Remove ephemeral Worker secrets
        if: always()
        run: rm -f -- "${WORKER_SECRETS_FILE}"
      - name: Verify deployed consumer controls
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const response = await fetch(
            "https://api.cloudflare.com/client/v4/accounts/" + process.env.CLOUDFLARE_ACCOUNT_ID + "/queues/" + process.env.EXPECTED_ACTIVATION_QUEUE_ID + "/consumers",
            { headers: { Authorization: "Bearer " + process.env.CLOUDFLARE_API_TOKEN, "Content-Type": "application/json" } },
          );
          const body = await response.json();
          if (!response.ok || body.success !== true) throw new Error("Could not verify protected Preview consumer");
          const consumers = body.result.filter((consumer) =>
            consumer.type === "worker" &&
            consumer.queue_name === process.env.EXPECTED_ACTIVATION_QUEUE &&
            (consumer.script_name == null || consumer.script_name === process.env.EXPECTED_WORKER_NAME)
          );
          if (body.result.length !== 1 || consumers.length !== 1) throw new Error("Preview queue does not have exactly one expected Worker consumer");
          const consumer = consumers[0];
          const settings = consumer.settings ?? {};
          const deadLetterQueue = consumer.dead_letter_queue ?? consumer.dead_letter_queue_name;
          if (
            deadLetterQueue !== process.env.EXPECTED_ACTIVATION_DLQ ||
            Number(settings.batch_size) !== 1 ||
            Number(settings.max_concurrency) !== 1 ||
            Number(settings.max_retries) !== 3 ||
            Number(settings.max_wait_time_ms) !== 5000
          ) {
            throw new Error("Preview queue consumer controls differ from protected contract");
          }
          console.log("Verified queue-only Worker consumer controls.");
          NODE
      - name: Verify deployed secret binding names
        shell: bash
        run: |
          npx wrangler secret list --config wrangler.jsonc > "${RUNNER_TEMP}/worker-secret-list.json"
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const expected = new Set([
            "AUTHORIZED_CLERK_USER_ID",
            "CLOUDFLARE_ACCOUNT_ID",
            "CLOUDFLARE_API_TOKEN",
            "DATABASE_URL",
            "DNA_DATABASE_OWNER_ID",
            "DNA_R2_ACCESS_KEY_ID",
            "DNA_R2_SECRET_ACCESS_KEY",
          ]);
          const bindings = JSON.parse(readFileSync(process.env.RUNNER_TEMP + "/worker-secret-list.json", "utf8"));
          const actual = new Set(bindings.map((binding) => binding.name));
          if (actual.size !== expected.size || [...expected].some((name) => !actual.has(name))) {
            throw new Error("Protected Preview Worker secret bindings differ from contract");
          }
          console.log("Verified seven protected Preview secret binding names.");
          NODE
      - name: Record deployment inventory
        run: npx wrangler deployments list --config wrangler.jsonc
      - name: Recover post-deploy synthetic Preview evidence residue
        if: always()
        env:
          DNA_CONNECTED_PREVIEW_EVIDENCE_RESIDUE_CLEANUP: "1"
        run: >-
          npx vitest run --no-file-parallelism
          tests/hosted-preview-connected-evidence-residue-cleanup.test.ts
