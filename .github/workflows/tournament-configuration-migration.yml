name: Tournament configuration migration

on:
  pull_request:
    paths:
      - "database/migrations/0021_tournament_configuration.*.sql"
      - ".github/workflows/tournament-configuration-migration.yml"

permissions:
  contents: read

jobs:
  tournament-configuration-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dna_racing_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dna_racing_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: dna_racing_ci
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply prerequisite migrations
        shell: bash
        run: |
          set -euo pipefail
          for migration in database/migrations/000{1..9}_*.up.sql database/migrations/001{0..9}_*.up.sql database/migrations/0020_*.up.sql; do
            psql --set ON_ERROR_STOP=1 --file "$migration"
          done
      - name: Apply Tournament configuration migration
        run: psql --set ON_ERROR_STOP=1 --file database/migrations/0021_tournament_configuration.up.sql
      - name: Run Tournament configuration smoke test
        run: psql --set ON_ERROR_STOP=1 --file database/migrations/0021_tournament_configuration.smoke.sql
      - name: Reverse Tournament configuration migration
        run: psql --set ON_ERROR_STOP=1 --file database/migrations/0021_tournament_configuration.down.sql
      - name: Verify Tournament configuration removal
        run: >-
          psql --set ON_ERROR_STOP=1 --command
          "DO \$\$ BEGIN IF EXISTS (
          SELECT 1 FROM pg_proc proc
          JOIN pg_namespace namespace ON namespace.oid = proc.pronamespace
          WHERE namespace.nspname = 'dna'
          AND proc.proname = 'list_tournament_configurations'
          ) OR EXISTS (
          SELECT 1 FROM pg_class relation
          JOIN pg_namespace namespace ON namespace.oid = relation.relnamespace
          WHERE namespace.nspname = 'dna'
          AND relation.relname = 'tournament_configuration'
          ) THEN RAISE EXCEPTION 'Tournament configuration objects still exist';
          END IF; END \$\$;"
