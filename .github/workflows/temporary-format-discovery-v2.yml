name: TEMPORARY format Discovery V2
on:
  push:
    branches: [feature/cross-mode-discovery-methodology-v2]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cross-mode-discovery-methodology-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write docs/DISCOVERY_METHODOLOGY_V2.md domain/discovery-methodology.ts tests/discovery-methodology.test.ts
      - name: Commit formatting if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/DISCOVERY_METHODOLOGY_V2.md domain/discovery-methodology.ts tests/discovery-methodology.test.ts; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/DISCOVERY_METHODOLOGY_V2.md domain/discovery-methodology.ts tests/discovery-methodology.test.ts
          git commit -m "Format Discovery V2 methodology"
          git push origin HEAD:feature/cross-mode-discovery-methodology-v2
