name: Codex format Preview resume tests

on:
  pull_request:
    paths:
      - .github/workflows/codex-format-preview-resume-tests.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/invoke-activation-evidence-compaction
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format exact tests
        run: >-
          npx prettier --write
          tests/bounded-import-preview-processor.test.ts
          tests/durable-import-preview-evidence-lifecycle.test.ts
          tests/durable-import-preview-staging-sink.test.ts
          tests/hosted-import-preview-worker-runtime.test.ts
      - name: Commit formatting only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/bounded-import-preview-processor.test.ts \
            tests/durable-import-preview-evidence-lifecycle.test.ts \
            tests/durable-import-preview-staging-sink.test.ts \
            tests/hosted-import-preview-worker-runtime.test.ts
          git diff --cached --check
          git commit -m "Format Preview resume tests"
          git push origin HEAD:codex/invoke-activation-evidence-compaction