name: DNA population entrant authority autonomous completion

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact accepted current main commit
        required: true
        type: string
      accepted_boundary_status:
        description: Exact accepted durable boundary status
        required: true
        type: choice
        options:
          - ready_for_continuation
          - authority_complete
      expected_unresolved_race_count:
        description: Exact unresolved Race count from accepted readiness
        required: true
        type: string
      expected_unresolved_race_set_sha256:
        description: Exact unresolved Race authority SHA-256
        required: true
        type: string
      expected_recovered_chunk_count:
        description: Exact recovered chunk count from accepted boundary
        required: true
        type: string
      expected_recovered_race_count:
        description: Exact recovered Race count from accepted boundary
        required: true
        type: string
      expected_next_chunk_ordinal:
        description: Exact next chunk ordinal from accepted boundary
        required: true
        type: string
      expected_checkpoint_updated_at:
        description: Exact durable checkpoint timestamp from accepted boundary
        required: true
        type: string
      readiness_capacity_observed_at:
        description: Capacity timestamp from accepted boundary
        required: true
        type: string
      durable_boundary_sha256:
        description: Sanitized exact durable boundary digest
        required: true
        type: string
      execute_all_private_preview_entrant_authority:
        description: Explicitly arm autonomous private Preview completion
        required: true
        default: false
        type: boolean

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: dna-population-entrant-authority-cohort-persistence
  cancel-in-progress: false

jobs:
  exact-main-private-preview-autonomous-session:
    name: Exact-main private Preview autonomous session
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment: preview
    env:
      AUTHORIZED_CLERK_USER_ID: ${{ secrets.AUTHORIZED_CLERK_USER_ID }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ANALYTICS_API_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_API_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DNA_DATABASE_OWNER_ID: ${{ secrets.DNA_DATABASE_OWNER_ID }}
      DNA_OPEN_LAB_API_KEY_1: ${{ secrets.DNA_OPEN_LAB_API_KEY_1 }}
      DNA_OPEN_LAB_API_KEY_2: ${{ secrets.DNA_OPEN_LAB_API_KEY_2 }}
      DNA_OPEN_LAB_API_KEY_3: ${{ secrets.DNA_OPEN_LAB_API_KEY_3 }}
      DNA_POPULATION_ENTRANT_AUTHORITY_AUTONOMOUS_RUNNER: "1"
      DNA_POPULATION_ENTRANT_AUTHORITY_AUTONOMOUS_WRITE_ARM: ${{ inputs.execute_all_private_preview_entrant_authority }}
      DNA_POPULATION_ENTRANT_AUTHORITY_ACCEPTED_BOUNDARY_STATUS: ${{ inputs.accepted_boundary_status }}
      DNA_POPULATION_ENTRANT_AUTHORITY_EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
      DNA_POPULATION_ENTRANT_AUTHORITY_EXPECTED_UNRESOLVED_RACE_COUNT: ${{ inputs.expected_unresolved_race_count }}
      DNA_POPULATION_ENTRANT_AUTHORITY_EXPECTED_UNRESOLVED_RACE_SET_SHA256: ${{ inputs.expected_unresolved_race_set_sha256 }}
      DNA_POPULATION_ENTRANT_AUTHORITY_EXPECTED_RECOVERED_CHUNK_COUNT: ${{ inputs.expected_recovered_chunk_count }}
      DNA_POPULATION_ENTRANT_AUTHORITY_EXPECTED_RECOVERED_RACE_COUNT: ${{ inputs.expected_recovered_race_count }}
      DNA_POPULATION_ENTRANT_AUTHORITY_EXPECTED_NEXT_CHUNK_ORDINAL: ${{ inputs.expected_next_chunk_ordinal }}
      DNA_POPULATION_ENTRANT_AUTHORITY_EXPECTED_CHECKPOINT_UPDATED_AT: ${{ inputs.expected_checkpoint_updated_at }}
      DNA_POPULATION_ENTRANT_AUTHORITY_READINESS_CAPACITY_OBSERVED_AT: ${{ inputs.readiness_capacity_observed_at }}
      DNA_POPULATION_ENTRANT_AUTHORITY_DURABLE_BOUNDARY_SHA256: ${{ inputs.durable_boundary_sha256 }}
      DNA_R2_ACCESS_KEY_ID: ${{ secrets.DNA_R2_ACCESS_KEY_ID }}
      DNA_R2_BUCKET_NAME: dna-racing-import-preview
      DNA_R2_SECRET_ACCESS_KEY: ${{ secrets.DNA_R2_SECRET_ACCESS_KEY }}
      DNA_R2_STORAGE_CLASS: Standard
      GITHUB_TOKEN: ${{ github.token }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
    steps:
      - name: Require exact main dispatch and explicit autonomous write arm
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "This entrant autonomous workflow may only run from main."
            exit 1
          fi
          if [[ "$DNA_POPULATION_ENTRANT_AUTHORITY_AUTONOMOUS_WRITE_ARM" != "true" ]]; then
            echo "Autonomous private Preview entrant completion was not explicitly armed."
            exit 1
          fi
          if [[ "$DNA_POPULATION_ENTRANT_AUTHORITY_EXPECTED_MAIN_SHA" != "$GITHUB_SHA" ]]; then
            echo "The accepted autonomous commit does not match the dispatch head."
            exit 1
          fi
      - name: Checkout exact head
        uses: actions/checkout@v4
      - name: Prove dispatch head is current main
        shell: bash
        run: |
          git fetch --no-tags origin main
          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]] || \
             [[ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]]; then
            echo "The entrant autonomous head is no longer current main."
            exit 1
          fi
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Validate private Preview autonomous configuration without exposure
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const required = [
            "AUTHORIZED_CLERK_USER_ID", "CLOUDFLARE_ACCOUNT_ID",
            "CLOUDFLARE_API_TOKEN", "CLOUDFLARE_ANALYTICS_API_TOKEN",
            "DATABASE_URL", "DNA_DATABASE_OWNER_ID", "DNA_OPEN_LAB_API_KEY_1",
            "DNA_OPEN_LAB_API_KEY_2", "DNA_OPEN_LAB_API_KEY_3",
            "DNA_POPULATION_ENTRANT_AUTHORITY_ACCEPTED_BOUNDARY_STATUS",
            "DNA_POPULATION_ENTRANT_AUTHORITY_EXPECTED_MAIN_SHA",
            "DNA_POPULATION_ENTRANT_AUTHORITY_EXPECTED_UNRESOLVED_RACE_COUNT",
            "DNA_POPULATION_ENTRANT_AUTHORITY_EXPECTED_UNRESOLVED_RACE_SET_SHA256",
            "DNA_POPULATION_ENTRANT_AUTHORITY_EXPECTED_RECOVERED_CHUNK_COUNT",
            "DNA_POPULATION_ENTRANT_AUTHORITY_EXPECTED_RECOVERED_RACE_COUNT",
            "DNA_POPULATION_ENTRANT_AUTHORITY_EXPECTED_NEXT_CHUNK_ORDINAL",
            "DNA_POPULATION_ENTRANT_AUTHORITY_EXPECTED_CHECKPOINT_UPDATED_AT",
            "DNA_POPULATION_ENTRANT_AUTHORITY_READINESS_CAPACITY_OBSERVED_AT",
            "DNA_POPULATION_ENTRANT_AUTHORITY_DURABLE_BOUNDARY_SHA256",
            "DNA_R2_ACCESS_KEY_ID", "DNA_R2_BUCKET_NAME",
            "DNA_R2_SECRET_ACCESS_KEY", "DNA_R2_STORAGE_CLASS", "GITHUB_TOKEN",
            "NEON_API_KEY", "NEON_PROJECT_ID",
          ];
          const invalid = required.filter((name) => {
            const value = process.env[name];
            return !value || value.trim() !== value || value.length > 4096;
          });
          if (invalid.length) throw new Error("Missing or invalid autonomous settings: " + invalid.join(", "));
          if (process.env.DNA_R2_STORAGE_CLASS !== "Standard") throw new Error("Only R2 Standard is allowed.");
          if (!/^[a-f0-9]{40}$/.test(process.env.GITHUB_SHA ?? "") ||
              process.env.DNA_POPULATION_ENTRANT_AUTHORITY_EXPECTED_MAIN_SHA !== process.env.GITHUB_SHA) {
            throw new Error("The exact main binding is invalid.");
          }
          const status = process.env.DNA_POPULATION_ENTRANT_AUTHORITY_ACCEPTED_BOUNDARY_STATUS;
          if (status !== "ready_for_continuation" && status !== "authority_complete") {
            throw new Error("The accepted boundary status is invalid.");
          }
          const counts = {};
          for (const name of [
            "DNA_POPULATION_ENTRANT_AUTHORITY_EXPECTED_UNRESOLVED_RACE_COUNT",
            "DNA_POPULATION_ENTRANT_AUTHORITY_EXPECTED_RECOVERED_CHUNK_COUNT",
            "DNA_POPULATION_ENTRANT_AUTHORITY_EXPECTED_RECOVERED_RACE_COUNT",
            "DNA_POPULATION_ENTRANT_AUTHORITY_EXPECTED_NEXT_CHUNK_ORDINAL",
          ]) {
            const value = process.env[name];
            if (!/^[1-9]\d*$/.test(value) || !Number.isSafeInteger(Number(value))) throw new Error("A boundary count is invalid.");
            counts[name] = Number(value);
          }
          const unresolved = counts.DNA_POPULATION_ENTRANT_AUTHORITY_EXPECTED_UNRESOLVED_RACE_COUNT;
          const chunks = counts.DNA_POPULATION_ENTRANT_AUTHORITY_EXPECTED_RECOVERED_CHUNK_COUNT;
          const recovered = counts.DNA_POPULATION_ENTRANT_AUTHORITY_EXPECTED_RECOVERED_RACE_COUNT;
          const next = counts.DNA_POPULATION_ENTRANT_AUTHORITY_EXPECTED_NEXT_CHUNK_ORDINAL;
          if (next !== chunks + 1 || recovered > unresolved ||
              (status === "ready_for_continuation" && recovered >= unresolved) ||
              (status === "authority_complete" && recovered !== unresolved)) {
            throw new Error("The accepted boundary relationship is invalid.");
          }
          for (const name of [
            "DNA_POPULATION_ENTRANT_AUTHORITY_EXPECTED_UNRESOLVED_RACE_SET_SHA256",
            "DNA_POPULATION_ENTRANT_AUTHORITY_DURABLE_BOUNDARY_SHA256",
          ]) {
            if (!/^[a-f0-9]{64}$/.test(process.env[name])) throw new Error("A boundary digest is invalid.");
          }
          for (const name of [
            "DNA_POPULATION_ENTRANT_AUTHORITY_EXPECTED_CHECKPOINT_UPDATED_AT",
            "DNA_POPULATION_ENTRANT_AUTHORITY_READINESS_CAPACITY_OBSERVED_AT",
          ]) {
            const value = process.env[name];
            const parsed = new Date(value);
            if (Number.isNaN(parsed.getTime()) || parsed.toISOString() !== value || parsed.getTime() > Date.now()) {
              throw new Error("A boundary timestamp is invalid.");
            }
          }
          console.log("Validated autonomous entrant configuration without printing private values.");
          NODE
      - name: Publish sanitized autonomous running status
        continue-on-error: true
        env:
          DNA_STATUS_MODE: autonomous-running
          DNA_STATUS_COMMENT_ID: "5866846740"
          DNA_STATUS_RECOVERED_RACE_COUNT: ${{ inputs.expected_recovered_race_count }}
          DNA_STATUS_UNRESOLVED_RACE_COUNT: ${{ inputs.expected_unresolved_race_count }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/update-dna-runtime-status.mjs
      - name: Execute one guarded bounded private Preview session
        run: >-
          npx vitest run --no-file-parallelism
          tests/hosted-preview-connected-population-entrant-authority-autonomous-runner.test.ts
      - name: Ensure sanitized autonomous failure handoff
        if: failure()
        shell: bash
        env:
          DNA_AUTONOMOUS_FAILURE_PATH: ${{ runner.temp }}/dna-entrant-autonomous-failure.json
        run: |
          if [[ ! -s "$DNA_AUTONOMOUS_FAILURE_PATH" ]]; then
            umask 077
            printf '%s\n' '{"stage":"workflow","diagnostic":"session_receipt_unavailable"}' > "$DNA_AUTONOMOUS_FAILURE_PATH"
          fi
      - name: Publish sanitized autonomous failure status
        if: failure()
        continue-on-error: true
        env:
          DNA_STATUS_MODE: autonomous-failure
          DNA_STATUS_COMMENT_ID: "5866846740"
          DNA_STATUS_RECEIPT_PATH: ${{ runner.temp }}/dna-entrant-autonomous-failure.json
          DNA_STATUS_RECOVERED_RACE_COUNT: ${{ inputs.expected_recovered_race_count }}
          DNA_STATUS_UNRESOLVED_RACE_COUNT: ${{ inputs.expected_unresolved_race_count }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/update-dna-runtime-status.mjs
      - name: Continue only from sanitized durable handoff
        shell: bash
        env:
          DNA_AUTONOMOUS_RESULT_PATH: ${{ runner.temp }}/dna-entrant-autonomous-session.json
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";

          const token = process.env.GITHUB_TOKEN ?? "";
          const repository = process.env.GITHUB_REPOSITORY ?? "";
          const exactHead = process.env.GITHUB_SHA ?? "";
          const path = process.env.DNA_AUTONOMOUS_RESULT_PATH ?? "";
          const exactKeys = (value, keys) => {
            if (value === null || typeof value !== "object" || Array.isArray(value)) return false;
            const actual = Object.keys(value).sort();
            const expected = [...keys].sort();
            return actual.length === expected.length && actual.every((key, index) => key === expected[index]);
          };
          if (!token || !/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(repository) ||
              !/^[a-f0-9]{40}$/.test(exactHead) || !path) {
            throw new Error("Autonomous continuation context is invalid.");
          }
          let receipt;
          try {
            receipt = JSON.parse(await readFile(path, "utf8"));
          } catch {
            throw new Error("Sanitized autonomous handoff is unavailable.");
          }
          if (!exactKeys(receipt, [
            "version", "status", "boundary", "initialRecoveredRaceCount",
            "completedCohortCount", "previewOnly", "providerWritePerformed",
            "paidUsageAllowed", "preserveLastGood",
          ]) || !exactKeys(receipt.boundary, [
            "version", "status", "exactCodeHeadSha", "unresolvedRaceCount",
            "unresolvedRaceSetSha256", "recoveredChunkCount", "recoveredRaceCount",
            "nextChunkOrdinal", "checkpointUpdatedAt", "capacityObservedAt",
            "durableBoundarySha256", "previewOnly", "providerRequestPerformed",
            "persistentWritePerformed", "providerWritePerformed", "paidUsageAllowed",
          ])) {
            throw new Error("Sanitized autonomous handoff shape is invalid.");
          }
          const boundary = receipt.boundary;
          if (receipt.version !== "dna-population-entrant-authority-autonomous-runner/v1" ||
              (receipt.status !== "advanced" && receipt.status !== "authority_complete") ||
              receipt.status !== (boundary.status === "authority_complete" ? "authority_complete" : "advanced") ||
              boundary.version !== 1 || boundary.exactCodeHeadSha !== exactHead ||
              !Number.isSafeInteger(receipt.initialRecoveredRaceCount) || receipt.initialRecoveredRaceCount < 1 ||
              !Number.isSafeInteger(receipt.completedCohortCount) || receipt.completedCohortCount < 0 ||
              receipt.previewOnly !== true || receipt.providerWritePerformed !== false ||
              receipt.paidUsageAllowed !== false || receipt.preserveLastGood !== true ||
              boundary.previewOnly !== true || boundary.providerRequestPerformed !== false ||
              boundary.persistentWritePerformed !== false || boundary.providerWritePerformed !== false ||
              boundary.paidUsageAllowed !== false ||
              !Number.isSafeInteger(boundary.unresolvedRaceCount) || boundary.unresolvedRaceCount < 1 ||
              !Number.isSafeInteger(boundary.recoveredChunkCount) || boundary.recoveredChunkCount < 1 ||
              !Number.isSafeInteger(boundary.recoveredRaceCount) || boundary.recoveredRaceCount < 1 ||
              !Number.isSafeInteger(boundary.nextChunkOrdinal) || boundary.nextChunkOrdinal !== boundary.recoveredChunkCount + 1 ||
              boundary.recoveredRaceCount > boundary.unresolvedRaceCount ||
              !/^[a-f0-9]{64}$/.test(boundary.unresolvedRaceSetSha256) ||
              !/^[a-f0-9]{64}$/.test(boundary.durableBoundarySha256)) {
            throw new Error("Sanitized autonomous handoff invariants are invalid.");
          }
          for (const value of [boundary.checkpointUpdatedAt, boundary.capacityObservedAt]) {
            const parsed = new Date(value);
            if (Number.isNaN(parsed.getTime()) || parsed.toISOString() !== value || parsed.getTime() > Date.now()) {
              throw new Error("Sanitized autonomous handoff time is invalid.");
            }
          }
          if (boundary.status === "authority_complete") {
            if (boundary.recoveredRaceCount !== boundary.unresolvedRaceCount) {
              throw new Error("Completion boundary is invalid.");
            }
            console.log("Autonomous entrant authority reached exact durable completion.");
            process.exit(0);
          }
          if (boundary.status !== "ready_for_continuation" ||
              boundary.recoveredRaceCount >= boundary.unresolvedRaceCount ||
              receipt.completedCohortCount < 1) {
            throw new Error("Continuation boundary is invalid.");
          }

          const headers = {
            Accept: "application/vnd.github+json",
            Authorization: `Bearer ${token}`,
            "Content-Type": "application/json",
            "X-GitHub-Api-Version": "2022-11-28",
          };
          const mainResponse = await fetch(
            `https://api.github.com/repos/${repository}/commits/main`,
            { headers, cache: "no-store" },
          );
          if (!mainResponse.ok || (await mainResponse.json())?.sha !== exactHead) {
            throw new Error("Current main changed before autonomous continuation.");
          }
          const response = await fetch(
            `https://api.github.com/repos/${repository}/actions/workflows/dna-population-entrant-authority-autonomous-runner.yml/dispatches`,
            {
              method: "POST",
              headers,
              body: JSON.stringify({
                ref: "main",
                inputs: {
                  expected_main_sha: exactHead,
                  accepted_boundary_status: boundary.status,
                  expected_unresolved_race_count: String(boundary.unresolvedRaceCount),
                  expected_unresolved_race_set_sha256: boundary.unresolvedRaceSetSha256,
                  expected_recovered_chunk_count: String(boundary.recoveredChunkCount),
                  expected_recovered_race_count: String(boundary.recoveredRaceCount),
                  expected_next_chunk_ordinal: String(boundary.nextChunkOrdinal),
                  expected_checkpoint_updated_at: boundary.checkpointUpdatedAt,
                  readiness_capacity_observed_at: boundary.capacityObservedAt,
                  durable_boundary_sha256: boundary.durableBoundarySha256,
                  execute_all_private_preview_entrant_authority: true,
                },
              }),
            },
          );
          if (response.status !== 204) {
            throw new Error(`Autonomous continuation dispatch failed with HTTP ${response.status}.`);
          }
          console.log("Queued the next non-overlapping autonomous entrant session from exact durable state.");
          NODE
      - name: Publish sanitized autonomous durable status
        if: success()
        continue-on-error: true
        env:
          DNA_STATUS_MODE: autonomous-result
          DNA_STATUS_COMMENT_ID: "5866846740"
          DNA_STATUS_RECEIPT_PATH: ${{ runner.temp }}/dna-entrant-autonomous-session.json
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/update-dna-runtime-status.mjs
      - name: Prove exact main remained unchanged
        if: always()
        shell: bash
        run: |
          git fetch --no-tags origin main
          if [[ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]]; then
            echo "Main changed during the entrant autonomous workflow."
            exit 1
          fi
