name: Temporary format PR 273

on:
  push:
    branches:
      - agent/hosted-race-archive-aggregate-runtime

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hosted-race-archive-aggregate-runtime
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format exact changed TypeScript files
        run: >-
          npx prettier --write
          lib/hosted-pro-league-aggregate-worker-runtime.ts
          lib/neon-race-archive-aggregate-refresh-plan.ts
          tests/neon-race-archive-aggregate-refresh-plan.test.ts
      - name: Commit formatting only when needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/hosted-pro-league-aggregate-worker-runtime.ts \
            lib/neon-race-archive-aggregate-refresh-plan.ts \
            tests/neon-race-archive-aggregate-refresh-plan.test.ts
          git commit -m "Format hosted archive aggregate runtime"
          git push origin HEAD:agent/hosted-race-archive-aggregate-runtime
