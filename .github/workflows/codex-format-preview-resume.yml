name: Codex format Preview resume

on:
  pull_request:
    paths:
      - .github/workflows/codex-format-preview-resume.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/invoke-activation-evidence-compaction
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format exact files
        run: >-
          npx prettier --write
          lib/durable-import-preview-staging-sink.ts
          lib/neon-durable-import-preview-staging-repository.ts
      - name: Commit formatting only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/durable-import-preview-staging-sink.ts \
            lib/neon-durable-import-preview-staging-repository.ts
          git diff --cached --check
          git commit -m "Format Preview evidence resume implementation"
          git push origin HEAD:codex/invoke-activation-evidence-compaction