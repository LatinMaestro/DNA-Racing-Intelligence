name: TEMPORARY report population audit status — DO NOT MERGE

on:
  push:
    branches:
      - temporary/kick-population-history-audit-2026-09-25-do-not-merge

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  report-status:
    runs-on: ubuntu-latest
    steps:
      - name: Report exact-main CI and audit status
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: 0268fcb72e363a5050075f748cb3b438f2fc1f1f
        run: |
          actual="$(gh api repos/LatinMaestro/DNA-Racing-Intelligence/commits/main --jq .sha)"
          if [[ "$actual" != "$EXPECTED_MAIN_SHA" ]]; then
            echo "Main moved; refusing stale status report."
            exit 1
          fi

          audit_json="$(gh run list             --repo LatinMaestro/DNA-Racing-Intelligence             --workflow dna-population-history-read-only-audit.yml             --branch main             --limit 20             --json databaseId,headSha,status,conclusion,createdAt,url             --jq '[.[] | select(.headSha == env.EXPECTED_MAIN_SHA)] | first // {}')"

          ci_json="$(gh run list             --repo LatinMaestro/DNA-Racing-Intelligence             --branch main             --commit "$EXPECTED_MAIN_SHA"             --event push             --limit 20             --json databaseId,name,headSha,status,conclusion,createdAt,url             --jq '[.[] | select(.name == "CI" and .headSha == env.EXPECTED_MAIN_SHA)] | first // {}')"

          gh issue comment 120             --repo LatinMaestro/DNA-Racing-Intelligence             --body "## Temporary exact-main status snapshot

Main: \`$EXPECTED_MAIN_SHA\`

Audit:
\`\`\`json
$audit_json
\`\`\`

Main CI:
\`\`\`json
$ci_json
\`\`\`

Read-only status snapshot from the **DO NOT MERGE** helper branch."
