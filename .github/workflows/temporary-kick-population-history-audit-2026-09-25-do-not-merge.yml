name: TEMPORARY report compact entrant workflow status — DO NOT MERGE

on:
  push:
    branches:
      - temporary/kick-population-history-audit-2026-09-25-do-not-merge

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  report-status:
    runs-on: ubuntu-latest
    env:
      EXPECTED_MAIN_SHA: 05267da2d07d32a31acc425021766872c734f77a
      REPO: LatinMaestro/DNA-Racing-Intelligence
    steps:
      - name: Report exact-main workflow status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          actual="$(gh api repos/$REPO/commits/main --jq .sha)"
          if [[ "$actual" != "$EXPECTED_MAIN_SHA" ]]; then
            echo "Main moved; refusing stale status report."
            exit 1
          fi
          ci="$(gh run list --repo "$REPO" --branch main --commit "$EXPECTED_MAIN_SHA" --limit 30 --json databaseId,name,status,conclusion,headSha,event --jq '[.[] | select(.name=="CI" and .headSha==env.EXPECTED_MAIN_SHA)]')"
          audit="$(gh run list --repo "$REPO" --workflow dna-population-history-read-only-audit.yml --branch main --limit 30 --json databaseId,name,status,conclusion,headSha,event --jq '[.[] | select(.headSha==env.EXPECTED_MAIN_SHA)]')"
          measurement="$(gh run list --repo "$REPO" --workflow dna-population-entrant-hydration-read-only-measurement.yml --branch main --limit 30 --json databaseId,name,status,conclusion,headSha,event --jq '[.[] | select(.headSha==env.EXPECTED_MAIN_SHA)]')"
          gh issue comment 120 --repo "$REPO" --body "## Temporary exact-main workflow status

Main: \`$EXPECTED_MAIN_SHA\`

CI:
\`\`\`json
$ci
\`\`\`

Population audit:
\`\`\`json
$audit
\`\`\`

Entrant measurement:
\`\`\`json
$measurement
\`\`\`

Status probe only; no workflow was dispatched and no provider request was made. Helper branch remains **DO NOT MERGE**."
