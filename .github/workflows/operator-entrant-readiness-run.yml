name: TEMPORARY operator entrant readiness run

on:
  push:
    branches:
      - operator/entrant-readiness-run
    paths:
      - .github/workflows/operator-entrant-readiness-run.yml
      - tests/operator-entrant-readiness-run.test.ts

permissions:
  contents: read

concurrency:
  group: operator-entrant-readiness-run
  cancel-in-progress: false

jobs:
  exact-main-read-only-readiness:
    name: Exact-main read-only entrant readiness
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: preview
    env:
      AUTHORIZED_CLERK_USER_ID: ${{ secrets.AUTHORIZED_CLERK_USER_ID }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ANALYTICS_API_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_API_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DNA_DATABASE_OWNER_ID: ${{ secrets.DNA_DATABASE_OWNER_ID }}
      DNA_OPEN_LAB_API_KEY_1: ${{ secrets.DNA_OPEN_LAB_API_KEY_1 }}
      DNA_POPULATION_ENTRANT_AUTHORITY_OPERATOR_READINESS: "1"
      DNA_POPULATION_ENTRANT_AUTHORITY_EXPECTED_MAIN_SHA: "c07cecdb0bbc4189778fe0b7d7dc0ce5d071c0c0"
      DNA_R2_ACCESS_KEY_ID: ${{ secrets.DNA_R2_ACCESS_KEY_ID }}
      DNA_R2_BUCKET_NAME: dna-racing-import-preview
      DNA_R2_SECRET_ACCESS_KEY: ${{ secrets.DNA_R2_SECRET_ACCESS_KEY }}
      DNA_R2_STORAGE_CLASS: Standard
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
    steps:
      - name: Checkout operator branch
        uses: actions/checkout@v4
      - name: Prove runtime code matches exact current main
        shell: bash
        run: |
          git fetch --no-tags origin main
          if [[ "$(git rev-parse origin/main)" != "$DNA_POPULATION_ENTRANT_AUTHORITY_EXPECTED_MAIN_SHA" ]]; then
            echo "Main moved before the read-only readiness run."
            exit 1
          fi
          mapfile -t changed < <(git diff --name-only origin/main HEAD | sort)
          expected=(
            ".github/workflows/operator-entrant-readiness-run.yml"
            "tests/operator-entrant-readiness-run.test.ts"
          )
          if [[ "${#changed[@]}" -ne "${#expected[@]}" ]]; then
            echo "Operator branch contains unexpected changes."
            exit 1
          fi
          for i in "${!expected[@]}"; do
            if [[ "${changed[$i]}" != "${expected[$i]}" ]]; then
              echo "Operator branch contains unexpected changes."
              exit 1
            fi
          done
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Inspect exact live authority and zero-cost readiness
        run: >-
          npx vitest run --no-file-parallelism
          tests/operator-entrant-readiness-run.test.ts
      - name: Prove exact main remained unchanged
        if: always()
        shell: bash
        run: |
          git fetch --no-tags origin main
          if [[ "$(git rev-parse origin/main)" != "$DNA_POPULATION_ENTRANT_AUTHORITY_EXPECTED_MAIN_SHA" ]]; then
            echo "Main changed during the read-only readiness run."
            exit 1
          fi
