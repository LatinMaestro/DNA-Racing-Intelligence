name: DNA Core results bounded private Preview generation

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/dna-core-race-history-private-generation-command.yml"
  workflow_dispatch:
    inputs:
      evaluated_at:
        description: Fixed UTC identity reused for every resume of this generation
        required: true
        type: string
      maximum_steps:
        description: Maximum resumable one-page steps in this run
        required: true
        default: "100"
        type: choice
        options:
          - "1"
          - "30"
          - "100"
      execute_bounded_private_preview_generation:
        description: Confirm bounded persistent writes to private Preview only
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: dna-core-results-bounded-private-preview-generation
  cancel-in-progress: false

jobs:
  exact-main-bounded-private-preview-generation:
    name: Exact-main bounded private Preview Core results
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AUTHORIZED_CLERK_USER_ID: ${{ secrets.AUTHORIZED_CLERK_USER_ID }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ANALYTICS_API_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_API_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DNA_CORE_RACE_HISTORY_PRIVATE_GENERATION_COMMAND: "1"
      DNA_CORE_RACE_HISTORY_PRIVATE_GENERATION_EVALUATED_AT: ${{ inputs.evaluated_at || '2026-09-15T10:49:00.000Z' }}
      DNA_CORE_RACE_HISTORY_PRIVATE_GENERATION_MAXIMUM_STEPS: ${{ inputs.maximum_steps || '100' }}
      DNA_DATABASE_OWNER_ID: ${{ secrets.DNA_DATABASE_OWNER_ID }}
      DNA_OPEN_LAB_API_KEY_1: ${{ secrets.DNA_OPEN_LAB_API_KEY_1 }}
      DNA_OPEN_LAB_API_KEY_2: ${{ secrets.DNA_OPEN_LAB_API_KEY_2 }}
      DNA_OPEN_LAB_API_KEY_3: ${{ secrets.DNA_OPEN_LAB_API_KEY_3 }}
      DNA_R2_ACCESS_KEY_ID: ${{ secrets.DNA_R2_ACCESS_KEY_ID }}
      DNA_R2_BUCKET_NAME: dna-racing-import-preview
      DNA_R2_SECRET_ACCESS_KEY: ${{ secrets.DNA_R2_SECRET_ACCESS_KEY }}
      DNA_R2_STORAGE_CLASS: Standard
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
    steps:
      - name: Require exact main dispatch and explicit Preview write arm
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "This bounded private Preview generation may only run from main."
            exit 1
          fi
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]] && \
             [[ "${{ inputs.execute_bounded_private_preview_generation }}" != "true" ]]; then
            echo "The bounded private Preview generation was not explicitly armed."
            exit 1
          fi
      - name: Checkout exact head
        uses: actions/checkout@v4
      - name: Prove dispatch head is current main
        shell: bash
        run: |
          git fetch --no-tags origin main
          if [[ "$(git rev-parse HEAD)" != "${GITHUB_SHA}" ]] || \
             [[ "$(git rev-parse origin/main)" != "${GITHUB_SHA}" ]]; then
            echo "The bounded private Preview generation head is no longer current main."
            exit 1
          fi
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Validate private Preview configuration without exposure
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const required = [
            "AUTHORIZED_CLERK_USER_ID",
            "CLOUDFLARE_ACCOUNT_ID",
            "CLOUDFLARE_API_TOKEN",
            "CLOUDFLARE_ANALYTICS_API_TOKEN",
            "DATABASE_URL",
            "DNA_CORE_RACE_HISTORY_PRIVATE_GENERATION_EVALUATED_AT",
            "DNA_DATABASE_OWNER_ID",
            "DNA_OPEN_LAB_API_KEY_1",
            "DNA_OPEN_LAB_API_KEY_2",
            "DNA_OPEN_LAB_API_KEY_3",
            "DNA_R2_ACCESS_KEY_ID",
            "DNA_R2_BUCKET_NAME",
            "DNA_R2_SECRET_ACCESS_KEY",
            "DNA_R2_STORAGE_CLASS",
            "NEON_API_KEY",
            "NEON_PROJECT_ID",
          ];
          const invalid = required.filter((name) => {
            const value = process.env[name];
            return !value || value.trim() !== value || value.length > 4096;
          });
          if (invalid.length > 0) {
            throw new Error("Missing or invalid bounded Preview settings: " + invalid.join(", "));
          }
          const evaluatedAt = new Date(
            process.env.DNA_CORE_RACE_HISTORY_PRIVATE_GENERATION_EVALUATED_AT,
          );
          if (
            Number.isNaN(evaluatedAt.getTime()) ||
            evaluatedAt.toISOString() !==
              process.env.DNA_CORE_RACE_HISTORY_PRIVATE_GENERATION_EVALUATED_AT ||
            evaluatedAt.getTime() > Date.now()
          ) {
            throw new Error("The generation identity must be a canonical past UTC timestamp.");
          }
          const keys = [
            process.env.DNA_OPEN_LAB_API_KEY_1,
            process.env.DNA_OPEN_LAB_API_KEY_2,
            process.env.DNA_OPEN_LAB_API_KEY_3,
          ];
          if (new Set(keys).size !== 3) {
            throw new Error("Three distinct DNA Open Lab API keys are required.");
          }
          if (process.env.DNA_R2_STORAGE_CLASS !== "Standard") {
            throw new Error("Only R2 Standard storage is allowed.");
          }
          console.log("Validated the bounded private Preview generation configuration without printing private values.");
          NODE
      - name: Advance first bounded Core result slice
        run: >-
          npx vitest run --no-file-parallelism
          tests/hosted-preview-connected-core-race-history-private-generation-command.test.ts
      - name: Advance second bounded Core result slice
        run: >-
          npx vitest run --no-file-parallelism
          tests/hosted-preview-connected-core-race-history-private-generation-command.test.ts
      - name: Complete joined Core result generation
        env:
          DNA_CORE_RACE_HISTORY_PRIVATE_GENERATION_REQUIRE_COMPLETE: "1"
        run: >-
          npx vitest run --no-file-parallelism
          tests/hosted-preview-connected-core-race-history-private-generation-command.test.ts
      - name: Prove exact main remained unchanged
        if: always()
        shell: bash
        run: |
          git fetch --no-tags origin main
          if [[ "$(git rev-parse origin/main)" != "${GITHUB_SHA}" ]]; then
            echo "Main changed during the bounded private Preview generation."
            exit 1
          fi
