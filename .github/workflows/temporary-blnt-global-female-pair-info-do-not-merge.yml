name: TEMPORARY BLNT global female pair info - DO NOT MERGE
on:
  push:
    branches: [temporary/r2-evidence-analysis-do-not-merge-2026-09-05]
    paths:
      - tests/temporary-blnt-global-female-pair-info-do-not-merge.test.ts
      - .github/workflows/temporary-blnt-global-female-pair-info-do-not-merge.yml
permissions:
  contents: read
jobs:
  pair-info:
    name: TEMPORARY ONLY - BLNT pair projections - DO NOT MERGE
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TEMP_BLNT_GLOBAL_PAIR_INFO: '1'
      DNA_OPEN_LAB_API_KEY_1: ${{ secrets.DNA_OPEN_LAB_API_KEY_1 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: temporary/r2-evidence-analysis-do-not-merge-2026-09-05
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx vitest run tests/temporary-blnt-global-female-pair-info-do-not-merge.test.ts --reporter=verbose
      - run: git diff --exit-code && git diff --cached --exit-code
      - uses: actions/upload-artifact@v4
        with:
          name: TEMPORARY-DO-NOT-MERGE-blnt-global-pairs-${{ github.run_id }}
          path: artifacts/temporary-blnt-global-pair-info.json
          retention-days: 1
