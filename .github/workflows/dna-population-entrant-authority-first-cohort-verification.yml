name: DNA population entrant first-cohort verification

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact current main commit to verify
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: dna-population-entrant-authority-first-cohort-verification
  cancel-in-progress: false

jobs:
  exact-main-read-only-first-cohort-verification:
    name: Exact-main read-only first-cohort verification
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: preview
    env:
      AUTHORIZED_CLERK_USER_ID: ${{ secrets.AUTHORIZED_CLERK_USER_ID }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ANALYTICS_API_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_API_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DNA_DATABASE_OWNER_ID: ${{ secrets.DNA_DATABASE_OWNER_ID }}
      DNA_OPEN_LAB_API_KEY_1: ${{ secrets.DNA_OPEN_LAB_API_KEY_1 }}
      DNA_POPULATION_ENTRANT_AUTHORITY_FIRST_COHORT_VERIFICATION: "1"
      DNA_POPULATION_ENTRANT_AUTHORITY_EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
      DNA_R2_ACCESS_KEY_ID: ${{ secrets.DNA_R2_ACCESS_KEY_ID }}
      DNA_R2_BUCKET_NAME: dna-racing-import-preview
      DNA_R2_SECRET_ACCESS_KEY: ${{ secrets.DNA_R2_SECRET_ACCESS_KEY }}
      DNA_R2_STORAGE_CLASS: Standard
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
    steps:
      - name: Require exact main dispatch
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "This entrant verification workflow may only run from main."
            exit 1
          fi
          if [[ "${{ inputs.expected_main_sha }}" != "$GITHUB_SHA" ]]; then
            echo "The supplied verification commit does not match the dispatch head."
            exit 1
          fi
      - name: Checkout exact head
        uses: actions/checkout@v4
      - name: Prove dispatch head is current main
        shell: bash
        run: |
          git fetch --no-tags origin main
          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]] || \
             [[ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]]; then
            echo "The entrant verification head is no longer current main."
            exit 1
          fi
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Verify first durable cohort read-only
        run: >-
          npx vitest run --no-file-parallelism
          tests/hosted-preview-connected-population-entrant-authority-first-cohort-verification.test.ts
      - name: Prove exact main remained unchanged
        if: always()
        shell: bash
        run: |
          git fetch --no-tags origin main
          if [[ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]]; then
            echo "Main changed during entrant first-cohort verification."
            exit 1
          fi
