name: Temporary format breeder quality

on:
  push:
    branches:
      - codex/offspring-breeder-quality-foundation

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/offspring-breeder-quality-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write domain/breeder-quality.ts domain/breeding-intelligence.ts tests/breeder-quality.test.ts
      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet -- domain/breeder-quality.ts domain/breeding-intelligence.ts tests/breeder-quality.test.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add domain/breeder-quality.ts domain/breeding-intelligence.ts tests/breeder-quality.test.ts
          git commit -m "Format breeder-quality foundation"
          git push origin HEAD:codex/offspring-breeder-quality-foundation
