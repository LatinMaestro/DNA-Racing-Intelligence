name: Breeding universe inventory

on:
  workflow_dispatch:
  push:
    branches:
      - codex/breeding-offspring-history-backfill
    paths:
      - tests/hosted-breeding-universe-inventory.test.ts
      - .github/workflows/breeding-universe-inventory.yml

permissions:
  contents: read

concurrency:
  group: breeding-universe-inventory-august-2026
  cancel-in-progress: false

jobs:
  inventory:
    if: ${{ !contains(github.event.head_commit.message, '[format-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      DNA_BREEDING_UNIVERSE_BACKFILL: "1"
      DNA_OPEN_LAB_API_KEY_1: ${{ secrets.DNA_OPEN_LAB_API_KEY_1 }}
      NODE_OPTIONS: "--import=./scripts/retry-transient-fetch.mjs"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Pull full breeding/race/core inventory under temporary 150 rpm authority
        run: npx vitest run --no-file-parallelism tests/hosted-breeding-universe-inventory.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: breeding-universe-inventory
          path: artifacts/breeding-universe-inventory.json
          if-no-files-found: error
          retention-days: 2
