name: Temporary harden history expiry

on:
  push:
    branches:
      - codex/breeding-offspring-history-backfill
    paths:
      - .github/workflows/temporary-harden-history-expiry.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/breeding-offspring-history-backfill
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Add per-request authority expiry guard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/hosted-breeding-race-history-shard.test.ts')
          text = path.read_text()
          marker = '''function canonicalTimestamp(value: unknown): string | null {\n  if (typeof value !== "string" || value.trim() === "") return null;\n  const parsed = new Date(value);\n  return Number.isNaN(parsed.getTime()) ? null : parsed.toISOString();\n}\n'''
          replacement = marker + '''\nfunction assertResearchAuthorityActive(): void {\n  if (Date.now() >= Date.parse(RESEARCH_EXPIRES_AT)) {\n    throw new Error(\n      "Temporary August high-rate research authority has expired; no further history requests may start.",\n    );\n  }\n}\n'''
          if marker not in text:
              raise SystemExit('canonicalTimestamp marker not found')
          text = text.replace(marker, replacement, 1)
          old = '''        for (let attempt = 0; attempt < 5; attempt++) {\n          await acquire();\n          requestCount++;\n          const response = await fetch(\n'''
          new = '''        for (let attempt = 0; attempt < 5; attempt++) {\n          assertResearchAuthorityActive();\n          await acquire();\n          assertResearchAuthorityActive();\n          requestCount++;\n          const response = await fetch(\n'''
          if old not in text:
              raise SystemExit('request loop marker not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          npx prettier --write tests/hosted-breeding-race-history-shard.test.ts
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temporary-harden-history-expiry.yml
          git add tests/hosted-breeding-race-history-shard.test.ts
          git commit -m "[format-only] Enforce per-request August research expiry"
          git push origin HEAD:codex/breeding-offspring-history-backfill
