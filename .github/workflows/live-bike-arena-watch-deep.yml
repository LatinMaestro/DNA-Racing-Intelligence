name: Deep Bike Arena watch validation

on:
  push:
    branches:
      - analysis/live-bike-arena-breeding-20260830
    paths:
      - tests/hosted-live-bike-arena-watch-deep.test.ts
      - .github/workflows/live-bike-arena-watch-deep.yml

permissions:
  contents: read

env:
  DNA_LIVE_ARENA_WATCH_DEEP: "1"
  DNA_OPEN_LAB_API_KEY_1: ${{ secrets.DNA_OPEN_LAB_API_KEY_1 }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run deep Bike Arena WATCH validation
        run: npx vitest run --no-file-parallelism tests/hosted-live-bike-arena-watch-deep.test.ts
      - name: Upload deep Bike Arena WATCH evidence
        uses: actions/upload-artifact@v4
        with:
          name: live-bike-arena-watch-deep
          path: artifacts/live-bike-arena-watch-deep.json
          if-no-files-found: error
          retention-days: 1
