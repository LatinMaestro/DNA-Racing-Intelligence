name: temporary-chat-pro-league-live-refresh
on:
  push:
    branches:
      - temporary/chat-pro-league-live-refresh-2026-09-18-do-not-merge

permissions:
  contents: read
  actions: write

jobs:
  live-refresh:
    if: ${{ !contains(github.event.head_commit.message, '[dispatch-preview-refresh]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PRO_LEAGUE_LIVE_REFRESH: "1"
      DNA_OPEN_LAB_API_KEY_1: ${{ secrets.DNA_OPEN_LAB_API_KEY_1 }}
      DNA_OPEN_LAB_VAULT: ${{ secrets.DNA_OPEN_LAB_VAULT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/temporary-chat-pro-league-live-refresh.test.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: temporary-chat-pro-league-live-refresh
          path: pro-league-live-refresh.json
          if-no-files-found: error
          retention-days: 1

  dispatch-preview-refresh:
    if: ${{ contains(github.event.head_commit.message, '[dispatch-preview-refresh]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the existing exact-main Preview refresh
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/dna-open-lab-private-daily-refresh-command.yml/dispatches" \
            --input - <<'JSON'
          {
            "ref": "main",
            "inputs": {
              "finished_history_upper_bound_at": "2026-09-19T07:38:00.000Z",
              "maximum_steps": "100",
              "execute_bounded_private_preview_refresh": "true"
            }
          }
          JSON
