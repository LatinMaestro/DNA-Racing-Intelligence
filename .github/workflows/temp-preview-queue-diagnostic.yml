name: Temporary Preview Queue Diagnostic

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  queue-diagnostic:
    if: github.head_ref == 'agent/hosted-race-archive-aggregate-runtime'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DNA_IMPORT_QUEUE_ID: df7408e1d697475db4dbcdda1aa3e247
      DNA_IMPORT_QUEUE_NAME: dna-racing-import-preview
      DNA_IMPORT_DEAD_LETTER_QUEUE_NAME: dna-racing-import-preview-dlq
    steps:
      - name: Inspect protected Preview queue health
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const required = ["CLOUDFLARE_ACCOUNT_ID", "CLOUDFLARE_API_TOKEN", "DNA_IMPORT_QUEUE_ID"];
          for (const name of required) {
            const value = process.env[name]?.trim() ?? "";
            if (!value) throw new Error(`${name} is unavailable`);
          }
          const base = `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}`;
          const headers = { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`, "Content-Type": "application/json" };
          async function read(path) {
            const response = await fetch(base + path, { headers });
            const body = await response.json();
            if (!response.ok || body.success !== true) throw new Error(`Cloudflare read failed for ${path}`);
            return body.result;
          }
          const queue = await read(`/queues/${process.env.DNA_IMPORT_QUEUE_ID}`);
          const metrics = await read(`/queues/${process.env.DNA_IMPORT_QUEUE_ID}/metrics`);
          const consumers = await read(`/queues/${process.env.DNA_IMPORT_QUEUE_ID}/consumers`);
          if (queue.queue_name !== process.env.DNA_IMPORT_QUEUE_NAME) throw new Error("Preview queue identity changed");
          const summary = {
            queue_name: queue.queue_name,
            delivery_paused: queue.settings?.delivery_paused ?? null,
            delivery_delay: queue.settings?.delivery_delay ?? null,
            backlog_count: Number(metrics.backlog_count ?? -1),
            backlog_bytes: Number(metrics.backlog_bytes ?? -1),
            oldest_message_timestamp_ms: Number(metrics.oldest_message_timestamp_ms ?? 0),
            consumer_count: Array.isArray(consumers) ? consumers.length : -1,
            consumers: Array.isArray(consumers) ? consumers.map((consumer) => ({
              type: consumer.type ?? null,
              queue_name: consumer.queue_name ?? null,
              script_name: consumer.script_name ?? null,
              dead_letter_queue: consumer.dead_letter_queue ?? consumer.dead_letter_queue_name ?? null,
              batch_size: Number(consumer.settings?.batch_size ?? -1),
              max_concurrency: Number(consumer.settings?.max_concurrency ?? -1),
              max_retries: Number(consumer.settings?.max_retries ?? -1),
              max_wait_time_ms: Number(consumer.settings?.max_wait_time_ms ?? -1),
            })) : [],
          };
          console.log(JSON.stringify(summary, null, 2));
          if (summary.delivery_paused === true) throw new Error("Preview queue delivery is paused");
          NODE
