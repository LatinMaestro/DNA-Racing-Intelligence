name: Temporary Tournament write format diagnostic

on:
  pull_request:
    paths:
      - "app/(private)/tournaments/actions.ts"
      - "lib/tournament-configuration-write-service.ts"
      - "tests/neon-tournament-configuration-write-repository.test.ts"
      - ".github/workflows/temporary-tournament-write-format.yml"

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Print exact formatter diff
        shell: bash
        run: |
          npx prettier --write "app/(private)/tournaments/actions.ts" lib/tournament-configuration-write-service.ts tests/neon-tournament-configuration-write-repository.test.ts
          git diff -- "app/(private)/tournaments/actions.ts" lib/tournament-configuration-write-service.ts tests/neon-tournament-configuration-write-repository.test.ts
          test -z "$(git status --short -- "app/(private)/tournaments/actions.ts" lib/tournament-configuration-write-service.ts tests/neon-tournament-configuration-write-repository.test.ts)"
