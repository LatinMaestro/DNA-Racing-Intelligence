name: DNA R2 budget ledger diagnostic

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact current main commit to diagnose
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: dna-r2-budget-ledger-diagnostic
  cancel-in-progress: false

jobs:
  read-only-private-preview-ledger:
    name: Read-only private Preview R2 budget ledger
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: preview
    env:
      AUTHORIZED_CLERK_USER_ID: ${{ secrets.AUTHORIZED_CLERK_USER_ID }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ANALYTICS_API_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_API_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DNA_DATABASE_OWNER_ID: ${{ secrets.DNA_DATABASE_OWNER_ID }}
      DNA_R2_BUDGET_LEDGER_DIAGNOSTIC: "1"
      DNA_R2_BUCKET_NAME: dna-racing-import-preview
      DNA_R2_STORAGE_CLASS: Standard
      EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
    steps:
      - name: Require exact main dispatch
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "The R2 budget diagnostic may only run from main."
            exit 1
          fi
          if [[ ! "${EXPECTED_MAIN_SHA}" =~ ^[a-f0-9]{40}$ ]] || \
             [[ "${EXPECTED_MAIN_SHA}" != "${GITHUB_SHA}" ]]; then
            echo "The expected main commit does not match the dispatched commit."
            exit 1
          fi
      - name: Checkout exact head
        uses: actions/checkout@v4
      - name: Prove dispatch head is current main
        shell: bash
        run: |
          git fetch --no-tags origin main
          if [[ "$(git rev-parse HEAD)" != "${GITHUB_SHA}" ]] || \
             [[ "$(git rev-parse origin/main)" != "${GITHUB_SHA}" ]]; then
            echo "The R2 budget diagnostic head is no longer current main."
            exit 1
          fi
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Validate read-only private configuration without exposure
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const required = [
            "AUTHORIZED_CLERK_USER_ID",
            "CLOUDFLARE_ACCOUNT_ID",
            "CLOUDFLARE_ANALYTICS_API_TOKEN",
            "DATABASE_URL",
            "DNA_DATABASE_OWNER_ID",
            "DNA_R2_BUCKET_NAME",
            "DNA_R2_STORAGE_CLASS",
            "EXPECTED_MAIN_SHA",
            "NEON_API_KEY",
            "NEON_PROJECT_ID",
          ];
          const invalid = required.filter((name) => {
            const value = process.env[name];
            return !value || value.trim() !== value || value.length > 4096;
          });
          if (invalid.length > 0) {
            throw new Error(
              "Missing or invalid R2 budget diagnostic settings: " +
                invalid.join(", "),
            );
          }
          if (process.env.DNA_R2_STORAGE_CLASS !== "Standard") {
            throw new Error("Only R2 Standard storage is allowed.");
          }
          console.log("Validated read-only R2 budget diagnostic configuration.");
          NODE
      - name: Inspect sanitized provider and ledger state
        run: >-
          npx vitest run --no-file-parallelism
          tests/hosted-preview-connected-r2-budget-ledger-diagnostic.test.ts
      - name: Prove exact main remained unchanged
        if: always()
        shell: bash
        run: |
          git fetch --no-tags origin main
          if [[ "$(git rev-parse origin/main)" != "${GITHUB_SHA}" ]]; then
            echo "Main changed during the R2 budget diagnostic."
            exit 1
          fi
