name: Temporary test repair diagnostic

on:
  pull_request:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Make staging API consistently asynchronous
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('lib/neon-race-archive-aggregate-publication.ts')
          text = path.read_text()
          old = '    stageRows(input) {'
          new = '    async stageRows(input) {'
          if text.count(old) != 1:
              raise SystemExit('expected exactly one stageRows implementation')
          path.write_text(text.replace(old, new))
          PY
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/neon-race-archive-aggregate-publication.ts
          git commit -m "Make aggregate staging rejection asynchronous"
          git push origin HEAD:${{ github.head_ref }}
