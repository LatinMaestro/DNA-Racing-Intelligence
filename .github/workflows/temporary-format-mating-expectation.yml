name: Temporary format mating expectation

on:
  push:
    branches:
      - codex/breeding-offspring-history-backfill
    paths:
      - .github/workflows/temporary-format-mating-expectation.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/breeding-offspring-history-backfill
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write domain/breeder-mating-expectation.ts tests/breeder-mating-expectation.test.ts
      - name: Commit formatting and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temporary-format-mating-expectation.yml
          git add domain/breeder-mating-expectation.ts tests/breeder-mating-expectation.test.ts
          git commit -m "[format-only] format empirical mating expectation"
          git push origin HEAD:codex/breeding-offspring-history-backfill
