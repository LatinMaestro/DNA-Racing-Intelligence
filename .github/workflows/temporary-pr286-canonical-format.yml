name: Temporary PR 286 canonical format

on:
  push:
    branches:
      - agent/spillable-core-performance-reducer

permissions:
  contents: write

concurrency:
  group: temporary-pr286-canonical-format
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/spillable-core-performance-reducer
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate inputs, format, test and remove temporary workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('lib/race-archive-spillable-core-performance.ts')
          text = path.read_text()
          marker = '\nfunction profileGroupKey'
          insert = '''\nfunction validatedObservations(\n  source: AsyncIterable<RaceArchiveCoreAnalyticalObservation>,\n): AsyncIterable<RaceArchiveCoreAnalyticalObservation> {\n  return (async function* () {\n    for await (const observation of source) {\n      yield validatedObservation(observation);\n    }\n  })();\n}\n'''
          if marker not in text:
              raise SystemExit('profileGroupKey marker missing')
          text = text.replace(marker, insert + marker, 1)
          old = '    records: input.observations,\n'
          new = '    records: validatedObservations(input.observations),\n'
          if old not in text:
              raise SystemExit('sort records marker missing')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          npx prettier --write lib/race-archive-spillable-core-performance.ts tests/race-archive-spillable-core-performance.test.ts
          npm run format
          npm run typecheck
          npx vitest run tests/race-archive-spillable-core-performance.test.ts
          rm .github/workflows/temporary-pr286-canonical-format.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Validate and format spillable Core Performance reducer'
          git push origin HEAD:agent/spillable-core-performance-reducer
