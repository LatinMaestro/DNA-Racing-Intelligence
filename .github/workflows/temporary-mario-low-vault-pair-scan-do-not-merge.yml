name: TEMPORARY Mario and Low vault pair scan - DO NOT MERGE

# TEMPORARY READ-ONLY DNA API WORKFLOW. DO NOT MERGE INTO main.
on:
  push:
    branches:
      - temporary/r2-evidence-analysis-do-not-merge-2026-09-05
    paths:
      - tests/temporary-mario-low-vault-pair-scan-do-not-merge.test.ts
      - .github/workflows/temporary-mario-low-vault-pair-scan-do-not-merge.yml
permissions:
  contents: read
jobs:
  scan-pairs:
    name: TEMPORARY ONLY - Mario/Low pair checks - DO NOT MERGE
    if: github.ref == 'refs/heads/temporary/r2-evidence-analysis-do-not-merge-2026-09-05'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEMP_MARIO_LOW_PAIR_SCAN: '1'
      DNA_OPEN_LAB_API_KEY_1: ${{ secrets.DNA_OPEN_LAB_API_KEY_1 }}
    steps:
      - name: Guard branch
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF}" == "refs/heads/temporary/r2-evidence-analysis-do-not-merge-2026-09-05" ]]
      - name: Checkout temporary branch only
        uses: actions/checkout@v4
        with:
          ref: temporary/r2-evidence-analysis-do-not-merge-2026-09-05
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install existing dependencies without scripts
        run: npm ci --ignore-scripts
      - name: Run read-only Mario/Low pair checks
        run: npx vitest run tests/temporary-mario-low-vault-pair-scan-do-not-merge.test.ts --reporter=dot
      - name: Prove tracked files unchanged
        run: git diff --exit-code && git diff --cached --exit-code
      - name: Upload sanitized results for one day
        uses: actions/upload-artifact@v4
        with:
          name: TEMPORARY-DO-NOT-MERGE-mario-low-vault-pairs-${{ github.run_id }}
          path: artifacts/temporary-mario-low-vault-pair-scan.json
          retention-days: 1
          if-no-files-found: error
