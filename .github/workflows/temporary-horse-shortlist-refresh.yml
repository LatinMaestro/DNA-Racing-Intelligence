name: temporary Horse shortlist refresh
on:
  push:
    branches:
      - temporary/chat-horse-free-shortlist-refresh-2026-09-20-do-not-merge
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      HORSE_SHORTLIST_REFRESH: "1"
      DNA_OPEN_LAB_API_KEY_1: ${{ secrets.DNA_OPEN_LAB_API_KEY_1 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/temporary-chat-horse-shortlist-refresh.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: temporary-horse-shortlist-refresh
          path: horse-shortlist-live-refresh.json
          retention-days: 1
