name: Breeding missing co-parent backfill

on:
  push:
    branches:
      - codex/breeding-offspring-history-backfill
    paths:
      - .github/workflows/breeding-missing-coparent-backfill.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: breeding-api-high-rate-august-2026
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DNA_BREEDING_COPARENT_ENRICHMENT: "1"
      DNA_OPEN_LAB_API_KEY_1: ${{ secrets.DNA_OPEN_LAB_API_KEY_1 }}
      BREEDING_CENSUS_PATH: artifacts/source/breeding-lineage-census-upgraded.json
      UPGRADED_CENSUS_ARTIFACT_ID: "9733841620"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Download upgraded lineage census
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/source
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${UPGRADED_CENSUS_ARTIFACT_ID}/zip" > /tmp/census.zip
          unzip -q /tmp/census.zip -d artifacts/source
          test -f artifacts/source/breeding-lineage-census-upgraded.json
      - name: Enrich all missing co-parents
        env:
          NODE_OPTIONS: "--import=./scripts/retry-transient-fetch.mjs"
        run: npx vitest run --no-file-parallelism tests/hosted-breeding-missing-coparent-inventory.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: breeding-missing-coparent-inventory
          path: artifacts/coparents/breeding-missing-coparent-inventory.json
          if-no-files-found: error
          retention-days: 2

  history:
    needs: inventory
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      DNA_BREEDING_RACE_HISTORY_BACKFILL: "1"
      HISTORY_SHARD_INDEX: ${{ matrix.shard }}
      HISTORY_SHARD_COUNT: "4"
      BREEDING_INVENTORY_PATH: artifacts/inventory/breeding-missing-coparent-inventory.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: breeding-missing-coparent-inventory
          path: artifacts/inventory
      - name: Pull missing co-parent Bike/Car/Horse history for shard ${{ matrix.shard }}
        env:
          NODE_OPTIONS: "--import=./scripts/retry-transient-fetch.mjs"
        run: npx vitest run --no-file-parallelism tests/hosted-breeding-race-history-shard.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: breeding-missing-coparent-history-${{ matrix.shard }}
          path: artifacts/history/breeding-race-history-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 2
