name: Temporary format lineage census

on:
  push:
    branches:
      - codex/breeding-offspring-history-backfill
    paths:
      - .github/workflows/temporary-format-lineage-census.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/breeding-offspring-history-backfill
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write tests/hosted-breeding-lineage-census.test.ts .github/workflows/breeding-lineage-census-fallback.yml
      - name: Commit formatting and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temporary-format-lineage-census.yml
          git add tests/hosted-breeding-lineage-census.test.ts .github/workflows/breeding-lineage-census-fallback.yml
          git commit -m "Format lineage census fallback"
          git push origin HEAD:codex/breeding-offspring-history-backfill
