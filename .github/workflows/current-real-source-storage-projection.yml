name: Current real-source storage projection

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/current-real-source-storage-projection.yml"
      - "database/measurements/current_real_source_neon_lower_bound.sql"
      - "database/migrations/0002_dataset_acceptance.up.sql"
      - "docs/AGGREGATE_SOURCE_PROFILE.md"
      - "docs/CURRENT_REAL_SOURCE_STORAGE_PROJECTION.md"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  projection:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dna_racing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dna_racing_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: dna_racing_test
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply complete migration chain
        run: |
          for migration in database/migrations/*.up.sql; do
            psql --set ON_ERROR_STOP=1 --file "$migration"
          done
      - name: Measure current real-source Neon lower bound
        run: >-
          psql --set ON_ERROR_STOP=1
          --file database/measurements/current_real_source_neon_lower_bound.sql
