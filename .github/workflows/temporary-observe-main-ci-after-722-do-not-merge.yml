name: TEMPORARY observe main CI after 722 — DO NOT MERGE

on:
  push:
    branches:
      - temporary/observe-main-ci-after-722-do-not-merge

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact main and its push CI
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: e983abc7a24b5468afbd3363242d81fdb9b03577
        run: |
          actual="$(gh api repos/LatinMaestro/DNA-Racing-Intelligence/commits/main --jq .sha)"
          if [[ "$actual" != "$EXPECTED_MAIN_SHA" ]]; then
            echo "Main moved; refusing stale verification."
            exit 1
          fi

          run_id=""
          conclusion=""
          for attempt in $(seq 1 60); do
            response="$(gh api "repos/LatinMaestro/DNA-Racing-Intelligence/actions/runs?head_sha=$EXPECTED_MAIN_SHA&event=push&per_page=100")"
            run_id="$(printf '%s' "$response" | jq -r '.workflow_runs[] | select(.name == "CI") | .id' | head -n 1)"
            conclusion="$(printf '%s' "$response" | jq -r '.workflow_runs[] | select(.name == "CI") | .conclusion // empty' | head -n 1)"
            if [[ -n "$run_id" && "$conclusion" == "success" ]]; then
              break
            fi
            if [[ -n "$run_id" && -n "$conclusion" && "$conclusion" != "success" ]]; then
              echo "Exact-main CI concluded $conclusion."
              exit 1
            fi
            sleep 10
          done

          if [[ -z "$run_id" || "$conclusion" != "success" ]]; then
            echo "Exact-main CI success was not observed."
            exit 1
          fi

          gh issue comment 120             --repo LatinMaestro/DNA-Racing-Intelligence             --body "## Independent main verification after #722

Main \`$EXPECTED_MAIN_SHA\` independently passed push-triggered CI run \`$run_id\`.

The temporary observer branch remains **DO NOT MERGE**."
