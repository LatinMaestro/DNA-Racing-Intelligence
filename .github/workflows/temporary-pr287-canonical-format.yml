name: Temporary PR 287 canonical format

on:
  push:
    branches:
      - agent/spillable-discovery-benchmarks

permissions:
  contents: write

concurrency:
  group: temporary-pr287-canonical-format
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/spillable-discovery-benchmarks
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format, test and remove temporary workflow
        shell: bash
        run: |
          npx prettier --write lib/race-archive-spillable-discovery-benchmarks.ts tests/race-archive-spillable-discovery-benchmarks.test.ts
          npm run format
          npm run typecheck
          npx vitest run tests/race-archive-spillable-discovery-benchmarks.test.ts
          rm .github/workflows/temporary-pr287-canonical-format.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Format spillable Discovery benchmark reducer'
          git push origin HEAD:agent/spillable-discovery-benchmarks
