name: Temporary harden offspring minted-at authority

on:
  push:
    branches:
      - codex/breeding-offspring-history-backfill
    paths:
      - .github/workflows/temporary-harden-offspring-minted-at.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/breeding-offspring-history-backfill
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Harden authoritative offspring creation timestamps
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/hosted-breeding-offspring-analysis.test.ts')
          text = path.read_text()
          start = text.index('      const splicingByHid = new Map<number, AnyRecord>(')
          end = text.index('      const byCoreModeDistance = new Map<string, HistoryRecord[]>();', start)
          replacement = '''      const directParentsByChild = new Map<number, number[]>(\n        Object.entries(inventory?.universe?.directParentsByChild ?? {}).map(\n          ([hid, parents]) => [\n            Number(hid),\n            (parents as unknown[])\n              .map(Number)\n              .filter((value) => Number.isSafeInteger(value) && value > 0),\n          ],\n        ),\n      );\n      const explicitMintedAt = new Map<number, string>();\n      for (const item of (\n        inventory?.spliceDiscovery?.spliceDocuments ?? []\n      ) as AnyRecord[]) {\n        const document =\n          item.document && typeof item.document === "object"\n            ? (item.document as AnyRecord)\n            : null;\n        if (document?.minted !== true) continue;\n        const hid = Number(document.hid);\n        const mintedAt = canonicalTimestamp(document.minted_at);\n        if (!Number.isSafeInteger(hid) || hid <= 0 || mintedAt === null) continue;\n        const existing = explicitMintedAt.get(hid);\n        if (existing !== undefined && existing !== mintedAt) {\n          throw new Error(\n            `Conflicting authoritative minted_at timestamps for child ${hid}.`,\n          );\n        }\n        explicitMintedAt.set(hid, mintedAt);\n      }\n\n'''
          # Preserve infoByHid, which precedes splicingByHid and is used later.
          text = text[:start] + replacement + text[end:]
          path.write_text(text)
          PY
          npx prettier --write tests/hosted-breeding-offspring-analysis.test.ts
          npx eslint tests/hosted-breeding-offspring-analysis.test.ts
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temporary-harden-offspring-minted-at.yml
          git add tests/hosted-breeding-offspring-analysis.test.ts
          git commit -m "Harden offspring minted-at authority"
          git push origin HEAD:codex/breeding-offspring-history-backfill
