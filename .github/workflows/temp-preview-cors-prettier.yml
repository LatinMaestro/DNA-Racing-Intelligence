name: TEMP Preview CORS Prettier diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  prettier-diagnostic:
    if: github.head_ref == 'codex/configure-preview-r2-cors'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Print exact pinned Prettier delta
        run: |
          npx prettier --write tests/protected-private-preview-deployment-workflow.test.ts
          git diff -- tests/protected-private-preview-deployment-workflow.test.ts
