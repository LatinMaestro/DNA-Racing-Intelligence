name: Discovery lineage migration

on:
  pull_request:
    paths:
      - "database/migrations/0016_discovery_lineage_hypotheses.*.sql"
      - "database/migrations/0017_discovery_extended_lineage.*.sql"
      - "database/migrations/0018_discovery_wider_lineage.*.sql"
      - ".github/workflows/discovery-lineage-migration.yml"

permissions:
  contents: read

jobs:
  lineage-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dna_racing_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dna_racing_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: dna_racing_ci
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply prerequisite migrations
        shell: bash
        run: |
          set -euo pipefail
          for migration in database/migrations/000{1..9}_*.up.sql database/migrations/001{0..5}_*.up.sql; do
            psql --set ON_ERROR_STOP=1 --file "$migration"
          done
      - name: Apply base Discovery lineage migration
        run: psql --set ON_ERROR_STOP=1 --file database/migrations/0016_discovery_lineage_hypotheses.up.sql
      - name: Run base Discovery lineage smoke test
        run: psql --set ON_ERROR_STOP=1 --file database/migrations/0016_discovery_lineage_hypotheses.smoke.sql
      - name: Apply extended Discovery lineage migration
        run: psql --set ON_ERROR_STOP=1 --file database/migrations/0017_discovery_extended_lineage.up.sql
      - name: Run extended Discovery lineage smoke test
        run: psql --set ON_ERROR_STOP=1 --file database/migrations/0017_discovery_extended_lineage.smoke.sql
      - name: Apply wider-lineage Discovery migration
        run: psql --set ON_ERROR_STOP=1 --file database/migrations/0018_discovery_wider_lineage.up.sql
      - name: Run wider-lineage Discovery smoke test
        run: psql --set ON_ERROR_STOP=1 --file database/migrations/0018_discovery_wider_lineage.smoke.sql
      - name: Reverse wider-lineage Discovery migration
        run: psql --set ON_ERROR_STOP=1 --file database/migrations/0018_discovery_wider_lineage.down.sql
      - name: Verify extended function restored
        run: >-
          psql --set ON_ERROR_STOP=1 --command
          "DO \$\$ DECLARE definition text; BEGIN
          SELECT pg_get_functiondef(proc.oid) INTO definition
          FROM pg_proc proc JOIN pg_namespace namespace ON namespace.oid = proc.pronamespace
          WHERE namespace.nspname = 'dna' AND proc.proname = 'list_discovery_lineage_hypotheses';
          IF definition IS NULL OR position('full_sibling' IN definition) = 0 OR position('offspring' IN definition) = 0 OR position('wider_lineage' IN definition) > 0
          THEN RAISE EXCEPTION 'Extended Discovery lineage function was not restored'; END IF;
          END \$\$;"
      - name: Reverse extended Discovery lineage migration
        run: psql --set ON_ERROR_STOP=1 --file database/migrations/0017_discovery_extended_lineage.down.sql
      - name: Verify base function restored
        run: >-
          psql --set ON_ERROR_STOP=1 --command
          "DO \$\$ DECLARE definition text; BEGIN
          SELECT pg_get_functiondef(proc.oid) INTO definition
          FROM pg_proc proc JOIN pg_namespace namespace ON namespace.oid = proc.pronamespace
          WHERE namespace.nspname = 'dna' AND proc.proname = 'list_discovery_lineage_hypotheses';
          IF definition IS NULL OR position('full_sibling' IN definition) > 0 OR position('offspring' IN definition) > 0
          THEN RAISE EXCEPTION 'Base Discovery lineage function was not restored'; END IF;
          END \$\$;"
      - name: Reverse base Discovery lineage migration
        run: psql --set ON_ERROR_STOP=1 --file database/migrations/0016_discovery_lineage_hypotheses.down.sql
      - name: Verify Discovery lineage function removal
        run: >-
          psql --set ON_ERROR_STOP=1 --command
          "DO \$\$ BEGIN IF EXISTS (
          SELECT 1 FROM pg_proc proc
          JOIN pg_namespace namespace ON namespace.oid = proc.pronamespace
          WHERE namespace.nspname = 'dna'
          AND proc.proname = 'list_discovery_lineage_hypotheses'
          ) THEN RAISE EXCEPTION 'Discovery lineage read function still exists';
          END IF; END \$\$;"
