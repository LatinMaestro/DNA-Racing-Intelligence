name: Diagnostic Prettier Diff

on:
  pull_request:

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Emit canonical Prettier diff
        run: |
          npx prettier --write lib/neon-race-bounded-materializer-sink.ts tests/neon-race-bounded-materializer-sink.test.ts
          git diff --no-ext-diff --no-color -- lib/neon-race-bounded-materializer-sink.ts tests/neon-race-bounded-materializer-sink.test.ts
