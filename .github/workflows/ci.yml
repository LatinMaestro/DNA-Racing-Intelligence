name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          VERCEL: "0"
          ALLOW_PRODUCTION_DEPLOYMENT: "false"

  migration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dna_racing_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dna_racing_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: dna_racing_ci
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply data-foundation migration
        run: psql --set ON_ERROR_STOP=1 --file database/migrations/0001_data_foundation.up.sql
      - name: Run synthetic migration smoke test
        run: psql --set ON_ERROR_STOP=1 --file database/migrations/0001_data_foundation.smoke.sql
      - name: Reverse data-foundation migration
        run: psql --set ON_ERROR_STOP=1 --file database/migrations/0001_data_foundation.down.sql
      - name: Verify schema removal
        run: >-
          psql --set ON_ERROR_STOP=1 --command
          "DO \$\$ BEGIN IF EXISTS (
          SELECT 1 FROM pg_namespace WHERE nspname = 'dna'
          ) THEN RAISE EXCEPTION 'dna schema still exists'; END IF; END \$\$;"
