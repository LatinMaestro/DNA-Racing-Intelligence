name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Scan tracked files for common secrets
        shell: bash
        run: |
          if git grep -nIE '(-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9_]{36,255}|sk_(live|test|proj)_[A-Za-z0-9_-]{20,}|xox[baprs]-[A-Za-z0-9-]{20,})' -- . ':!package-lock.json'; then
            echo "A tracked file contains a credential-like value."
            exit 1
          fi
      - run: npm run format
      - run: npm run lint
      - run: npm run typecheck
      - name: Verify generated Cloudflare Worker bindings
        run: npm run worker:types:check
      - name: Validate Cloudflare Worker bundle without deployment
        run: npm run worker:dry-run
      - run: npm test
      - run: npm run build
        env:
          VERCEL: "0"
          ALLOW_PRODUCTION_DEPLOYMENT: "false"

  migration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dna_racing_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dna_racing_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: dna_racing_ci
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply data-foundation migration
        run: psql --set ON_ERROR_STOP=1 --file database/migrations/0001_data_foundation.up.sql
      - name: Run data-foundation smoke test
        run: psql --set ON_ERROR_STOP=1 --file database/migrations/0001_data_foundation.smoke.sql
      - name: Apply dataset-acceptance migration
        run: psql --set ON_ERROR_STOP=1 --file database/migrations/0002_dataset_acceptance.up.sql
      - name: Run dataset-acceptance smoke test
        run: psql --set ON_ERROR_STOP=1 --file database/migrations/0002_dataset_acceptance.smoke.sql
      - name: Apply normalized Race Merge materialization migration
