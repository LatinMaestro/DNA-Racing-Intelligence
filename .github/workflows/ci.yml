name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Scan tracked files for common secrets
        shell: bash
        run: |
          if git grep -nIE '(-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9_]{36,255}|sk_(live|test|proj)_[A-Za-z0-9_-]{20,}|xox[baprs]-[A-Za-z0-9-]{20,})' -- . ':!package-lock.json'; then
            echo "A tracked file contains a credential-like value."
            exit 1
          fi
      - run: npm run format
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          VERCEL: "0"
          ALLOW_PRODUCTION_DEPLOYMENT: "false"

  migration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dna_racing_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dna_racing_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: dna_racing_ci
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply data-foundation migration
        run: psql --set ON_ERROR_STOP=1 --file database/migrations/0001_data_foundation.up.sql
      - name: Run data-foundation smoke test
        run: psql --set ON_ERROR_STOP=1 --file database/migrations/0001_data_foundation.smoke.sql
      - name: Apply dataset-acceptance migration
        run: psql --set ON_ERROR_STOP=1 --file database/migrations/0002_dataset_acceptance.up.sql
      - name: Run dataset-acceptance smoke test
        run: psql --set ON_ERROR_STOP=1 --file database/migrations/0002_dataset_acceptance.smoke.sql
      - name: Apply normalized Race Merge materialization migration
        run: psql --set ON_ERROR_STOP=1 --file database/migrations/0003_race_materialization.up.sql
      - name: Run normalized Race Merge materialization smoke test
        run: psql --set ON_ERROR_STOP=1 --file database/migrations/0003_race_materialization.smoke.sql
      - name: Apply star-profile materialization migration
        run: psql --set ON_ERROR_STOP=1 --file database/migrations/0004_star_profile_materialization.up.sql
      - name: Run star-profile materialization smoke test
        run: psql --set ON_ERROR_STOP=1 --file database/migrations/0004_star_profile_materialization.smoke.sql
      - name: Apply star-observation reconciliation migration
        run: psql --set ON_ERROR_STOP=1 --file database/migrations/0005_star_observation_reconciliation.up.sql
      - name: Run star-observation reconciliation smoke test
        run: psql --set ON_ERROR_STOP=1 --file database/migrations/0005_star_observation_reconciliation.smoke.sql
      - name: Apply lineage graph migration
        run: psql --set ON_ERROR_STOP=1 --file database/migrations/0006_lineage_graph.up.sql
      - name: Run lineage graph smoke test
        run: psql --set ON_ERROR_STOP=1 --file database/migrations/0006_lineage_graph.smoke.sql
      - name: Apply Core Details materialization migration
        run: psql --set ON_ERROR_STOP=1 --file database/migrations/0007_core_materialization.up.sql
      - name: Run Core Details materialization smoke test
        run: psql --set ON_ERROR_STOP=1 --file database/migrations/0007_core_materialization.smoke.sql
      - name: Apply current-snapshot materialization migration
        run: psql --set ON_ERROR_STOP=1 --file database/migrations/0008_snapshot_materialization.up.sql
      - name: Run current-snapshot materialization smoke test
        run: psql --set ON_ERROR_STOP=1 --file database/migrations/0008_snapshot_materialization.smoke.sql
      - name: Apply race-economic ledger migration
        run: psql --set ON_ERROR_STOP=1 --file database/migrations/0009_race_economic_ledger.up.sql
      - name: Run race-economic ledger smoke test
        run: psql --set ON_ERROR_STOP=1 --file database/migrations/0009_race_economic_ledger.smoke.sql
      - name: Apply import-operation reservation migration
        run: psql --set ON_ERROR_STOP=1 --file database/migrations/0010_import_operation_reservation.up.sql
      - name: Run import-operation reservation smoke test
        run: psql --set ON_ERROR_STOP=1 --file database/migrations/0010_import_operation_reservation.smoke.sql
      - name: Apply private-upload reservation migration
        run: psql --set ON_ERROR_STOP=1 --file database/migrations/0011_private_upload_reservation.up.sql
      - name: Run private-upload reservation smoke test
        run: psql --set ON_ERROR_STOP=1 --file database/migrations/0011_private_upload_reservation.smoke.sql
      - name: Reverse private-upload reservation migration
        run: psql --set ON_ERROR_STOP=1 --file database/migrations/0011_private_upload_reservation.down.sql
      - name: Verify private-upload reservation removal
        run: >-
          psql --set ON_ERROR_STOP=1 --command
          "DO \$\$ BEGIN IF EXISTS (
          SELECT 1 FROM pg_proc proc
          JOIN pg_namespace namespace ON namespace.oid = proc.pronamespace
          WHERE namespace.nspname = 'dna'
          AND proc.proname IN (
          'reserve_import_upload_batch',
          'mark_import_upload_targets_ready',
          'mark_import_upload_reservation_failed'
          )
          ) OR EXISTS (
          SELECT 1 FROM pg_class relation
          JOIN pg_namespace namespace ON namespace.oid = relation.relnamespace
          WHERE namespace.nspname = 'dna'
          AND relation.relname IN (
          'import_upload_batch',
          'import_upload_file'
          )
          ) THEN RAISE EXCEPTION 'private-upload reservation objects still exist';
          END IF; END \$\$;"
      - name: Reverse import-operation reservation migration
        run: psql --set ON_ERROR_STOP=1 --file database/migrations/0010_import_operation_reservation.down.sql
      - name: Verify import-operation reservation removal
        run: >-
          psql --set ON_ERROR_STOP=1 --command
          "DO \$\$ BEGIN IF EXISTS (
          SELECT 1 FROM pg_proc proc
          JOIN pg_namespace namespace ON namespace.oid = proc.pronamespace
          WHERE namespace.nspname = 'dna'
          AND proc.proname = 'reserve_import_operation'
          ) OR EXISTS (
          SELECT 1 FROM pg_class relation
          JOIN pg_namespace namespace ON namespace.oid = relation.relnamespace
          WHERE namespace.nspname = 'dna'
          AND relation.relname = 'import_operation_reservation'
          ) OR EXISTS (
          SELECT 1 FROM pg_catalog.pg_roles
          WHERE rolname = 'dna_app_runtime'
          ) THEN RAISE EXCEPTION 'import-operation reservation objects still exist';
          END IF; END \$\$;"
      - name: Reverse race-economic ledger migration
        run: psql --set ON_ERROR_STOP=1 --file database/migrations/0009_race_economic_ledger.down.sql
      - name: Verify race-economic ledger removal
        run: >-
          psql --set ON_ERROR_STOP=1 --command
          "DO \$\$ BEGIN IF EXISTS (
          SELECT 1 FROM pg_proc proc
          JOIN pg_namespace namespace ON namespace.oid = proc.pronamespace
          WHERE namespace.nspname = 'dna'
          AND proc.proname IN (
          'exact_decimal_to_atomic',
          'race_economic_natural_key',
          'materialize_owned_race_economics',
          'record_daily_usd_rate',
          'refresh_race_usd_valuations',
          'rollback_active_dataset_pre_economics'
          )
          ) OR EXISTS (
          SELECT 1 FROM pg_class relation
          JOIN pg_namespace namespace ON namespace.oid = relation.relnamespace
          WHERE namespace.nspname = 'dna'
          AND relation.relname IN (
          'daily_usd_rate',
          'race_economic_contribution',
          'economic_transaction_usd_valuation',
          'current_race_economic_usd',
          'race_economic_usd_coverage'
          )
          ) OR EXISTS (
          SELECT 1 FROM information_schema.columns
          WHERE table_schema = 'dna'
          AND (
          (table_name = 'normalized_race_staged_fact'
          AND column_name IN (
          'race_asset',
          'entry_fee_amount',
          'gross_payout_amount',
          'payout_mechanism_source_value',
          'race_tags_source_value'
          ))
          OR (table_name = 'race_entry_source'
          AND column_name = 'raw_race_tags')
          OR (table_name = 'race_event'
          AND column_name IN (
          'payout_mechanism_source_value',
          'race_tags_source_value'
          ))
          )
          ) THEN RAISE EXCEPTION 'race-economic ledger objects still exist';
          END IF; END \$\$;"
      - name: Reverse current-snapshot materialization migration
        run: psql --set ON_ERROR_STOP=1 --file database/migrations/0008_snapshot_materialization.down.sql
      - name: Verify current-snapshot materialization removal
        run: >-
          psql --set ON_ERROR_STOP=1 --command
          "DO \$\$ BEGIN IF EXISTS (
          SELECT 1 FROM pg_proc proc
          JOIN pg_namespace namespace ON namespace.oid = proc.pronamespace
          WHERE namespace.nspname = 'dna'
          AND proc.proname IN (
          'accept_staged_vault_dataset',
          'accept_staged_arena_dataset',
          'rollback_active_dataset_pre_snapshot'
          )
          ) OR EXISTS (
          SELECT 1 FROM pg_class relation
          JOIN pg_namespace namespace ON namespace.oid = relation.relnamespace
          WHERE namespace.nspname = 'dna'
          AND relation.relname IN (
          'normalized_vault_staged_fact',
          'normalized_arena_staged_fact',
          'vault_snapshot_entry',
          'arena_snapshot_entry',
          'current_vault_snapshot_entry',
          'current_arena_snapshot_entry'
          )
          ) THEN RAISE EXCEPTION 'current-snapshot materialization objects still exist';
          END IF; END \$\$;"
      - name: Reverse Core Details materialization migration
        run: psql --set ON_ERROR_STOP=1 --file database/migrations/0007_core_materialization.down.sql
      - name: Verify Core Details materialization removal
        run: >-
          psql --set ON_ERROR_STOP=1 --command
          "DO \$\$ BEGIN IF EXISTS (
          SELECT 1 FROM pg_proc proc
          JOIN pg_namespace namespace ON namespace.oid = proc.pronamespace
          WHERE namespace.nspname = 'dna'
          AND proc.proname IN (
          'accept_staged_core_dataset',
          'evaluate_family_pair_graph',
          'refresh_core_lineage_unfiltered',
          'rollback_active_dataset_pre_core'
          )
          ) OR EXISTS (
          SELECT 1 FROM pg_class relation
          JOIN pg_namespace namespace ON namespace.oid = relation.relnamespace
          WHERE namespace.nspname = 'dna'
          AND relation.relname IN (
          'normalized_core_staged_fact',
          'core_parent_import_provenance',
          'active_core_details'
          )
          ) OR EXISTS (
          SELECT 1 FROM information_schema.columns
          WHERE table_schema = 'dna'
          AND table_name = 'core_parent'
          AND column_name = 'active_in_core_details'
          ) THEN RAISE EXCEPTION 'Core Details materialization objects still exist';
          END IF; END \$\$;"
      - name: Reverse lineage graph migration
        run: psql --set ON_ERROR_STOP=1 --file database/migrations/0006_lineage_graph.down.sql
      - name: Verify lineage graph removal
        run: >-
          psql --set ON_ERROR_STOP=1 --command
          "DO \$\$ BEGIN IF EXISTS (
          SELECT 1 FROM pg_proc proc
          JOIN pg_namespace namespace ON namespace.oid = proc.pronamespace
          WHERE namespace.nspname = 'dna'
          AND proc.proname IN ('refresh_core_lineage', 'evaluate_family_pair')
          ) OR EXISTS (
          SELECT 1 FROM pg_class relation
          JOIN pg_namespace namespace ON namespace.oid = relation.relnamespace
          WHERE namespace.nspname = 'dna'
          AND relation.relname IN (
          'core_lineage_reachability',
          'core_lineage_validation_issue'
          )
          ) THEN RAISE EXCEPTION 'lineage graph objects still exist';
          END IF; END \$\$;"
      - name: Reverse star-observation reconciliation migration
        run: psql --set ON_ERROR_STOP=1 --file database/migrations/0005_star_observation_reconciliation.down.sql
      - name: Verify star-observation reconciliation removal
        run: >-
          psql --set ON_ERROR_STOP=1 --command
          "DO \$\$ BEGIN IF EXISTS (
          SELECT 1 FROM pg_proc proc
          JOIN pg_namespace namespace ON namespace.oid = proc.pronamespace
          WHERE namespace.nspname = 'dna'
          AND proc.proname = 'reconcile_manual_star_observations'
          ) OR EXISTS (
          SELECT 1 FROM pg_class relation
          JOIN pg_namespace namespace ON namespace.oid = relation.relnamespace
          WHERE namespace.nspname = 'dna'
          AND relation.relname IN (
          'manual_star_observation_reconcile_queue',
          'race_event_reconcile_candidate'
          )
          ) THEN RAISE EXCEPTION 'star-observation reconciliation objects still exist';
          END IF; END \$\$;"
      - name: Reverse star-profile materialization migration
        run: psql --set ON_ERROR_STOP=1 --file database/migrations/0004_star_profile_materialization.down.sql
      - name: Verify star-profile materialization removal
        run: >-
          psql --set ON_ERROR_STOP=1 --command
          "DO \$\$ BEGIN IF EXISTS (
          SELECT 1 FROM pg_class relation
          JOIN pg_namespace namespace ON namespace.oid = relation.relnamespace
          WHERE namespace.nspname = 'dna'
          AND relation.relname = 'core_star_profile'
          ) OR EXISTS (
          SELECT 1 FROM pg_proc proc
          JOIN pg_namespace namespace ON namespace.oid = proc.pronamespace
          WHERE namespace.nspname = 'dna'
          AND proc.proname = 'refresh_star_profiles'
          ) OR EXISTS (
          SELECT 1 FROM information_schema.columns
          WHERE table_schema = 'dna'
          AND table_name = 'event_star_validation'
          AND column_name = 'gold_source_core_ids'
          ) THEN RAISE EXCEPTION 'star-profile materialization objects still exist';
          END IF; END \$\$;"
      - name: Reverse normalized Race Merge materialization migration
        run: psql --set ON_ERROR_STOP=1 --file database/migrations/0003_race_materialization.down.sql
      - name: Verify normalized Race Merge materialization removal
        run: >-
          psql --set ON_ERROR_STOP=1 --command
          "DO \$\$ BEGIN IF EXISTS (
          SELECT 1 FROM pg_class relation
          JOIN pg_namespace namespace ON namespace.oid = relation.relnamespace
          WHERE namespace.nspname = 'dna'
          AND relation.relname = 'normalized_race_staged_fact'
          ) OR EXISTS (
          SELECT 1 FROM information_schema.columns
          WHERE table_schema = 'dna'
          AND table_name IN ('race_event', 'race_entry')
          AND column_name = 'active_in_dataset'
          ) OR EXISTS (
          SELECT 1 FROM pg_proc proc
          JOIN pg_namespace namespace ON namespace.oid = proc.pronamespace
          WHERE namespace.nspname = 'dna'
          AND proc.proname IN (
          'accept_staged_race_dataset',
          'rollback_active_dataset_ledger'
          )
          ) THEN RAISE EXCEPTION 'race materialization objects still exist';
          END IF; END \$\$;"
      - name: Reverse dataset-acceptance migration
        run: psql --set ON_ERROR_STOP=1 --file database/migrations/0002_dataset_acceptance.down.sql
      - name: Verify dataset-acceptance removal
        run: >-
          psql --set ON_ERROR_STOP=1 --command
          "DO \$\$ BEGIN IF EXISTS (
          SELECT 1 FROM pg_class relation
          JOIN pg_namespace namespace ON namespace.oid = relation.relnamespace
          WHERE namespace.nspname = 'dna'
          AND relation.relname IN (
          'dataset_stream', 'dataset_staged_record',
          'dataset_version_record', 'dataset_record_contribution',
          'active_dataset_record'
          )
          ) THEN RAISE EXCEPTION 'dataset acceptance objects still exist';
          END IF; END \$\$;"
      - name: Reverse data-foundation migration
        run: psql --set ON_ERROR_STOP=1 --file database/migrations/0001_data_foundation.down.sql
      - name: Verify schema removal
        run: >-
          psql --set ON_ERROR_STOP=1 --command
          "DO \$\$ BEGIN IF EXISTS (
          SELECT 1 FROM pg_namespace WHERE nspname = 'dna'
          ) THEN RAISE EXCEPTION 'dna schema still exists'; END IF; END \$\$;"
