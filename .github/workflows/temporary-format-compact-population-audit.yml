name: TEMPORARY format compact population audit

on:
  push:
    branches:
      - agent/compact-population-history-audit
    paths:
      - ".github/workflows/temporary-format-compact-population-audit.yml"

permissions:
  contents: write

jobs:
  format-and-remove-self:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/compact-population-history-audit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format only compact-audit changes
        run: >-
          npx prettier --write
          lib/dna-open-lab-combined-history-performance-evidence.ts
          tests/dna-open-lab-combined-history-performance-evidence.test.ts
          tests/hosted-preview-connected-population-history-audit.test.ts
      - name: Remove this one-shot workflow and commit formatting
        shell: bash
        run: |
          rm .github/workflows/temporary-format-compact-population-audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             lib/dna-open-lab-combined-history-performance-evidence.ts             tests/dna-open-lab-combined-history-performance-evidence.test.ts             tests/hosted-preview-connected-population-history-audit.test.ts
          git add -u .github/workflows/temporary-format-compact-population-audit.yml
          if git diff --cached --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git commit -m "Format compact population audit"
          git push origin HEAD:agent/compact-population-history-audit
