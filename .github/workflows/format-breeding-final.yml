name: Format final breeding contract test

on:
  push:
    branches:
      - codex/breeding-offspring-history-backfill
    paths:
      - .github/workflows/format-breeding-final.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/breeding-offspring-history-backfill
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write tests/breeding-all-modes-distance-contract.test.ts
      - name: Commit formatting and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/format-breeding-final.yml
          git add tests/breeding-all-modes-distance-contract.test.ts
          git commit -m "Format cross-mode breeding contract"
          git push origin HEAD:codex/breeding-offspring-history-backfill
