name: temporary population capacity diagnostic

on:
  push:
    branches:
      - temporary/chat-population-capacity-diagnostic-2026-09-24-do-not-merge

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AUTHORIZED_CLERK_USER_ID: ${{ secrets.AUTHORIZED_CLERK_USER_ID }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ANALYTICS_API_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_API_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DNA_R2_BUCKET_NAME: dna-racing-import-preview
      DNA_R2_STORAGE_CLASS: Standard
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Measure current population capacity without writes
        run: npx vitest run --no-file-parallelism tests/temporary-population-capacity-diagnostic.test.ts
      - name: Inspect sanitized Preview relation sizes without writes
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          psql "${DATABASE_URL}" -X -At --set ON_ERROR_STOP=1 --command "
            SELECT 'DNA_PREVIEW_RELATION_SIZE=' ||
                   json_build_object(
                     'schema', schemaname,
                     'relation', relname,
                     'totalBytes', pg_total_relation_size(relid),
                     'tableBytes', pg_table_size(relid),
                     'indexesBytes', pg_indexes_size(relid)
                   )::text
            FROM pg_catalog.pg_statio_user_tables
            WHERE schemaname = 'dna'
            ORDER BY pg_total_relation_size(relid) DESC
            LIMIT 20;
          "
          psql "${DATABASE_URL}" -X -At --set ON_ERROR_STOP=1 --command "
            SELECT 'DNA_POPULATION_INDEX_SHAPE=' ||
                   json_build_object(
                     'rowCount', count(*),
                     'modeNullCount', count(*) FILTER (WHERE mode IS NULL),
                     'bikeCount', count(*) FILTER (WHERE mode = 'bike'),
                     'carCount', count(*) FILTER (WHERE mode = 'car'),
                     'horseCount', count(*) FILTER (WHERE mode = 'horse'),
                     'avgRaceIdChars', round(avg(length(source_race_id))::numeric, 2),
                     'avgCanonicalBytes', round(avg(pg_column_size(canonical))::numeric, 2),
                     'avgRaceIdBytes', round(avg(pg_column_size(source_race_id))::numeric, 2),
                     'avgShaBytes', round(avg(pg_column_size(raw_evidence_sha256))::numeric, 2),
                     'avgRowBytes', round(avg(pg_column_size(r))::numeric, 2)
                   )::text
            FROM dna.dna_population_race_index_race r;
          "
