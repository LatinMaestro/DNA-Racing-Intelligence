name: DNA population entrant continuation readiness

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact current main commit to inspect
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: dna-population-entrant-authority-continuation-readiness
  cancel-in-progress: false

jobs:
  exact-main-read-only-continuation-readiness:
    name: Exact-main read-only continuation readiness
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: preview
    env:
      AUTHORIZED_CLERK_USER_ID: ${{ secrets.AUTHORIZED_CLERK_USER_ID }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ANALYTICS_API_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_API_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DNA_DATABASE_OWNER_ID: ${{ secrets.DNA_DATABASE_OWNER_ID }}
      DNA_OPEN_LAB_API_KEY_1: ${{ secrets.DNA_OPEN_LAB_API_KEY_1 }}
      DNA_OPEN_LAB_API_KEY_2: ${{ secrets.DNA_OPEN_LAB_API_KEY_2 }}
      DNA_OPEN_LAB_API_KEY_3: ${{ secrets.DNA_OPEN_LAB_API_KEY_3 }}
      DNA_POPULATION_ENTRANT_AUTHORITY_CONTINUATION_READINESS: "1"
      DNA_POPULATION_ENTRANT_AUTHORITY_EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
      DNA_R2_ACCESS_KEY_ID: ${{ secrets.DNA_R2_ACCESS_KEY_ID }}
      DNA_R2_BUCKET_NAME: dna-racing-import-preview
      DNA_R2_SECRET_ACCESS_KEY: ${{ secrets.DNA_R2_SECRET_ACCESS_KEY }}
      DNA_R2_STORAGE_CLASS: Standard
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
    steps:
      - name: Require exact main dispatch
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "This entrant continuation-readiness workflow may only run from main."
            exit 1
          fi
          if [[ "${{ inputs.expected_main_sha }}" != "$GITHUB_SHA" ]]; then
            echo "The supplied continuation-readiness commit does not match the dispatch head."
            exit 1
          fi
      - name: Checkout exact head
        uses: actions/checkout@v4
      - name: Prove dispatch head is current main
        shell: bash
        run: |
          git fetch --no-tags origin main
          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]] || \
             [[ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]]; then
            echo "The entrant continuation-readiness head is no longer current main."
            exit 1
          fi
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Inspect durable continuation boundary read-only
        run: >-
          npx vitest run --no-file-parallelism
          tests/hosted-preview-connected-population-entrant-authority-continuation-readiness.test.ts
      - name: Publish sanitized readiness status
        env:
          DNA_STATUS_MODE: readiness
          DNA_STATUS_COMMENT_ID: "5866846740"
          DNA_STATUS_RECEIPT_PATH: ${{ runner.temp }}/dna-entrant-continuation-readiness.json
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/update-dna-runtime-status.mjs
      - name: Prove exact main remained unchanged
        if: always()
        shell: bash
        run: |
          git fetch --no-tags origin main
          if [[ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]]; then
            echo "Main changed during entrant continuation readiness."
            exit 1
          fi
