name: Pro League full-gate Preview migration

on:
  workflow_dispatch:
    inputs:
      exact_main_sha:
        description: Exact current main commit containing migration 0152
        required: true
        type: string
      apply_private_preview_migration:
        description: Confirm reviewed Pro League migration apply to private Preview
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: pro-league-full-gate-preview-migration
  cancel-in-progress: false

jobs:
  apply-reviewed-preview-migration:
    name: Apply reviewed Pro League full-gate migration to Preview
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: preview
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      EXPECTED_MAIN_SHA: ${{ inputs.exact_main_sha }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
    steps:
      - name: Require exact main and explicit private Preview migration arm
        shell: bash
        run: |
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$EXPECTED_MAIN_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$EXPECTED_MAIN_SHA" == "$GITHUB_SHA" ]]
          [[ "${{ inputs.apply_private_preview_migration }}" == "true" ]]
      - name: Checkout exact accepted head
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.exact_main_sha }}
          fetch-depth: 0
      - name: Prove dispatch head is current main
        shell: bash
        run: |
          git fetch --no-tags origin main
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_MAIN_SHA" ]]
          [[ "$(git rev-parse origin/main)" == "$EXPECTED_MAIN_SHA" ]]
      - name: Validate approved private Preview binding without exposure
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          for (const name of ["DATABASE_URL", "NEON_API_KEY", "NEON_PROJECT_ID"]) {
            const value = process.env[name] ?? "";
            if (!value || value.trim() !== value || value.length > 4096) {
              throw new Error("Private Preview migration configuration is incomplete.");
            }
          }
          if (process.env.NEON_PROJECT_ID !== "fancy-bar-26534950") {
            throw new Error("The private Preview Neon project is not approved.");
          }
          const parsed = new URL(process.env.DATABASE_URL);
          const database = decodeURIComponent(parsed.pathname.replace(/^\//, ""));
          const endpoint = parsed.hostname.split(".")[0]?.replace(/-pooler$/, "");
          const role = decodeURIComponent(parsed.username);
          if (database !== "neondb" ||
              endpoint !== "ep-misty-paper-a796pgn0" ||
              role !== "dna_app_runtime") {
            throw new Error("The private Preview runtime target is not approved.");
          }
          NODE
      - name: Install PostgreSQL client
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
      - name: Acquire masked short-lived approved migration binding
        shell: bash
        run: |
          export DNA_RUNTIME_ENDPOINT_ID="ep-misty-paper-a796pgn0"
          branch_id="$(npx --yes neon@6.0.0 api \
            "/projects/${NEON_PROJECT_ID}/endpoints" \
            --output json --no-color 2>/dev/null | node --input-type=module -e '
              let body = "";
              for await (const chunk of process.stdin) body += chunk;
              const parsed = JSON.parse(body);
              const matches = (parsed.endpoints ?? []).filter(
                (endpoint) => endpoint?.id === process.env.DNA_RUNTIME_ENDPOINT_ID,
              );
              if (matches.length !== 1 ||
                  matches[0]?.branch_id !== "br-floral-haze-a7bvs9lu" ||
                  matches[0]?.autoscaling_limit_min_cu !== 0.25 ||
                  matches[0]?.autoscaling_limit_max_cu !== 0.25 ||
                  matches[0]?.suspend_timeout_seconds !== 0 ||
                  typeof matches[0]?.suspended_at !== "string") {
                throw new Error("The bounded private Preview endpoint is not approved.");
              }
              process.stdout.write(matches[0].branch_id);
            ')"
          migration_url="$(npx --yes neon@6.0.0 connection-string "$branch_id" \
            --project-id "$NEON_PROJECT_ID" --role-name neondb_owner \
            --database-name neondb --no-color 2>/dev/null)"
          [[ "$migration_url" =~ ^postgres(ql)?://[^[:space:]]+$ ]]
          echo "::add-mask::$migration_url"
          echo "DNA_MIGRATION_DATABASE_URL=$migration_url" >> "$GITHUB_ENV"
      - name: Fail closed unless migration 0152 is wholly absent
        shell: bash
        run: |
          psql "$DNA_MIGRATION_DATABASE_URL" --set ON_ERROR_STOP=1 <<'SQL'
          DO $contract$
          BEGIN
            IF to_regclass('dna.pro_league_full_gate_plan') IS NOT NULL
              OR to_regclass('dna.pro_league_full_gate_assignment_snapshot') IS NOT NULL
              OR to_regprocedure(
                'dna.store_pro_league_full_gate_plan(uuid,text,text,text,text,jsonb)'
              ) IS NOT NULL
              OR to_regprocedure(
                'dna.read_pro_league_full_gate_plan(uuid,text)'
              ) IS NOT NULL
            THEN
              RAISE EXCEPTION 'Pro League full-gate migration is not wholly absent';
            END IF;
          END
          $contract$;
          SQL
      - name: Apply and smoke reviewed migration 0152
        shell: bash
        run: |
          set -euo pipefail
          rollback() {
            psql "$DNA_MIGRATION_DATABASE_URL" --set ON_ERROR_STOP=1 \
              --file database/migrations/0152_pro_league_full_gate_persistence.down.sql
            psql "$DNA_MIGRATION_DATABASE_URL" --set ON_ERROR_STOP=1 \
              --file database/migrations/0152_pro_league_full_gate_persistence.removal.sql
          }
          trap rollback ERR
          psql "$DNA_MIGRATION_DATABASE_URL" --set ON_ERROR_STOP=1 \
            --file database/migrations/0152_pro_league_full_gate_persistence.up.sql
          psql "$DNA_MIGRATION_DATABASE_URL" --set ON_ERROR_STOP=1 \
            --file database/migrations/0152_pro_league_full_gate_persistence.smoke.sql
          trap - ERR
      - name: Clear short-lived Preview migration binding
        if: always()
        shell: bash
        run: echo "DNA_MIGRATION_DATABASE_URL=" >> "$GITHUB_ENV"
      - name: Prove exact main remained unchanged
        if: always()
        shell: bash
        run: |
          git fetch --no-tags origin main
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_MAIN_SHA" ]]
          [[ "$(git rev-parse origin/main)" == "$EXPECTED_MAIN_SHA" ]]
