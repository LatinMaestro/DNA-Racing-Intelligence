name: temporary chat midrange opposition audit
on:
  push:
    branches:
      - temporary/chat-midrange-opposition-audit-2026-09-20-do-not-merge
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      MIDRANGE_OPPOSITION_AUDIT: "1"
      DNA_OPEN_LAB_API_KEY_1: ${{ secrets.DNA_OPEN_LAB_API_KEY_1 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/temporary-chat-midrange-opposition-audit.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: temporary-chat-midrange-opposition-audit
          path: midrange-opposition-audit.json
          retention-days: 1
