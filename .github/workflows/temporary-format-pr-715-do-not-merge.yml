name: TEMPORARY format PR 715 — DO NOT MERGE

on:
  push:
    branches:
      - agent/bound-incremental-history-r2-read-concurrency

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write lib/dna-open-lab-combined-history-performance-evidence.ts
      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatter changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/dna-open-lab-combined-history-performance-evidence.ts
          git commit -m "TEMPORARY format incremental history concurrency"
          git push origin HEAD:agent/bound-incremental-history-r2-read-concurrency
