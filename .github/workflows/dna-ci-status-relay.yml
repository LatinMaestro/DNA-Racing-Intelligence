name: DNA CI status relay

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  issues: write

jobs:
  publish:
    if: >-
      ${{ github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DNA_STATUS_MODE: ci
      DNA_STATUS_COMMENT_ID: "5866846183"
      DNA_STATUS_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      DNA_STATUS_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - name: Checkout exact completed CI head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Publish sanitized current-main CI status
        run: node .github/scripts/update-dna-runtime-status.mjs
