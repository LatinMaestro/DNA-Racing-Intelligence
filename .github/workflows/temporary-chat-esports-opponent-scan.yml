name: temporary chat esports opponent scan

on:
  push:
    branches:
      - temporary/chat-esports-opponent-scan-2026-09-20-do-not-merge

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pull public opponent team and match evidence
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const base = 'https://api.dnaracing.run/fbike/esports';
          const teamIds = ['e4879e84ec','68082d17da','1c0422c92c','8c52c6d87d'];
          const outDir = 'esports-opponent-scan';
          fs.mkdirSync(outDir,{recursive:true});

          async function post(path, body={}) {
            try {
              const res = await fetch(base + path, {
                method:'POST',
                headers:{
                  'content-type':'application/json',
                  'accept':'application/json',
                  'user-agent':'Mozilla/5.0 ChatGPT read-only opponent analysis'
                },
                body:JSON.stringify(body),
                redirect:'follow'
              });
              const text = await res.text();
              let data = null;
              try { data = JSON.parse(text); } catch {}
              return {ok:res.ok,status:res.status,data,text:data===null?text.slice(0,2000):undefined};
            } catch (error) {
              return {ok:false,status:null,error:String(error)};
            }
          }

          async function main() {
            const output = {
              generatedAt:new Date().toISOString(),
              globals:{},
              teams:{},
              events:{}
            };

            for (const [key,path,body] of [
              ['maps','/maps',{}],
              ['race_types','/race_types',{}],
              ['seasons','/seasons',{}],
              ['season_state','/season_state',{}],
              ['standings','/standings',{season:null}],
              ['events','/events',{week:null,season:null}]
            ]) {
              output.globals[key] = await post(path,body);
            }

            const eventIds = new Set();
            for (const teamId of teamIds) {
              const team = {};
              team.team = await post('/team',{team_id:teamId});
              team.events = await post('/team/events',{team_id:teamId});
              team.history = await post('/team/match_history',{team_id:teamId,limit:100,skip:0,bucket:null});
              team.stats = await post('/vault_stats',{team_id:teamId,of_vault:null,season:0});
              team.subs_state = await post('/team/subs_state',{team_id:teamId});
              team.subs_history = await post('/team/subs_history',{team_id:teamId});
              output.teams[teamId] = team;

              const collect = (value) => {
                if (!value) return;
                if (Array.isArray(value)) { for (const x of value) collect(x); return; }
                if (typeof value !== 'object') return;
                for (const [k,v] of Object.entries(value)) {
                  if ((k === 'event_id' || k === 'eventId') && (typeof v === 'string' || typeof v === 'number')) eventIds.add(String(v));
                  collect(v);
                }
              };
              collect(team.history?.data);
              collect(team.events?.data);
            }

            for (const eventId of [...eventIds]) {
              output.events[eventId] = {
                event: await post('/event',{event_id:eventId}),
                assign1: await post('/event/assign_status',{event_id:eventId,map_slot:1}),
                assign2: await post('/event/assign_status',{event_id:eventId,map_slot:2}),
                assign3: await post('/event/assign_status',{event_id:eventId,map_slot:3})
              };
            }

            fs.writeFileSync(outDir + '/opponents-api.json',JSON.stringify(output,null,2));
            console.log(JSON.stringify({
              teamCount:Object.keys(output.teams).length,
              eventCount:Object.keys(output.events).length,
              teamSummary:Object.fromEntries(Object.entries(output.teams).map(([id,t]) => [
                id,
                {
                  team:t.team.status,
                  events:t.events.status,
                  history:t.history.status,
                  stats:t.stats.status
                }
              ]))
            },null,2));
          }

          main().catch(error=>{console.error(error);process.exitCode=1});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: temporary-chat-esports-opponent-scan
          path: esports-opponent-scan
          retention-days: 1
