name: temporary complete Arena proof

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/temporary-complete-arena-proof.yml
  push:
    branches:
      - temporary/chat-arena-complete-proof-2026-09-21-do-not-merge
    paths:
      - .github/workflows/temporary-complete-arena-proof.yml

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      DNA_OPEN_LAB_API_KEY_3: ${{ secrets.DNA_OPEN_LAB_API_KEY_3 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Refresh shortlisted external parent Arena status and prices
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");
          const key = process.env.DNA_OPEN_LAB_API_KEY_3;
          if (!/^dna_[A-Za-z0-9_-]{43}$/.test(key ?? "")) throw new Error("API key unavailable");
          const hids=[35,140,1450,4126,4287,10345,14961,15568,17922,18346,19035,22670,23396,23480,23538,23683,24361,24370,24931,25017];
          const res=await fetch("https://api.dnaracing.run/fbike/pub/v1/cores/splicing_info_bulk",{
            method:"POST",
            headers:{authorization:"Bearer "+key,accept:"application/json","content-type":"application/json"},
            body:JSON.stringify({hids})
          });
          const text=await res.text();
          let json=null; try {json=JSON.parse(text)} catch {}
          if (!res.ok || json?.status!=="success" || !Array.isArray(json.result)) throw new Error("splicing_info_bulk "+res.status+" "+text.slice(0,500));
          const byHid=new Map(json.result.map(x=>[Number(x?.hid),x]));
          const candidates=hids.map(hid=>({hid,found:byHid.has(hid),splicing:byHid.get(hid)??null}));
          const report={fetchedAt:new Date().toISOString(),endpoint:"/cores/splicing_info_bulk",candidates};
          fs.writeFileSync("arena-shortlist-refresh.json",JSON.stringify(report,null,2));
          console.log(JSON.stringify({fetchedAt:report.fetchedAt,rows:json.result.length,inStud:candidates.filter(x=>x.splicing?.in_stud===true).map(x=>x.hid),notInStud:candidates.filter(x=>x.splicing?.in_stud===false).map(x=>x.hid)}));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: arena-shortlist-refresh
          path: arena-shortlist-refresh.json
          retention-days: 1
