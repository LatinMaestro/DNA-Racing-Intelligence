name: temporary complete Arena proof

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/temporary-complete-arena-proof.yml
  push:
    branches:
      - temporary/chat-arena-complete-proof-2026-09-21-do-not-merge
    paths:
      - .github/workflows/temporary-complete-arena-proof.yml

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DNA_OPEN_LAB_API_KEY_3: ${{ secrets.DNA_OPEN_LAB_API_KEY_3 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Pull complete Bike Arena and verify external breeding parents
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");
          const key = process.env.DNA_OPEN_LAB_API_KEY_3;
          if (!/^dna_[A-Za-z0-9_-]{43}$/.test(key ?? "")) {
            throw new Error("DNA Open Lab API key is missing or invalid");
          }

          const base = "https://api.dnaracing.run/fbike/pub/v1";
          const candidateHids = [
            35, 140, 1450, 4126, 4287, 10345, 14961, 15568, 17922, 18346,
            19035, 22670, 23396, 23480, 23538, 23683, 24361, 24370, 24931, 25017
          ];
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          let lastStartedAt = 0;

          async function request(path, method = "GET", body) {
            let lastError = null;
            for (let attempt = 1; attempt <= 6; attempt += 1) {
              const wait = Math.max(0, 2200 - (Date.now() - lastStartedAt));
              if (wait > 0) await sleep(wait);
              lastStartedAt = Date.now();
              const controller = new AbortController();
              const timer = setTimeout(() => controller.abort(), 60000);
              try {
                const response = await fetch(base + path, {
                  method,
                  signal: controller.signal,
                  headers: {
                    authorization: "Bearer " + key,
                    accept: "application/json",
                    ...(body === undefined ? {} : {"content-type": "application/json"}),
                  },
                  ...(body === undefined ? {} : {body: JSON.stringify(body)}),
                });
                const text = await response.text();
                let json = null;
                try { json = JSON.parse(text); } catch {}
                if (response.status === 429) {
                  const retry = Math.max(3, Number(response.headers.get("retry-after") || 3));
                  await sleep(retry * 1000);
                  continue;
                }
                if (!response.ok || json?.status !== "success" || !("result" in json)) {
                  throw new Error(path + " " + response.status + " " + text.slice(0, 400));
                }
                return json.result;
              } catch (error) {
                lastError = error;
                if (attempt === 6) throw error;
                await sleep(3000);
              } finally {
                clearTimeout(timer);
              }
            }
            throw lastError ?? new Error("request retries exhausted");
          }

          async function post(path, body) {
            return request(path, "POST", body);
          }

          function assertPositiveInteger(value, field) {
            if (!Number.isSafeInteger(value) || value < 1) {
              throw new Error(field + " is invalid");
            }
          }

          async function pullBikeArena() {
            const pages = [];
            const cores = [];
            const seen = new Set();
            let expectedLimit = null;

            for (let page = 1; page <= 512; page += 1) {
              const result = await post("/splice/arena", {f: {rvmode: "bike"}, page});
              if (!result || typeof result !== "object" || Array.isArray(result)) {
                throw new Error("bike page " + page + " result is malformed");
              }
              if (result.page !== page) {
                throw new Error("bike page drift " + page + " -> " + result.page);
              }
              assertPositiveInteger(result.limit, "bike limit");
              if (expectedLimit !== null && result.limit !== expectedLimit) {
                throw new Error("bike page-size drift");
              }
              expectedLimit = result.limit;
              if (typeof result.has_more !== "boolean" || !Array.isArray(result.cores)) {
                throw new Error("bike pagination envelope is malformed");
              }
              if (result.cores.length > result.limit) {
                throw new Error("bike page exceeds provider limit");
              }
              for (const core of result.cores) {
                assertPositiveInteger(core?.hid, "bike hid");
                if (seen.has(core.hid)) throw new Error("bike duplicate Core " + core.hid);
                seen.add(core.hid);
                cores.push(core);
              }
              pages.push({
                page,
                count: result.cores.length,
                limit: result.limit,
                reportedHasMore: result.has_more,
              });
              console.log(JSON.stringify({mode:"bike",page,count:result.cores.length,limit:result.limit,reportedHasMore:result.has_more}));

              const needsContinuation =
                result.has_more === true || result.cores.length === result.limit;
              if (!needsContinuation) break;
              if (page === 512) throw new Error("bike page bound exceeded");
            }

            const final = pages.at(-1);
            if (!final || final.reportedHasMore === true || final.count === final.limit) {
              throw new Error("bike did not reach a proven terminal short/empty page");
            }
            return {pages, cores};
          }

          (async () => {
            const bike = await pullBikeArena();
            const splicingInfo = await post("/cores/splicing_info_bulk", {hids: candidateHids});
            if (!Array.isArray(splicingInfo)) throw new Error("splicing_info_bulk result malformed");
            const splicingByHid = new Map(splicingInfo.map((row) => [Number(row?.hid), row]));
            const arenaByHid = new Map(bike.cores.map((row) => [Number(row?.hid), row]));

            const candidates = candidateHids.map((hid) => ({
              hid,
              arenaListed: arenaByHid.has(hid),
              arenaListing: arenaByHid.get(hid) ?? null,
              splicingFound: splicingByHid.has(hid),
              splicing: splicingByHid.get(hid) ?? null,
            }));

            const report = {
              fetchedAt: new Date().toISOString(),
              continuationRule: "has_more_true_or_full_page; terminal_short_or_empty_and_has_more_false",
              bike: {
                pages: bike.pages,
                count: bike.cores.length,
                cores: bike.cores,
              },
              candidates,
            };

            fs.writeFileSync("bike-arena-parent-verification.json", JSON.stringify(report, null, 2));
            console.log(JSON.stringify({
              fetchedAt: report.fetchedAt,
              bikeCount: bike.cores.length,
              pages: bike.pages,
              listed: candidates.filter((x) => x.arenaListed).map((x) => x.hid),
              notListed: candidates.filter((x) => !x.arenaListed).map((x) => x.hid),
              inStud: candidates.filter((x) => x.splicing?.splice_core?.in_stud === true).map((x) => x.hid),
              notInStud: candidates.filter((x) => x.splicing?.splice_core?.in_stud === false).map((x) => x.hid),
            }));
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: bike-arena-parent-verification
          path: bike-arena-parent-verification.json
          retention-days: 1
