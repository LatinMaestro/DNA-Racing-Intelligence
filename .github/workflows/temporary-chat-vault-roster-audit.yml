name: temporary chat vault roster audit

on:
  push:
    branches:
      - temporary/chat-pro-league-live-refresh-2026-09-18-do-not-merge

permissions:
  contents: read

jobs:
  audit:
    if: github.event.head_commit.message == 'Add temporary vault roster audit'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      VAULT_ROSTER_AUDIT: "1"
      DNA_OPEN_LAB_API_KEY_1: ${{ secrets.DNA_OPEN_LAB_API_KEY_1 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/temporary-chat-vault-roster-audit.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: temporary-chat-vault-roster-audit
          path: vault-roster-audit.json
          retention-days: 1
