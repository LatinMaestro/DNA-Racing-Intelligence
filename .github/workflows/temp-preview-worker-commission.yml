name: Temporary exact-head Preview Worker commission

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cloudflare-preview-worker-commission
  cancel-in-progress: false

env:
  EXPECTED_QUEUE_ID: df7408e1d697475db4dbcdda1aa3e247
  EXPECTED_QUEUE_NAME: dna-racing-import-preview
  EXPECTED_DLQ: dna-racing-import-preview-dlq
  EXPECTED_WORKER_NAME: dna-racing-import-preview
  WORKER_SECRETS_FILE: /tmp/dna-racing-preview-worker-secrets.json

jobs:
  commission:
    if: github.head_ref == 'agent/hosted-race-archive-aggregate-runtime'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      AUTHORIZED_CLERK_USER_ID: ${{ secrets.AUTHORIZED_CLERK_USER_ID }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DNA_DATABASE_OWNER_ID: ${{ secrets.DNA_DATABASE_OWNER_ID }}
      DNA_R2_ACCESS_KEY_ID: ${{ secrets.DNA_R2_ACCESS_KEY_ID }}
      DNA_R2_SECRET_ACCESS_KEY: ${{ secrets.DNA_R2_SECRET_ACCESS_KEY }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Validate protected Preview target
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const required = [
            "AUTHORIZED_CLERK_USER_ID",
            "CLOUDFLARE_ACCOUNT_ID",
            "CLOUDFLARE_API_TOKEN",
            "DATABASE_URL",
            "DNA_DATABASE_OWNER_ID",
            "DNA_R2_ACCESS_KEY_ID",
            "DNA_R2_SECRET_ACCESS_KEY",
          ];
          for (const name of required) {
            const value = process.env[name]?.trim() ?? "";
            if (!value || value.length > 4096) throw new Error(name + " is unavailable");
          }
          if (!process.env.AUTHORIZED_CLERK_USER_ID.startsWith("user_")) {
            throw new Error("Preview owner identity is invalid");
          }
          if (!/^[a-f0-9]{32}$/.test(process.env.CLOUDFLARE_ACCOUNT_ID)) {
            throw new Error("Cloudflare account identity is invalid");
          }
          const databaseUrl = new URL(process.env.DATABASE_URL);
          if (
            decodeURIComponent(databaseUrl.username) !== "dna_app_runtime" ||
            !databaseUrl.hostname.includes("-pooler.") ||
            !databaseUrl.hostname.endsWith(".neon.tech") ||
            databaseUrl.pathname !== "/neondb" ||
            databaseUrl.searchParams.get("sslmode") !== "require"
          ) {
            throw new Error("Worker database target is outside protected Preview runtime");
          }
          console.log("Validated protected private Preview deployment target.");
          NODE
      - name: Validate exact Worker bundle before deployment
        run: npm run worker:dry-run
      - name: Record pre-deploy Worker inventory
        run: npx wrangler deployments list --config wrangler.jsonc
      - name: Materialize ephemeral Worker secrets
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";
          const names = [
            "AUTHORIZED_CLERK_USER_ID",
            "CLOUDFLARE_ACCOUNT_ID",
            "CLOUDFLARE_API_TOKEN",
            "DATABASE_URL",
            "DNA_DATABASE_OWNER_ID",
            "DNA_R2_ACCESS_KEY_ID",
            "DNA_R2_SECRET_ACCESS_KEY",
          ];
          const secrets = Object.fromEntries(names.map((name) => {
            const value = process.env[name];
            if (!value) throw new Error("Missing " + name);
            return [name, value];
          }));
          writeFileSync(process.env.WORKER_SECRETS_FILE, JSON.stringify(secrets), {
            encoding: "utf8",
            mode: 0o600,
          });
          NODE
      - name: Deploy exact protected Preview Worker
        run: >-
          npx wrangler deploy
          --config wrangler.jsonc
          --strict
          --experimental-provision=false
          --experimental-auto-create=false
          --secrets-file "${WORKER_SECRETS_FILE}"
      - name: Remove ephemeral Worker secrets
        if: always()
        run: rm -f -- "${WORKER_SECRETS_FILE}"
      - name: Verify deployed secret bindings
        run: |
          npx wrangler secret list --config wrangler.jsonc > "${RUNNER_TEMP}/worker-secret-list.json"
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const expected = new Set([
            "AUTHORIZED_CLERK_USER_ID",
            "CLOUDFLARE_ACCOUNT_ID",
            "CLOUDFLARE_API_TOKEN",
            "DATABASE_URL",
            "DNA_DATABASE_OWNER_ID",
            "DNA_R2_ACCESS_KEY_ID",
            "DNA_R2_SECRET_ACCESS_KEY",
          ]);
          const bindings = JSON.parse(
            readFileSync(process.env.RUNNER_TEMP + "/worker-secret-list.json", "utf8"),
          );
          const actual = new Set(bindings.map((binding) => binding.name));
          if (
            actual.size !== expected.size ||
            [...expected].some((name) => !actual.has(name))
          ) {
            throw new Error("Deployed Worker secret bindings changed");
          }
          console.log("Verified seven exact protected Worker secret bindings.");
          NODE
      - name: Verify exact queue consumer controls
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const response = await fetch(
            "https://api.cloudflare.com/client/v4/accounts/" +
              process.env.CLOUDFLARE_ACCOUNT_ID +
              "/queues/" +
              process.env.EXPECTED_QUEUE_ID +
              "/consumers",
            {
              headers: {
                Authorization: "Bearer " + process.env.CLOUDFLARE_API_TOKEN,
                "Content-Type": "application/json",
              },
            },
          );
          const body = await response.json();
          if (!response.ok || body.success !== true || !Array.isArray(body.result)) {
            throw new Error("Could not verify deployed Preview consumer");
          }
          if (body.result.length !== 1) {
            throw new Error("Preview queue consumer count changed");
          }
          const consumer = body.result[0];
          const settings = consumer.settings ?? {};
          const deadLetterQueue =
            consumer.dead_letter_queue ?? consumer.dead_letter_queue_name;
          if (
            consumer.type !== "worker" ||
            consumer.queue_name !== process.env.EXPECTED_QUEUE_NAME ||
            (consumer.script_name != null &&
              consumer.script_name !== process.env.EXPECTED_WORKER_NAME) ||
            deadLetterQueue !== process.env.EXPECTED_DLQ ||
            Number(settings.batch_size) !== 1 ||
            Number(settings.max_concurrency) !== 1 ||
            Number(settings.max_retries) !== 3 ||
            Number(settings.max_wait_time_ms) !== 5000
          ) {
            throw new Error("Deployed Preview queue consumer controls changed");
          }
          console.log("Verified protected Preview queue-only Worker controls.");
          NODE
      - name: Record post-deploy Worker inventory
        run: npx wrangler deployments list --config wrangler.jsonc
