name: Temporary upgrade lineage census

on:
  push:
    branches:
      - codex/breeding-offspring-history-backfill
    paths:
      - .github/workflows/temporary-upgrade-lineage-census.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/breeding-offspring-history-backfill
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Upgrade census contract for existing history/analysis stages
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/hosted-breeding-lineage-census.test.ts')
          s = p.read_text()

          marker = '''function assertAuthority(): void {\n  if (Date.now() >= Date.parse(RESEARCH_EXPIRES_AT)) {\n    throw new Error("Temporary August 150 rpm research authority has expired.");\n  }\n}\n'''
          insert = marker + '''\nfunction extractRequestIds(\n  value: unknown,\n  path = "splice_core",\n): { path: string; value: string }[] {\n  if (value === null || value === undefined) return [];\n  if (Array.isArray(value)) {\n    return value.flatMap((entry, index) =>\n      extractRequestIds(entry, `${path}[${index}]`),\n    );\n  }\n  if (typeof value !== "object") return [];\n  const record = value as AnyRecord;\n  const out: { path: string; value: string }[] = [];\n  for (const [key, entry] of Object.entries(record)) {\n    const nextPath = `${path}.${key}`;\n    if (\n      typeof entry === "string" &&\n      entry.trim() !== "" &&\n      /(req(?:uest)?[_-]?id|requestid)/i.test(key)\n    ) {\n      out.push({ path: nextPath, value: entry.trim() });\n    }\n    out.push(...extractRequestIds(entry, nextPath));\n  }\n  return out;\n}\n'''
          if marker not in s:
              raise SystemExit('assertAuthority marker missing')
          s = s.replace(marker, insert, 1)

          marker2 = '''      const relevantHids = [...new Set([...parentTargets, ...relevantChildHids])].sort(\n        (a, b) => a - b,\n      );\n'''
          insert2 = marker2 + '''      const directParentsByChild = Object.fromEntries(\n        links\n          .filter((link) => relevantChildHids.has(link.childHid))\n          .map((link) => [String(link.childHid), [...new Set(link.parentHids)]]),\n      );\n'''
          if marker2 not in s:
              raise SystemExit('relevantHids marker missing')
          s = s.replace(marker2, insert2, 1)

          marker3 = '''      for (const batch of chunks(relevantHids, CORE_BATCH_SIZE)) {\n        const [infoResponse, statsResponse, powerResponse, splicingResponse] =\n          await Promise.all([\n            paced(() => client.coreInfoBulk(batch)),\n            paced(() => client.coreRacingStatsBulk(batch)),\n            paced(() => client.corePowerBulk(batch)),\n            paced(() => client.coreSplicingInfoBulk(batch)),\n          ]);\n        info.push(...(infoResponse.result as AnyRecord[]));\n        stats.push(...(statsResponse.result as AnyRecord[]));\n        power.push(...(powerResponse.result as AnyRecord[]));\n        splicing.push(...(splicingResponse.result as AnyRecord[]));\n      }\n'''
          insert3 = marker3 + '''\n      const requestIds: { childHid: number; path: string; requestId: string }[] = [];\n      for (const row of splicing) {\n        const childHid = finiteHid(row.hid);\n        if (childHid === null || !relevantChildHids.has(childHid)) continue;\n        for (const request of extractRequestIds(row.splice_core)) {\n          requestIds.push({\n            childHid,\n            path: request.path,\n            requestId: request.value,\n          });\n        }\n      }\n      const spliceDocuments: AnyRecord[] = [];\n      const seenRequestIds = new Set<string>();\n      for (const request of requestIds) {\n        if (seenRequestIds.has(request.requestId)) continue;\n        seenRequestIds.add(request.requestId);\n        try {\n          const response = await paced(() => client.spliceDocument(request.requestId));\n          spliceDocuments.push({\n            requestId: request.requestId,\n            childHid: request.childHid,\n            path: request.path,\n            document: response.result,\n            error: null,\n          });\n        } catch (error) {\n          spliceDocuments.push({\n            requestId: request.requestId,\n            childHid: request.childHid,\n            path: request.path,\n            document: null,\n            error: error instanceof Error ? error.message : String(error),\n          });\n        }\n      }\n'''
          if marker3 not in s:
              raise SystemExit('core family marker missing')
          s = s.replace(marker3, insert3, 1)

          marker4 = '''          relevantCoreCount: relevantHids.length,\n          offspringByParent: [...offspringByParent.entries()]\n'''
          insert4 = '''          relevantCoreCount: relevantHids.length,\n          universe: {\n            hids: relevantHids,\n            directParentsByChild,\n          },\n          spliceDiscovery: {\n            requestIds,\n            spliceDocuments,\n          },\n          offspringByParent: [...offspringByParent.entries()]\n'''
          if marker4 not in s:
              raise SystemExit('output marker missing')
          s = s.replace(marker4, insert4, 1)
          p.write_text(s)
          PY
          npx prettier --write tests/hosted-breeding-lineage-census.test.ts
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temporary-upgrade-lineage-census.yml
          git add tests/hosted-breeding-lineage-census.test.ts
          git commit -m "Align lineage census with breeder analysis contract"
          git push origin HEAD:codex/breeding-offspring-history-backfill
