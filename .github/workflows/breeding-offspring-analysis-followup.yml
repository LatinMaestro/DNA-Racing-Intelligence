name: Breeding full two-parent analysis follow-up

on:
  push:
    branches:
      - codex/breeding-offspring-history-backfill
    paths:
      - .github/workflows/breeding-offspring-analysis-followup.yml

permissions:
  contents: read
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: "33317292893"
      COPARENT_RUN_ID: "33320144999"
      UPGRADED_CENSUS_ARTIFACT_ID: "9733841620"
      DNA_BREEDING_FULL_TWO_PARENT_ANALYSIS: "1"
      BREEDING_CENSUS_PATH: artifacts/inventory/breeding-lineage-census-upgraded.json
      BREEDING_COPARENT_INVENTORY_PATH: artifacts/inventory/breeding-missing-coparent-inventory.json
      BREEDING_HISTORY_DIRS: artifacts/history/base,artifacts/history/coparent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Download lineage census and co-parent inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/inventory
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${UPGRADED_CENSUS_ARTIFACT_ID}/zip" > /tmp/census.zip
          unzip -q /tmp/census.zip -d artifacts/inventory
          coparent_inventory_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${COPARENT_RUN_ID}/artifacts" \
            --jq '.artifacts[] | select(.name == "breeding-missing-coparent-inventory") | .id' | head -n 1)
          test -n "$coparent_inventory_id"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${coparent_inventory_id}/zip" > /tmp/coparent-inventory.zip
          unzip -q /tmp/coparent-inventory.zip -d artifacts/inventory
          test -f artifacts/inventory/breeding-lineage-census-upgraded.json
          test -f artifacts/inventory/breeding-missing-coparent-inventory.json
      - name: Download original and co-parent history shards
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/history/base artifacts/history/coparent
          for shard in 0 1 2 3; do
            base_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts" \
              --jq ".artifacts[] | select(.name == \"breeding-census-history-${shard}\") | .id" | head -n 1)
            coparent_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${COPARENT_RUN_ID}/artifacts" \
              --jq ".artifacts[] | select(.name == \"breeding-missing-coparent-history-${shard}\") | .id" | head -n 1)
            test -n "$base_id"
            test -n "$coparent_id"
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${base_id}/zip" > "/tmp/base-${shard}.zip"
            unzip -q "/tmp/base-${shard}.zip" -d artifacts/history/base
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${coparent_id}/zip" > "/tmp/coparent-${shard}.zip"
            unzip -q "/tmp/coparent-${shard}.zip" -d artifacts/history/coparent
          done
          test "$(find artifacts/history/base -name 'breeding-race-history-*.json' | wc -l)" -eq 4
          test "$(find artifacts/history/coparent -name 'breeding-race-history-*.json' | wc -l)" -eq 4
      - name: Build strict full two-parent breeder research report
        run: npx vitest run --no-file-parallelism tests/hosted-breeding-full-two-parent-analysis.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: breeding-full-two-parent-analysis
          path: artifacts/analysis/breeding-full-two-parent-analysis.json
          if-no-files-found: error
          retention-days: 2
