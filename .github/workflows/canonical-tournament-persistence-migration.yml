name: Canonical Tournament persistence migration

on:
  pull_request:
    paths:
      - "database/migrations/0025_canonical_tournament_persistence.*.sql"
      - ".github/workflows/canonical-tournament-persistence-migration.yml"

permissions:
  contents: read

jobs:
  canonical-tournament-persistence-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dna_racing_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dna_racing_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: dna_racing_ci
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply prerequisite migrations
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r migration; do
            [[ "$migration" == *"/0025_"* ]] && break
            psql --set ON_ERROR_STOP=1 --file "$migration"
          done < <(find database/migrations -maxdepth 1 -name '*.up.sql' | sort)
      - name: Apply canonical Tournament persistence migration
        run: >-
          psql --set ON_ERROR_STOP=1 --file
          database/migrations/0025_canonical_tournament_persistence.up.sql
      - name: Run canonical Tournament persistence smoke test
        run: >-
          psql --set ON_ERROR_STOP=1 --file
          database/migrations/0025_canonical_tournament_persistence.smoke.sql
      - name: Reverse canonical Tournament persistence migration
        run: >-
          psql --set ON_ERROR_STOP=1 --file
          database/migrations/0025_canonical_tournament_persistence.down.sql
      - name: Verify canonical Tournament persistence was removed
        run: >-
          psql --set ON_ERROR_STOP=1 --command
          "DO \$\$ BEGIN IF EXISTS (
          SELECT 1 FROM information_schema.columns
          WHERE table_schema = 'dna'
          AND table_name = 'tournament_configuration'
          AND column_name = 'campaign_action'
          ) OR to_regprocedure(
          'dna.list_complete_tournament_configurations(uuid)'
          ) IS NOT NULL THEN
          RAISE EXCEPTION 'canonical Tournament persistence remains';
          END IF; END \$\$;"
