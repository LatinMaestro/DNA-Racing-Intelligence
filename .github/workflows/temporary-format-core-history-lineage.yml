name: TEMPORARY format Core history lineage PR

on:
  push:
    branches:
      - agent/core-history-lineage-composition

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/core-history-lineage-composition
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write lib/dna-core-race-history-generation-materializer.ts tests/dna-core-race-history-generation-materializer.test.ts
      - name: Commit formatter output only
        shell: bash
        run: |
          if git diff --quiet -- lib/dna-core-race-history-generation-materializer.ts tests/dna-core-race-history-generation-materializer.test.ts; then
            echo "No formatter changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/dna-core-race-history-generation-materializer.ts tests/dna-core-race-history-generation-materializer.test.ts
          git commit -m "TEMPORARY format Core history lineage"
          git push origin HEAD:agent/core-history-lineage-composition
