name: Temporary format breeding history

on:
  push:
    branches:
      - codex/breeding-offspring-history-backfill
    paths:
      - .github/workflows/temporary-format-breeding-history.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/breeding-offspring-history-backfill
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format breeding history files
        run: npx prettier --write domain/breeding-offspring-evidence.ts tests/breeding-offspring-evidence.test.ts tests/hosted-breeding-universe-inventory.test.ts tests/hosted-breeding-race-history-shard.test.ts tests/hosted-breeding-offspring-analysis.test.ts
      - name: Commit formatting and remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/temporary-format-breeding-history.yml
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add domain/breeding-offspring-evidence.ts tests/breeding-offspring-evidence.test.ts tests/hosted-breeding-universe-inventory.test.ts tests/hosted-breeding-race-history-shard.test.ts tests/hosted-breeding-offspring-analysis.test.ts .github/workflows/temporary-format-breeding-history.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "[format-only] Format breeding history backfill"
          git push origin HEAD:codex/breeding-offspring-history-backfill
