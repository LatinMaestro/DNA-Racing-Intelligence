name: Connected Preview R2 acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/connected-preview-r2-acceptance.yml"
      - "lib/cloudflare-r2-import-object-storage.ts"
      - "lib/cloudflare-r2-s3-port.ts"
      - "tests/hosted-preview-connected-r2.test.ts"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: connected-preview-r2-acceptance
  cancel-in-progress: false

jobs:
  connected-r2:
    name: Presigned upload, verify, and clean up
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'LatinMaestro')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AUTHORIZED_CLERK_USER_ID: ${{ secrets.AUTHORIZED_CLERK_USER_ID }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DNA_CONNECTED_PREVIEW_ACCEPTANCE: "1"
      DNA_R2_ACCESS_KEY_ID: ${{ secrets.DNA_R2_ACCESS_KEY_ID }}
      DNA_R2_SECRET_ACCESS_KEY: ${{ secrets.DNA_R2_SECRET_ACCESS_KEY }}
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Validate bounded Preview secret contract
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const required = [
            "AUTHORIZED_CLERK_USER_ID",
            "CLOUDFLARE_ACCOUNT_ID",
            "CLOUDFLARE_API_TOKEN",
            "DNA_R2_ACCESS_KEY_ID",
            "DNA_R2_SECRET_ACCESS_KEY",
          ];
          for (const name of required) {
            const value = process.env[name];
            if (!value || value.trim() !== value || value.length > 4096) {
              throw new Error(name + " is missing, padded, or unexpectedly large");
            }
          }
          if (!process.env.AUTHORIZED_CLERK_USER_ID.startsWith("user_")) {
            throw new Error("AUTHORIZED_CLERK_USER_ID must be a Clerk user ID");
          }
          if (!/^[a-f0-9]{32}$/.test(process.env.CLOUDFLARE_ACCOUNT_ID)) {
            throw new Error("CLOUDFLARE_ACCOUNT_ID has an unexpected shape");
          }
          console.log("Validated bounded Preview R2 acceptance inputs.");
          NODE
      - name: Run connected synthetic direct-upload acceptance
        run: npx vitest run tests/hosted-preview-connected-r2.test.ts
