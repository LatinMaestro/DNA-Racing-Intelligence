name: Connected Preview provider acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/connected-preview-r2-acceptance.yml"
      - "database/migrations/0043_pro_league_multi_source_aggregate_refresh.up.sql"
      - "database/migrations/0044_import_dataset_rollback.up.sql"
      - "database/migrations/0045_dataset_evidence_object_manifest.up.sql"
      - "database/migrations/0046_unlinked_dataset_evidence_cleanup.up.sql"
      - "database/migrations/0047_accepted_dataset_evidence_compaction.up.sql"
      - "database/migrations/0048_import_activation_evidence_compaction.up.sql"
      - "database/migrations/0049_staged_evidence_compaction_coverage.up.sql"
      - "database/migrations/0050_preview_processing_failure_stage.up.sql"
      - "database/migrations/0051_preview_evidence_resume.up.sql"
      - "database/migrations/0052_preview_evidence_owner_identity.up.sql"
      - "database/migrations/0059_race_archive_core_locators.up.sql"
      - "database/migrations/0060_race_archive_aggregate_publication.up.sql"
      - "database/migrations/0061_preserve_archive_aggregates_on_current_refresh.up.sql"
      - "database/migrations/0062_race_archive_aggregate_refresh_plan.up.sql"
      - "database/migrations/0063_aggregate_refresh_target_source.up.sql"
      - "lib/aggregate-refresh-source-router.ts"
      - "lib/cloudflare-r2-import-object-storage.ts"
      - "lib/cloudflare-r2-s3-port.ts"
      - "lib/cloudflare-r2-dataset-evidence-port.ts"
      - "lib/private-dataset-evidence-object-reader.ts"
      - "lib/private-dataset-evidence-object-writer.ts"
      - "lib/neon-dataset-evidence-object-repository.ts"
      - "lib/hosted-import-activation-worker-runtime.ts"
      - "lib/hosted-import-preview-worker-runtime.ts"
      - "lib/hosted-import-upload-completion-runtime.ts"
      - "lib/hosted-pro-league-aggregate-worker-runtime.ts"
      - "lib/import-aggregate-refresh-service.ts"
      - "lib/import-aggregate-retry-action-service.ts"
      - "lib/import-background-processing-service.ts"
      - "lib/import-queue-consumer.ts"
      - "lib/import-upload-completion-service.ts"
      - "lib/neon-aggregate-refresh-target-source.ts"
      - "lib/neon-durable-import-preview-staging-repository.ts"
      - "lib/durable-import-preview-staging-sink.ts"
      - "lib/bounded-accepted-dataset-processor.ts"
      - "lib/bounded-import-preview-processor.ts"
      - "lib/neon-import-persistence-driver.ts"
      - "lib/neon-import-activation.ts"
      - "lib/neon-import-rollback-repository.ts"
      - "lib/neon-import-confirmation-cleanup-repository.ts"
      - "lib/neon-import-pre-activation-cleanup-repository.ts"
      - "lib/neon-import-upload-completion-repository.ts"
      - "lib/neon-import-upload-intake-repository.ts"
      - "lib/neon-pro-league-aggregate-refresh.ts"
      - "lib/neon-race-archive-aggregate-publication.ts"
      - "lib/neon-race-archive-aggregate-refresh-plan.ts"
      - "lib/neon-race-archive-core-locator-repository.ts"
      - "lib/neon-sealed-race-archive-manifest-repository.ts"
      - "lib/race-archive-aggregate-refresher.ts"
      - "lib/race-staged-row-locator-sealing-rehydrator.ts"
      - "lib/race-staged-row-rehydrator.ts"
      - "lib/sealed-race-archive-reader.ts"
      - "tests/hosted-preview-evidence-residue-recovery.ts"
      - "tests/hosted-preview-connected-evidence-residue-cleanup.test.ts"
      - "tests/hosted-preview-connected-evidence-object.test.ts"
      - "tests/hosted-preview-connected-neon-import-rollback.test.ts"
      - "tests/hosted-preview-connected-neon-pre-activation-cleanup.test.ts"
      - "tests/hosted-preview-connected-neon-upload-completion.test.ts"
      - "tests/hosted-preview-connected-neon-upload-reservation.test.ts"
      - "tests/hosted-preview-connected-staging-contract.test.ts"
      - "tests/hosted-preview-connected-queue-worker.test.ts"
      - "tests/hosted-preview-connected-r2.test.ts"
      - "tests/race-staged-row-locator-sealing-rehydrator.test.ts"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: cloudflare-preview-worker-commission
  cancel-in-progress: false

jobs:
  connected-provider:
    name: Upload, reservation, verification, queue, Worker, and clean up
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'LatinMaestro')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AUTHORIZED_CLERK_USER_ID: ${{ secrets.AUTHORIZED_CLERK_USER_ID }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DNA_CONNECTED_PREVIEW_ACCEPTANCE: "1"
      DNA_DATABASE_OWNER_ID: ${{ secrets.DNA_DATABASE_OWNER_ID }}
      DNA_IMPORT_DEAD_LETTER_QUEUE_NAME: dna-racing-import-preview-dlq
      DNA_IMPORT_QUEUE_ID: df7408e1d697475db4dbcdda1aa3e247
      DNA_IMPORT_QUEUE_NAME: dna-racing-import-preview
      DNA_R2_BUCKET_NAME: dna-racing-import-preview
      DNA_R2_ACCESS_KEY_ID: ${{ secrets.DNA_R2_ACCESS_KEY_ID }}
      DNA_R2_SECRET_ACCESS_KEY: ${{ secrets.DNA_R2_SECRET_ACCESS_KEY }}
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Validate bounded Preview secret contract
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const required = [
            "AUTHORIZED_CLERK_USER_ID",
            "CLOUDFLARE_ACCOUNT_ID",
            "CLOUDFLARE_API_TOKEN",
            "DATABASE_URL",
            "DNA_DATABASE_OWNER_ID",
            "DNA_R2_ACCESS_KEY_ID",
            "DNA_R2_SECRET_ACCESS_KEY",
          ];
          for (const name of required) {
            const value = process.env[name];
            if (!value || value.trim() !== value || value.length > 4096) {
              throw new Error(name + " is missing, padded, or unexpectedly large");
            }
          }
          if (!process.env.AUTHORIZED_CLERK_USER_ID.startsWith("user_")) {
            throw new Error("AUTHORIZED_CLERK_USER_ID must be a Clerk user ID");
          }
          if (!/^[a-f0-9]{32}$/.test(process.env.CLOUDFLARE_ACCOUNT_ID)) {
            throw new Error("CLOUDFLARE_ACCOUNT_ID has an unexpected shape");
          }
          if (
            process.env.DNA_DATABASE_OWNER_ID !==
            "ae7e0493-eb8d-4de8-b1f6-9815d1c0c8a3"
          ) {
            throw new Error("DNA_DATABASE_OWNER_ID targets the wrong Preview owner");
          }
          const databaseUrl = new URL(process.env.DATABASE_URL);
          if (
            decodeURIComponent(databaseUrl.username) !== "dna_app_runtime" ||
            !databaseUrl.password ||
            !databaseUrl.hostname.includes("-pooler.") ||
            !databaseUrl.hostname.endsWith(".neon.tech") ||
            databaseUrl.pathname !== "/neondb" ||
            databaseUrl.searchParams.get("sslmode") !== "require"
          ) {
            throw new Error("DATABASE_URL is outside the pooled Preview runtime contract");
          }
          console.log("Validated bounded connected Preview acceptance inputs.");
          NODE
      - name: Verify archive aggregate Preview schema
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { neon } from "@neondatabase/serverless";

          const sql = neon(process.env.DATABASE_URL);
          const rows = await sql.query(`
            SELECT
              to_regprocedure('dna.pro_league_aggregate_refresh_target_source_type(uuid,uuid,uuid,character)') IS NOT NULL AS target_source,
              to_regprocedure('dna.list_race_archive_aggregate_refresh_versions(uuid,uuid,uuid,character,integer)') IS NOT NULL AS archive_plan,
              to_regprocedure('dna.begin_race_archive_aggregate_publication(uuid,uuid,uuid,text,character,timestamp with time zone)') IS NOT NULL AS publication_begin,
              to_regprocedure('dna.stage_race_archive_aggregate_rows(uuid,uuid,text,text,integer,jsonb)') IS NOT NULL AS publication_stage,
              to_regprocedure('dna.publish_race_archive_aggregates(uuid,uuid,text,character,bigint,bigint,bigint,bigint,bigint,bigint,timestamp with time zone)') IS NOT NULL AS publication_publish,
              to_regclass('dna.race_archive_core_locator_receipt') IS NOT NULL AS core_locator_receipt,
              to_regclass('dna.race_archive_aggregate_publication_receipt') IS NOT NULL AS publication_receipt
          `);
          if (rows.length !== 1) {
            throw new Error("Preview archive aggregate schema probe returned an unexpected row count");
          }
          const required = Object.entries(rows[0]);
          const missing = required
            .filter(([, available]) => available !== true)
            .map(([name]) => name);
          if (missing.length > 0) {
            throw new Error(
              "Protected Preview archive aggregate schema is not commissioned: " +
                missing.join(", "),
            );
          }
          console.log("Verified protected Preview archive aggregate schema prerequisites.");
          NODE
      - name: Prove least-privilege Preview staging contract
        run: >-
          npx vitest run --no-file-parallelism
          tests/hosted-preview-connected-staging-contract.test.ts
      - name: Run connected synthetic provider acceptance
        run: >-
          npx vitest run --no-file-parallelism
          tests/hosted-preview-connected-r2.test.ts
          tests/hosted-preview-connected-evidence-object.test.ts
          tests/hosted-preview-connected-neon-upload-reservation.test.ts
          tests/hosted-preview-connected-neon-upload-completion.test.ts
          tests/hosted-preview-connected-neon-pre-activation-cleanup.test.ts
          tests/hosted-preview-connected-neon-import-rollback.test.ts
          tests/hosted-preview-connected-queue-worker.test.ts
      - name: Recover synthetic Preview evidence residue
        if: always()
        env:
          DNA_CONNECTED_PREVIEW_EVIDENCE_RESIDUE_CLEANUP: "1"
        run: >-
          npx vitest run --no-file-parallelism
          tests/hosted-preview-connected-evidence-residue-cleanup.test.ts
