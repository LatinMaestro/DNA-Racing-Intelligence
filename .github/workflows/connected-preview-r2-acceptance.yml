name: Connected Preview provider acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/connected-preview-r2-acceptance.yml"
      - "lib/cloudflare-r2-import-object-storage.ts"
      - "lib/cloudflare-r2-s3-port.ts"
      - "lib/hosted-import-preview-worker-runtime.ts"
      - "lib/hosted-import-upload-completion-runtime.ts"
      - "lib/import-upload-completion-service.ts"
      - "lib/neon-durable-import-preview-staging-repository.ts"
      - "lib/durable-import-preview-staging-sink.ts"
      - "lib/bounded-import-preview-processor.ts"
      - "lib/neon-import-persistence-driver.ts"
      - "lib/neon-import-pre-activation-cleanup-repository.ts"
      - "lib/neon-import-upload-completion-repository.ts"
      - "lib/neon-import-upload-intake-repository.ts"
      - "tests/hosted-preview-connected-neon-pre-activation-cleanup.test.ts"
      - "tests/hosted-preview-connected-neon-upload-completion.test.ts"
      - "tests/hosted-preview-connected-neon-upload-reservation.test.ts"
      - "tests/hosted-preview-connected-queue-worker.test.ts"
      - "tests/hosted-preview-connected-r2.test.ts"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: connected-preview-provider-acceptance
  cancel-in-progress: false

jobs:
  connected-provider:
    name: Upload, reservation, verification, queue, Worker, and clean up
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'LatinMaestro')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AUTHORIZED_CLERK_USER_ID: ${{ secrets.AUTHORIZED_CLERK_USER_ID }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DNA_CONNECTED_PREVIEW_ACCEPTANCE: "1"
      DNA_DATABASE_OWNER_ID: ${{ secrets.DNA_DATABASE_OWNER_ID }}
      DNA_IMPORT_DEAD_LETTER_QUEUE_NAME: dna-racing-import-preview-dlq
      DNA_IMPORT_QUEUE_ID: df7408e1d697475db4dbcdda1aa3e247
      DNA_IMPORT_QUEUE_NAME: dna-racing-import-preview
      DNA_R2_BUCKET_NAME: dna-racing-import-preview
      DNA_R2_ACCESS_KEY_ID: ${{ secrets.DNA_R2_ACCESS_KEY_ID }}
      DNA_R2_SECRET_ACCESS_KEY: ${{ secrets.DNA_R2_SECRET_ACCESS_KEY }}
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Validate bounded Preview secret contract
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const required = [
            "AUTHORIZED_CLERK_USER_ID",
            "CLOUDFLARE_ACCOUNT_ID",
            "CLOUDFLARE_API_TOKEN",
            "DATABASE_URL",
            "DNA_DATABASE_OWNER_ID",
            "DNA_R2_ACCESS_KEY_ID",
            "DNA_R2_SECRET_ACCESS_KEY",
          ];
          for (const name of required) {
            const value = process.env[name];
            if (!value || value.trim() !== value || value.length > 4096) {
              throw new Error(name + " is missing, padded, or unexpectedly large");
            }
          }
          if (!process.env.AUTHORIZED_CLERK_USER_ID.startsWith("user_")) {
            throw new Error("AUTHORIZED_CLERK_USER_ID must be a Clerk user ID");
          }
          if (!/^[a-f0-9]{32}$/.test(process.env.CLOUDFLARE_ACCOUNT_ID)) {
            throw new Error("CLOUDFLARE_ACCOUNT_ID has an unexpected shape");
          }
          if (
            process.env.DNA_DATABASE_OWNER_ID !==
            "ae7e0493-eb8d-4de8-b1f6-9815d1c0c8a3"
          ) {
            throw new Error("DNA_DATABASE_OWNER_ID targets the wrong Preview owner");
          }
          const databaseUrl = new URL(process.env.DATABASE_URL);
          if (
            decodeURIComponent(databaseUrl.username) !== "dna_app_runtime" ||
            !databaseUrl.password ||
            !databaseUrl.hostname.includes("-pooler.") ||
            !databaseUrl.hostname.endsWith(".neon.tech") ||
            databaseUrl.pathname !== "/neondb" ||
            databaseUrl.searchParams.get("sslmode") !== "require"
          ) {
            throw new Error("DATABASE_URL is outside the pooled Preview runtime contract");
          }
          console.log("Validated bounded connected Preview acceptance inputs.");
          NODE
      - name: Run connected synthetic provider acceptance
        run: >-
          npx vitest run
          tests/hosted-preview-connected-r2.test.ts
          tests/hosted-preview-connected-neon-upload-reservation.test.ts
          tests/hosted-preview-connected-neon-upload-completion.test.ts
          tests/hosted-preview-connected-neon-pre-activation-cleanup.test.ts
          tests/hosted-preview-connected-queue-worker.test.ts
