name: temporary chat horse Free refresh

on:
  push:
    branches:
      - temporary/chat-horse-free-refresh-2026-09-20-do-not-merge

permissions:
  contents: read

concurrency:
  group: temporary-chat-horse-free-refresh-2026-09-20
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MAIN_SHA: 8d2a98abdd03c43d80f171f46471285563eaa0f0
      AUTHORIZED_CLERK_USER_ID: ${{ secrets.AUTHORIZED_CLERK_USER_ID }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ANALYTICS_API_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_API_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DNA_DATABASE_OWNER_ID: ${{ secrets.DNA_DATABASE_OWNER_ID }}
      DNA_OPEN_LAB_API_KEY_1: ${{ secrets.DNA_OPEN_LAB_API_KEY_1 }}
      DNA_OPEN_LAB_API_KEY_2: ${{ secrets.DNA_OPEN_LAB_API_KEY_2 }}
      DNA_OPEN_LAB_API_KEY_3: ${{ secrets.DNA_OPEN_LAB_API_KEY_3 }}
      DNA_OPEN_LAB_PRIVATE_DAILY_REFRESH_COMMAND: "1"
      DNA_OPEN_LAB_PRIVATE_DAILY_REFRESH_MAXIMUM_STEPS: "100"
      DNA_OPEN_LAB_PRIVATE_DAILY_REFRESH_UPPER_BOUND_AT: "2026-09-20T02:00:00.000Z"
      DNA_OPEN_LAB_VAULT: ${{ secrets.DNA_OPEN_LAB_VAULT }}
      DNA_R2_ACCESS_KEY_ID: ${{ secrets.DNA_R2_ACCESS_KEY_ID }}
      DNA_R2_BUCKET_NAME: dna-racing-import-preview
      DNA_R2_SECRET_ACCESS_KEY: ${{ secrets.DNA_R2_SECRET_ACCESS_KEY }}
      DNA_R2_STORAGE_CLASS: Standard
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
    steps:
      - name: Checkout temporary trigger
        uses: actions/checkout@v4
      - name: Prove current main matches fixed authority
        shell: bash
        run: |
          git fetch --no-tags origin main
          if [[ "$(git rev-parse origin/main)" != "$MAIN_SHA" ]]; then
            echo "Main moved from the fixed refresh authority."
            exit 1
          fi
      - name: Checkout exact current main code
        shell: bash
        run: git checkout --detach "$MAIN_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Validate private Preview configuration without exposure
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const required = [
            "AUTHORIZED_CLERK_USER_ID","CLOUDFLARE_ACCOUNT_ID","CLOUDFLARE_API_TOKEN",
            "CLOUDFLARE_ANALYTICS_API_TOKEN","DATABASE_URL","DNA_DATABASE_OWNER_ID",
            "DNA_OPEN_LAB_API_KEY_1","DNA_OPEN_LAB_API_KEY_2","DNA_OPEN_LAB_API_KEY_3",
            "DNA_OPEN_LAB_PRIVATE_DAILY_REFRESH_UPPER_BOUND_AT","DNA_OPEN_LAB_VAULT",
            "DNA_R2_ACCESS_KEY_ID","DNA_R2_BUCKET_NAME","DNA_R2_SECRET_ACCESS_KEY",
            "DNA_R2_STORAGE_CLASS","NEON_API_KEY","NEON_PROJECT_ID","MAIN_SHA"
          ];
          const invalid = required.filter((name) => {
            const value = process.env[name];
            return !value || value.trim() !== value || value.length > 4096;
          });
          if (invalid.length) throw new Error("Missing/invalid refresh settings: " + invalid.join(", "));
          const cutoff = new Date(process.env.DNA_OPEN_LAB_PRIVATE_DAILY_REFRESH_UPPER_BOUND_AT);
          if (Number.isNaN(cutoff.getTime()) || cutoff.toISOString() !== process.env.DNA_OPEN_LAB_PRIVATE_DAILY_REFRESH_UPPER_BOUND_AT || cutoff.getTime() > Date.now()) {
            throw new Error("Refresh cutoff is invalid.");
          }
          if (new Set([process.env.DNA_OPEN_LAB_API_KEY_1,process.env.DNA_OPEN_LAB_API_KEY_2,process.env.DNA_OPEN_LAB_API_KEY_3]).size !== 3) {
            throw new Error("Three distinct API keys are required.");
          }
          console.log("Validated Preview-only refresh configuration.");
          NODE
      - name: Execute bounded resumable refresh against exact main authority
        shell: bash
        run: |
          GITHUB_SHA="$MAIN_SHA" npx vitest run --no-file-parallelism tests/hosted-preview-connected-private-daily-refresh-command.test.ts
      - name: Prove main remained unchanged
        if: always()
        shell: bash
        run: |
          git fetch --no-tags origin main
          if [[ "$(git rev-parse origin/main)" != "$MAIN_SHA" ]]; then
            echo "Main changed during the refresh."
            exit 1
          fi
