name: Temporary force lineage fallback

on:
  push:
    branches:
      - codex/breeding-offspring-history-backfill
    paths:
      - .github/workflows/temporary-force-lineage-fallback.yml

permissions:
  actions: write
  contents: read

jobs:
  switch:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PRIMARY_RUN_ID: "33306940620"
      INVENTORY_WORKFLOW_ID: "345816250"
      BRANCH_NAME: codex/breeding-offspring-history-backfill
      EXPIRES_AT: "2026-08-31T14:00:00Z"
    steps:
      - name: Stop broad inventory and launch lineage-first pipeline
        shell: bash
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          now=$(date -u +%s)
          expiry=$(date -u -d "${EXPIRES_AT}" +%s)
          if [ "$now" -ge "$expiry" ]; then
            echo "Temporary August authority already expired; no fallback will be launched."
            exit 0
          fi

          status=$(gh api "repos/${repo}/actions/runs/${PRIMARY_RUN_ID}" --jq '.status')
          if [ "$status" != "completed" ]; then
            echo "Cancelling long-running broad inventory ${PRIMARY_RUN_ID}."
            gh api -X POST "repos/${repo}/actions/runs/${PRIMARY_RUN_ID}/cancel" >/dev/null 2>&1 || true
          fi

          sleep 20
          gh api "repos/${repo}/actions/workflows/${INVENTORY_WORKFLOW_ID}/runs?branch=${BRANCH_NAME}&per_page=50" \
            --jq ".workflow_runs[] | select(.status == \"queued\" or .status == \"pending\" or .status == \"in_progress\") | .id" \
            | while read -r run_id; do
                [ -z "$run_id" ] && continue
                echo "Cancelling broad inventory run ${run_id}."
                gh api -X POST "repos/${repo}/actions/runs/${run_id}/cancel" >/dev/null 2>&1 || true
              done

          existing=$(gh api "repos/${repo}/actions/runs?branch=${BRANCH_NAME}&per_page=100" \
            --jq '[.workflow_runs[] | select(.name == "Breeding lineage census fallback" and (.status == "queued" or .status == "pending" or .status == "in_progress" or .conclusion == "success"))] | length')
          if [ "$existing" -eq 0 ]; then
            gh workflow run breeding-lineage-census-fallback.yml --repo "${repo}" --ref "${BRANCH_NAME}"
            echo "Lineage-first fallback dispatched."
          else
            echo "Lineage-first fallback already exists; no duplicate launched."
          fi
