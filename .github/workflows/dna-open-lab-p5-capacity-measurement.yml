name: DNA Open Lab P5 capacity measurement

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: dna-open-lab-p5-capacity-measurement
  cancel-in-progress: false

jobs:
  rollback-only-private-preview-capacity:
    name: Rollback-only private Preview capacity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AUTHORIZED_CLERK_USER_ID: ${{ secrets.AUTHORIZED_CLERK_USER_ID }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DNA_DATABASE_OWNER_ID: ${{ secrets.DNA_DATABASE_OWNER_ID }}
      DNA_OPEN_LAB_P5_CONNECTED_CAPACITY: "1"
      DNA_OPEN_LAB_P5_PROVIDER_PREFLIGHT: "1"
      DNA_R2_ACCESS_KEY_ID: ${{ secrets.DNA_R2_ACCESS_KEY_ID }}
      DNA_R2_BUCKET_NAME: dna-racing-import-preview
      DNA_R2_SECRET_ACCESS_KEY: ${{ secrets.DNA_R2_SECRET_ACCESS_KEY }}
    steps:
      - name: Require exact main dispatch
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "This bounded provider workflow may only run from main."
            exit 1
          fi
      - name: Checkout exact head
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Validate secret presence without exposure
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const required = [
            "AUTHORIZED_CLERK_USER_ID",
            "CLOUDFLARE_ACCOUNT_ID",
            "CLOUDFLARE_API_TOKEN",
            "DATABASE_URL",
            "DNA_DATABASE_OWNER_ID",
            "DNA_R2_ACCESS_KEY_ID",
            "DNA_R2_SECRET_ACCESS_KEY",
          ];
          for (const name of required) {
            const value = process.env[name];
            if (!value || value.trim() !== value || value.length > 4096) {
              throw new Error(name + " is missing or invalid");
            }
          }
          console.log("Validated bounded capacity-measurement secret presence.");
          NODE
      - name: Re-prove exact-head provider prerequisites
        run: >-
          npx vitest run --no-file-parallelism
          tests/hosted-preview-connected-p5-provider-prerequisites.test.ts
      - name: Execute rollback-only connected capacity measurement
        id: capacity
        run: >-
          npx vitest run --no-file-parallelism
          tests/hosted-preview-connected-p5-capacity-measurement.test.ts
      - name: Prove post-run cleanup and provider safety
        id: cleanup
        if: always()
        run: >-
          npx vitest run --no-file-parallelism
          tests/hosted-preview-connected-p5-provider-prerequisites.test.ts
      - name: Upload sanitized capacity evidence
        if: steps.capacity.outcome == 'success' && steps.cleanup.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: dna-open-lab-p5-capacity-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/dna-open-lab-p5-capacity-evidence.json
          if-no-files-found: error
          retention-days: 7
