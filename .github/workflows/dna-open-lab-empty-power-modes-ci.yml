name: DNA Open Lab empty power modes migration

on:
  pull_request:
    branches:
      - main
    paths:
      - database/migrations/0109_dna_open_lab_empty_power_modes.up.sql
      - database/migrations/0109_dna_open_lab_empty_power_modes.smoke.sql
      - database/migrations/0109_dna_open_lab_empty_power_modes.down.sql
      - database/migrations/0109_dna_open_lab_empty_power_modes.removal.sql
      - tests/dna-open-lab-empty-power-modes.test.ts
      - .github/workflows/dna-open-lab-empty-power-modes-ci.yml
  push:
    branches:
      - main
    paths:
      - database/migrations/0109_dna_open_lab_empty_power_modes.up.sql
      - database/migrations/0109_dna_open_lab_empty_power_modes.smoke.sql
      - database/migrations/0109_dna_open_lab_empty_power_modes.down.sql
      - database/migrations/0109_dna_open_lab_empty_power_modes.removal.sql
      - tests/dna-open-lab-empty-power-modes.test.ts
      - .github/workflows/dna-open-lab-empty-power-modes-ci.yml

permissions:
  contents: read

jobs:
  migration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dna_racing_empty_power_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dna_racing_empty_power_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: dna_racing_empty_power_ci
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply authoritative CI migration baseline through 0108
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t migrations < <(
            grep -oE 'database/migrations/[0-9]{4}_[^ ]+\.up\.sql' .github/workflows/ci.yml |
              awk '!seen[$0]++'
          )
          if [[ "${#migrations[@]}" -lt 1 ]] || [[ "${migrations[-1]}" != "database/migrations/0108_dna_open_lab_partial_power_modes.up.sql" ]]; then
            echo "Authoritative CI migration baseline does not end at 0108."
            exit 1
          fi
          for migration in "${migrations[@]}"; do
            psql --set ON_ERROR_STOP=1 --file "$migration" >/dev/null
          done
      - name: Apply empty power modes migration
        run: psql --set ON_ERROR_STOP=1 --file database/migrations/0109_dna_open_lab_empty_power_modes.up.sql
      - name: Run empty power modes smoke test
        run: psql --set ON_ERROR_STOP=1 --file database/migrations/0109_dna_open_lab_empty_power_modes.smoke.sql
      - name: Reverse empty power modes migration
        run: psql --set ON_ERROR_STOP=1 --file database/migrations/0109_dna_open_lab_empty_power_modes.down.sql
      - name: Verify empty power modes removal
        run: psql --set ON_ERROR_STOP=1 --file database/migrations/0109_dna_open_lab_empty_power_modes.removal.sql
