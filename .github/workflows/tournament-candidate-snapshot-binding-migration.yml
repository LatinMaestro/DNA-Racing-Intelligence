name: Tournament candidate snapshot binding migration

on:
  pull_request:
    paths:
      - "database/migrations/0027_tournament_candidate_snapshot_binding.*.sql"
      - ".github/workflows/tournament-candidate-snapshot-binding-migration.yml"

permissions:
  contents: read

jobs:
  tournament-candidate-snapshot-binding-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dna_racing_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dna_racing_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: dna_racing_ci
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply prerequisite migrations
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r migration; do
            [[ "$migration" == *"/0027_"* ]] && break
            psql --set ON_ERROR_STOP=1 --file "$migration"
          done < <(find database/migrations -maxdepth 1 -name '*.up.sql' | sort)
      - name: Apply Tournament candidate snapshot binding migration
        run: >-
          psql --set ON_ERROR_STOP=1 --file
          database/migrations/0027_tournament_candidate_snapshot_binding.up.sql
      - name: Run Tournament candidate snapshot binding smoke test
        run: >-
          psql --set ON_ERROR_STOP=1 --file
          database/migrations/0027_tournament_candidate_snapshot_binding.smoke.sql
      - name: Reverse Tournament candidate snapshot binding migration
        run: >-
          psql --set ON_ERROR_STOP=1 --file
          database/migrations/0027_tournament_candidate_snapshot_binding.down.sql
      - name: Verify Tournament candidate snapshot binding was removed
        run: >-
          psql --set ON_ERROR_STOP=1 --command
          "DO \$\$ BEGIN IF to_regprocedure(
          'dna.list_bound_tournament_configurations(uuid)'
          ) IS NOT NULL OR to_regprocedure(
          'dna.bind_tournament_candidate_snapshot(uuid,text,text,text)'
          ) IS NOT NULL OR to_regprocedure(
          'dna.derive_tournament_candidate_snapshot(uuid,text)'
          ) IS NOT NULL THEN
          RAISE EXCEPTION 'Tournament candidate snapshot binding remains';
          END IF; END \$\$;"
