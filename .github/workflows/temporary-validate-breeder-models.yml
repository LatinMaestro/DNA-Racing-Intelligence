name: Temporary validate breeder models

on:
  push:
    branches:
      - codex/breeding-offspring-history-backfill
    paths:
      - .github/workflows/temporary-validate-breeder-models.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/breeding-offspring-history-backfill
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format and validate breeder model files
        shell: bash
        run: |
          npx prettier --write \
            domain/breeder-mating-expectation.ts \
            tests/breeder-mating-expectation.test.ts \
            domain/breeder-effect-decomposition.ts \
            tests/breeder-effect-decomposition.test.ts
          npx eslint \
            domain/breeder-mating-expectation.ts \
            tests/breeder-mating-expectation.test.ts \
            domain/breeder-effect-decomposition.ts \
            tests/breeder-effect-decomposition.test.ts
          npx vitest run --no-file-parallelism \
            tests/breeder-mating-expectation.test.ts \
            tests/breeder-effect-decomposition.test.ts
      - name: Commit validated formatting and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temporary-validate-breeder-models.yml
          git add \
            domain/breeder-mating-expectation.ts \
            tests/breeder-mating-expectation.test.ts \
            domain/breeder-effect-decomposition.ts \
            tests/breeder-effect-decomposition.test.ts
          git commit -m "[format-only] validate empirical breeder models"
          git push origin HEAD:codex/breeding-offspring-history-backfill
