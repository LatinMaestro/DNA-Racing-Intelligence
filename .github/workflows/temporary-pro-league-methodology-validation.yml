name: temporary pro league methodology validation

on:
  push:
    branches:
      - feature/pro-league-roster-mapping-free-benchmark-methodology-20260920

permissions:
  contents: write

jobs:
  validate:
    if: github.event.head_commit.message == 'Run temporary Pro League formatter'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format changed files
        run: npx prettier --write components/pro-league-commissioning-panel.tsx domain/discovery-methodology.ts domain/pro-league-discovery-experiment-queue.ts domain/pro-league-maps.ts domain/pro-league-roster-recommendation.ts domain/pro-league-roster.ts tests/discovery-methodology.test.ts tests/pro-league-commissioning-panel.test.tsx tests/pro-league-discovery-experiment-queue.test.ts tests/pro-league-maps.test.ts tests/pro-league-roster-recommendation.test.ts tests/pro-league-roster.test.ts docs/DISCOVERY_METHODOLOGY_V2.md docs/DISCOVERY_NORMAL_FREE_STUDY.md docs/ESPORTS_PRO_LEAGUE_PREPARATION.md docs/PRIVATE_OWNER_SCOPE.md
      - name: Typecheck
        run: npm run typecheck
      - name: Focused tests
        run: npx vitest run tests/discovery-methodology.test.ts tests/pro-league-discovery-experiment-queue.test.ts tests/pro-league-commissioning-panel.test.tsx tests/pro-league-maps.test.ts tests/pro-league-roster.test.ts tests/pro-league-roster-recommendation.test.ts
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/pro-league-commissioning-panel.tsx domain/discovery-methodology.ts domain/pro-league-discovery-experiment-queue.ts domain/pro-league-maps.ts domain/pro-league-roster-recommendation.ts domain/pro-league-roster.ts tests/discovery-methodology.test.ts tests/pro-league-commissioning-panel.test.tsx tests/pro-league-discovery-experiment-queue.test.ts tests/pro-league-maps.test.ts tests/pro-league-roster-recommendation.test.ts tests/pro-league-roster.test.ts docs/DISCOVERY_METHODOLOGY_V2.md docs/DISCOVERY_NORMAL_FREE_STUDY.md docs/ESPORTS_PRO_LEAGUE_PREPARATION.md docs/PRIVATE_OWNER_SCOPE.md
          git commit -m "Format Pro League methodology changes"
          git push
