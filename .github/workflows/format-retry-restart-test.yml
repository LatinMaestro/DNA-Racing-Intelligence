name: Format retry restart test

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/format-retry-restart-test.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply exact Prettier output
        run: |
          npx prettier tests/bounded-import-preview-processor.test.ts --write
          if git diff --quiet -- tests/bounded-import-preview-processor.test.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/bounded-import-preview-processor.test.ts
          git commit -m "Format Preview retry test"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
