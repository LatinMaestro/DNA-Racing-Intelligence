name: temporary breeding population-qualifier enrichment
on:
  push:
    branches:
      - temporary/chat-breeding-finalist-enrichment-2026-09-21-do-not-merge
permissions:
  contents: read
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DNA_OPEN_LAB_API_KEY_2: ${{ secrets.DNA_OPEN_LAB_API_KEY_2 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch bounded read-only full-population qualifier evidence
        run: |
          node <<'NODE'
          const fs = require("fs");
          const key = process.env.DNA_OPEN_LAB_API_KEY_2;
          if (!key) throw new Error("DNA API key unavailable");
          const base = "https://api.dnaracing.run/fbike/pub/v1";
          const hids = [18346,24931,4287,25017,23480,35,17922,23538,22670,15568,23683,14961,4126,1450];
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          async function post(path) {
            for (let attempt=1; attempt<=4; attempt++) {
              const r = await fetch(base + path, {
                method: "POST",
                headers: {
                  authorization: "Bearer " + key,
                  accept: "application/json",
                  "content-type": "application/json",
                },
                body: JSON.stringify({ hids }),
              });
              const text = await r.text();
              if (r.status === 429 && attempt < 4) {
                const retrySeconds = Math.max(10, Number(r.headers.get("retry-after") || 20));
                await sleep(retrySeconds * 1000);
                continue;
              }
              let j; try { j = JSON.parse(text); } catch { throw new Error(path + " non-json"); }
              if (!r.ok || j?.status !== "success") throw new Error(path + " " + r.status + " " + text.slice(0,300));
              return j.result;
            }
            throw new Error(path + " retry exhausted");
          }
          (async () => {
            const observedAt = new Date().toISOString();
            const info = await post("/cores/info_bulk");
            await sleep(2200);
            const power = await post("/cores/power_bulk");
            await sleep(2200);
            const splicing = await post("/cores/splicing_info_bulk");
            const out = { observedAt, requestedHids: hids, info, power, splicing };
            fs.writeFileSync("breeding-global-qualifier-enrichment.json", JSON.stringify(out, null, 2));
            console.log(JSON.stringify({
              observedAt,
              requested: hids.length,
              info: Array.isArray(info) ? info.length : null,
              power: Array.isArray(power) ? power.length : null,
              splicing: Array.isArray(splicing) ? splicing.length : null,
            }));
          })().catch(e => { console.error(e); process.exit(1); });
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: breeding-global-qualifier-enrichment
          path: breeding-global-qualifier-enrichment.json
          retention-days: 1
