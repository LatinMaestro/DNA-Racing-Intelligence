name: temporary breeding finalist enrichment
on:
  push:
    branches:
      - temporary/chat-breeding-finalist-enrichment-2026-09-21-do-not-merge
permissions:
  contents: read
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DNA_OPEN_LAB_API_KEY_3: ${{ secrets.DNA_OPEN_LAB_API_KEY_3 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch bounded read-only finalist evidence
        run: |
          node <<'NODE'
          const fs = require("fs");
          const key = process.env.DNA_OPEN_LAB_API_KEY_3;
          if (!key) throw new Error("DNA API key unavailable");
          const base = "https://api.dnaracing.run/fbike/pub/v1";
          const hids = [24361,24370,1450,19035,10345,140,24931,25017,18346,23396,23683,22670,15568,17851];
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          async function post(path) {
            const r = await fetch(base + path, {
              method: "POST",
              headers: {
                authorization: "Bearer " + key,
                accept: "application/json",
                "content-type": "application/json",
              },
              body: JSON.stringify({ hids }),
            });
            const text = await r.text();
            let j; try { j = JSON.parse(text); } catch { throw new Error(path + " non-json"); }
            if (!r.ok || j?.status !== "success") throw new Error(path + " " + r.status + " " + text.slice(0,300));
            return j.result;
          }
          (async () => {
            const observedAt = new Date().toISOString();
            const info = await post("/cores/info_bulk");
            await sleep(2200);
            const power = await post("/cores/power_bulk");
            await sleep(2200);
            const listing = await post("/cores/listing_price_bulk");
            await sleep(2200);
            const splicing = await post("/cores/splicing_info_bulk");
            const out = { observedAt, requestedHids: hids, info, power, listing, splicing };
            fs.writeFileSync("breeding-finalist-enrichment.json", JSON.stringify(out, null, 2));
            console.log(JSON.stringify({
              observedAt,
              requested: hids.length,
              info: Array.isArray(info) ? info.length : null,
              power: Array.isArray(power) ? power.length : null,
              listing: Array.isArray(listing) ? listing.length : null,
              splicing: Array.isArray(splicing) ? splicing.length : null,
            }));
          })().catch(e => { console.error(e); process.exit(1); });
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: breeding-finalist-enrichment
          path: breeding-finalist-enrichment.json
          retention-days: 1
