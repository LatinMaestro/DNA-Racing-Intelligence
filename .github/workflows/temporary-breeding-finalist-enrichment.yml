name: temporary breeding final pair authority closure
on:
  push:
    branches:
      - temporary/chat-breeding-finalist-enrichment-2026-09-21-do-not-merge
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DNA_OPEN_LAB_API_KEY_1: ${{ secrets.DNA_OPEN_LAB_API_KEY_1 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate bounded read-only preferred-shortlist pair authority
        run: |
          node <<'NODE'
          const fs = require("fs");
          const key = process.env.DNA_OPEN_LAB_API_KEY_1;
          if (!key) throw new Error("DNA API key unavailable");
          const base = "https://api.dnaracing.run/fbike/pub/v1";
          const pairs = [
            {label:"TECTONIC BLAZE x April O'Neil", father:14961, mother:18346},
            {label:"Drift King x Frost Rocket", father:19802, mother:25574},
            {label:"MYSTERIOUS GURU x Frost Rocket", father:17922, mother:25574},
            {label:"Trust me, bro x Frost Rocket", father:23480, mother:25574},
            {label:"TECTONIC BLAZE x Lightning Gale", father:14961, mother:20365},
            {label:"MYSTERIOUS GURU x Lightning Gale", father:17922, mother:20365},
            {label:"Drift King x Lightning Gale", father:19802, mother:20365},
            {label:"MYSTERIOUS GURU x Divine Riot", father:17922, mother:22338},
            {label:"MYSTERIOUS GURU x April O'Neil", father:17922, mother:18346}
          ];
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          async function get(path) {
            for (let attempt=1; attempt<=4; attempt++) {
              const r = await fetch(base + path, {
                method: "GET",
                headers: { authorization: "Bearer " + key, accept: "application/json" }
              });
              const text = await r.text();
              if (r.status === 429 && attempt < 4) {
                const retrySeconds = Math.max(10, Number(r.headers.get("retry-after") || 20));
                await sleep(retrySeconds * 1000);
                continue;
              }
              let body; try { body = JSON.parse(text); } catch { body = { raw: text.slice(0,500) }; }
              return { httpStatus:r.status, ok:r.ok, body };
            }
          }
          (async () => {
            const observedAt = new Date().toISOString();
            const results = [];
            for (const pair of pairs) {
              const q = "father_coreid="+pair.father+"&mother_coreid="+pair.mother;
              const validation = await get("/splice/pair_validate?"+q);
              await sleep(2200);
              const info = await get("/splice/pair_info?"+q);
              results.push({...pair, validation, info});
              await sleep(2200);
            }
            fs.writeFileSync("breeding-final-pair-authority-closure.json", JSON.stringify({observedAt,results}, null, 2));
            console.log(JSON.stringify({observedAt,pairCount:results.length}));
          })().catch(e => { console.error(e); process.exit(1); });
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: breeding-final-pair-authority-closure
          path: breeding-final-pair-authority-closure.json
          retention-days: 1
