name: temporary breeding owned-and-low-fee finalist validation
on:
  push:
    branches:
      - temporary/chat-breeding-finalist-enrichment-2026-09-21-do-not-merge
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DNA_OPEN_LAB_API_KEY_1: ${{ secrets.DNA_OPEN_LAB_API_KEY_1 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate bounded read-only owned and low-fee finalist pairs
        run: |
          node <<'NODE'
          const fs = require("fs");
          const key = process.env.DNA_OPEN_LAB_API_KEY_1;
          if (!key) throw new Error("DNA API key unavailable");
          const base = "https://api.dnaracing.run/fbike/pub/v1";
          const pairs = [
            {label:"Midnight City x Zoey", father:10980, mother:20292},
            {label:"Midnight City x Lightning Gale", father:10980, mother:20365},
            {label:"Drift King x Divine Riot", father:19802, mother:22338},
            {label:"Mr Brightside x Divine Riot", father:16515, mother:22338},
            {label:"Allurity x Cyber Dancer", father:1675, mother:20827},
            {label:"Utopian Risk x Cyber Dancer", father:8902, mother:20827},
            {label:"Hell has Frozen Over x Divine Riot", father:23683, mother:22338},
            {label:"Trust me, bro x Divine Riot", father:23480, mother:22338},
            {label:"TECTONIC BLAZE x Divine Riot", father:14961, mother:22338},
            {label:"Invincible Jumper x Divine Riot", father:4126, mother:22338}
          ];
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          async function get(path) {
            for (let attempt=1; attempt<=4; attempt++) {
              const r = await fetch(base + path, {
                method: "GET",
                headers: { authorization: "Bearer " + key, accept: "application/json" }
              });
              const text = await r.text();
              if (r.status === 429 && attempt < 4) {
                const retrySeconds = Math.max(10, Number(r.headers.get("retry-after") || 20));
                await sleep(retrySeconds * 1000);
                continue;
              }
              let body; try { body = JSON.parse(text); } catch { body = { raw: text.slice(0,500) }; }
              return { httpStatus:r.status, ok:r.ok, body };
            }
          }
          (async () => {
            const observedAt = new Date().toISOString();
            const results = [];
            for (const pair of pairs) {
              const q = "father_coreid="+pair.father+"&mother_coreid="+pair.mother;
              const validation = await get("/splice/pair_validate?"+q);
              await sleep(2200);
              const info = await get("/splice/pair_info?"+q);
              results.push({...pair, validation, info});
              await sleep(2200);
            }
            fs.writeFileSync("breeding-owned-low-fee-pair-validation.json", JSON.stringify({observedAt,results}, null, 2));
            console.log(JSON.stringify({observedAt,pairCount:results.length}));
          })().catch(e => { console.error(e); process.exit(1); });
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: breeding-owned-low-fee-pair-validation
          path: breeding-owned-low-fee-pair-validation.json
          retention-days: 1
