name: temporary breeding final pair authority closure
on:
  push:
    branches:
      - temporary/chat-breeding-finalist-enrichment-2026-09-21-do-not-merge
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      DNA_OPEN_LAB_API_KEY_1: ${{ secrets.DNA_OPEN_LAB_API_KEY_1 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate bounded read-only vault-wide breeding finalists
        run: |
          node <<'NODE'
          const fs = require("fs");
          const key = process.env.DNA_OPEN_LAB_API_KEY_1;
          if (!key) throw new Error("DNA API key unavailable");
          const base = "https://api.dnaracing.run/fbike/pub/v1";
          const pairs = [
            {label:"Utopian Risk x Lightning Gale", father:8902, mother:20365},
            {label:"Krillin x Lightning Gale", father:15833, mother:20365},
            {label:"Cash Bag x Lightning Gale", father:583, mother:20365},
            {label:"Utopian Risk x Flame Dash", father:8902, mother:22164},
            {label:"Krillin x Flame Dash", father:15833, mother:22164},
            {label:"Cash Bag x Flame Dash", father:583, mother:22164},
            {label:"Livid Jaguar x Swift Fist", father:23269, mother:23282},
            {label:"Livid Jaguar x Violet Jaguar", father:23269, mother:23388},
            {label:"Phantom Panther x Violet Jaguar", father:23484, mother:23388},
            {label:"Drift King x Violet Jaguar", father:19802, mother:23388},
            {label:"Drift King x Swift Fist", father:19802, mother:23282},
            {label:"Utopian Risk x Creeper", father:8902, mother:25564},
            {label:"Utopian Risk x Peak Crown", father:8902, mother:9216},
            {label:"Krillin x Peak Crown", father:15833, mother:9216},
            {label:"Krillin x Salsa", father:15833, mother:10457},
            {label:"Livid Jaguar x Starline", father:23269, mother:20524}
          ];
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          async function get(path) {
            for (let attempt=1; attempt<=5; attempt++) {
              const r = await fetch(base + path, {
                method: "GET",
                headers: { authorization: "Bearer " + key, accept: "application/json" }
              });
              const text = await r.text();
              if (r.status === 429 && attempt < 5) {
                const retrySeconds = Math.max(10, Number(r.headers.get("retry-after") || 20));
                await sleep(retrySeconds * 1000);
                continue;
              }
              let body; try { body = JSON.parse(text); } catch { body = { raw: text.slice(0,500) }; }
              return { httpStatus:r.status, ok:r.ok, body };
            }
          }
          (async () => {
            const observedAt = new Date().toISOString();
            const results = [];
            for (const pair of pairs) {
              const q = "father_coreid="+pair.father+"&mother_coreid="+pair.mother;
              const validation = await get("/splice/pair_validate?"+q);
              await sleep(2200);
              const info = await get("/splice/pair_info?"+q);
              results.push({...pair, validation, info});
              await sleep(2200);
            }
            fs.writeFileSync("breeding-final-pair-authority-closure.json", JSON.stringify({observedAt,results}, null, 2));
            console.log(JSON.stringify({observedAt,pairCount:results.length}));
          })().catch(e => { console.error(e); process.exit(1); });
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: breeding-final-pair-authority-closure
          path: breeding-final-pair-authority-closure.json
          retention-days: 1
