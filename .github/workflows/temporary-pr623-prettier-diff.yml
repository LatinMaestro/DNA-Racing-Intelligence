name: temporary PR623 prettier diff

on:
  push:
    branches:
      - temporary/format-pr623-2026-09-21-do-not-merge

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Print exact Prettier diff
        run: |
          npx prettier --write tests/hosted-breeding-universe-inventory.test.ts tests/hosted-breeding-lineage-census.test.ts
          git diff -- tests/hosted-breeding-universe-inventory.test.ts tests/hosted-breeding-lineage-census.test.ts
