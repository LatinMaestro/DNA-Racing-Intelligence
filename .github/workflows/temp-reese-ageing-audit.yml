name: Temporary Reese Dylan refined Bike classification

on:
  push:
    branches:
      - temp/reese-ageing-audit-2026-09-01

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refine complete Reese Dylan Bike classification
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const base='https://api.dnaracing.run';
          const hid=11848;
          const sleep=(ms)=>new Promise(r=>setTimeout(r,ms));
          async function post(path,body){
            const r=await fetch(base+path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
            const text=await r.text();let j=null;try{j=JSON.parse(text)}catch{};if(!r.ok)throw new Error(`${path} HTTP ${r.status}`);await sleep(220);return j?.result??j;
          }
          function arr(v){if(Array.isArray(v))return v;if(v&&typeof v==='object'){for(const k of ['data','items','races'])if(Array.isArray(v[k]))return v[k];}return []}
          function when(r){for(const k of ['start_time','startTime','date','created_at','createdAt']){const v=r?.[k];if(typeof v==='string'){const t=Date.parse(v);if(Number.isFinite(t))return t}if(typeof v==='number')return v>1e12?v:v*1000}return null}
          function num(v){const n=Number(v);return Number.isFinite(n)?n:0}
          function feeOf(r){return Math.max(num(r?.fee),num(r?.fee_fixed),0)}
          function tagged(v){if(v==null)return false;if(Array.isArray(v))return v.length>0;if(typeof v==='object')return Object.keys(v).length>0;if(typeof v==='string')return !['','[]','{}'].includes(v.trim());return !!v}
          const eventFormats=new Set(['sub_rounds','sub_roundsp','sub_war','sub_bounty','sub_quest']);
          const eventName=/\b(round(?:s)?(?:-| )?\d*|semi[- ]?finals?|finals?|grand final|grand-final|GF|weekly|tourney|tournament|qual(?:ifier)?|bounty|challenge|war|season|T3|TOH|DU|top\s*3|top\s*2|trainer|trail|may the morph|pod|variance|spin|blackjack|survey|triple death|last out|loot box|claimer|chainplay)\b/i;
          const all=[];let page=1;
          while(page<=50){const rows=arr(await post('/fbike/i/hraces',{hid,page}));if(!rows.length)break;all.push(...rows);if(rows.length<50)break;page++}
          const ded=new Map();for(const r of all){const key=String(r?.rhid??r?.rid??`${when(r)}:${r?.rvmode}:${r?.cb}:${r?.pos}:${r?.race_name}`);if(!ded.has(key))ded.set(key,r)}
          const bike=[...ded.values()].filter(r=>String(r?.rvmode??'').toLowerCase()==='bike').sort((a,b)=>(when(a)||0)-(when(b)||0));
          const stats=await post('/fbike/cores/racing_stats_bulk',{hids:[hid]});const st=Array.isArray(stats)?stats[0]:stats;
          function classify(r){
            const fee=feeOf(r),name=String(r?.race_name??''),fmt=String(r?.format??'').toLowerCase();
            if(fee>0)return 'paid_entry_fee';
            if(/\bFree\b/i.test(name))return 'normal_free';
            if(tagged(r?.eventtags)||eventFormats.has(fmt)||eventName.test(name))return 'zero_fee_event_round';
            return 'other_zero_fee_nonfree';
          }
          const rows=bike.map(r=>({r,cat:classify(r),fee:feeOf(r),date:when(r)?new Date(when(r)).toISOString():null,name:String(r?.race_name??''),fmt:String(r?.format??''),tagged:tagged(r?.eventtags)}));
          const cats=['paid_entry_fee','zero_fee_event_round','normal_free','other_zero_fee_nonfree'];
          const summary={};
          for(const cat of cats){const q=rows.filter(x=>x.cat===cat);summary[cat]={count:q.length,first:q[0]?.date??null,last:q.at(-1)?.date??null};}
          function group(q,key){const m=new Map();for(const x of q){const k=key(x);m.set(k,(m.get(k)||0)+1)}return [...m].sort((a,b)=>b[1]-a[1]||String(a[0]).localeCompare(String(b[0])))}
          const other=rows.filter(x=>x.cat==='other_zero_fee_nonfree');
          const event=rows.filter(x=>x.cat==='zero_fee_event_round');
          const paid=rows.filter(x=>x.cat==='paid_entry_fee');
          const free=rows.filter(x=>x.cat==='normal_free');
          const may2026=rows.filter(x=>x.date?.startsWith('2026-05'));
          console.log('REFINED_SUMMARY',JSON.stringify({historyBikeRows:bike.length,apiCareer:st?.hstats_bike?.career?.races_n,apiPaidCareer:st?.hstats_bike?.career?.paid_races_n,ageing:st?.ageing,summary}));
          console.log('OTHER_NAMES',JSON.stringify(group(other,x=>x.name)));
          console.log('OTHER_FORMATS',JSON.stringify(group(other,x=>x.fmt)));
          console.log('EVENT_TOP_NAMES',JSON.stringify(group(event,x=>x.name).slice(0,80)));
          console.log('PAID_TOP_NAMES',JSON.stringify(group(paid,x=>x.name).slice(0,50)));
          console.log('NORMAL_FREE_NAMES',JSON.stringify(group(free,x=>x.name)));
          console.log('MAY_2026',JSON.stringify(may2026.map(x=>({date:x.date,cat:x.cat,name:x.name,fee:x.fee,format:x.fmt,tagged:x.tagged,distance:x.r?.cb,pos:x.r?.pos}))));
          console.log('BY_YEAR_CAT',JSON.stringify(Object.fromEntries(['2024','2025','2026'].map(y=>[y,Object.fromEntries(cats.map(c=>[c,rows.filter(x=>x.cat===c&&x.date?.startsWith(y)).length]))]))));
          NODE
