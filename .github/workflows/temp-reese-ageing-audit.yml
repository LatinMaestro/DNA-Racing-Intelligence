name: Temporary Reese Dylan ageing audit

on:
  push:
    branches:
      - temp/reese-ageing-audit-2026-09-01

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pull Reese Dylan Bike career and ageing
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const r=await fetch('https://api.dnaracing.run/fbike/cores/racing_stats_bulk',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({hids:[11848]})});
          const j=await r.json(); const v=j?.result??j; const row=Array.isArray(v)?v[0]:v;
          console.log('AGEING',JSON.stringify(row?.ageing??null));
          console.log('HSTATS_BIKE',JSON.stringify(row?.hstats_bike??null));
          NODE
