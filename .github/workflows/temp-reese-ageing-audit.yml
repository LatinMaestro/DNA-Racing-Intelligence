name: Temporary Reese Dylan ageing audit

on:
  push:
    branches:
      - temp/reese-ageing-audit-2026-09-01

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pull Reese Dylan current ageing authority
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const base='https://api.dnaracing.run';
          const hid=11848;
          async function post(path,body){
            const r=await fetch(base+path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
            const text=await r.text(); let json=null; try{json=JSON.parse(text)}catch{}
            console.log('HTTP',path,r.status);
            return json;
          }
          function unwrap(v){return v&&typeof v==='object'&&!Array.isArray(v)&&'result' in v?v.result:v;}
          const stats=unwrap(await post('/fbike/cores/racing_stats_bulk',{hids:[hid]}));
          const row=Array.isArray(stats)?stats[0]:stats;
          console.log('REESE_STATS_KEYS',JSON.stringify(row?Object.keys(row):[]));
          console.log('REESE_AGEING_CURRENT',JSON.stringify(row?.ageing??null));
          console.log('REESE_MAIDEN',JSON.stringify(row?.is_maiden??null));
          const mini=unwrap(await post('/fbike/cores/mini_bulk',{hids:[hid]}));
          const m=Array.isArray(mini)?mini[0]:mini;
          console.log('REESE_MINI',JSON.stringify(m));
          NODE
