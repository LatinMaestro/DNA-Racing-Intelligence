name: Temporary Reese Dylan complete Bike classification

on:
  push:
    branches:
      - temp/reese-ageing-audit-2026-09-01

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pull and classify every Reese Dylan Bike race
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const base='https://api.dnaracing.run';
          const hid=11848;
          const sleep=(ms)=>new Promise(r=>setTimeout(r,ms));
          let requests=0;
          async function post(path,body){
            const r=await fetch(base+path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
            requests++;
            const text=await r.text(); let json=null; try{json=JSON.parse(text)}catch{}
            if(!r.ok) throw new Error(`${path} HTTP ${r.status}: ${text.slice(0,200)}`);
            await sleep(250);
            return json?.result??json;
          }
          function arr(v){if(Array.isArray(v))return v;if(v&&typeof v==='object'){for(const k of ['data','items','races'])if(Array.isArray(v[k]))return v[k];}return [];}
          function when(row){for(const k of ['start_time','startTime','date','created_at','createdAt']){const v=row?.[k];if(typeof v==='string'){const t=Date.parse(v);if(Number.isFinite(t))return t;}if(typeof v==='number'&&Number.isFinite(v))return v>1e12?v:v*1000;}return null;}
          function num(v){const n=Number(v);return Number.isFinite(n)?n:0;}
          function hasEventTags(v){
            if(v==null) return false;
            if(Array.isArray(v)) return v.length>0;
            if(typeof v==='object') return Object.keys(v).length>0;
            if(typeof v==='string') return v.trim()!=='' && v.trim()!=='[]' && v.trim()!=='{}';
            return Boolean(v);
          }
          function feeOf(r){
            const f=num(r?.fee);
            const ff=num(r?.fee_fixed);
            return Math.max(f,ff,0);
          }
          const all=[];
          let page=1;
          while(page<=50){
            const rows=arr(await post('/fbike/i/hraces',{hid,page}));
            console.log(`PAGE ${page} ROWS ${rows.length}`);
            if(!rows.length) break;
            all.push(...rows);
            if(rows.length<50) break;
            page++;
          }
          const ded=new Map();
          for(const r of all){
            const key=String(r?.rhid??r?.rid??r?.race_id??`${when(r)}:${r?.rvmode}:${r?.cb}:${r?.pos}:${r?.race_name}`);
            if(!ded.has(key)) ded.set(key,r);
          }
          const bike=[...ded.values()].filter(r=>String(r?.rvmode??'').toLowerCase()==='bike').sort((a,b)=>(when(a)||0)-(when(b)||0));
          const stats=await post('/fbike/cores/racing_stats_bulk',{hids:[hid]});
          const stat=Array.isArray(stats)?stats[0]:stats;
          const apiCareer=Number(stat?.hstats_bike?.career?.races_n??0);
          const paidCareer=Number(stat?.hstats_bike?.career?.paid_races_n??0);
          const ageing=stat?.ageing??null;

          const detail=[];
          for(const r of bike){
            const name=String(r?.race_name??'').trim();
            const fee=feeOf(r);
            const normalFree=/\bFree\b/i.test(name);
            const eventTagged=hasEventTags(r?.eventtags);
            let category;
            if(fee>0) category='paid_entry_fee';
            else if(normalFree) category='normal_free';
            else if(eventTagged) category='zero_fee_event_round';
            else category='other_zero_fee_nonfree';
            detail.push({
              category,
              date:when(r)?new Date(when(r)).toISOString():null,
              rhid:r?.rhid??null,
              rid:r?.rid??null,
              name,
              fee,
              fee_raw:r?.fee??null,
              fee_fixed_raw:r?.fee_fixed??null,
              paytoken:r?.paytoken??null,
              eventtags:r?.eventtags??null,
              eventTagged,
              format:r?.format??null,
              distance:r?.cb??null,
              gate:r?.rgate??r?.gate??null,
              pos:r?.pos??null,
              prize_usd:r?.prize_usd??null,
              star:r?.star??null,
              status:r?.status??null,
            });
          }

          function groupBy(rows,keyFn){
            const m=new Map();
            for(const x of rows){const k=keyFn(x);if(!m.has(k))m.set(k,[]);m.get(k).push(x);}
            return [...m.entries()].map(([key,items])=>({key,count:items.length,items}));
          }
          const categories={};
          for(const cat of ['paid_entry_fee','zero_fee_event_round','normal_free','other_zero_fee_nonfree']){
            const rows=detail.filter(x=>x.category===cat);
            const byName=groupBy(rows,x=>x.name||'(blank)').map(g=>({name:g.key,count:g.count,fees:[...new Set(g.items.map(x=>x.fee))],eventTagged:g.items.filter(x=>x.eventTagged).length,first:g.items[0]?.date??null,last:g.items.at(-1)?.date??null})).sort((a,b)=>b.count-a.count||a.name.localeCompare(b.name));
            const byMonth=groupBy(rows,x=>x.date?.slice(0,7)??'unknown').map(g=>({month:g.key,count:g.count})).sort((a,b)=>a.month.localeCompare(b.month));
            const byDistance=groupBy(rows,x=>String(x.distance)).map(g=>({distance:g.key,count:g.count})).sort((a,b)=>Number(a.distance)-Number(b.distance));
            categories[cat]={count:rows.length,byName,byMonth,byDistance};
          }
          const zeroNonFree=detail.filter(x=>x.fee===0&&!/\bFree\b/i.test(x.name));
          const zeroNameAudit=groupBy(zeroNonFree,x=>x.name||'(blank)').map(g=>({name:g.key,count:g.count,eventTagged:g.items.filter(x=>x.eventTagged).length,formats:[...new Set(g.items.map(x=>String(x.format??'')))],first:g.items[0]?.date,last:g.items.at(-1)?.date})).sort((a,b)=>b.count-a.count||a.name.localeCompare(b.name));
          const feeAudit=groupBy(detail,x=>String(x.fee)).map(g=>({fee:g.key,count:g.count})).sort((a,b)=>Number(a.fee)-Number(b.fee));
          const summary={
            pulledAt:new Date().toISOString(),hid,name:'Reese Dylan',requests,pagesFetched:page,
            apiCareer,historyBikeRows:bike.length,complete:apiCareer===bike.length,
            apiPaidCareer:paidCareer,ageing,
            firstBike:detail[0]?.date??null,lastBike:detail.at(-1)?.date??null,
            categoryCounts:Object.fromEntries(Object.entries(categories).map(([k,v])=>[k,v.count])),
            categoryTotal:Object.values(categories).reduce((s,v)=>s+v.count,0),
            feeAudit,zeroNameAudit,categories,
          };
          fs.writeFileSync('reese-bike-classification.json',JSON.stringify({summary,detail}));
          console.log('SUMMARY',JSON.stringify({pulledAt:summary.pulledAt,apiCareer,historyBikeRows:bike.length,complete:summary.complete,apiPaidCareer:paidCareer,ageing,categoryCounts:summary.categoryCounts,firstBike:summary.firstBike,lastBike:summary.lastBike,requests}));
          console.log('FEE_AUDIT',JSON.stringify(feeAudit));
          console.log('ZERO_NONFREE_NAMES',JSON.stringify(zeroNameAudit));
          console.log('PAID_NAMES',JSON.stringify(categories.paid_entry_fee.byName));
          console.log('EVENT_NAMES',JSON.stringify(categories.zero_fee_event_round.byName));
          console.log('FREE_NAMES',JSON.stringify(categories.normal_free.byName));
          console.log('OTHER_NAMES',JSON.stringify(categories.other_zero_fee_nonfree.byName));
          console.log('CATEGORY_MONTHS',JSON.stringify(Object.fromEntries(Object.entries(categories).map(([k,v])=>[k,v.byMonth]))));
          console.log('CATEGORY_DISTANCES',JSON.stringify(Object.fromEntries(Object.entries(categories).map(([k,v])=>[k,v.byDistance]))));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: reese-bike-classification
          path: reese-bike-classification.json
          retention-days: 1
