name: Format diagnostic

on:
  push:
    branches:
      - codex/bounded-evidence-ndjson-partitions

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Show canonical formatting diff
        shell: bash
        run: |
          npx prettier --write lib/dataset-evidence-ndjson-partition-writer.ts tests/dataset-evidence-ndjson-partition-writer.test.ts
          git diff -- lib/dataset-evidence-ndjson-partition-writer.ts tests/dataset-evidence-ndjson-partition-writer.test.ts
          git diff --quiet -- lib/dataset-evidence-ndjson-partition-writer.ts tests/dataset-evidence-ndjson-partition-writer.test.ts
