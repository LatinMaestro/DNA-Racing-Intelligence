name: Temporary format diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write lib/neon-race-archive-aggregate-publication.ts tests/neon-race-archive-aggregate-publication.test.ts
      - run: git diff --no-ext-diff --no-color -- lib/neon-race-archive-aggregate-publication.ts tests/neon-race-archive-aggregate-publication.test.ts
