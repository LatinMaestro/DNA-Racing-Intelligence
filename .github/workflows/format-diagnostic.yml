name: Format diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Show exact Prettier patch
        run: |
          npx prettier --write tests/dataset-evidence-ndjson-partition-writer.test.ts
          git diff -- tests/dataset-evidence-ndjson-partition-writer.test.ts
          exit 1
