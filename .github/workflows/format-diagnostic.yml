name: Format diagnostic

on:
  pull_request:
    paths:
      - "lib/race-archive-aggregate-refresher.ts"
      - "tests/race-archive-aggregate-refresher.test.ts"
      - ".github/workflows/format-diagnostic.yml"

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format target files
        run: npx prettier --write lib/race-archive-aggregate-refresher.ts tests/race-archive-aggregate-refresher.test.ts
      - name: Emit formatted files
        run: |
          echo "SERVICE_B64=$(base64 -w0 lib/race-archive-aggregate-refresher.ts)"
          echo "TEST_B64=$(base64 -w0 tests/race-archive-aggregate-refresher.test.ts)"
