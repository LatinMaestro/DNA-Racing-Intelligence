name: Format diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Show exact Prettier patch
        run: |
          npx prettier --write lib/private-dataset-evidence-object-writer.ts lib/cloudflare-r2-dataset-evidence-port.ts tests/private-dataset-evidence-object-writer.test.ts tests/cloudflare-r2-dataset-evidence-port.test.ts
          git diff -- lib/private-dataset-evidence-object-writer.ts lib/cloudflare-r2-dataset-evidence-port.ts tests/private-dataset-evidence-object-writer.test.ts tests/cloudflare-r2-dataset-evidence-port.test.ts
          exit 1
