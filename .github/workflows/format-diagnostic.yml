name: Format diagnostic

on:
  pull_request:
    paths:
      - "lib/race-archive-aggregate-refresher.ts"
      - "tests/race-archive-aggregate-refresher.test.ts"
      - ".github/workflows/format-diagnostic.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/race-archive-aggregate-reconstruction
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format target files
        run: npx prettier --write lib/race-archive-aggregate-refresher.ts tests/race-archive-aggregate-refresher.test.ts
      - name: Commit formatting only when changed
        run: |
          if git diff --quiet -- lib/race-archive-aggregate-refresher.ts tests/race-archive-aggregate-refresher.test.ts; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/race-archive-aggregate-refresher.ts tests/race-archive-aggregate-refresher.test.ts
          git commit -m "Format Race archive reconstruction"
          git push origin HEAD:agent/race-archive-aggregate-reconstruction
