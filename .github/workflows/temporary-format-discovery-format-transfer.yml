name: TEMPORARY format Discovery format transfer
on:
  push:
    branches: [feature/discovery-format-gate-transfer-v3]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/discovery-format-gate-transfer-v3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write docs/DISCOVERY_FORMAT_GATE_TRANSFER.md docs/PHASE_3_DISCOVERY_WORKSPACE.md domain/discovery-format-gate-transfer.ts tests/discovery-format-gate-transfer.test.ts
      - name: Commit formatting if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/DISCOVERY_FORMAT_GATE_TRANSFER.md docs/PHASE_3_DISCOVERY_WORKSPACE.md domain/discovery-format-gate-transfer.ts tests/discovery-format-gate-transfer.test.ts; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/DISCOVERY_FORMAT_GATE_TRANSFER.md docs/PHASE_3_DISCOVERY_WORKSPACE.md domain/discovery-format-gate-transfer.ts tests/discovery-format-gate-transfer.test.ts
          git commit -m "Format Discovery format-transfer methodology"
          git push origin HEAD:feature/discovery-format-gate-transfer-v3
