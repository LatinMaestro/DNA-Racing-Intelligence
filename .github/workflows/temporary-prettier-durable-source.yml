name: Temporary Prettier durable source
on:
  pull_request:
permissions:
  contents: read
jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Show canonical Prettier diff
        shell: bash
        run: |
          npx prettier --write lib/dna-population-core-outcome-durable-sources.ts
          git diff -- lib/dna-population-core-outcome-durable-sources.ts
          exit 1
