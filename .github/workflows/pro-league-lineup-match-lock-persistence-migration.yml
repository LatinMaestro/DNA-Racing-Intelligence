name: Pro League lineup and match-lock persistence migration

on:
  pull_request:
    paths:
      - "database/migrations/**"
      - ".github/workflows/pro-league-lineup-match-lock-persistence-migration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dna_racing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dna_racing_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: dna_racing_test
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply complete migration chain
        run: |
          for migration in database/migrations/*.up.sql; do
            psql --set ON_ERROR_STOP=1 --file "$migration"
          done
      - name: Run Pro League lineup and match-lock smoke test
        run: >-
          psql --set ON_ERROR_STOP=1 --file
          database/migrations/0082_pro_league_lineup_match_lock_persistence.smoke.sql
      - name: Reverse Pro League lineup and match-lock migration
        run: >-
          psql --set ON_ERROR_STOP=1 --file
          database/migrations/0082_pro_league_lineup_match_lock_persistence.down.sql
      - name: Verify Pro League lineup and match-lock removal
        run: >-
          psql --set ON_ERROR_STOP=1 --file
          database/migrations/0082_pro_league_lineup_match_lock_persistence.removal.sql
