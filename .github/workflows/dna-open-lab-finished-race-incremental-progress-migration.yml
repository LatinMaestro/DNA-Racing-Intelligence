name: DNA Open Lab finished-race incremental progress migration

on:
  pull_request:
    paths:
      - "database/migrations/**"
      - ".github/workflows/dna-open-lab-finished-race-incremental-progress-migration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dna_racing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dna_racing_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: dna_racing_test
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply complete migration chain
        run: |
          for migration in database/migrations/*.up.sql; do
            psql --set ON_ERROR_STOP=1 --file "$migration"
          done
      - name: Run finished-race incremental progress smoke test
        run: >-
          psql --set ON_ERROR_STOP=1 --file
          database/migrations/0090_dna_open_lab_finished_race_incremental_progress.smoke.sql
      - name: Reverse dependent daily refresh generation migration
        run: >-
          psql --set ON_ERROR_STOP=1 --file
          database/migrations/0094_dna_open_lab_daily_refresh_generation.down.sql
      - name: Verify dependent daily refresh generation removal
        run: >-
          psql --set ON_ERROR_STOP=1 --file
          database/migrations/0094_dna_open_lab_daily_refresh_generation.removal.sql
      - name: Reverse dependent finished-race incremental publication migration
        run: >-
          psql --set ON_ERROR_STOP=1 --file
          database/migrations/0091_dna_open_lab_finished_race_incremental_publication.down.sql
      - name: Verify dependent finished-race incremental publication removal
        run: >-
          psql --set ON_ERROR_STOP=1 --file
          database/migrations/0091_dna_open_lab_finished_race_incremental_publication.removal.sql
      - name: Reverse finished-race incremental progress migration
        run: >-
          psql --set ON_ERROR_STOP=1 --file
          database/migrations/0090_dna_open_lab_finished_race_incremental_progress.down.sql
      - name: Verify finished-race incremental progress removal
        run: >-
          psql --set ON_ERROR_STOP=1 --file
          database/migrations/0090_dna_open_lab_finished_race_incremental_progress.removal.sql
