name: DNA population race index R2 compaction migration

on:
  pull_request:
    branches:
      - main
    paths:
      - database/migrations/0114_dna_population_race_index_r2_compaction.up.sql
      - database/migrations/0114_dna_population_race_index_r2_compaction.smoke.sql
      - database/migrations/0114_dna_population_race_index_r2_compaction.down.sql
      - database/migrations/0114_dna_population_race_index_r2_compaction.removal.sql
      - database/migrations/0115_dna_population_race_index_storage_negative_cutover.up.sql
      - database/migrations/0115_dna_population_race_index_storage_negative_cutover.smoke.sql
      - database/migrations/0115_dna_population_race_index_storage_negative_cutover.down.sql
      - database/migrations/0115_dna_population_race_index_storage_negative_cutover.removal.sql
      - database/migrations/0116_dna_population_race_index_published_manifest_read.up.sql
      - database/migrations/0116_dna_population_race_index_published_manifest_read.smoke.sql
      - database/migrations/0116_dna_population_race_index_published_manifest_read.down.sql
      - database/migrations/0116_dna_population_race_index_published_manifest_read.removal.sql
      - .github/workflows/dna-population-race-index-r2-compaction-ci.yml
      - .github/workflows/ci.yml
  push:
    branches:
      - main
    paths:
      - database/migrations/0114_dna_population_race_index_r2_compaction.up.sql
      - database/migrations/0114_dna_population_race_index_r2_compaction.smoke.sql
      - database/migrations/0114_dna_population_race_index_r2_compaction.down.sql
      - database/migrations/0114_dna_population_race_index_r2_compaction.removal.sql
      - database/migrations/0115_dna_population_race_index_storage_negative_cutover.up.sql
      - database/migrations/0115_dna_population_race_index_storage_negative_cutover.smoke.sql
      - database/migrations/0115_dna_population_race_index_storage_negative_cutover.down.sql
      - database/migrations/0115_dna_population_race_index_storage_negative_cutover.removal.sql
      - database/migrations/0116_dna_population_race_index_published_manifest_read.up.sql
      - database/migrations/0116_dna_population_race_index_published_manifest_read.smoke.sql
      - database/migrations/0116_dna_population_race_index_published_manifest_read.down.sql
      - database/migrations/0116_dna_population_race_index_published_manifest_read.removal.sql
      - .github/workflows/dna-population-race-index-r2-compaction-ci.yml
      - .github/workflows/ci.yml

permissions:
  contents: read

jobs:
  migration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dna_population_r2_compaction_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dna_population_r2_compaction_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: dna_population_r2_compaction_ci
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply authoritative CI migration baseline through 0114
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t migrations < <(
            grep -oE 'database/migrations/[0-9]{4}_[^ ]+\.up\.sql' .github/workflows/ci.yml |
              awk '!seen[$0]++'
          )
          if [[ "${#migrations[@]}" -lt 3 ]] || [[ "${migrations[-1]}" != "database/migrations/0116_dna_population_race_index_published_manifest_read.up.sql" ]]; then
            echo "Authoritative CI migration list does not end at 0116."
            exit 1
          fi
          unset 'migrations[-1]'
          if [[ "${migrations[-1]}" != "database/migrations/0115_dna_population_race_index_storage_negative_cutover.up.sql" ]]; then
            echo "Authoritative CI migration predecessor is not 0115."
            exit 1
          fi
          unset 'migrations[-1]'
          if [[ "${migrations[-1]}" != "database/migrations/0114_dna_population_race_index_r2_compaction.up.sql" ]]; then
            echo "Authoritative CI migration baseline does not end at 0114."
            exit 1
          fi
          for migration in "${migrations[@]}"; do
            psql --set ON_ERROR_STOP=1 --file "$migration" >/dev/null
          done
      - name: Apply population race index storage-negative cutover migration
        run: psql --set ON_ERROR_STOP=1 --file database/migrations/0115_dna_population_race_index_storage_negative_cutover.up.sql
      - name: Run population race index storage-negative cutover smoke test
        run: psql --set ON_ERROR_STOP=1 --file database/migrations/0115_dna_population_race_index_storage_negative_cutover.smoke.sql
      - name: Apply published population manifest read migration
        run: psql --set ON_ERROR_STOP=1 --file database/migrations/0116_dna_population_race_index_published_manifest_read.up.sql
      - name: Run published population manifest read smoke test
        run: psql --set ON_ERROR_STOP=1 --file database/migrations/0116_dna_population_race_index_published_manifest_read.smoke.sql
      - name: Reverse published population manifest read migration
        run: psql --set ON_ERROR_STOP=1 --file database/migrations/0116_dna_population_race_index_published_manifest_read.down.sql
      - name: Verify published population manifest read reversal
        run: psql --set ON_ERROR_STOP=1 --file database/migrations/0116_dna_population_race_index_published_manifest_read.removal.sql
      - name: Reverse population race index storage-negative cutover migration
        run: psql --set ON_ERROR_STOP=1 --file database/migrations/0115_dna_population_race_index_storage_negative_cutover.down.sql
      - name: Verify population race index storage-negative cutover reversal
        run: psql --set ON_ERROR_STOP=1 --file database/migrations/0115_dna_population_race_index_storage_negative_cutover.removal.sql
