name: TEMP Prettier diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  prettier-diagnostic:
    if: github.head_ref == 'codex/align-import-r2-analytics-query'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Print exact pinned Prettier delta
        shell: bash
        run: |
          npx prettier --write tests/cloudflare-neon-import-capacity-port.test.ts
          git diff -- tests/cloudflare-neon-import-capacity-port.test.ts
