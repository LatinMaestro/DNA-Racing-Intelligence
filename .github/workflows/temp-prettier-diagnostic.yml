name: Temp Prettier Diagnostic

on:
  pull_request:
    branches:
      - main
    paths:
      - "lib/hosted-pro-league-aggregate-worker-runtime.ts"
      - ".github/workflows/temp-prettier-diagnostic.yml"

permissions:
  contents: read

jobs:
  prettier-diff:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Show canonical Prettier diff
        shell: bash
        run: |
          npx prettier --write lib/hosted-pro-league-aggregate-worker-runtime.ts
          git diff -- lib/hosted-pro-league-aggregate-worker-runtime.ts
          test -z "$(git status --short -- lib/hosted-pro-league-aggregate-worker-runtime.ts)"
