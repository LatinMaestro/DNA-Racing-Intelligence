name: TEMP Prettier diagnostic

on:
  pull_request:
    paths:
      - "lib/dna-population-entrant-authority-capacity-gate.ts"
      - "lib/dna-population-entrant-authority-zero-cost-policy.ts"
      - "lib/dna-population-entrant-hydration-read-only-measurement.ts"
      - "tests/dna-open-lab-independent-race-doc-lanes.test.ts"
      - "tests/dna-population-entrant-authority-cohort.test.ts"
      - ".github/workflows/temp-prettier-diagnostic.yml"

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Print canonical Prettier diff
        shell: bash
        run: |
          npx prettier --write \
            lib/dna-population-entrant-authority-capacity-gate.ts \
            lib/dna-population-entrant-authority-zero-cost-policy.ts \
            lib/dna-population-entrant-hydration-read-only-measurement.ts \
            tests/dna-open-lab-independent-race-doc-lanes.test.ts \
            tests/dna-population-entrant-authority-cohort.test.ts
          git diff -- \
            lib/dna-population-entrant-authority-capacity-gate.ts \
            lib/dna-population-entrant-authority-zero-cost-policy.ts \
            lib/dna-population-entrant-hydration-read-only-measurement.ts \
            tests/dna-open-lab-independent-race-doc-lanes.test.ts \
            tests/dna-population-entrant-authority-cohort.test.ts
          test -z "$(git status --short)"
