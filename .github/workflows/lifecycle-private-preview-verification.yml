name: Lifecycle private Preview verification

on:
  workflow_dispatch:
    inputs:
      verified_at:
        description: Canonical past UTC verification timestamp
        required: true
        type: string
      execute_private_preview_verification:
        description: Confirm bounded read-only Lifecycle verification
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: lifecycle-private-preview-verification
  cancel-in-progress: false

jobs:
  exact-main-private-preview-verification:
    name: Exact-main private Preview Lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: preview
    env:
      AUTHORIZED_CLERK_USER_ID: ${{ secrets.AUTHORIZED_CLERK_USER_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DNA_DATABASE_OWNER_ID: ${{ secrets.DNA_DATABASE_OWNER_ID }}
      LIFECYCLE_COMMISSIONING_VERIFIED_AT: ${{ inputs.verified_at }}
      LIFECYCLE_COMMISSIONING_VERIFICATION: "1"
    steps:
      - name: Require exact main and explicit read-only arm
        shell: bash
        run: |
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "${{ inputs.execute_private_preview_verification }}" == "true" ]]
      - name: Checkout exact head
        uses: actions/checkout@v4
      - name: Prove verification head is current main
        shell: bash
        run: |
          git fetch --no-tags origin main
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$(git rev-parse origin/main)" == "$GITHUB_SHA" ]]
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run bounded read-only Lifecycle verification
        run: >-
          npx vitest run --no-file-parallelism
          tests/hosted-preview-connected-lifecycle-commissioning.test.tsx
      - name: Prove exact main remained unchanged
        if: always()
        shell: bash
        run: |
          git fetch --no-tags origin main
          [[ "$(git rev-parse origin/main)" == "$GITHUB_SHA" ]]
