name: Pro League format diagnostic

on:
  pull_request:
    paths:
      - "components/pro-league-workspace.tsx"
      - "domain/pro-league-preparation.ts"
      - "domain/pro-league-roster.ts"
      - "lib/pro-league-preparation-service.ts"
      - "tests/pro-league-preparation.test.ts"
      - ".github/workflows/pro-league-format-diagnostic.yml"

permissions:
  contents: read

jobs:
  format-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Print exact Prettier diff
        shell: bash
        run: |
          npx prettier --write components/pro-league-workspace.tsx domain/pro-league-preparation.ts domain/pro-league-roster.ts lib/pro-league-preparation-service.ts tests/pro-league-preparation.test.ts
          git diff -- components/pro-league-workspace.tsx domain/pro-league-preparation.ts domain/pro-league-roster.ts lib/pro-league-preparation-service.ts tests/pro-league-preparation.test.ts
