name: Prettier diagnostic

on:
  pull_request:
    paths:
      - "components/discovery-workspace.tsx"
      - "domain/discovery-probe-plan.ts"
      - ".github/workflows/prettier-diagnostic.yml"

permissions:
  contents: read

jobs:
  prettier-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Print exact Prettier diff
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --write components/discovery-workspace.tsx domain/discovery-probe-plan.ts
          git diff -- components/discovery-workspace.tsx domain/discovery-probe-plan.ts
