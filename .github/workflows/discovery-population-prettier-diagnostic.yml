name: Discovery population Prettier diagnostic

on:
  pull_request:
    paths:
      - "lib/discovery-workspace-service.ts"
      - ".github/workflows/discovery-population-prettier-diagnostic.yml"

permissions:
  contents: read

jobs:
  prettier-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Print exact Prettier diff
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --write lib/discovery-workspace-service.ts
          git diff -- lib/discovery-workspace-service.ts
