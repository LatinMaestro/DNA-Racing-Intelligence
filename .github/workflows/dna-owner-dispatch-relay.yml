name: DNA owner dispatch relay

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read

concurrency:
  group: dna-owner-dispatch-relay
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch allow-listed DNA entrant workflow
    if: >-
      ${{ github.event.issue.number == 120 &&
          github.actor == github.repository_owner &&
          github.event.comment.author_association == 'OWNER' &&
          startsWith(github.event.comment.body, '/dna-dispatch ') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate owner command and dispatch allow-listed workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DNA_OWNER_DISPATCH_COMMAND: ${{ github.event.comment.body }}
          DNA_OWNER_DISPATCH_REPOSITORY: ${{ github.repository }}
        run: |
          node --input-type=module <<'NODE'
          const prefix = "/dna-dispatch ";
          const command = process.env.DNA_OWNER_DISPATCH_COMMAND ?? "";
          const repository = process.env.DNA_OWNER_DISPATCH_REPOSITORY ?? "";
          const token = process.env.GH_TOKEN ?? "";

          if (
            !command.startsWith(prefix) ||
            command.length > 4096 ||
            !/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(repository) ||
            token.length < 1
          ) {
            throw new Error("Owner dispatch command is invalid.");
          }

          let payload;
          try {
            payload = JSON.parse(command.slice(prefix.length));
          } catch {
            throw new Error("Owner dispatch payload is invalid.");
          }
          if (payload === null || typeof payload !== "object" || Array.isArray(payload)) {
            throw new Error("Owner dispatch payload is invalid.");
          }

          const exactKeys = (allowed) => {
            const actual = Object.keys(payload).sort();
            const expected = [...allowed].sort();
            if (
              actual.length !== expected.length ||
              actual.some((key, index) => key !== expected[index])
            ) {
              throw new Error("Owner dispatch payload keys are invalid.");
            }
          };
          const sha40 = (value) =>
            typeof value === "string" && /^[a-f0-9]{40}$/.test(value);
          const sha64 = (value) =>
            typeof value === "string" && /^[a-f0-9]{64}$/.test(value);
          const positiveCount = (value) =>
            typeof value === "string" &&
            /^[1-9]\d*$/.test(value) &&
            Number.isSafeInteger(Number(value));
          const exactTimestamp = (value) => {
            if (typeof value !== "string") return false;
            const parsed = new Date(value);
            return (
              !Number.isNaN(parsed.getTime()) &&
              parsed.toISOString() === value &&
              parsed.getTime() <= Date.now()
            );
          };

          if (!sha40(payload.expected_main_sha)) {
            throw new Error("Owner dispatch main authority is invalid.");
          }

          const headers = {
            Accept: "application/vnd.github+json",
            Authorization: `Bearer ${token}`,
            "Content-Type": "application/json",
            "X-GitHub-Api-Version": "2022-11-28",
          };
          const mainResponse = await fetch(
            `https://api.github.com/repos/${repository}/commits/main`,
            { headers, cache: "no-store" },
          );
          if (!mainResponse.ok) {
            throw new Error("Current main authority is unavailable.");
          }
          const main = await mainResponse.json();
          if (main?.sha !== payload.expected_main_sha) {
            throw new Error("Owner dispatch main authority is stale.");
          }

          let workflow;
          let inputs;
          switch (payload.kind) {
            case "exact-main-ci":
              exactKeys(["kind", "expected_main_sha"]);
              workflow = "ci.yml";
              inputs = { expected_main_sha: payload.expected_main_sha };
              break;
            case "dna-throughput-probe":
              exactKeys(["kind", "expected_main_sha"]);
              workflow = "dna-open-lab-throughput-probe.yml";
              inputs = { expected_main_sha: payload.expected_main_sha };
              break;
            case "population-index-maintenance":
              exactKeys(["kind", "expected_main_sha"]);
              workflow =
                "dna-population-race-index-private-preview-command.yml";
              inputs = {
                expected_main_sha: payload.expected_main_sha,
                maximum_receipts: "25",
                execute_bounded_private_preview_index: true,
              };
              break;
            case "population-core-history-readiness":
              exactKeys(["kind", "expected_main_sha"]);
              workflow = "dna-population-core-history-readiness.yml";
              inputs = {
                expected_main_sha: payload.expected_main_sha,
                execute_read_only_readiness: true,
              };
              break;
            case "population-core-history-first-cohort":
              exactKeys([
                "kind",
                "expected_main_sha",
                "cohort_observed_at",
                "execute_first_private_preview_population_core_history",
              ]);
              if (
                !exactTimestamp(payload.cohort_observed_at) ||
                payload.execute_first_private_preview_population_core_history !== true
              ) {
                throw new Error(
                  "Population Core-history first-cohort dispatch authority is invalid.",
                );
              }
              workflow =
                "dna-population-core-history-first-cohort-command.yml";
              inputs = {
                expected_main_sha: payload.expected_main_sha,
                cohort_observed_at: payload.cohort_observed_at,
                execute_first_private_preview_population_core_history: true,
              };
              break;
            case "population-core-history-authority-migration":
              exactKeys([
                "kind",
                "expected_main_sha",
                "apply_private_preview_migration",
              ]);
              if (payload.apply_private_preview_migration !== true) {
                throw new Error(
                  "Population Core-history authority migration is invalid.",
                );
              }
              workflow =
                "dna-population-core-history-authority-preview-migration.yml";
              inputs = {
                exact_main_sha: payload.expected_main_sha,
                apply_private_preview_migration: true,
              };
              break;
            case "provider-capacity-preflight":
              exactKeys(["kind", "expected_main_sha"]);
              workflow = "dna-open-lab-daily-refresh-provider-preflight.yml";
              inputs = {};
              break;
            case "r2-budget-ledger-diagnostic":
              exactKeys(["kind", "expected_main_sha"]);
              workflow = "dna-open-lab-r2-budget-ledger-diagnostic.yml";
              inputs = {
                expected_main_sha: payload.expected_main_sha,
              };
              break;
            case "r2-expired-budget-recovery-migration":
              exactKeys([
                "kind",
                "expected_main_sha",
                "apply_private_preview_migration",
              ]);
              if (payload.apply_private_preview_migration !== true) {
                throw new Error(
                  "Expired R2 recovery migration authority is invalid.",
                );
              }
              workflow =
                "dna-open-lab-r2-expired-budget-recovery-preview-migration.yml";
              inputs = {
                exact_main_sha: payload.expected_main_sha,
                apply_private_preview_migration: true,
              };
              break;
            case "r2-expired-budget-recovery":
              exactKeys([
                "kind",
                "expected_main_sha",
                "expected_ledger_window_end_at",
                "expected_reserved_storage_bytes",
                "expected_reserved_class_a_operations",
                "expected_reserved_class_b_operations",
                "execute_expired_r2_budget_recovery",
              ]);
              if (
                !exactTimestamp(payload.expected_ledger_window_end_at) ||
                !positiveCount(payload.expected_reserved_storage_bytes) ||
                !positiveCount(payload.expected_reserved_class_a_operations) ||
                !positiveCount(payload.expected_reserved_class_b_operations) ||
                payload.execute_expired_r2_budget_recovery !== true
              ) {
                throw new Error(
                  "Expired R2 budget recovery authority is invalid.",
                );
              }
              workflow = "dna-open-lab-r2-expired-budget-recovery.yml";
              inputs = {
                expected_main_sha: payload.expected_main_sha,
                expected_ledger_window_end_at:
                  payload.expected_ledger_window_end_at,
                expected_reserved_storage_bytes:
                  payload.expected_reserved_storage_bytes,
                expected_reserved_class_a_operations:
                  payload.expected_reserved_class_a_operations,
                expected_reserved_class_b_operations:
                  payload.expected_reserved_class_b_operations,
                execute_expired_r2_budget_recovery: true,
              };
              break;
            case "entrant-readiness":
              exactKeys(["kind", "expected_main_sha"]);
              workflow = "dna-population-entrant-authority-readiness.yml";
              inputs = {
                expected_main_sha: payload.expected_main_sha,
              };
              break;
            case "entrant-remediation-first":
              exactKeys([
                "kind",
                "expected_main_sha",
                "cohort_observed_at",
                "execute_first_private_preview_entrant_remediation",
              ]);
              if (
                !exactTimestamp(payload.cohort_observed_at) ||
                payload.execute_first_private_preview_entrant_remediation !== true
              ) {
                throw new Error("First remediation dispatch authority is invalid.");
              }
              workflow =
                "dna-population-entrant-authority-remediation-command.yml";
              inputs = {
                expected_main_sha: payload.expected_main_sha,
                cohort_observed_at: payload.cohort_observed_at,
                execute_first_private_preview_entrant_remediation: true,
              };
              break;
            case "entrant-remediation-verify":
              exactKeys(["kind", "expected_main_sha"]);
              workflow =
                "dna-population-entrant-authority-remediation-verification.yml";
              inputs = {
                expected_main_sha: payload.expected_main_sha,
              };
              break;
            case "entrant-remediation-continuation-readiness":
              exactKeys(["kind", "expected_main_sha"]);
              workflow =
                "dna-population-entrant-authority-remediation-continuation-readiness.yml";
              inputs = {
                expected_main_sha: payload.expected_main_sha,
              };
              break;
            case "entrant-remediation-continuation":
              exactKeys([
                "kind",
                "expected_main_sha",
                "cohort_observed_at",
                "execute_next_private_preview_entrant_remediation",
              ]);
              if (
                !exactTimestamp(payload.cohort_observed_at) ||
                payload.execute_next_private_preview_entrant_remediation !== true
              ) {
                throw new Error(
                  "Remediation continuation dispatch authority is invalid.",
                );
              }
              workflow =
                "dna-population-entrant-authority-remediation-continuation-command.yml";
              inputs = {
                expected_main_sha: payload.expected_main_sha,
                cohort_observed_at: payload.cohort_observed_at,
                execute_next_private_preview_entrant_remediation: true,
              };
              break;
            case "entrant-remediation-continuation-verify":
              exactKeys(["kind", "expected_main_sha"]);
              workflow =
                "dna-population-entrant-authority-remediation-continuation-verification.yml";
              inputs = {
                expected_main_sha: payload.expected_main_sha,
              };
              break;
            case "entrant-remediation-cohort-3-readiness":
              exactKeys(["kind", "expected_main_sha"]);
              workflow =
                "dna-population-entrant-authority-remediation-cohort-3-readiness.yml";
              inputs = {
                expected_main_sha: payload.expected_main_sha,
              };
              break;
            case "entrant-remediation-cohort-3":
              exactKeys([
                "kind",
                "expected_main_sha",
                "cohort_observed_at",
                "execute_private_preview_entrant_remediation_cohort_3",
              ]);
              if (
                !exactTimestamp(payload.cohort_observed_at) ||
                payload.execute_private_preview_entrant_remediation_cohort_3 !== true
              ) {
                throw new Error(
                  "Remediation cohort 3 dispatch authority is invalid.",
                );
              }
              workflow =
                "dna-population-entrant-authority-remediation-cohort-3-command.yml";
              inputs = {
                expected_main_sha: payload.expected_main_sha,
                cohort_observed_at: payload.cohort_observed_at,
                execute_private_preview_entrant_remediation_cohort_3: true,
              };
              break;
            case "entrant-remediation-cohort-3-verify":
              exactKeys(["kind", "expected_main_sha"]);
              workflow =
                "dna-population-entrant-authority-remediation-cohort-3-verification.yml";
              inputs = {
                expected_main_sha: payload.expected_main_sha,
              };
              break;
            case "entrant-first-verify":
              exactKeys(["kind", "expected_main_sha"]);
              workflow =
                "dna-population-entrant-authority-first-cohort-verification.yml";
              inputs = {
                expected_main_sha: payload.expected_main_sha,
              };
              break;
            case "entrant-continuation-readiness":
              exactKeys([
                "kind",
                "expected_main_sha",
                "expected_unresolved_race_count",
                "expected_unresolved_race_set_sha256",
              ]);
              if (
                !positiveCount(payload.expected_unresolved_race_count) ||
                !sha64(payload.expected_unresolved_race_set_sha256)
              ) {
                throw new Error(
                  "Continuation-readiness Race authority is invalid.",
                );
              }
              workflow =
                "dna-population-entrant-authority-continuation-readiness.yml";
              inputs = {
                expected_main_sha: payload.expected_main_sha,
                expected_unresolved_race_count:
                  payload.expected_unresolved_race_count,
                expected_unresolved_race_set_sha256:
                  payload.expected_unresolved_race_set_sha256,
              };
              break;
            case "entrant-autonomous":
              exactKeys([
                "kind",
                "expected_main_sha",
                "accepted_boundary_status",
                "expected_unresolved_race_count",
                "expected_unresolved_race_set_sha256",
                "expected_recovered_chunk_count",
                "expected_recovered_race_count",
                "expected_next_chunk_ordinal",
                "expected_checkpoint_updated_at",
                "readiness_capacity_observed_at",
                "durable_boundary_sha256",
                "execute_all_private_preview_entrant_authority",
              ]);
              if (
                payload.accepted_boundary_status !== "ready_for_continuation" ||
                !positiveCount(payload.expected_unresolved_race_count) ||
                !sha64(payload.expected_unresolved_race_set_sha256) ||
                !positiveCount(payload.expected_recovered_chunk_count) ||
                !positiveCount(payload.expected_recovered_race_count) ||
                !positiveCount(payload.expected_next_chunk_ordinal) ||
                !exactTimestamp(payload.expected_checkpoint_updated_at) ||
                !exactTimestamp(payload.readiness_capacity_observed_at) ||
                !sha64(payload.durable_boundary_sha256) ||
                payload.execute_all_private_preview_entrant_authority !== true
              ) {
                throw new Error("Autonomous dispatch authority is invalid.");
              }
              workflow =
                "dna-population-entrant-authority-autonomous-runner.yml";
              inputs = {
                expected_main_sha: payload.expected_main_sha,
                accepted_boundary_status: payload.accepted_boundary_status,
                expected_unresolved_race_count:
                  payload.expected_unresolved_race_count,
                expected_unresolved_race_set_sha256:
                  payload.expected_unresolved_race_set_sha256,
                expected_recovered_chunk_count:
                  payload.expected_recovered_chunk_count,
                expected_recovered_race_count:
                  payload.expected_recovered_race_count,
                expected_next_chunk_ordinal:
                  payload.expected_next_chunk_ordinal,
                expected_checkpoint_updated_at:
                  payload.expected_checkpoint_updated_at,
                readiness_capacity_observed_at:
                  payload.readiness_capacity_observed_at,
                durable_boundary_sha256:
                  payload.durable_boundary_sha256,
                execute_all_private_preview_entrant_authority: true,
              };
              break;
            case "entrant-continuation":
              exactKeys([
                "kind",
                "expected_main_sha",
                "cohort_observed_at",
                "expected_unresolved_race_count",
                "expected_unresolved_race_set_sha256",
                "expected_recovered_chunk_count",
                "expected_recovered_race_count",
                "expected_next_chunk_ordinal",
                "expected_checkpoint_updated_at",
                "readiness_capacity_observed_at",
                "durable_boundary_sha256",
                "execute_next_private_preview_entrant_cohort",
              ]);
              if (
                !exactTimestamp(payload.cohort_observed_at) ||
                !positiveCount(payload.expected_unresolved_race_count) ||
                !sha64(payload.expected_unresolved_race_set_sha256) ||
                !positiveCount(payload.expected_recovered_chunk_count) ||
                !positiveCount(payload.expected_recovered_race_count) ||
                !positiveCount(payload.expected_next_chunk_ordinal) ||
                !exactTimestamp(payload.expected_checkpoint_updated_at) ||
                !exactTimestamp(payload.readiness_capacity_observed_at) ||
                !sha64(payload.durable_boundary_sha256) ||
                payload.execute_next_private_preview_entrant_cohort !== true
              ) {
                throw new Error("Continuation dispatch authority is invalid.");
              }
              workflow =
                "dna-population-entrant-authority-continuation-command.yml";
              inputs = {
                expected_main_sha: payload.expected_main_sha,
                cohort_observed_at: payload.cohort_observed_at,
                expected_unresolved_race_count:
                  payload.expected_unresolved_race_count,
                expected_unresolved_race_set_sha256:
                  payload.expected_unresolved_race_set_sha256,
                expected_recovered_chunk_count:
                  payload.expected_recovered_chunk_count,
                expected_recovered_race_count:
                  payload.expected_recovered_race_count,
                expected_next_chunk_ordinal:
                  payload.expected_next_chunk_ordinal,
                expected_checkpoint_updated_at:
                  payload.expected_checkpoint_updated_at,
                readiness_capacity_observed_at:
                  payload.readiness_capacity_observed_at,
                durable_boundary_sha256:
                  payload.durable_boundary_sha256,
                execute_next_private_preview_entrant_cohort: true,
              };
              break;
            case "entrant-first-cohort":
              exactKeys([
                "kind",
                "expected_main_sha",
                "cohort_observed_at",
                "expected_unresolved_race_count",
                "expected_unresolved_race_set_sha256",
                "readiness_capacity_observed_at",
                "readiness_receipt_sha256",
                "execute_first_private_preview_entrant_cohort",
              ]);
              if (
                !exactTimestamp(payload.cohort_observed_at) ||
                !positiveCount(payload.expected_unresolved_race_count) ||
                !sha64(payload.expected_unresolved_race_set_sha256) ||
                !exactTimestamp(payload.readiness_capacity_observed_at) ||
                !sha64(payload.readiness_receipt_sha256) ||
                payload.execute_first_private_preview_entrant_cohort !== true
              ) {
                throw new Error("First-cohort dispatch authority is invalid.");
              }
              workflow =
                "dna-population-entrant-authority-cohort-command.yml";
              inputs = {
                expected_main_sha: payload.expected_main_sha,
                cohort_observed_at: payload.cohort_observed_at,
                expected_unresolved_race_count:
                  payload.expected_unresolved_race_count,
                expected_unresolved_race_set_sha256:
                  payload.expected_unresolved_race_set_sha256,
                readiness_capacity_observed_at:
                  payload.readiness_capacity_observed_at,
                readiness_receipt_sha256:
                  payload.readiness_receipt_sha256,
                execute_first_private_preview_entrant_cohort: true,
              };
              break;
            case "import-workspace-runtime-grants-migration":
              exactKeys([
                "kind",
                "expected_main_sha",
                "apply_private_preview_migration",
              ]);
              if (payload.apply_private_preview_migration !== true) {
                throw new Error(
                  "Import workspace runtime grants migration authority is invalid.",
                );
              }
              workflow =
                "dna-import-workspace-runtime-grants-preview-migration.yml";
              inputs = {
                exact_main_sha: payload.expected_main_sha,
                apply_private_preview_migration: true,
              };
              break;
            case "race-merge-r2-manifest-migration":
              exactKeys([
                "kind",
                "expected_main_sha",
                "apply_private_preview_migration",
              ]);
              if (payload.apply_private_preview_migration !== true) {
                throw new Error(
                  "Race Merge R2 manifest migration authority is invalid.",
                );
              }
              workflow =
                "dna-race-merge-core-outcome-r2-preview-migration.yml";
              inputs = {
                exact_main_sha: payload.expected_main_sha,
                apply_private_preview_migration: true,
              };
              break;
            case "race-merge-first-core-outcome-cohort":
              exactKeys([
                "kind",
                "expected_main_sha",
                "execute_first_private_preview_race_merge_cohort",
              ]);
              if (
                payload.execute_first_private_preview_race_merge_cohort !== true
              ) {
                throw new Error(
                  "Race Merge first Core-outcome cohort authority is invalid.",
                );
              }
              workflow =
                "dna-race-merge-core-outcome-first-cohort-command.yml";
              inputs = {
                expected_main_sha: payload.expected_main_sha,
                execute_first_private_preview_race_merge_cohort: true,
              };
              break;
            case "race-merge-core-outcome-continuation":
              exactKeys([
                "kind",
                "expected_main_sha",
                "previous_cohort_ordinal",
                "execute_next_private_preview_race_merge_cohort",
              ]);
              if (
                !positiveCount(payload.previous_cohort_ordinal) ||
                payload.execute_next_private_preview_race_merge_cohort !== true
              ) {
                throw new Error(
                  "Race Merge Core-outcome continuation authority is invalid.",
                );
              }
              workflow =
                "dna-race-merge-core-outcome-continuation-command.yml";
              inputs = {
                expected_main_sha: payload.expected_main_sha,
                previous_cohort_ordinal: payload.previous_cohort_ordinal,
                execute_next_private_preview_race_merge_cohort: true,
              };
              break;
            case "population-core-outcome-gap-measurement":
              exactKeys(["kind", "expected_main_sha"]);
              workflow =
                "dna-population-core-outcome-gap-measurement.yml";
              inputs = {
                expected_main_sha: payload.expected_main_sha,
                execute_read_only_measurement: true,
              };
              break;
            case "population-core-outcome-gap-bootstrap":
              exactKeys([
                "kind",
                "expected_main_sha",
                "acquisition_evaluated_at",
                "expected_gap_core_count",
                "expected_gap_core_set_sha256",
                "expected_missing_membership_set_sha256",
                "bootstrap_exact_gap_acquisition",
              ]);
              if (
                !exactTimestamp(payload.acquisition_evaluated_at) ||
                !positiveCount(payload.expected_gap_core_count) ||
                !sha64(payload.expected_gap_core_set_sha256) ||
                !sha64(payload.expected_missing_membership_set_sha256) ||
                payload.bootstrap_exact_gap_acquisition !== true
              ) {
                throw new Error(
                  "Population Core-outcome gap bootstrap authority is invalid.",
                );
              }
              workflow =
                "dna-population-core-outcome-gap-acquisition-bootstrap.yml";
              inputs = {
                expected_main_sha: payload.expected_main_sha,
                acquisition_evaluated_at:
                  payload.acquisition_evaluated_at,
                expected_gap_core_count: payload.expected_gap_core_count,
                expected_gap_core_set_sha256:
                  payload.expected_gap_core_set_sha256,
                expected_missing_membership_set_sha256:
                  payload.expected_missing_membership_set_sha256,
                bootstrap_exact_gap_acquisition: true,
              };
              break;
            case "population-core-outcome-gap-first-api-page":
              exactKeys([
                "kind",
                "expected_main_sha",
                "acquisition_evaluated_at",
                "expected_gap_core_count",
                "expected_gap_core_set_sha256",
                "expected_missing_membership_set_sha256",
                "execute_first_exact_gap_api_page",
              ]);
              if (
                !exactTimestamp(payload.acquisition_evaluated_at) ||
                !positiveCount(payload.expected_gap_core_count) ||
                !sha64(payload.expected_gap_core_set_sha256) ||
                !sha64(payload.expected_missing_membership_set_sha256) ||
                payload.execute_first_exact_gap_api_page !== true
              ) {
                throw new Error(
                  "Population Core-outcome first API page authority is invalid.",
                );
              }
              workflow =
                "dna-population-core-outcome-gap-first-api-page.yml";
              inputs = {
                expected_main_sha: payload.expected_main_sha,
                acquisition_evaluated_at:
                  payload.acquisition_evaluated_at,
                expected_gap_core_count: payload.expected_gap_core_count,
                expected_gap_core_set_sha256:
                  payload.expected_gap_core_set_sha256,
                expected_missing_membership_set_sha256:
                  payload.expected_missing_membership_set_sha256,
                execute_first_exact_gap_api_page: true,
              };
              break;
            case "population-core-outcome-gap-continuation-api-page":
              exactKeys([
                "kind",
                "expected_main_sha",
                "acquisition_evaluated_at",
                "expected_gap_core_count",
