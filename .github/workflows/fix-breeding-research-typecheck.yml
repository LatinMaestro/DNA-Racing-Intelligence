name: Fix breeding research typecheck

on:
  push:
    branches:
      - codex/breeding-offspring-history-backfill
    paths:
      - .github/workflows/fix-breeding-research-typecheck.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/breeding-offspring-history-backfill
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply TypeScript-only research harness fixes
        shell: bash
        run: |
          set -euo pipefail
          python -c "from pathlib import Path; p=Path('tests/hosted-breeding-complete-core-enrichment.test.ts'); s=p.read_text(); old='const families: Record<string, unknown[]> = {'; new='const families: Record<\"info\" | \"stats\" | \"power\" | \"listing\" | \"assets\" | \"owner\" | \"stamina\" | \"splicing\" | \"telemetry\" | \"telemetryBenchmark\", unknown[]> = {'; assert s.count(old)==1; p.write_text(s.replace(old,new,1))"
          sed -i 's/as AnyRecord\[\]/as readonly AnyRecord[]/g' tests/hosted-breeding-lineage-census.test.ts
          sed -i 's/as AnyRecord\[\]/as readonly AnyRecord[]/g' tests/hosted-breeding-missing-coparent-inventory.test.ts
          python -c "from pathlib import Path; p=Path('tests/hosted-dna-open-lab-connected-discovery.test.ts'); s=p.read_text(); old='telemetryClients[laneIndex]!.coreTelemetryBenchmark(\\n              candidateCoreId,\\n            )'; new='telemetryClients[laneIndex]!.coreTelemetryBenchmark(\\n              candidateCoreId,\\n              10,\\n            )'; assert s.count(old)==1; p.write_text(s.replace(old,new,1))"
          npx prettier --write tests/hosted-breeding-complete-core-enrichment.test.ts tests/hosted-breeding-lineage-census.test.ts tests/hosted-breeding-missing-coparent-inventory.test.ts tests/hosted-dna-open-lab-connected-discovery.test.ts
          npx tsc --noEmit
      - name: Commit typecheck cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/hosted-breeding-complete-core-enrichment.test.ts tests/hosted-breeding-lineage-census.test.ts tests/hosted-breeding-missing-coparent-inventory.test.ts tests/hosted-dna-open-lab-connected-discovery.test.ts
          git commit -m "Fix breeding research type safety"
          git push origin HEAD:codex/breeding-offspring-history-backfill
