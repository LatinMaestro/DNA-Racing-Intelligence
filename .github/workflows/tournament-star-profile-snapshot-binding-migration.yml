name: Tournament star-profile snapshot binding migration

on:
  pull_request:
    paths:
      - "database/migrations/0030_tournament_star_profile_snapshot_binding.*.sql"
      - ".github/workflows/tournament-star-profile-snapshot-binding-migration.yml"

permissions:
  contents: read

jobs:
  tournament-star-profile-snapshot-binding-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dna_racing_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dna_racing_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: dna_racing_ci
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply prerequisite migrations
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r migration; do
            [[ "$migration" == *"/0030_"* ]] && break
            psql --set ON_ERROR_STOP=1 --file "$migration"
          done < <(find database/migrations -maxdepth 1 -name '*.up.sql' | sort)
      - name: Apply Tournament star-profile snapshot binding migration
        run: >-
          psql --set ON_ERROR_STOP=1 --file
          database/migrations/0030_tournament_star_profile_snapshot_binding.up.sql
      - name: Run Tournament star-profile snapshot binding smoke test
        run: >-
          psql --set ON_ERROR_STOP=1 --file
          database/migrations/0030_tournament_star_profile_snapshot_binding.smoke.sql
      - name: Reverse Tournament star-profile snapshot binding migration
        run: >-
          psql --set ON_ERROR_STOP=1 --file
          database/migrations/0030_tournament_star_profile_snapshot_binding.down.sql
      - name: Verify benchmark binding was restored without star-profile binding
        run: >-
          psql --set ON_ERROR_STOP=1 --command
          "DO \$\$ BEGIN IF to_regprocedure(
          'dna.derive_tournament_candidate_snapshot(uuid,text)'
          ) IS NULL OR pg_get_functiondef(to_regprocedure(
          'dna.derive_tournament_candidate_snapshot(uuid,text)'
          )) NOT LIKE '%benchmarkRefreshedAt%' OR pg_get_functiondef(
          to_regprocedure('dna.derive_tournament_candidate_snapshot(uuid,text)')
          ) LIKE '%starProfileRefreshedAt%' THEN
          RAISE EXCEPTION 'prior Tournament snapshot derivation was not restored';
          END IF; END \$\$;"
      - name: Reverse prerequisite benchmark snapshot binding migration
        run: >-
          psql --set ON_ERROR_STOP=1 --file
          database/migrations/0029_tournament_benchmark_snapshot_binding.down.sql
      - name: Verify benchmark snapshot binding removal
        run: >-
          psql --set ON_ERROR_STOP=1 --command
          "DO \$\$ BEGIN IF pg_get_functiondef(to_regprocedure(
          'dna.derive_tournament_candidate_snapshot(uuid,text)'
          )) LIKE '%benchmarkRefreshedAt%' THEN
          RAISE EXCEPTION 'Tournament benchmark snapshot binding remains';
          END IF; END \$\$;"
