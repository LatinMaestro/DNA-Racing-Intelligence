name: TEMPORARY format PR 722 — DO NOT MERGE

on:
  push:
    branches:
      - agent/compact-entrant-replay-integrity

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/compact-entrant-replay-integrity
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format only PR 722 files
        run: >-
          npx prettier --write
          lib/dna-population-entrant-authority-replay.ts
          tests/dna-population-entrant-authority-replay.test.ts
      - name: Commit formatter output if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatter changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             lib/dna-population-entrant-authority-replay.ts             tests/dna-population-entrant-authority-replay.test.ts
          git commit -m "TEMPORARY format compact entrant replay"
          git push origin HEAD:agent/compact-entrant-replay-integrity
