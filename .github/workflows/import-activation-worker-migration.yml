name: Import activation worker migration

on:
  pull_request:
    paths:
      - "database/migrations/**"
      - ".github/workflows/import-activation-worker-migration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dna_racing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dna_racing_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: dna_racing_test
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply and smoke activation migrations at historical boundaries
        run: |
          set -euo pipefail
          reached_target=0
          while IFS= read -r migration; do
            psql --set ON_ERROR_STOP=1 --file "$migration"
            case "$(basename "$migration")" in
              0038_import_activation_worker.up.sql)
                psql --set ON_ERROR_STOP=1 --file database/migrations/0038_import_activation_worker.smoke.sql
                ;;
              0039_import_activation_dataset.up.sql)
                psql --set ON_ERROR_STOP=1 --file database/migrations/0039_import_activation_dataset.smoke.sql
                ;;
              0040_runtime_connection_capacity.up.sql)
                psql --set ON_ERROR_STOP=1 --file database/migrations/0040_runtime_connection_capacity.smoke.sql
                ;;
              0041_import_pre_activation_cleanup.up.sql)
                psql --set ON_ERROR_STOP=1 --file database/migrations/0041_import_pre_activation_cleanup.smoke.sql
                ;;
              0042_import_confirmation_cleanup.up.sql)
                psql --set ON_ERROR_STOP=1 --file database/migrations/0042_import_confirmation_cleanup.smoke.sql
                ;;
              0044_import_dataset_rollback.up.sql)
                psql --set ON_ERROR_STOP=1 --file database/migrations/0044_import_dataset_rollback.smoke.sql
                ;;
              0045_dataset_evidence_object_manifest.up.sql)
                psql --set ON_ERROR_STOP=1 --file database/migrations/0045_dataset_evidence_object_manifest.smoke.sql
                ;;
              0046_unlinked_dataset_evidence_cleanup.up.sql)
                psql --set ON_ERROR_STOP=1 --file database/migrations/0046_unlinked_dataset_evidence_cleanup.smoke.sql
                ;;
              0047_accepted_dataset_evidence_compaction.up.sql)
                psql --set ON_ERROR_STOP=1 --file database/migrations/0047_accepted_dataset_evidence_compaction.smoke.sql
                ;;
              0048_import_activation_evidence_compaction.up.sql)
                psql --set ON_ERROR_STOP=1 --file database/migrations/0048_import_activation_evidence_compaction.smoke.sql
                ;;
              0049_staged_evidence_compaction_coverage.up.sql)
                psql --set ON_ERROR_STOP=1 --file database/migrations/0049_staged_evidence_compaction_coverage.smoke.sql
                ;;
              0050_preview_processing_failure_stage.up.sql)
                psql --set ON_ERROR_STOP=1 --file database/migrations/0050_preview_processing_failure_stage.smoke.sql
                ;;
              0051_preview_evidence_resume.up.sql)
                psql --set ON_ERROR_STOP=1 --file database/migrations/0051_preview_evidence_resume.smoke.sql
                ;;
              0052_preview_evidence_owner_identity.up.sql)
                psql --set ON_ERROR_STOP=1 --file database/migrations/0052_preview_evidence_owner_identity.smoke.sql
                reached_target=1
                break
                ;;
            esac
          done < <(find database/migrations -maxdepth 1 -name '*.up.sql' -print | sort)
          if [[ "$reached_target" -ne 1 ]]; then
            echo "Activation migration boundary 0052 was not reached" >&2
            exit 1
          fi
      - name: Reverse activation migration chain and verify removal
        run: |
          set -euo pipefail
          for stem in \
            0052_preview_evidence_owner_identity \
            0051_preview_evidence_resume \
            0050_preview_processing_failure_stage \
            0049_staged_evidence_compaction_coverage \
            0048_import_activation_evidence_compaction \
            0047_accepted_dataset_evidence_compaction \
            0046_unlinked_dataset_evidence_cleanup \
            0045_dataset_evidence_object_manifest \
            0044_import_dataset_rollback \
            0042_import_confirmation_cleanup \
            0041_import_pre_activation_cleanup \
            0040_runtime_connection_capacity \
            0039_import_activation_dataset; do
            psql --set ON_ERROR_STOP=1 --file "database/migrations/${stem}.down.sql"
            psql --set ON_ERROR_STOP=1 --file "database/migrations/${stem}.removal.sql"
          done
          psql --set ON_ERROR_STOP=1 --file database/migrations/0038_import_activation_worker.down.sql
          psql --set ON_ERROR_STOP=1 --command "DO \$\$ BEGIN IF to_regclass('dna.import_activation_processing') IS NOT NULL OR to_regclass('dna.import_activation_dispatch') IS NOT NULL THEN RAISE EXCEPTION 'import activation worker ledger still exists'; END IF; END \$\$;"
