name: Temporary Reese Dylan ageing boundary
on:
  push:
    branches:
      - temp/reese-ageing-audit-2026-09-01
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Find chronological ageing boundary
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const base='https://api.dnaracing.run',hid=11848;
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function post(path,body){const r=await fetch(base+path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const t=await r.text();let j;try{j=JSON.parse(t)}catch{};if(!r.ok)throw new Error(`HTTP ${r.status}`);await sleep(220);return j?.result??j}
          function arr(v){if(Array.isArray(v))return v;if(v&&typeof v==='object')for(const k of ['data','items','races'])if(Array.isArray(v[k]))return v[k];return []}
          function when(r){for(const k of ['start_time','startTime','date','created_at','createdAt']){const v=r?.[k];if(typeof v==='string'){const t=Date.parse(v);if(Number.isFinite(t))return t}if(typeof v==='number')return v>1e12?v:v*1000}return null}
          function num(v){const n=Number(v);return Number.isFinite(n)?n:0} function fee(r){return Math.max(num(r?.fee),num(r?.fee_fixed),0)}
          const all=[];for(let p=1;p<=50;p++){const q=arr(await post('/fbike/i/hraces',{hid,page:p}));if(!q.length)break;all.push(...q);if(q.length<50)break}
          const d=new Map();for(const r of all){const k=String(r?.rhid??r?.rid??`${when(r)}:${r?.rvmode}:${r?.cb}:${r?.pos}:${r?.race_name}`);if(!d.has(k))d.set(k,r)}
          const bike=[...d.values()].filter(r=>String(r?.rvmode??'').toLowerCase()==='bike').sort((a,b)=>(when(a)||0)-(when(b)||0));
          const paid=bike.filter(r=>fee(r)>0); const normalFree=bike.filter(r=>fee(r)===0&&/\bFree\b/i.test(String(r?.race_name??'')));
          const counting=[...paid,...normalFree].sort((a,b)=>(when(a)||0)-(when(b)||0));
          const stats=await post('/fbike/cores/racing_stats_bulk',{hids:[hid]});const st=Array.isArray(stats)?stats[0]:stats;
          const show=r=>r?{date:new Date(when(r)).toISOString(),name:r.race_name,fee:fee(r),format:r.format,cb:r.cb,pos:r.pos,rhid:r.rhid}:null;
          const remaining=Number(st?.ageing?.bike); const used=1000-remaining; const historical=counting.length; const excluded=historical-used;
          console.log('AGE_BOUNDARY',JSON.stringify({remaining,used,historicalCountingCandidates:historical,paid:paid.length,normalFree:normalFree.length,excludedBeforeActivationIfContinuous:excluded,lastExcluded:show(counting[excluded-1]),firstCounted:show(counting[excluded]),boundaryWindow:counting.slice(Math.max(0,excluded-5),excluded+5).map(show)}));
          const months={};for(const r of counting){const m=new Date(when(r)).toISOString().slice(0,7);months[m]=(months[m]||0)+1}console.log('COUNTING_BY_MONTH',JSON.stringify(months));
          NODE
