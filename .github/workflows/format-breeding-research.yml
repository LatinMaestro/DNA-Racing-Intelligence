name: Format breeding research files

on:
  push:
    branches:
      - codex/breeding-offspring-history-backfill
    paths:
      - .github/workflows/format-breeding-research.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/breeding-offspring-history-backfill
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply Prettier
        run: npx prettier --write tests/hosted-breeding-census-augment.test.ts tests/hosted-breeding-complete-core-enrichment.test.ts tests/hosted-breeding-missing-coparent-inventory.test.ts lib/dna-open-lab-v1-telemetry-client.ts tests/dna-open-lab-v1-telemetry-client.test.ts
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/hosted-breeding-census-augment.test.ts tests/hosted-breeding-complete-core-enrichment.test.ts tests/hosted-breeding-missing-coparent-inventory.test.ts lib/dna-open-lab-v1-telemetry-client.ts tests/dna-open-lab-v1-telemetry-client.test.ts
          git commit -m "Format breeding research files"
          git push origin HEAD:codex/breeding-offspring-history-backfill
