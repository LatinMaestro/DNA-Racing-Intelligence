name: temporary format Horse Discovery bot changes

on:
  push:
    branches:
      - feature/horse-burn-grade-free-entry-campaign-20260920

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message == 'Run temporary Horse Discovery formatter'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx prettier --write campaigns/horse-burn-grade-discovery-2026-09-20.json domain/free-discovery-entry-campaign.ts domain/race-entry-bot.ts tests/free-discovery-entry-campaign.test.ts
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add campaigns/horse-burn-grade-discovery-2026-09-20.json domain/free-discovery-entry-campaign.ts domain/race-entry-bot.ts tests/free-discovery-entry-campaign.test.ts
          git commit -m "Format Horse Discovery bot changes"
          git push
