name: Temporary Discovery group-bound parity fix

on:
  push:
    branches:
      - agent/spillable-discovery-benchmarks

permissions:
  contents: write

concurrency:
  group: temporary-discovery-group-bound
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/spillable-discovery-benchmarks
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Preserve resident benchmark group-bound semantics
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          source_path = Path('lib/race-archive-spillable-discovery-benchmarks.ts')
          source = source_path.read_text()
          source = source.replace('    let benchmarkCount = 0;\n', '', 1)
          anchor = '''        groupSequence += 1;
                const groupRunId = `${input.groupRunPrefix}/group-${String(groupSequence).padStart(8, "0")}`;'''
          replacement = '''        groupSequence += 1;
                if (groupSequence > input.maximumBenchmarks) {
                  throw new Error(
                    "Race archive Discovery benchmark bound was exceeded.",
                  );
                }
                const groupRunId = `${input.groupRunPrefix}/group-${String(groupSequence).padStart(8, "0")}`;'''
          if anchor not in source:
              raise SystemExit('group sequence anchor changed')
          source = source.replace(anchor, replacement, 1)
          old = '''        benchmarkCount += 1;
                if (benchmarkCount > input.maximumBenchmarks) {
                  throw new Error(
                    "Race archive Discovery benchmark bound was exceeded.",
                  );
                }
                const winning = await exactSortedRaceArchiveStatistics({'''
          new = '''        const winning = await exactSortedRaceArchiveStatistics({'''
          if old not in source:
              raise SystemExit('post-filter benchmark bound block changed')
          source = source.replace(old, new, 1)
          source_path.write_text(source)

          test_path = Path('tests/race-archive-spillable-discovery-benchmarks.test.ts')
          tests = test_path.read_text()
          marker = '\n});\n'
          at = tests.rfind(marker)
          if at < 0:
              raise SystemExit('test suite closing marker changed')
          regression = r'''

            it("counts non-publishing distance groups against the resident benchmark bound", async () => {
              const input = [
                observation({
                  event: "event-1",
                  core: "core-a",
                  mode: "bike",
                  distance: 900,
                  elapsed: 45_000,
                  finish: 4,
                  eventAt: "2026-04-01T00:00:00Z",
                  row: 1,
                }),
                observation({
                  event: "event-2",
                  core: "core-b",
                  mode: "bike",
                  distance: 1000,
                  elapsed: 40_000,
                  finish: 1,
                  eventAt: "2026-04-02T00:00:00Z",
                  row: 2,
                }),
              ] as const;
              expect(() =>
                discoveryExactDistanceBenchmarksFromRaceArchive({
                  observations: input,
                  refreshedAt: "2026-04-03T00:00:00Z",
                  maximumObservations: 10,
                  maximumBenchmarks: 1,
                }),
              ).toThrow("Archive Discovery benchmark bound was exceeded.");

              const scratch = memoryStore<RaceArchiveCoreAnalyticalObservation>();
              const spillable =
                await spillableDiscoveryExactDistanceBenchmarksFromRaceArchive({
                  observations: records(input),
                  store: scratch.store,
                  runPrefix: "test/discovery-nonpublishing-bound",
                  refreshedAt: "2026-04-03T00:00:00Z",
                  maximumRecordsInMemory: 1,
                  mergeFanIn: 2,
                  maximumObservations: 10,
                  maximumRunObjects: 20,
                  maximumBenchmarks: 1,
                });
              await expect(collect(spillable.readBenchmarks())).rejects.toThrow(
                "Race archive Discovery benchmark bound was exceeded.",
              );
              expect(scratch.runs.size).toBe(0);
            });'''
          test_path.write_text(tests[:at] + regression + tests[at:])
          PY
          npx prettier --write lib/race-archive-spillable-discovery-benchmarks.ts tests/race-archive-spillable-discovery-benchmarks.test.ts
          npm run format
          npm run lint
          npm run typecheck
          npx vitest run tests/race-archive-spillable-discovery-benchmarks.test.ts tests/race-archive-exact-sorted-statistics.test.ts
          rm .github/workflows/temporary-discovery-group-bound.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Preserve Discovery benchmark group-bound parity'
          git push origin HEAD:agent/spillable-discovery-benchmarks
