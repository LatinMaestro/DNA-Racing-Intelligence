name: Codex Preview evidence resume patch

on:
  pull_request:
    paths:
      - .github/workflows/codex-preview-evidence-resume-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/invoke-activation-evidence-compaction
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply exact resumable evidence patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected patch anchor missing: {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          sink = "lib/durable-import-preview-staging-sink.ts"
          replace(
              sink,
              'import type { PreparedImportPreview } from "./import-preview-processing-service";\n',
              'import type { PreparedImportPreview } from "./import-preview-processing-service";\nimport type { DatasetEvidenceObjectRegistration } from "./neon-dataset-evidence-object-repository";\n',
          )
          replace(
              sink,
              '''  commitVerified: (input: {\n    byteLength: number;\n    sha256: string;\n    chunkCount: number;\n  }) => Promise<DurablePreviewObjectResult>;''',
              '''  commitVerified: (input: {\n    byteLength: number;\n    sha256: string;\n    chunkCount: number;\n    evidenceRegistrations?: readonly DatasetEvidenceObjectRegistration[];\n  }) => Promise<DurablePreviewObjectResult>;''',
          )
          replace(
              sink,
              '''export type DurableImportPreviewStagingRepository = Readonly<{\n  beginObject: (input: {''',
              '''export type DurableImportPreviewStagingRepository = Readonly<{\n  resumeObject: (input: {\n    ownerId: string;\n    previewDispatchId: string;\n    objectId: string;\n    sourceFamily: "race_merge" | "core_details" | "current_arena";\n    expectedByteLength: number;\n    expectedSha256: string;\n  }) => Promise<DurablePreviewObjectResult | null>;\n  beginObject: (input: {''',
          )
          replace(
              sink,
              '''  assertPreviewObjects: (input: {''',
              '''  finalizePreviewEvidence: (input: {\n    ownerId: string;\n    importBatchIds: readonly string[];\n  }) => Promise<void>;\n  assertPreviewObjects: (input: {''',
          )
          replace(
              sink,
              '''  return {\n    async beginObject(beginInput) {''',
              '''  return {\n    resumeObject(resumeInput) {\n      if (!IMPORTED_FAMILIES.has(resumeInput.sourceFamily)) {\n        throw new Error("Source family is not imported into Preview");\n      }\n      return input.repository.resumeObject({\n        ...resumeInput,\n        sourceFamily: resumeInput.sourceFamily as\n          | "race_merge"\n          | "core_details"\n          | "current_arena",\n      });\n    },\n    async beginObject(beginInput) {''',
          )
          replace(
              sink,
              '''          const commit = () => transaction.commitVerified(verified);\n          return evidence === undefined\n            ? commit()\n            : evidence.commitAndRegister(commit);''',
              '''          if (evidence === undefined) {\n            return transaction.commitVerified(verified);\n          }\n          return evidence.commitWithEvidenceReceipts((stored) =>\n            transaction.commitVerified({\n              ...verified,\n              evidenceRegistrations: stored.map(\n                ({ registration }) => registration,\n              ),\n            }),\n          );''',
          )
          replace(
              sink,
              '''    async completePreview(completeInput) {\n      await input.repository.assertPreviewObjects({''',
              '''    async completePreview(completeInput) {\n      const summary = previewSummary(completeInput);\n      const importBatchIds = completeInput.objects.map(\n        ({ stagedResult }) =>\n          (stagedResult as DurablePreviewObjectResult).importBatchId,\n      );\n      await input.repository.finalizePreviewEvidence({\n        ownerId: completeInput.ownerId,\n        importBatchIds,\n      });\n      await input.repository.assertPreviewObjects({''',
          )
          replace(
              sink,
              '''      return previewSummary(completeInput);\n    },''',
              '''      return summary;\n    },''',
          )

          repo = "lib/neon-durable-import-preview-staging-repository.ts"
          replace(
              repo,
              '''    'dna.normalized_arena_staged_fact'::regclass\n  ]) relation(oid)''',
              '''    'dna.normalized_arena_staged_fact'::regclass,\n    'dna.import_preview_evidence_receipt'::regclass\n  ]) relation(oid)''',
          )
          anchor = '''const STAGE_SCHEMA_SQL = `\n'''
          insert = '''const RESUME_OBJECT_SQL = `\n  SELECT batch.id::text AS import_batch_id, batch.source_rows,\n    batch.accepted_rows, batch.rejected_rows, batch.warning_rows\n  FROM dna.import_preview_processing processing\n  JOIN dna.import_verified_upload_object object\n    ON object.owner_id = processing.owner_id\n    AND object.preview_dispatch_id = processing.preview_dispatch_id\n  JOIN dna.import_upload_file file\n    ON file.owner_id = object.owner_id AND file.id = object.upload_file_id\n  JOIN dna.import_batch batch\n    ON batch.owner_id = file.owner_id AND batch.id = file.id\n  WHERE processing.owner_id = $1::uuid\n    AND processing.preview_dispatch_id = $2::uuid\n    AND processing.state = 'processing'\n    AND object.object_id = $3\n    AND file.source_family = $4\n    AND file.byte_length = $5::bigint\n    AND file.sha256 = $6::character(64)\n    AND object.advertised_byte_length = file.byte_length\n    AND batch.status = 'validating'\n    AND batch.source_rows = COALESCE((\n      SELECT sum(receipt.row_count)\n      FROM dna.import_preview_evidence_receipt receipt\n      WHERE receipt.owner_id = batch.owner_id\n        AND receipt.import_batch_id = batch.id\n        AND receipt.source_type = batch.source_type\n        AND receipt.object_kind = 'staged_rows'\n    ), 0)\n`;\n\nconst RECORD_EVIDENCE_RECEIPTS_SQL = `\n  SELECT dna.record_import_preview_evidence_receipts(\n    $1::uuid, $2::uuid, $3::jsonb\n  ) AS recorded_count\n`;\n\nconst FINALIZE_EVIDENCE_RECEIPTS_SQL = `\n  SELECT staged_batch_count, receipt_count, registered_manifest_count\n  FROM dna.finalize_import_preview_evidence_receipts(\n    $1::uuid, $2::uuid[], $3::timestamptz\n  )\n`;\n\n'''
          replace(repo, anchor, insert + anchor)
          replace(
              repo,
              '''function oneRow(result: QueryResult, field: string): DbRow {\n  if (result.rows.length !== 1)\n    throw new Error(`${field} must return exactly one row`);\n  return record(result.rows[0], field);\n}\n''',
              '''function oneRow(result: QueryResult, field: string): DbRow {\n  if (result.rows.length !== 1)\n    throw new Error(`${field} must return exactly one row`);\n  return record(result.rows[0], field);\n}\nfunction optionalRow(result: QueryResult, field: string): DbRow | null {\n  if (result.rows.length > 1)\n    throw new Error(`${field} must return at most one row`);\n  return result.rows.length === 0 ? null : record(result.rows[0], field);\n}\nfunction objectResult(row: DbRow): DurablePreviewObjectResult {\n  return {\n    importBatchId: text(row.import_batch_id, "import_batch_id"),\n    sourceRowCount: count(row.source_rows, "source_rows"),\n    readyRowCount: count(row.accepted_rows, "accepted_rows"),\n    quarantinedRowCount: count(row.rejected_rows, "rejected_rows"),\n    warningRowCount: count(row.warning_rows, "warning_rows"),\n    blockingIssueCount: count(row.rejected_rows, "rejected_rows"),\n  };\n}\n''',
          )
          replace(
              repo,
              '''  return {\n    async beginObject(object) {''',
              '''  return {\n    resumeObject(object) {\n      if (!SHA_PATTERN.test(object.expectedSha256))\n        throw new Error("expectedSha256 is invalid");\n      return run(object.ownerId, async (client) => {\n        const row = optionalRow(\n          await client.query(RESUME_OBJECT_SQL, [\n            config.databaseOwnerId,\n            object.previewDispatchId,\n            object.objectId,\n            object.sourceFamily,\n            object.expectedByteLength,\n            object.expectedSha256,\n          ]),\n          "resumable Preview object",\n        );\n        return row === null ? null : objectResult(row);\n      });\n    },\n    async beginObject(object) {''',
          )
          replace(
              repo,
              '''            const row = oneRow(\n              await session.client.query(RESULT_SQL, [''',
              '''            if (verified.evidenceRegistrations !== undefined) {\n              const receiptRow = oneRow(\n                await session.client.query(RECORD_EVIDENCE_RECEIPTS_SQL, [\n                  config.databaseOwnerId,\n                  importBatchId,\n                  JSON.stringify(verified.evidenceRegistrations),\n                ]),\n                "Preview evidence receipt recording",\n              );\n              if (\n                count(receiptRow.recorded_count, "recorded_count") !==\n                verified.evidenceRegistrations.length\n              ) {\n                throw new Error("Preview evidence receipt recording is incomplete");\n              }\n            }\n            const row = oneRow(\n              await session.client.query(RESULT_SQL, [''',
          )
          replace(
              repo,
              '''            const result = {\n              importBatchId: text(row.import_batch_id, "import_batch_id"),\n              sourceRowCount: count(row.source_rows, "source_rows"),\n              readyRowCount: count(row.accepted_rows, "accepted_rows"),\n              quarantinedRowCount: count(row.rejected_rows, "rejected_rows"),\n              warningRowCount: count(row.warning_rows, "warning_rows"),\n              blockingIssueCount: count(row.rejected_rows, "rejected_rows"),\n            };''',
              '''            const result = objectResult(row);''',
          )
          replace(
              repo,
              '''    assertPreviewObjects(assertion) {''',
              '''    finalizePreviewEvidence(finalization) {\n      if (\n        finalization.importBatchIds.length < 1 ||\n        finalization.importBatchIds.length > 24 ||\n        new Set(finalization.importBatchIds).size !==\n          finalization.importBatchIds.length\n      ) {\n        throw new Error("Preview evidence finalization batch set is invalid");\n      }\n      return run(finalization.ownerId, async (client) => {\n        await client.query("SET LOCAL statement_timeout = '60000ms'");\n        const row = oneRow(\n          await client.query(FINALIZE_EVIDENCE_RECEIPTS_SQL, [\n            config.databaseOwnerId,\n            finalization.importBatchIds,\n            new Date().toISOString(),\n          ]),\n          "Preview evidence finalization",\n        );\n        const stagedBatchCount = count(\n          row.staged_batch_count,\n          "staged_batch_count",\n        );\n        const receiptCount = count(row.receipt_count, "receipt_count");\n        const registeredManifestCount = count(\n          row.registered_manifest_count,\n          "registered_manifest_count",\n        );\n        if (\n          stagedBatchCount !== finalization.importBatchIds.length ||\n          registeredManifestCount !== receiptCount\n        ) {\n          throw new Error("Preview evidence finalization is incomplete");\n        }\n      });\n    },\n    assertPreviewObjects(assertion) {''',
          )

          runtime = "lib/hosted-import-preview-worker-runtime.ts"
          replace(
              runtime,
              'import { createDatasetEvidenceManifestRegistrationService } from "./dataset-evidence-manifest-registration-service";\n',
              '',
          )
          replace(
              runtime,
              '''            registrationService:\n              createDatasetEvidenceManifestRegistrationService({\n                ownerId,\n                repository: evidenceRepository,\n              }),\n''',
              '',
          )

          workflow = ".github/workflows/import-activation-worker-migration.yml"
          replace(
              workflow,
              '''      - name: Run preview processing failure stage smoke test\n        run: psql --set ON_ERROR_STOP=1 --file database/migrations/0050_preview_processing_failure_stage.smoke.sql\n      - name: Reverse preview processing failure stage migration''',
              '''      - name: Run preview processing failure stage smoke test\n        run: psql --set ON_ERROR_STOP=1 --file database/migrations/0050_preview_processing_failure_stage.smoke.sql\n      - name: Run Preview evidence resume smoke test\n        run: psql --set ON_ERROR_STOP=1 --file database/migrations/0051_preview_evidence_resume.smoke.sql\n      - name: Reverse Preview evidence resume migration\n        run: psql --set ON_ERROR_STOP=1 --file database/migrations/0051_preview_evidence_resume.down.sql\n      - name: Verify Preview evidence resume removal\n        run: psql --set ON_ERROR_STOP=1 --file database/migrations/0051_preview_evidence_resume.removal.sql\n      - name: Reverse preview processing failure stage migration''',
          )
          PY
      - name: Commit production patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/durable-import-preview-staging-sink.ts \
            lib/neon-durable-import-preview-staging-repository.ts \
            lib/hosted-import-preview-worker-runtime.ts \
            .github/workflows/import-activation-worker-migration.yml
          git diff --cached --check
          git commit -m "Make Preview evidence finalization resumable"
          git push origin HEAD:codex/invoke-activation-evidence-compaction