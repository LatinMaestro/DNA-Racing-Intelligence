name: Breeding census continuation

on:
  push:
    branches:
      - codex/breeding-offspring-history-backfill
    paths:
      - .github/workflows/breeding-census-continuation.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: breeding-api-high-rate-august-2026
  cancel-in-progress: false

jobs:
  augment:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      DNA_BREEDING_CENSUS_AUGMENT: "1"
      DNA_OPEN_LAB_API_KEY_1: ${{ secrets.DNA_OPEN_LAB_API_KEY_1 }}
      BREEDING_CENSUS_SOURCE_PATH: artifacts/source/breeding-lineage-census.json
      SOURCE_CENSUS_ARTIFACT_ID: "9733142717"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Download successful 26k-HID lineage census
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/source
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_CENSUS_ARTIFACT_ID}/zip" > /tmp/census.zip
          unzip -q /tmp/census.zip -d artifacts/source
          test -f artifacts/source/breeding-lineage-census.json
      - name: Upgrade census and recover authoritative splice times where exposed
        env:
          NODE_OPTIONS: "--import=./scripts/retry-transient-fetch.mjs"
        run: npx vitest run --no-file-parallelism tests/hosted-breeding-census-augment.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: breeding-lineage-census-upgraded
          path: artifacts/inventory/breeding-lineage-census-upgraded.json
          if-no-files-found: error
          retention-days: 2

  history:
    needs: augment
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      DNA_BREEDING_RACE_HISTORY_BACKFILL: "1"
      HISTORY_SHARD_INDEX: ${{ matrix.shard }}
      HISTORY_SHARD_COUNT: "4"
      BREEDING_INVENTORY_PATH: artifacts/inventory/breeding-lineage-census-upgraded.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: breeding-lineage-census-upgraded
          path: artifacts/inventory
      - name: Pull targeted Bike/Car/Horse history for shard ${{ matrix.shard }}
        env:
          NODE_OPTIONS: "--import=./scripts/retry-transient-fetch.mjs"
        run: npx vitest run --no-file-parallelism tests/hosted-breeding-race-history-shard.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: breeding-census-history-${{ matrix.shard }}
          path: artifacts/history/breeding-race-history-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 2

  analyze:
    needs: history
    runs-on: ubuntu-latest
    timeout-minutes: 130
    env:
      DNA_BREEDING_OFFSPRING_ANALYSIS: "1"
      BREEDING_INVENTORY_PATH: artifacts/inventory/breeding-lineage-census-upgraded.json
      BREEDING_HISTORY_DIR: artifacts/history
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: breeding-lineage-census-upgraded
          path: artifacts/inventory
      - uses: actions/download-artifact@v4
        with:
          pattern: breeding-census-history-*
          path: artifacts/history
          merge-multiple: true
      - name: Build chronological breeder-lift analysis
        run: npx vitest run --no-file-parallelism tests/hosted-breeding-offspring-analysis.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: breeding-census-offspring-analysis
          path: artifacts/analysis/breeding-offspring-analysis.json
          if-no-files-found: error
          retention-days: 2
