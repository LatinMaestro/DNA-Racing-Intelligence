name: temporary Quest deep historical read-only scan

on:
  push:
    branches:
      - temporary/chat-quest-readonly-discovery-2026-09-21-do-not-merge
    paths:
      - .github/workflows/temporary-quest-readonly-discovery.yml

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DNA_OPEN_LAB_API_KEY_3: ${{ secrets.DNA_OPEN_LAB_API_KEY_3 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Deep-scan proven Quest history read-only
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");
          const key = process.env.DNA_OPEN_LAB_API_KEY_3;
          if (!/^dna_[A-Za-z0-9_-]{43}$/.test(key ?? "")) throw new Error("DNA API key missing/invalid");

          const base = "https://api.dnaracing.run/fbike/pub/v1";
          const EXISTING_START = new Date("2026-08-22T10:03:14.637Z");
          const ABSOLUTE_FLOOR = new Date("2026-01-01T00:00:00.000Z");
          const BLOCK_DAYS = 30;
          const MAX_CONSECUTIVE_EMPTY_BLOCKS = 3;
          const BASE_WINDOW_MS = 6 * 60 * 60 * 1000;
          const MIN_SPLIT_MS = 5 * 60 * 1000;

          let lastStartedAt = 0;
          let requestCount = 0;
          let splitCount = 0;
          let rateLimitedCount = 0;
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function api(path, method="GET", body) {
            for (let attempt=1; attempt<=6; attempt++) {
              const wait = Math.max(0, 2200 - (Date.now() - lastStartedAt));
              if (wait) await sleep(wait);
              lastStartedAt = Date.now();
              requestCount++;
              const controller = new AbortController();
              const timer = setTimeout(() => controller.abort(), 60000);
              try {
                const response = await fetch(base + path, {
                  method,
                  signal: controller.signal,
                  headers: {
                    authorization: "Bearer " + key,
                    accept: "application/json",
                    ...(body === undefined ? {} : {"content-type":"application/json"}),
                  },
                  ...(body === undefined ? {} : {body: JSON.stringify(body)}),
                });
                const text = await response.text();
                let json;
                try { json = JSON.parse(text); } catch { json = null; }
                if (response.status === 429) {
                  rateLimitedCount++;
                  const retry = Math.max(3, Number(response.headers.get("retry-after") || 3));
                  await sleep(retry * 1000);
                  continue;
                }
                if (!response.ok || json?.status !== "success" || !("result" in json)) {
                  throw new Error(path + " " + response.status + " " + text.slice(0,500));
                }
                return json.result;
              } catch (error) {
                if (attempt === 6) throw error;
                await sleep(3000);
              } finally {
                clearTimeout(timer);
              }
            }
          }

          function isQuest(row) {
            const rid = String(row?.rid ?? "");
            const format = String(row?.format ?? "").toLowerCase();
            return rid.startsWith("quest_") || format === "quest" || format === "sub_quest";
          }

          function rootRid(rid) {
            return String(rid).replace(/-[1-5]-[A-Z]$/u, "");
          }

          async function batched(path, values, keyName) {
            const out = [];
            for (let i=0; i<values.length; i+=20) {
              const rows = await api(path, "POST", {[keyName]: values.slice(i,i+20)});
              if (!Array.isArray(rows)) throw new Error(path + " malformed");
              out.push(...rows);
            }
            return out;
          }

          const questRows = new Map();
          const windows = [];
          const blocks = [];

          async function crawlWindow(st, ed, depth=0) {
            const rows = await api("/races/finished", "POST", {
              st: st.toISOString(),
              ed: ed.toISOString(),
              limit: 200,
            });
            if (!Array.isArray(rows)) throw new Error("finished races malformed");
            windows.push({st:st.toISOString(), ed:ed.toISOString(), count:rows.length, depth});
            if (rows.length === 200 && (ed.getTime() - st.getTime()) > MIN_SPLIT_MS) {
              splitCount++;
              const mid = new Date(st.getTime() + Math.floor((ed.getTime()-st.getTime())/2));
              await crawlWindow(st, mid, depth+1);
              await crawlWindow(new Date(mid.getTime()+1), ed, depth+1);
              return;
            }
            for (const row of rows) {
              if (isQuest(row) && row?.rid !== undefined) questRows.set(String(row.rid), row);
            }
          }

          async function crawlBlock(st, ed) {
            const before = questRows.size;
            const requestBefore = requestCount;
            for (let t=st.getTime(); t<ed.getTime(); t+=BASE_WINDOW_MS) {
              const ws = new Date(t);
              const we = new Date(Math.min(ed.getTime()-1, t+BASE_WINDOW_MS-1));
              await crawlWindow(ws, we);
            }
            return {
              st: st.toISOString(),
              ed: ed.toISOString(),
              questRowsAdded: questRows.size - before,
              requests: requestCount - requestBefore,
            };
          }

          (async()=>{
            let cursor = EXISTING_START;
            let consecutiveEmptyBlocks = 0;
            while (cursor > ABSOLUTE_FLOOR && consecutiveEmptyBlocks < MAX_CONSECUTIVE_EMPTY_BLOCKS) {
              const blockStart = new Date(Math.max(
                ABSOLUTE_FLOOR.getTime(),
                cursor.getTime() - BLOCK_DAYS*24*60*60*1000
              ));
              const block = await crawlBlock(blockStart, cursor);
              blocks.push(block);
              if (block.questRowsAdded === 0) consecutiveEmptyBlocks++;
              else consecutiveEmptyBlocks = 0;
              console.log(JSON.stringify({
                checkpoint:true,
                block,
                cumulativeQuestRows:questRows.size,
                requestCount,
                consecutiveEmptyBlocks,
              }));
              cursor = blockStart;
            }

            const sparse = [...questRows.values()];
            const rootIds = [...new Set(sparse.map(x=>rootRid(x.rid)))];
            const roots = rootIds.length ? await batched("/races/docs", rootIds, "rids") : [];
            const subIds = [];
            for (const root of roots) {
              for (const group of Object.values(root?.format_inf?.rounds ?? {})) {
                for (const sub of Object.values(group ?? {})) {
                  if (sub?.rid) subIds.push(String(sub.rid));
                }
              }
            }
            const uniqueSubIds = [...new Set(subIds)];
            const subdocs = uniqueSubIds.length ? await batched("/races/docs", uniqueSubIds, "rids") : [];
            const userHids = [...new Set(
              roots.map(x=>Number(x?.r_form?.u_hid)).filter(Number.isSafeInteger)
            )];
            const info = userHids.length ? await batched("/cores/info_bulk", userHids, "hids") : [];
            const power = userHids.length ? await batched("/cores/power_bulk", userHids, "hids") : [];
            const stats = userHids.length ? await batched("/cores/racing_stats_bulk", userHids, "hids") : [];

            const output = {
              fetchedAt:new Date().toISOString(),
              readOnly:true,
              policy:{
                requestIntervalMs:2200,
                maximumConsecutiveEmptyBlocks:MAX_CONSECUTIVE_EMPTY_BLOCKS,
                blockDays:BLOCK_DAYS,
                absoluteFloor:ABSOLUTE_FLOOR.toISOString(),
                existingCoverageStartsAt:EXISTING_START.toISOString(),
              },
              scannedStart:blocks.at(-1)?.st ?? EXISTING_START.toISOString(),
              scannedEnd:EXISTING_START.toISOString(),
              stoppedAfterConsecutiveEmptyBlocks:consecutiveEmptyBlocks,
              reachedAbsoluteFloor:cursor.getTime() <= ABSOLUTE_FLOOR.getTime(),
              requestCount,
              rateLimitedCount,
              splitCount,
              windowCount:windows.length,
              blocks,
              questSparseCount:sparse.length,
              rootIdCount:rootIds.length,
              rootFoundCount:roots.length,
              subIdCount:uniqueSubIds.length,
              subdocFoundCount:subdocs.length,
              userCoreCount:userHids.length,
              questSparse:sparse,
              roots,
              subdocs,
              info,
              power,
              stats,
            };
            fs.writeFileSync("quest-deep-history.json", JSON.stringify(output,null,2));
            console.log(JSON.stringify({
              completed:true,
              fetchedAt:output.fetchedAt,
              scannedStart:output.scannedStart,
              scannedEnd:output.scannedEnd,
              stoppedAfterConsecutiveEmptyBlocks:output.stoppedAfterConsecutiveEmptyBlocks,
              reachedAbsoluteFloor:output.reachedAbsoluteFloor,
              requestCount,
              rateLimitedCount,
              splitCount,
              windowCount:windows.length,
              questSparseCount:sparse.length,
              rootFoundCount:roots.length,
              subdocFoundCount:subdocs.length,
              userCoreCount:userHids.length,
            }));
          })().catch((e)=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: quest-deep-history
          path: quest-deep-history.json
          retention-days: 1
