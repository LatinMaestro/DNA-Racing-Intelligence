name: temporary Quest complete P5 baseline read-only scan

on:
  push:
    branches:
      - temporary/chat-quest-readonly-discovery-2026-09-21-do-not-merge
    paths:
      - .github/workflows/temporary-quest-readonly-discovery.yml

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DNA_R2_ACCESS_KEY_ID: ${{ secrets.DNA_R2_ACCESS_KEY_ID }}
      DNA_R2_SECRET_ACCESS_KEY: ${{ secrets.DNA_R2_SECRET_ACCESS_KEY }}
      AUTHORIZED_CLERK_USER_ID: ${{ secrets.AUTHORIZED_CLERK_USER_ID }}
      DNA_R2_BUCKET_NAME: dna-racing-import-preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install repository dependencies
        run: npm ci --ignore-scripts
      - name: Scan complete immutable P5 finished-race baseline read-only
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import crypto from "node:crypto";
          import {S3Client,ListObjectsV2Command,GetObjectCommand} from "@aws-sdk/client-s3";

          const accountId=process.env.CLOUDFLARE_ACCOUNT_ID;
          const accessKeyId=process.env.DNA_R2_ACCESS_KEY_ID;
          const secretAccessKey=process.env.DNA_R2_SECRET_ACCESS_KEY;
          const ownerId=process.env.AUTHORIZED_CLERK_USER_ID;
          const bucket=process.env.DNA_R2_BUCKET_NAME;
          for(const [name,value] of Object.entries({accountId,accessKeyId,secretAccessKey,ownerId,bucket})) if(!value) throw new Error(name+" missing");
          const ownerPrefix=crypto.createHash("sha256").update("dna-open-lab-owner\0"+ownerId,"utf8").digest("hex");
          const prefix="dna-open-lab/v1/"+ownerPrefix+"/first-private-preview-backfill/";
          const FINISHED_REQUEST_COUNT=17369;
          const s3=new S3Client({region:"auto",endpoint:"https://"+accountId+".r2.cloudflarestorage.com",credentials:{accessKeyId,secretAccessKey}});

          async function bodyText(body){
            if(!body)throw new Error("missing R2 body");
            if(typeof body.transformToString==="function")return body.transformToString();
            const chunks=[];for await(const chunk of body)chunks.push(Buffer.from(chunk));
            return Buffer.concat(chunks).toString("utf8");
          }
          async function getJson(key){
            const out=await s3.send(new GetObjectCommand({Bucket:bucket,Key:key}));
            return JSON.parse(await bodyText(out.Body));
          }
          function isQuest(row){
            const rid=String(row?.rid??"");
            const format=String(row?.format??"").toLowerCase();
            return rid.startsWith("quest_")||format==="quest"||format==="sub_quest";
          }
          async function mapLimit(items,limit,fn){
            let next=0;
            async function worker(){while(true){const i=next++;if(i>=items.length)return;await fn(items[i],i)}}
            await Promise.all(Array.from({length:Math.min(limit,items.length)},()=>worker()));
          }

          const requestKeys=[];
          let token;
          do{
            const page=await s3.send(new ListObjectsV2Command({Bucket:bucket,Prefix:prefix,ContinuationToken:token,MaxKeys:1000}));
            for(const obj of page.Contents??[]){
              const key=obj.Key??"";
              const m=key.match(/\/requests\/(\d{6})\.json$/u);
              if(!m)continue;
              const ordinal=Number(m[1]);
              if(Number.isSafeInteger(ordinal)&&ordinal>=1&&ordinal<=FINISHED_REQUEST_COUNT)requestKeys.push({key,ordinal});
            }
            token=page.IsTruncated?page.NextContinuationToken:undefined;
          }while(token);
          requestKeys.sort((a,b)=>a.ordinal-b.ordinal);
          console.log(JSON.stringify({phase:"listed",finishedRequestKeys:requestKeys.length,prefix}));

          const questByRid=new Map();
          let finishedRequestReadCount=0;
          let sourceRowCount=0;
          let minimumObservedAt=null;
          let maximumObservedAt=null;
          let minimumRaceTime=null;
          let maximumRaceTime=null;
          let nonFinishedFamilyCount=0;
          let malformedCount=0;

          await mapLimit(requestKeys,32,async({key,ordinal})=>{
            const doc=await getJson(key);
            if(doc?.family!=="finished_races"||doc?.endpoint!=="races.finished"){
              nonFinishedFamilyCount++;
              return;
            }
            finishedRequestReadCount++;
            const observedAt=doc?.observedAt;
            if(typeof observedAt==="string"){
              minimumObservedAt=minimumObservedAt===null||observedAt<minimumObservedAt?observedAt:minimumObservedAt;
              maximumObservedAt=maximumObservedAt===null||observedAt>maximumObservedAt?observedAt:maximumObservedAt;
            }
            const rows=doc?.response?.result;
            if(!Array.isArray(rows)){malformedCount++;return}
            sourceRowCount+=rows.length;
            for(const row of rows){
              const t=typeof row?.end_time==="string"?row.end_time:(typeof row?.start_time==="string"?row.start_time:null);
              if(t){
                minimumRaceTime=minimumRaceTime===null||t<minimumRaceTime?t:minimumRaceTime;
                maximumRaceTime=maximumRaceTime===null||t>maximumRaceTime?t:maximumRaceTime;
              }
              if(isQuest(row)&&row?.rid!==undefined)questByRid.set(String(row.rid),row);
            }
            if(finishedRequestReadCount%1000===0)console.log(JSON.stringify({
              phase:"scan",finishedRequestReadCount,sourceRowCount,questCount:questByRid.size
            }));
          });

          const questRows=[...questByRid.values()].sort((a,b)=>String(a?.end_time??a?.start_time??"").localeCompare(String(b?.end_time??b?.start_time??"")));
          const output={
            fetchedAt:new Date().toISOString(),
            readOnly:true,
            authority:{
              source:"immutable_P5_first_private_preview_backfill",
              family:"finished_races",
              endpoint:"races.finished",
              expectedFinishedRequestCount:FINISHED_REQUEST_COUNT,
              originalHistoryStart:"1970-01-01T00:00:00.000Z",
              baselineCurrentThrough:"2026-09-02T00:11:55.961Z",
            },
            listedRequestCount:requestKeys.length,
            finishedRequestReadCount,
            nonFinishedFamilyCount,
            malformedCount,
            sourceRowCount,
            minimumObservedAt,
            maximumObservedAt,
            minimumRaceTime,
            maximumRaceTime,
            questSparseCount:questRows.length,
            questRows,
          };
          fs.writeFileSync("quest-p5-baseline-sparse.json",JSON.stringify(output,null,2));
          console.log(JSON.stringify({
            completed:true,
            listedRequestCount:output.listedRequestCount,
            finishedRequestReadCount,
            nonFinishedFamilyCount,
            malformedCount,
            sourceRowCount,
            minimumObservedAt,
            maximumObservedAt,
            minimumRaceTime,
            maximumRaceTime,
            questSparseCount:questRows.length,
          }));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: quest-p5-baseline-sparse
          path: quest-p5-baseline-sparse.json
          retention-days: 1
