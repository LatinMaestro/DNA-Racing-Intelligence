name: temporary Quest read-only discovery

on:
  push:
    branches:
      - temporary/chat-quest-readonly-discovery-2026-09-21-do-not-merge
    paths:
      - .github/workflows/temporary-quest-readonly-discovery.yml

permissions:
  contents: read
  actions: read

jobs:
  roots:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DNA_OPEN_LAB_API_KEY_3: ${{ secrets.DNA_OPEN_LAB_API_KEY_3 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: quest-hydrated-docs
          path: hydrated
          run-id: 35587388043
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Hydrate Quest root documents read-only
        shell: bash
        run: |
          node <<'NODE'
          const fs=require("fs");
          const key=process.env.DNA_OPEN_LAB_API_KEY_3;
          if(!/^dna_[A-Za-z0-9_-]{43}$/.test(key??"")) throw new Error("DNA API key missing/invalid");
          const docs=JSON.parse(fs.readFileSync("hydrated/quest-hydrated-docs.json","utf8")).docs;
          const roots=new Set();
          for(const d of docs){
            if(d?.format==="quest") roots.add(String(d.rid));
            if(d?.format==="sub_quest" && d?.baserid) roots.add(String(d.baserid));
          }
          const rids=[...roots];
          const base="https://api.dnaracing.run/fbike/pub/v1";
          let last=0,count=0; const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function api(batch){
            const wait=Math.max(0,2200-(Date.now()-last));if(wait)await sleep(wait);last=Date.now();count++;
            const response=await fetch(base+"/races/docs",{method:"POST",headers:{authorization:"Bearer "+key,accept:"application/json","content-type":"application/json"},body:JSON.stringify({rids:batch})});
            const text=await response.text();let j=null;try{j=JSON.parse(text)}catch{}
            if(!response.ok||j?.status!=="success"||!Array.isArray(j?.result)) throw new Error("root docs failed "+response.status+" "+text.slice(0,400));
            return j.result;
          }
          (async()=>{
            const out=[];
            for(let i=0;i<rids.length;i+=20) out.push(...await api(rids.slice(i,i+20)));
            const by=new Map(out.map(d=>[String(d?.rid),d]));
            const report={fetchedAt:new Date().toISOString(),requestCount:count,requested:rids.length,found:out.length,missing:rids.filter(r=>!by.has(r)),roots:out};
            fs.writeFileSync("quest-root-docs.json",JSON.stringify(report,null,2));
            console.log(JSON.stringify({requestCount:count,requested:rids.length,found:out.length,missing:report.missing.length}));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: quest-root-docs
          path: quest-root-docs.json
          retention-days: 1
