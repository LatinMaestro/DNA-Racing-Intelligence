name: temporary Quest external racing-stats enrichment

on:
  push:
    branches:
      - temporary/chat-quest-readonly-discovery-2026-09-21-do-not-merge
    paths:
      - .github/workflows/temporary-quest-readonly-discovery.yml

permissions:
  contents: read
  actions: read

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DNA_OPEN_LAB_API_KEY_3: ${{ secrets.DNA_OPEN_LAB_API_KEY_3 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: quest-history-extension
          path: prior
          run-id: 35589865808
          github-token: ${{ github.token }}
      - name: Fetch Quest Core racing stats read-only
        shell: bash
        run: |
          node <<'NODE'
          const fs=require("fs");
          const key=process.env.DNA_OPEN_LAB_API_KEY_3;
          const src=JSON.parse(fs.readFileSync("prior/quest-history-extension.json","utf8"));
          const hids=[...new Set((src.roots??[]).map(x=>Number(x?.r_form?.u_hid)).filter(Number.isSafeInteger))];
          const base="https://api.dnaracing.run/fbike/pub/v1";
          let last=0,requests=0; const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function api(path,body){
            for(let attempt=1;attempt<=5;attempt++){
              const wait=Math.max(0,2200-(Date.now()-last));if(wait)await sleep(wait);last=Date.now();requests++;
              const res=await fetch(base+path,{method:"POST",headers:{authorization:"Bearer "+key,accept:"application/json","content-type":"application/json"},body:JSON.stringify(body)});
              const text=await res.text();let j;try{j=JSON.parse(text)}catch{j=null}
              if(res.status===429){await sleep(Math.max(3,Number(res.headers.get("retry-after")||3))*1000);continue}
              if(!res.ok||j?.status!=="success"||!("result" in j))throw new Error(path+" "+res.status+" "+text.slice(0,300));
              return j.result;
            }
          }
          (async()=>{
            const stats=[];
            for(let i=0;i<hids.length;i+=20) stats.push(...await api("/cores/racing_stats_bulk",{hids:hids.slice(i,i+20)}));
            fs.writeFileSync("quest-history-racing-stats.json",JSON.stringify({fetchedAt:new Date().toISOString(),readOnly:true,requestCount:requests,hidCount:hids.length,stats},null,2));
            console.log(JSON.stringify({requestCount:requests,hidCount:hids.length,statsCount:stats.length}));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: quest-history-racing-stats
          path: quest-history-racing-stats.json
          retention-days: 1
