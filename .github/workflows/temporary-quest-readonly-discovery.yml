name: temporary Quest complete archived-history read-only scan

on:
  push:
    branches:
      - temporary/chat-quest-readonly-discovery-2026-09-21-do-not-merge
    paths:
      - .github/workflows/temporary-quest-readonly-discovery.yml

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DNA_R2_ACCESS_KEY_ID: ${{ secrets.DNA_R2_ACCESS_KEY_ID }}
      DNA_R2_SECRET_ACCESS_KEY: ${{ secrets.DNA_R2_SECRET_ACCESS_KEY }}
      AUTHORIZED_CLERK_USER_ID: ${{ secrets.AUTHORIZED_CLERK_USER_ID }}
      DNA_OPEN_LAB_API_KEY_3: ${{ secrets.DNA_OPEN_LAB_API_KEY_3 }}
      DNA_R2_BUCKET_NAME: dna-racing-import-preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install repository dependencies
        run: npm ci --ignore-scripts
      - name: Scan immutable Open Lab historical archive read-only
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import crypto from "node:crypto";
          import {
            S3Client,
            ListObjectsV2Command,
            GetObjectCommand,
          } from "@aws-sdk/client-s3";

          const accountId=process.env.CLOUDFLARE_ACCOUNT_ID;
          const accessKeyId=process.env.DNA_R2_ACCESS_KEY_ID;
          const secretAccessKey=process.env.DNA_R2_SECRET_ACCESS_KEY;
          const ownerId=process.env.AUTHORIZED_CLERK_USER_ID;
          const bucket=process.env.DNA_R2_BUCKET_NAME;
          const apiKey=process.env.DNA_OPEN_LAB_API_KEY_3;
          for (const [name,value] of Object.entries({accountId,accessKeyId,secretAccessKey,ownerId,bucket})) {
            if (!value) throw new Error(name+" missing");
          }
          const ownerPrefix=crypto.createHash("sha256").update("dna-open-lab-owner\0"+ownerId,"utf8").digest("hex");
          const prefix="dna-open-lab/v1/"+ownerPrefix+"/races/finished-windows/";
          const s3=new S3Client({
            region:"auto",
            endpoint:"https://"+accountId+".r2.cloudflarestorage.com",
            credentials:{accessKeyId,secretAccessKey},
          });

          async function bodyText(body) {
            if (!body) throw new Error("R2 body missing");
            if (typeof body.transformToString === "function") return body.transformToString();
            const chunks=[];
            for await (const chunk of body) chunks.push(Buffer.from(chunk));
            return Buffer.concat(chunks).toString("utf8");
          }
          async function getJson(key) {
            const out=await s3.send(new GetObjectCommand({Bucket:bucket,Key:key}));
            return JSON.parse(await bodyText(out.Body));
          }
          function isQuest(row) {
            const rid=String(row?.rid??"");
            const format=String(row?.format??"").toLowerCase();
            return rid.startsWith("quest_") || format==="quest" || format==="sub_quest";
          }
          async function mapLimit(items,limit,fn) {
            const out=new Array(items.length);
            let next=0;
            async function worker(){
              while(true){
                const i=next++;
                if(i>=items.length)return;
                out[i]=await fn(items[i],i);
              }
            }
            await Promise.all(Array.from({length:Math.min(limit,items.length)},()=>worker()));
            return out;
          }

          const manifestKeys=[];
          let token=undefined;
          do {
            const page=await s3.send(new ListObjectsV2Command({
              Bucket:bucket,Prefix:prefix,ContinuationToken:token,MaxKeys:1000
            }));
            for (const obj of page.Contents??[]) if (obj.Key?.endsWith(".json")) manifestKeys.push(obj.Key);
            token=page.IsTruncated ? page.NextContinuationToken : undefined;
          } while(token);

          console.log(JSON.stringify({phase:"listed",manifestCount:manifestKeys.length,prefix}));

          const questSparseByRid=new Map();
          const questObjectKeyByRid=new Map();
          let manifestReadCount=0;
          let discoveredRaceCount=0;
          await mapLimit(manifestKeys,24,async(key)=>{
            const manifest=await getJson(key);
            const discovered=Array.isArray(manifest?.discoveredRaces)?manifest.discoveredRaces:[];
            const refs=Array.isArray(manifest?.raceDocumentObjects)?manifest.raceDocumentObjects:[];
            const refByRid=new Map(refs.map(x=>[String(x?.sourceRaceId??""),x?.objectKey]));
            discoveredRaceCount+=discovered.length;
            for(const row of discovered){
              if(!isQuest(row))continue;
              const rid=String(row.rid);
              questSparseByRid.set(rid,row);
              const objectKey=refByRid.get(rid);
              if(objectKey)questObjectKeyByRid.set(rid,objectKey);
            }
            manifestReadCount++;
            if(manifestReadCount%1000===0)console.log(JSON.stringify({
              phase:"manifest_scan",manifestReadCount,questSparseCount:questSparseByRid.size,discoveredRaceCount
            }));
          });

          const questRids=[...questSparseByRid.keys()];
          const missingObjectRefs=questRids.filter(rid=>!questObjectKeyByRid.has(rid));
          const questDocsByRid=new Map();
          await mapLimit([...questObjectKeyByRid.entries()],24,async([rid,key],i)=>{
            const doc=await getJson(key);
            questDocsByRid.set(rid,doc);
            if((i+1)%100===0)console.log(JSON.stringify({phase:"quest_docs",read:i+1,total:questObjectKeyByRid.size}));
          });

          const roots=[...questDocsByRid.values()].filter(x=>String(x?.format??"").toLowerCase()==="quest");
          const subdocs=[...questDocsByRid.values()].filter(x=>String(x?.format??"").toLowerCase()==="sub_quest");
          const userHids=[...new Set(roots.map(x=>Number(x?.r_form?.u_hid)).filter(Number.isSafeInteger))];

          let lastStartedAt=0,apiRequestCount=0,rateLimitedCount=0;
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function api(path,body){
            if(!/^dna_[A-Za-z0-9_-]{43}$/.test(apiKey??"")) throw new Error("DNA API key missing/invalid");
            for(let attempt=1;attempt<=5;attempt++){
              const wait=Math.max(0,2200-(Date.now()-lastStartedAt));if(wait)await sleep(wait);
              lastStartedAt=Date.now();apiRequestCount++;
              const res=await fetch("https://api.dnaracing.run/fbike/pub/v1"+path,{
                method:"POST",
                headers:{authorization:"Bearer "+apiKey,accept:"application/json","content-type":"application/json"},
                body:JSON.stringify(body),
              });
              const text=await res.text();let j;try{j=JSON.parse(text)}catch{j=null}
              if(res.status===429){rateLimitedCount++;await sleep(Math.max(3,Number(res.headers.get("retry-after")||3))*1000);continue}
              if(!res.ok||j?.status!=="success"||!("result" in j))throw new Error(path+" "+res.status+" "+text.slice(0,300));
              return j.result;
            }
          }
          async function bulk(path,hids){
            const out=[];
            for(let i=0;i<hids.length;i+=20)out.push(...await api(path,{hids:hids.slice(i,i+20)}));
            return out;
          }

          const info=userHids.length?await bulk("/cores/info_bulk",userHids):[];
          const power=userHids.length?await bulk("/cores/power_bulk",userHids):[];
          const stats=userHids.length?await bulk("/cores/racing_stats_bulk",userHids):[];

          const output={
            fetchedAt:new Date().toISOString(),
            readOnly:true,
            archiveAuthority:{
              source:"immutable_private_r2_api_evidence",
              endpoint:"races.finished + races.docs",
              historicalCutoff:"2026-09-02T00:11:55.961Z",
              originalHistoryStart:"1970-01-01T00:00:00.000Z",
              ownerPrefix,
            },
            manifestCount:manifestKeys.length,
            manifestReadCount,
            discoveredRaceCount,
            questSparseCount:questSparseByRid.size,
            questDocumentCount:questDocsByRid.size,
            rootCount:roots.length,
            subdocCount:subdocs.length,
            missingObjectRefs,
            userCoreCount:userHids.length,
            apiEnrichmentRequestCount:apiRequestCount,
            apiEnrichmentRateLimitedCount:rateLimitedCount,
            questSparse:[...questSparseByRid.values()],
            roots,
            subdocs,
            info,
            power,
            stats,
          };
          fs.writeFileSync("quest-complete-archive.json",JSON.stringify(output,null,2));
          console.log(JSON.stringify({
            completed:true,
            manifestCount:manifestKeys.length,
            manifestReadCount,
            discoveredRaceCount,
            questSparseCount:output.questSparseCount,
            questDocumentCount:output.questDocumentCount,
            rootCount:output.rootCount,
            subdocCount:output.subdocCount,
            userCoreCount:output.userCoreCount,
            apiEnrichmentRequestCount,
            apiEnrichmentRateLimitedCount:rateLimitedCount,
            missingObjectRefs:missingObjectRefs.length,
          }));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: quest-complete-archive
          path: quest-complete-archive.json
          retention-days: 1
