name: temporary Quest read-only discovery

on:
  push:
    branches:
      - temporary/chat-quest-readonly-discovery-2026-09-21-do-not-merge
    paths:
      - .github/workflows/temporary-quest-readonly-discovery.yml

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DNA_OPEN_LAB_API_KEY_3: ${{ secrets.DNA_OPEN_LAB_API_KEY_3 }}
      DNA_OPEN_LAB_VAULT: ${{ secrets.DNA_OPEN_LAB_VAULT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Discover Quest race metadata read-only
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");
          const key = process.env.DNA_OPEN_LAB_API_KEY_3;
          const vault = process.env.DNA_OPEN_LAB_VAULT;
          if (!/^dna_[A-Za-z0-9_-]{43}$/.test(key ?? "")) throw new Error("DNA API key missing/invalid");
          if (!vault || vault.length > 512) throw new Error("DNA vault missing/invalid");

          const base = "https://api.dnaracing.run/fbike/pub/v1";
          let lastStartedAt = 0;
          let requestCount = 0;
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function api(path, method="GET", body) {
            for (let attempt=1; attempt<=6; attempt++) {
              const wait = Math.max(0, 2200 - (Date.now() - lastStartedAt));
              if (wait) await sleep(wait);
              lastStartedAt = Date.now();
              requestCount++;
              const controller = new AbortController();
              const timer = setTimeout(() => controller.abort(), 60000);
              try {
                const response = await fetch(base + path, {
                  method,
                  signal: controller.signal,
                  headers: {
                    authorization: "Bearer " + key,
                    accept: "application/json",
                    ...(body === undefined ? {} : {"content-type":"application/json"}),
                  },
                  ...(body === undefined ? {} : {body: JSON.stringify(body)}),
                });
                const text = await response.text();
                let json;
                try { json = JSON.parse(text); } catch { json = null; }
                if (response.status === 429) {
                  const retry = Math.max(3, Number(response.headers.get("retry-after") || 3));
                  await sleep(retry * 1000);
                  continue;
                }
                if (!response.ok || json?.status !== "success" || !("result" in json)) {
                  throw new Error(path + " " + response.status + " " + text.slice(0,500));
                }
                return json.result;
              } catch (e) {
                if (attempt === 6) throw e;
                await sleep(3000);
              } finally { clearTimeout(timer); }
            }
          }

          const keywordRegex = /(quest|progressive)/i;
          const secondaryRegex = /(bot|round\s*[1-5]|cash\s*out|risk\s*it)/i;
          const docsByRid = new Map();
          const windows = [];
          let splitCount = 0;

          function rid(doc) {
            const v = doc?.rid;
            return (typeof v === "string" || typeof v === "number") ? String(v) : null;
          }

          async function crawl(st, ed, depth=0) {
            const rows = await api("/races/finished", "POST", {st: st.toISOString(), ed: ed.toISOString(), limit: 200});
            if (!Array.isArray(rows)) throw new Error("finished races result malformed");
            windows.push({st:st.toISOString(), ed:ed.toISOString(), count:rows.length, depth});
            if (rows.length === 200) {
              const span = ed.getTime() - st.getTime();
              if (span > 5*60*1000) {
                splitCount++;
                const mid = new Date(st.getTime() + Math.floor(span/2));
                await crawl(st, mid, depth+1);
                await crawl(new Date(mid.getTime()+1), ed, depth+1);
                return;
              }
            }
            for (const row of rows) {
              const id = rid(row);
              if (id) docsByRid.set(id, row);
            }
          }

          (async () => {
            const now = new Date();
            const start = new Date(now.getTime() - 7*24*60*60*1000);
            for (let t=start.getTime(); t<now.getTime(); t += 6*60*60*1000) {
              const st = new Date(t);
              const ed = new Date(Math.min(now.getTime(), t + 6*60*60*1000 - 1));
              await crawl(st, ed);
            }

            const ownedFull = await api("/vault/" + encodeURIComponent(vault) + "/cores_full");
            if (!Array.isArray(ownedFull)) throw new Error("vault cores_full malformed");
            const ownedSet = new Set(ownedFull.map(x => Number(x?.hid)).filter(Number.isSafeInteger));

            const allDocs = [...docsByRid.values()];
            const keywordCandidates = allDocs.filter(d => keywordRegex.test(JSON.stringify(d)));
            const secondaryCandidates = allDocs.filter(d => !keywordRegex.test(JSON.stringify(d)) && secondaryRegex.test(JSON.stringify(d)));
            const keyFrequency = {};
            const valueSamples = {};
            for (const d of keywordCandidates) {
              for (const [k,v] of Object.entries(d)) {
                keyFrequency[k] = (keyFrequency[k] || 0) + 1;
                if (valueSamples[k] === undefined) valueSamples[k] = [];
                const s = typeof v === "string" ? v : JSON.stringify(v);
                if (s !== undefined && valueSamples[k].length < 12 && !valueSamples[k].includes(s)) valueSamples[k].push(s);
              }
            }

            const candidateRows = keywordCandidates.map(d => ({
              ...d,
              ownedParticipants: Array.isArray(d.hids) ? d.hids.filter(h => ownedSet.has(Number(h))) : [],
            }));

            const report = {
              fetchedAt: new Date().toISOString(),
              scope: {days:7, source:"races/finished", readOnly:true},
              requestCount,
              uniqueFinishedRaces: allDocs.length,
              bikeFinishedRaces: allDocs.filter(d=>d?.rvmode==="bike").length,
              splitCount,
              windows,
              keywordCandidateCount: keywordCandidates.length,
              secondaryCandidateCount: secondaryCandidates.length,
              keywordKeyFrequency: keyFrequency,
              keywordValueSamples: valueSamples,
              candidates: candidateRows,
              secondarySamples: secondaryCandidates.slice(0,50),
              ownedCoreCount: ownedSet.size,
              ownedQuestParticipantHids: [...new Set(candidateRows.flatMap(x=>x.ownedParticipants))].sort((a,b)=>a-b),
            };
            fs.writeFileSync("quest-discovery.json", JSON.stringify(report,null,2));
            console.log(JSON.stringify({
              fetchedAt: report.fetchedAt,
              requestCount,
              uniqueFinishedRaces: report.uniqueFinishedRaces,
              bikeFinishedRaces: report.bikeFinishedRaces,
              keywordCandidateCount: report.keywordCandidateCount,
              secondaryCandidateCount: report.secondaryCandidateCount,
              ownedCoreCount: report.ownedCoreCount,
              ownedQuestParticipantCount: report.ownedQuestParticipantHids.length,
              splitCount,
            }));
          })().catch((e)=>{ console.error(e); process.exit(1); });
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: quest-readonly-discovery
          path: quest-discovery.json
          retention-days: 1
