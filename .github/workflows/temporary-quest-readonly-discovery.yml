name: temporary Quest Vault read-only scan

on:
  push:
    branches:
      - temporary/chat-quest-readonly-discovery-2026-09-21-do-not-merge
    paths:
      - .github/workflows/temporary-quest-readonly-discovery.yml

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DNA_OPEN_LAB_API_KEY_3: ${{ secrets.DNA_OPEN_LAB_API_KEY_3 }}
      DNA_OPEN_LAB_VAULT: ${{ secrets.DNA_OPEN_LAB_VAULT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Scan current Vault Quest predictors read-only
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");
          const key = process.env.DNA_OPEN_LAB_API_KEY_3;
          const vault = process.env.DNA_OPEN_LAB_VAULT;
          if (!/^dna_[A-Za-z0-9_-]{43}$/.test(key ?? "")) throw new Error("DNA API key missing/invalid");
          if (!vault) throw new Error("DNA vault missing");
          const base = "https://api.dnaracing.run/fbike/pub/v1";
          let last=0, requests=0;
          const sleep = ms => new Promise(r=>setTimeout(r,ms));
          async function api(path, method="GET", body) {
            for (let attempt=1; attempt<=5; attempt++) {
              const wait=Math.max(0,2200-(Date.now()-last)); if(wait) await sleep(wait);
              last=Date.now(); requests++;
              const res=await fetch(base+path,{
                method,
                headers:{authorization:"Bearer "+key,accept:"application/json",...(body===undefined?{}:{"content-type":"application/json"})},
                ...(body===undefined?{}:{body:JSON.stringify(body)})
              });
              const text=await res.text(); let json; try{json=JSON.parse(text)}catch{json=null}
              if(res.status===429){await sleep(Math.max(3,Number(res.headers.get("retry-after")||3))*1000);continue}
              if(!res.ok||json?.status!=="success"||!("result" in json)) throw new Error(path+" "+res.status+" "+text.slice(0,300));
              return json.result;
            }
          }
          (async()=>{
            const cores=await api("/vault/"+encodeURIComponent(vault)+"/cores_full");
            if(!Array.isArray(cores)) throw new Error("cores malformed");
            const hids=cores.map(x=>Number(x.hid)).filter(Number.isSafeInteger);
            const powers=[], stats=[];
            for(let i=0;i<hids.length;i+=20){
              const batch=hids.slice(i,i+20);
              powers.push(...await api("/cores/power_bulk","POST",{hids:batch}));
              stats.push(...await api("/cores/racing_stats_bulk","POST",{hids:batch}));
            }
            fs.writeFileSync("quest-vault-current.json",JSON.stringify({
              fetchedAt:new Date().toISOString(),readOnly:true,requestCount:requests,vaultCoreCount:hids.length,cores,powers,stats
            },null,2));
            console.log(JSON.stringify({fetchedAt:new Date().toISOString(),requestCount:requests,vaultCoreCount:hids.length,powerCount:powers.length,statsCount:stats.length}));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: quest-vault-current
          path: quest-vault-current.json
          retention-days: 1
