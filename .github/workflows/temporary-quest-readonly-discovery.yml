name: temporary Quest historical subrace hydration

on:
  push:
    branches:
      - temporary/chat-quest-readonly-discovery-2026-09-21-do-not-merge
    paths:
      - .github/workflows/temporary-quest-readonly-discovery.yml

permissions:
  contents: read
  actions: read

jobs:
  hydrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DNA_OPEN_LAB_API_KEY_3: ${{ secrets.DNA_OPEN_LAB_API_KEY_3 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: quest-history-extension
          path: prior
          run-id: 35589865808
          github-token: ${{ github.token }}
      - name: Hydrate historical Quest sub-races read-only
        shell: bash
        run: |
          node <<'NODE'
          const fs=require("fs");
          const key=process.env.DNA_OPEN_LAB_API_KEY_3;
          const src=JSON.parse(fs.readFileSync("prior/quest-history-extension.json","utf8"));
          const rids=[];
          for(const root of src.roots??[]){
            for(const group of Object.values(root?.format_inf?.rounds??{})){
              for(const sub of Object.values(group??{})) if(sub?.rid) rids.push(String(sub.rid));
            }
          }
          const unique=[...new Set(rids)];
          const base="https://api.dnaracing.run/fbike/pub/v1";
          let last=0,requests=0; const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function api(path,body){
            for(let attempt=1;attempt<=5;attempt++){
              const wait=Math.max(0,2200-(Date.now()-last));if(wait)await sleep(wait);last=Date.now();requests++;
              const res=await fetch(base+path,{method:"POST",headers:{authorization:"Bearer "+key,accept:"application/json","content-type":"application/json"},body:JSON.stringify(body)});
              const text=await res.text();let j;try{j=JSON.parse(text)}catch{j=null}
              if(res.status===429){await sleep(Math.max(3,Number(res.headers.get("retry-after")||3))*1000);continue}
              if(!res.ok||j?.status!=="success"||!("result" in j))throw new Error(path+" "+res.status+" "+text.slice(0,300));
              return j.result;
            }
          }
          (async()=>{
            const docs=[];
            for(let i=0;i<unique.length;i+=20) docs.push(...await api("/races/docs",{rids:unique.slice(i,i+20)}));
            fs.writeFileSync("quest-history-subdocs.json",JSON.stringify({fetchedAt:new Date().toISOString(),readOnly:true,sourceRun:35589865808,requestCount:requests,requested:unique.length,found:docs.length,docs},null,2));
            console.log(JSON.stringify({requestCount:requests,requested:unique.length,found:docs.length}));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: quest-history-subdocs
          path: quest-history-subdocs.json
          retention-days: 1
