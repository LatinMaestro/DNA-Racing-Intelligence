name: temporary Quest read-only discovery

on:
  push:
    branches:
      - temporary/chat-quest-readonly-discovery-2026-09-21-do-not-merge
    paths:
      - .github/workflows/temporary-quest-readonly-discovery.yml

permissions:
  contents: read
  actions: read

jobs:
  hydrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DNA_OPEN_LAB_API_KEY_3: ${{ secrets.DNA_OPEN_LAB_API_KEY_3 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: quest-readonly-discovery
          path: discovery
          run-id: 35586631937
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Hydrate discovered Quest race documents read-only
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");
          const key = process.env.DNA_OPEN_LAB_API_KEY_3;
          if (!/^dna_[A-Za-z0-9_-]{43}$/.test(key ?? "")) throw new Error("DNA API key missing/invalid");
          const discovery = JSON.parse(fs.readFileSync("discovery/quest-discovery.json","utf8"));
          const rids = discovery.candidates.map(x => x.rid);
          const base = "https://api.dnaracing.run/fbike/pub/v1";
          let lastStartedAt = 0, requestCount = 0;
          const sleep = ms => new Promise(r=>setTimeout(r,ms));
          async function api(path, body) {
            for (let attempt=1; attempt<=6; attempt++) {
              const wait=Math.max(0,2200-(Date.now()-lastStartedAt)); if(wait) await sleep(wait);
              lastStartedAt=Date.now(); requestCount++;
              const controller=new AbortController(); const timer=setTimeout(()=>controller.abort(),60000);
              try{
                const response=await fetch(base+path,{method:"POST",signal:controller.signal,headers:{authorization:"Bearer "+key,accept:"application/json","content-type":"application/json"},body:JSON.stringify(body)});
                const text=await response.text(); let json=null; try{json=JSON.parse(text)}catch{}
                if(response.status===429){await sleep(Math.max(3,Number(response.headers.get("retry-after")||3))*1000);continue;}
                if(!response.ok||json?.status!=="success"||!("result" in json)) throw new Error(path+" "+response.status+" "+text.slice(0,500));
                return json.result;
              }catch(e){if(attempt===6)throw e;await sleep(3000)}finally{clearTimeout(timer)}
            }
          }
          (async()=>{
            const docs=[];
            for(let i=0;i<rids.length;i+=20){
              const rows=await api("/races/docs",{rids:rids.slice(i,i+20)});
              if(!Array.isArray(rows)) throw new Error("race docs result malformed");
              docs.push(...rows);
            }
            const byRid=new Map(docs.map(d=>[String(d?.rid),d]));
            const missing=rids.filter(r=>!byRid.has(String(r)));
            const keys={};
            for(const d of docs) for(const k of Object.keys(d)) keys[k]=(keys[k]||0)+1;
            const report={
              fetchedAt:new Date().toISOString(),
              sourceRun:35586631937,
              requestCount,
              requestedRidCount:rids.length,
              hydratedCount:docs.length,
              missing,
              keys,
              docs
            };
            fs.writeFileSync("quest-hydrated-docs.json",JSON.stringify(report,null,2));
            console.log(JSON.stringify({requestCount,requestedRidCount:rids.length,hydratedCount:docs.length,missingCount:missing.length,keys}));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: quest-hydrated-docs
          path: quest-hydrated-docs.json
          retention-days: 1
