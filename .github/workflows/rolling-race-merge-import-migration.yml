name: Rolling Race Merge import migration

on:
  pull_request:
    paths:
      - "database/migrations/0023_expand_rolling_race_merge_batch.*.sql"
      - ".github/workflows/rolling-race-merge-import-migration.yml"

permissions:
  contents: read

jobs:
  rolling-race-merge-import-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dna_racing_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dna_racing_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: dna_racing_ci
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply prerequisite migrations
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r migration; do
            [[ "$migration" == *"/0023_"* ]] && break
            psql --set ON_ERROR_STOP=1 --file "$migration"
          done < <(find database/migrations -maxdepth 1 -name '*.up.sql' | sort)
      - name: Apply rolling Race Merge import migration
        run: psql --set ON_ERROR_STOP=1 --file database/migrations/0023_expand_rolling_race_merge_batch.up.sql
      - name: Run rolling Race Merge import smoke test
        run: psql --set ON_ERROR_STOP=1 --file database/migrations/0023_expand_rolling_race_merge_batch.smoke.sql
      - name: Reverse rolling Race Merge import migration
        run: psql --set ON_ERROR_STOP=1 --file database/migrations/0023_expand_rolling_race_merge_batch.down.sql
      - name: Verify eight-file limit restoration
        run: >-
          psql --set ON_ERROR_STOP=1 --command
          "DO \$\$ BEGIN IF pg_get_functiondef(
          'dna.enforce_import_upload_batch_file_limit()'::regprocedure
          ) NOT LIKE '%v_existing_count >= 8%'
          THEN RAISE EXCEPTION 'eight-file limit was not restored';
          END IF; END \$\$;"
