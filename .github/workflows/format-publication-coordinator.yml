name: Temporary publication coordinator formatter

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write lib/race-archive-aggregate-publication-service.ts tests/race-archive-aggregate-publication-service.test.ts
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet -- lib/race-archive-aggregate-publication-service.ts tests/race-archive-aggregate-publication-service.test.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/race-archive-aggregate-publication-service.ts tests/race-archive-aggregate-publication-service.test.ts
          git commit -m "Format Race archive aggregate publication coordinator"
          git push origin HEAD:${{ github.head_ref }}
