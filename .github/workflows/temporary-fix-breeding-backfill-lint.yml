name: Temporary fix breeding backfill lint

on:
  push:
    branches:
      - codex/breeding-offspring-history-backfill
    paths:
      - .github/workflows/temporary-fix-breeding-backfill-lint.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/breeding-offspring-history-backfill
      - name: Fix connected backfill lint issues
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path('tests/hosted-breeding-universe-inventory.test.ts'),
              Path('tests/hosted-breeding-race-history-shard.test.ts'),
              Path('tests/hosted-breeding-offspring-analysis.test.ts'),
          ]
          for path in paths:
              text = path.read_text()
              text = text.replace('type AnyRecord = Record<string, any>;', 'type AnyRecord = Record<string, unknown>;')
              path.write_text(text)

          analysis = Path('tests/hosted-breeding-offspring-analysis.test.ts')
          text = analysis.read_text()
          start = text.find('      const fullSummaryByKey = new Map(')
          if start != -1:
              end_marker = '      );\n\n      const indexedHistory'
              end = text.find(end_marker, start)
              if end == -1:
                  raise SystemExit('Could not locate fullSummaryByKey end marker')
              text = text[:start] + '      const indexedHistory' + text[end + len(end_marker):]
              analysis.write_text(text)
          PY
      - name: Commit lint fixes and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temporary-fix-breeding-backfill-lint.yml
          git add tests/hosted-breeding-universe-inventory.test.ts tests/hosted-breeding-race-history-shard.test.ts tests/hosted-breeding-offspring-analysis.test.ts
          git commit -m "[format-only] Fix breeding backfill lint types"
          git push origin HEAD:codex/breeding-offspring-history-backfill
