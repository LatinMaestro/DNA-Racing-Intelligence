name: TEMPORARY kick read-only population history audit

on:
  push:
    branches:
      - temporary/kick-population-preview-2026-09-25-do-not-merge

permissions:
  actions: write
  contents: read

jobs:
  dispatch-current-main-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch read-only audit only on exact unchanged main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: 704eb411d2f1cd790898b50c6c59492369a93d7c
        run: |
          current_main="$(gh api "/repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
          if [[ "${current_main}" != "${EXPECTED_MAIN_SHA}" ]]; then
            echo "Main changed; refusing temporary audit dispatch."
            exit 1
          fi

          active_count="$(gh api             "/repos/${GITHUB_REPOSITORY}/actions/workflows/dna-population-history-read-only-audit.yml/runs?per_page=20"             --jq '[.workflow_runs[] | select(.status != "completed")] | length')"
          if [[ ! "${active_count}" =~ ^[0-9]+$ ]]; then
            echo "Competing-audit proof was invalid."
            exit 1
          fi
          if (( active_count > 0 )); then
            echo "A population-history audit is already active; no duplicate dispatch."
            exit 0
          fi

          jq -n --arg sha "${EXPECTED_MAIN_SHA}" '{
            ref: "main",
            inputs: {
              expected_main_sha: $sha,
              execute_read_only_audit: "true"
            }
          }' | gh api --method POST             "/repos/${GITHUB_REPOSITORY}/actions/workflows/dna-population-history-read-only-audit.yml/dispatches"             --input -
          echo "Dispatched exact-main read-only population history audit."
