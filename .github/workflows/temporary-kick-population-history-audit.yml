name: TEMPORARY kick optimized population history audit

on:
  push:
    branches:
      - temporary/kick-population-preview-2026-09-25-do-not-merge
    paths:
      - ".github/workflows/temporary-kick-population-history-audit.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch-current-main-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch optimized audit only on exact unchanged main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: 0c829b546635d6b73a0094acf845045543516120
        run: |
          current_main="$(gh api "/repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
          if [[ "${current_main}" != "${EXPECTED_MAIN_SHA}" ]]; then
            echo "Main changed; refusing audit dispatch."
            exit 1
          fi
          active_count="$(gh api             "/repos/${GITHUB_REPOSITORY}/actions/workflows/dna-population-history-read-only-audit.yml/runs?per_page=20"             --jq "[.workflow_runs[] | select(.head_sha == \"${EXPECTED_MAIN_SHA}\" and .status != \"completed\")] | length")"
          if [[ ! "${active_count}" =~ ^[0-9]+$ ]]; then
            echo "Competing-audit proof was invalid."
            exit 1
          fi
          if (( active_count > 0 )); then
            echo "An exact-head population-history audit is already active."
            exit 0
          fi
          jq -n --arg sha "${EXPECTED_MAIN_SHA}" '{
            ref: "main",
            inputs: {
              expected_main_sha: $sha,
              execute_read_only_audit: "true"
            }
          }' | gh api --method POST             "/repos/${GITHUB_REPOSITORY}/actions/workflows/dna-population-history-read-only-audit.yml/dispatches"             --input -
          echo "Dispatched optimized exact-main population history audit."
