name: Temporary cancel breeding enrichment

on:
  push:
    branches:
      - codex/breeding-offspring-history-backfill
    paths:
      - .github/workflows/temporary-cancel-breeding-enrichment.yml

permissions:
  actions: write
  contents: write

jobs:
  cancel:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_RUN_ID: "33320479281"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/breeding-offspring-history-backfill
      - name: Cancel queued unpaced enrichment
        shell: bash
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${TARGET_RUN_ID}/cancel" || true
      - name: Remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temporary-cancel-breeding-enrichment.yml
          git commit -m "[format-only] remove enrichment cancellation helper"
          git push origin HEAD:codex/breeding-offspring-history-backfill
