name: Breeding complete Core enrichment

on:
  push:
    branches:
      - codex/breeding-offspring-history-backfill
    paths:
      - .github/workflows/breeding-complete-core-enrichment.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: breeding-api-high-rate-august-2026
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ github.token }}
      DNA_BREEDING_COMPLETE_ENRICHMENT: "1"
      DNA_OPEN_LAB_API_KEY_1: ${{ secrets.DNA_OPEN_LAB_API_KEY_1 }}
      BREEDING_CENSUS_PATH: artifacts/source/breeding-lineage-census-upgraded.json
      BREEDING_COPARENT_PATH: artifacts/source/breeding-missing-coparent-inventory.json
      UPGRADED_CENSUS_ARTIFACT_ID: "9733841620"
      COPARENT_RUN_ID: "33320144999"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Download upgraded lineage census and co-parent inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/source
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${UPGRADED_CENSUS_ARTIFACT_ID}/zip" > /tmp/census.zip
          unzip -q /tmp/census.zip -d artifacts/source
          for attempt in $(seq 1 240); do
            artifact_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${COPARENT_RUN_ID}/artifacts" \
              --jq '.artifacts[] | select(.name == "breeding-missing-coparent-inventory") | .id' | head -n 1)
            if [ -n "$artifact_id" ]; then break; fi
            sleep 5
          done
          test -n "$artifact_id"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > /tmp/coparents.zip
          unzip -q /tmp/coparents.zip -d artifacts/source
      - name: Capture complete read-only Core families and telemetry benchmarks
        env:
          NODE_OPTIONS: "--import=./scripts/retry-transient-fetch.mjs"
        run: npx vitest run --no-file-parallelism tests/hosted-breeding-complete-core-enrichment.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: breeding-complete-core-enrichment
          path: artifacts/enrichment/breeding-complete-core-enrichment.json
          if-no-files-found: error
          retention-days: 2
