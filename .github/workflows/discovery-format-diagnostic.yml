name: Discovery format diagnostic

on:
  push:
    branches:
      - agent/discovery-manual-vault-probes

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Print exact Prettier diff
        shell: bash
        run: |
          npx prettier --write 'app/(private)/discovery/page.tsx' components/discovery-workspace.tsx lib/discovery-workspace-service.ts
          git diff -- 'app/(private)/discovery/page.tsx' components/discovery-workspace.tsx lib/discovery-workspace-service.ts
          exit 1
