name: Live Bike Arena breeding scan

on:
  push:
    branches:
      - analysis/live-bike-arena-breeding-20260830

permissions:
  contents: read

concurrency:
  group: live-bike-arena-breeding
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DNA_LIVE_ARENA_BREEDING: "1"
      DNA_OPEN_LAB_API_KEY_1: ${{ secrets.DNA_OPEN_LAB_API_KEY_1 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run live Bike Arena elite breeding scan
        run: npx vitest run --no-file-parallelism tests/hosted-live-bike-arena-breeding.test.ts
      - name: Upload live Bike Arena breeding evidence
        uses: actions/upload-artifact@v4
        with:
          name: live-bike-arena-breeding
          path: artifacts/live-bike-arena-breeding.json
          if-no-files-found: error
          retention-days: 1
