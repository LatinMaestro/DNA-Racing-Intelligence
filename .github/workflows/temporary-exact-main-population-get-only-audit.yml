name: TEMPORARY exact-main population GET-only audit

on:
  push:
    branches:
      - temporary/chat-population-get-only-audit-2026-09-24-do-not-merge
    paths:
      - .github/workflows/temporary-exact-main-population-get-only-audit.yml

permissions:
  contents: read

concurrency:
  group: temporary-exact-main-population-get-only-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Exact-main GET-only population audit
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      AUTHORIZED_CLERK_USER_ID: ${{ secrets.AUTHORIZED_CLERK_USER_ID }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ANALYTICS_API_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_API_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DNA_POPULATION_HISTORY_READ_ONLY_AUDIT: "1"
      DNA_DATABASE_OWNER_ID: ${{ secrets.DNA_DATABASE_OWNER_ID }}
      DNA_R2_ACCESS_KEY_ID: ${{ secrets.DNA_R2_ACCESS_KEY_ID }}
      DNA_R2_BUCKET_NAME: dna-racing-import-preview
      DNA_R2_SECRET_ACCESS_KEY: ${{ secrets.DNA_R2_SECRET_ACCESS_KEY }}
      DNA_R2_STORAGE_CLASS: Standard
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
      EXPECTED_MAIN_SHA: a0b3c44943fe63e950029a2dfefd5c8bfcd6c371
    steps:
      - name: Checkout exact current main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Prove audited code is the expected current main
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="$(git rev-parse HEAD)"
          git fetch --no-tags origin main
          if [[ "$BASE_SHA" != "$EXPECTED_MAIN_SHA" ]] || \
             [[ "$(git rev-parse origin/main)" != "$EXPECTED_MAIN_SHA" ]]; then
            echo "Main moved; refusing stale connected audit."
            exit 1
          fi
          echo "AUDIT_MAIN_SHA=$BASE_SHA" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Validate private read-only bindings without exposure
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const required = [
            "AUTHORIZED_CLERK_USER_ID",
            "CLOUDFLARE_ACCOUNT_ID",
            "CLOUDFLARE_ANALYTICS_API_TOKEN",
            "CLOUDFLARE_API_TOKEN",
            "DATABASE_URL",
            "DNA_DATABASE_OWNER_ID",
            "DNA_R2_ACCESS_KEY_ID",
            "DNA_R2_BUCKET_NAME",
            "DNA_R2_SECRET_ACCESS_KEY",
            "DNA_R2_STORAGE_CLASS",
            "NEON_API_KEY",
            "NEON_PROJECT_ID",
          ];
          const invalid = required.filter((name) => {
            const value = process.env[name];
            return !value || value.trim() !== value || value.length > 4096;
          });
          if (invalid.length > 0) {
            throw new Error("Missing or invalid private settings: " + invalid.join(", "));
          }
          if (process.env.DNA_R2_STORAGE_CLASS !== "Standard") {
            throw new Error("Only R2 Standard storage is allowed.");
          }
          console.log("Validated private read-only settings without printing values.");
          NODE
      - name: Run existing receipt-backed GET-only population audit
        shell: bash
        run: |
          GITHUB_SHA="$AUDIT_MAIN_SHA" npx vitest run --no-file-parallelism \
            tests/hosted-preview-connected-population-history-audit.test.ts
      - name: Prove exact main remained unchanged
        if: always()
        shell: bash
        run: |
          git fetch --no-tags origin main
          if [[ "$(git rev-parse origin/main)" != "$AUDIT_MAIN_SHA" ]]; then
            echo "Main changed during the connected audit."
            exit 1
          fi
