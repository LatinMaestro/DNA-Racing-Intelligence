name: Cloudflare Preview consumer diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/cloudflare-preview-consumer-diagnostic.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      EXPECTED_ACTIVATION_QUEUE_ID: df7408e1d697475db4dbcdda1aa3e247
    steps:
      - name: Inspect sanitized queue consumers
        run: |
          node --input-type=module <<'NODE'
          const response = await fetch(
            "https://api.cloudflare.com/client/v4/accounts/" +
              process.env.CLOUDFLARE_ACCOUNT_ID +
              "/queues/" +
              process.env.EXPECTED_ACTIVATION_QUEUE_ID +
              "/consumers",
            {
              headers: {
                Authorization: "Bearer " + process.env.CLOUDFLARE_API_TOKEN,
                "Content-Type": "application/json",
              },
            },
          );
          const body = await response.json();
          if (!response.ok || body.success !== true || !Array.isArray(body.result)) {
            throw new Error("Could not read Cloudflare queue consumers");
          }
          const sanitized = body.result.map((consumer) => ({
            consumer_id: consumer.consumer_id ?? null,
            type: consumer.type ?? null,
            script_name: consumer.script_name ?? null,
            queue_name: consumer.queue_name ?? null,
            dead_letter_queue: consumer.dead_letter_queue ?? null,
            settings: consumer.settings ?? null,
          }));
          console.log(JSON.stringify({ count: sanitized.length, consumers: sanitized }, null, 2));
          NODE
