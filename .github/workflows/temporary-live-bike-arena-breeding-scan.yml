name: temporary live Bike Arena pagination probe

on:
  push:
    branches:
      - temporary/chat-arena-breeding-scan-2026-09-21-do-not-merge

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DNA_OPEN_LAB_API_KEY_2: ${{ secrets.DNA_OPEN_LAB_API_KEY_2 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Probe Arena pages beyond has_more
        run: |
          node <<'NODE'
          const fs=require('fs');
          const key=process.env.DNA_OPEN_LAB_API_KEY_2;
          const base='https://api.dnaracing.run/fbike/pub/v1';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function arena(page){
            const r=await fetch(base+'/splice/arena',{
              method:'POST',
              headers:{
                'authorization':'Bearer '+key,
                'accept':'application/json',
                'content-type':'application/json'
              },
              body:JSON.stringify({f:{rvmode:'bike'},page})
            });
            const text=await r.text();
            let json=null; try{json=JSON.parse(text)}catch{}
            await sleep(450);
            return {status:r.status,json,text};
          }
          (async()=>{
            const pages=[];
            for(let page=1;page<=25;page++){
              const x=await arena(page);
              if(x.status!==200 || x.json?.status!=='success'){
                pages.push({page,status:x.status,error:x.text.slice(0,400)});
                break;
              }
              const result=x.json.result;
              pages.push({
                page,
                returnedPage:result.page,
                limit:result.limit,
                has_more:result.has_more,
                count:Array.isArray(result.cores)?result.cores.length:null,
                hids:Array.isArray(result.cores)?result.cores.map(c=>c.hid):[]
              });
              if(!Array.isArray(result.cores) || result.cores.length===0) break;
            }
            fs.writeFileSync('arena-pagination-probe.json',JSON.stringify({fetchedAt:new Date().toISOString(),pages},null,2));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: arena-pagination-probe
          path: arena-pagination-probe.json
          retention-days: 1
