name: DNA population entrant checkpoint Preview migration

on:
  workflow_dispatch:
    inputs:
      exact_main_sha:
        description: Exact current main commit containing the reviewed migration
        required: true
        type: string
      apply_private_preview_migration:
        description: Confirm reviewed entrant checkpoint migration apply to private Preview only
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: dna-population-entrant-authority-checkpoint-preview-migration
  cancel-in-progress: false

jobs:
  apply-reviewed-preview-migration:
    name: Apply reviewed entrant checkpoint migration to Preview
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: preview
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      EXPECTED_MAIN_SHA: ${{ inputs.exact_main_sha }}
    steps:
      - name: Require exact main dispatch and explicit Preview migration arm
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "This migration may only run from main."
            exit 1
          fi
          if [[ ! "$EXPECTED_MAIN_SHA" =~ ^[a-f0-9]{40}$ ]] || \
             [[ "$EXPECTED_MAIN_SHA" != "${GITHUB_SHA}" ]]; then
            echo "The supplied exact main commit is invalid or stale."
            exit 1
          fi
          if [[ "${{ inputs.apply_private_preview_migration }}" != "true" ]]; then
            echo "The private Preview migration was not explicitly armed."
            exit 1
          fi
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.exact_main_sha }}
      - name: Prove dispatch head is current main
        shell: bash
        run: |
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"
      - name: Validate private Preview database binding without exposure
        shell: bash
        run: |
          if [[ -z "${DATABASE_URL}" ]]; then
            echo "The private Preview database binding is unavailable."
            exit 1
          fi
      - name: Install PostgreSQL client
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
      - name: Fail closed unless the entrant checkpoint schema is absent
        shell: bash
        run: |
          psql "${DATABASE_URL}" --set ON_ERROR_STOP=1 <<'SQL'
          DO $contract$
          BEGIN
            IF to_regclass('dna.dna_population_entrant_authority_generation') IS NOT NULL
               OR to_regclass('dna.dna_population_entrant_authority_chunk') IS NOT NULL
               OR to_regprocedure(
                 'dna.begin_dna_population_entrant_authority_generation(uuid,jsonb,timestamp with time zone)'
               ) IS NOT NULL THEN
              RAISE EXCEPTION 'entrant checkpoint schema is not absent';
            END IF;
          END
          $contract$;
          SQL
      - name: Apply and prove entrant checkpoint migration with rollback on smoke failure
        shell: bash
        run: |
          set -euo pipefail
          psql "${DATABASE_URL}" --set ON_ERROR_STOP=1 --file \
            database/migrations/0117_dna_population_entrant_authority_checkpoint.up.sql
          if ! psql "${DATABASE_URL}" --set ON_ERROR_STOP=1 --file \
            database/migrations/0117_dna_population_entrant_authority_checkpoint.smoke.sql; then
            psql "${DATABASE_URL}" --set ON_ERROR_STOP=1 --file \
              database/migrations/0117_dna_population_entrant_authority_checkpoint.down.sql
            psql "${DATABASE_URL}" --set ON_ERROR_STOP=1 --file \
              database/migrations/0117_dna_population_entrant_authority_checkpoint.removal.sql
            exit 1
          fi
      - name: Prove exact main remained unchanged
        if: always()
        shell: bash
        run: |
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"
