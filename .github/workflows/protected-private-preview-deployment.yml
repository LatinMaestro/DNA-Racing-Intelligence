name: Protected private Preview deployment

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact accepted main commit to deploy
        required: true
        type: string
      deploy_protected_preview:
        description: Confirm one deliberate protected private Preview deployment
        required: true
        default: false
        type: boolean
      synchronize_preview_runtime:
        description: Synchronize the approved Preview runtime bindings without exposure
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: protected-private-preview-deployment
  cancel-in-progress: false

jobs:
  deploy-protected-preview:
    name: Deploy exact-main protected private Preview
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: preview
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      AUTHORIZED_CLERK_USER_ID: ${{ secrets.AUTHORIZED_CLERK_USER_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DNA_DATABASE_OWNER_ID: ${{ secrets.DNA_DATABASE_OWNER_ID }}
      DNA_DATABASE_RUNTIME_ROLE: dna_app_runtime
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ANALYTICS_API_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_API_TOKEN }}
      DNA_R2_ACCESS_KEY_ID: ${{ secrets.DNA_R2_ACCESS_KEY_ID }}
      DNA_R2_SECRET_ACCESS_KEY: ${{ secrets.DNA_R2_SECRET_ACCESS_KEY }}
      DNA_R2_BUCKET_NAME: dna-racing-import-preview
      DNA_IMPORT_QUEUE_ID: df7408e1d697475db4dbcdda1aa3e247
      DNA_IMPORT_QUEUE_NAME: dna-racing-import-preview
      DNA_IMPORT_DEAD_LETTER_QUEUE_NAME: dna-racing-import-preview-dlq
      DNA_IMPORT_LIMIT_R2_STORAGE_BYTES: "9500000000"
      DNA_IMPORT_LIMIT_R2_CLASS_A_OPERATIONS: "800000"
      DNA_IMPORT_LIMIT_R2_CLASS_B_OPERATIONS: "8000000"
      DNA_IMPORT_LIMIT_NEON_STORAGE_BYTES: "950000000"
      DNA_IMPORT_LIMIT_QUEUE_BACKLOG_MESSAGES: "1"
      DNA_IMPORT_MINIMUM_HEADROOM_BASIS_POINTS: "0"
      DNA_IMPORT_MAXIMUM_MEASUREMENT_AGE_MILLISECONDS: "300000"
      DNA_RACE_MERGE_EVIDENCE_BRIDGE_ENABLED: "true"
      ENABLE_PHASE0_REVIEW: "true"
    steps:
      - name: Require exact main and explicit Preview deployment arm
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "This deployment may only run from main."
            exit 1
          fi
          if [[ "${{ inputs.deploy_protected_preview }}" != "true" ]]; then
            echo "The protected private Preview deployment was not explicitly armed."
            exit 1
          fi
          if [[ "${{ inputs.synchronize_preview_runtime }}" != "true" ]]; then
            echo "The protected Preview runtime synchronization was not explicitly armed."
            exit 1
          fi
          if [[ "${{ inputs.expected_main_sha }}" != "${GITHUB_SHA}" ]]; then
            echo "The requested release candidate does not match this workflow head."
            exit 1
          fi
          if [[ ! "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The workflow head is not a full commit identity."
            exit 1
          fi
      - name: Checkout exact accepted head
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_main_sha }}
          fetch-depth: 0
      - name: Prove deployment head is current main
        shell: bash
        run: |
          git fetch --no-tags origin main
          if [[ "$(git rev-parse HEAD)" != "${GITHUB_SHA}" ]] || \
             [[ "$(git rev-parse origin/main)" != "${GITHUB_SHA}" ]]; then
            echo "The protected Preview deployment head is no longer current main."
            exit 1
          fi
          if ! grep -Eq '"deploymentEnabled"[[:space:]]*:[[:space:]]*false' vercel.json; then
            echo "Automatic Git deployment must remain disabled."
            exit 1
          fi
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "The accepted checkout is not clean."
            exit 1
          fi
      - name: Generate masked ephemeral Race Merge bridge nonce
        shell: bash
        run: |
          nonce="$(openssl rand -hex 32)"
          if [[ ! "${nonce}" =~ ^[a-f0-9]{64}$ ]]; then
            echo "Could not create a valid ephemeral bridge nonce."
            exit 1
          fi
          echo "::add-mask::${nonce}"
          echo "DNA_RACE_MERGE_EVIDENCE_BRIDGE_NONCE=${nonce}" >> "${GITHUB_ENV}"
      - name: Validate protected Preview provider settings without exposure
        shell: bash
        run: |
          invalid=0
          for name in VERCEL_ORG_ID VERCEL_PROJECT_ID VERCEL_TOKEN \
            AUTHORIZED_CLERK_USER_ID DATABASE_URL DNA_DATABASE_OWNER_ID \
            DNA_DATABASE_RUNTIME_ROLE CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN \
            CLOUDFLARE_ANALYTICS_API_TOKEN DNA_R2_ACCESS_KEY_ID DNA_R2_SECRET_ACCESS_KEY DNA_R2_BUCKET_NAME \
            DNA_IMPORT_QUEUE_ID DNA_IMPORT_QUEUE_NAME \
            DNA_IMPORT_DEAD_LETTER_QUEUE_NAME DNA_IMPORT_LIMIT_R2_STORAGE_BYTES \
            DNA_IMPORT_LIMIT_R2_CLASS_A_OPERATIONS \
            DNA_IMPORT_LIMIT_R2_CLASS_B_OPERATIONS \
            DNA_IMPORT_LIMIT_NEON_STORAGE_BYTES \
            DNA_IMPORT_LIMIT_QUEUE_BACKLOG_MESSAGES \
            DNA_IMPORT_MINIMUM_HEADROOM_BASIS_POINTS \
            DNA_IMPORT_MAXIMUM_MEASUREMENT_AGE_MILLISECONDS \
            DNA_RACE_MERGE_EVIDENCE_BRIDGE_ENABLED \
            DNA_RACE_MERGE_EVIDENCE_BRIDGE_NONCE ENABLE_PHASE0_REVIEW; do
            value="${!name:-}"
            if [[ -z "${value}" ]] || [[ "${value}" != "${value# }" ]] || \
               [[ "${value}" != "${value% }" ]] || [[ ${#value} -gt 4096 ]]; then
              echo "Missing or invalid protected Preview setting: ${name}"
              invalid=1
            fi
          done
          if [[ "${invalid}" -ne 0 ]]; then
            exit 1
          fi
          echo "Validated protected Preview settings without printing their values."
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Install pinned Vercel CLI
        run: npm install --global vercel@50.1.6
      - name: Link only the protected Preview project
        shell: bash
        run: |
          mkdir -p .vercel
          node --input-type=module <<'NODE'
          import { writeFile } from "node:fs/promises";

          await writeFile(
            ".vercel/project.json",
            JSON.stringify({
              orgId: process.env.VERCEL_ORG_ID,
              projectId: process.env.VERCEL_PROJECT_ID,
            }),
            { mode: 0o600 },
          );
          NODE
      - name: Synchronize bounded Preview runtime configuration without exposure
        shell: bash
        run: |
          node scripts/vercel-preview-environment-sync.mjs
          node scripts/vercel-preview-environment-sync.mjs --validate-only
      - name: Pull protected Preview configuration
        shell: bash
        run: >-
          vercel pull
          --yes
          --environment=preview
          --token="${VERCEL_TOKEN}"
      - name: Build and deploy isolated Preview remotely
        id: deploy
        shell: bash
        run: |
          url="$(vercel deploy --yes --token="${VERCEL_TOKEN}")"
          if [[ ! "${url}" =~ ^https://[^/]+\.vercel\.app$ ]]; then
            echo "The deployment command did not return a valid Preview URL."
            exit 1
          fi
          echo "url=${url}" >> "${GITHUB_OUTPUT}"
          echo "Created the isolated protected Preview deployment."
      - name: Configure exact-origin private R2 browser upload CORS
        shell: bash
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        run: |
          node --input-type=module <<'NODE'
          import { PutObjectCommand, S3Client } from "@aws-sdk/client-s3";
          import { getSignedUrl } from "@aws-sdk/s3-request-presigner";

          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID ?? "";
          const apiToken = process.env.CLOUDFLARE_API_TOKEN ?? "";
          const bucketName = process.env.DNA_R2_BUCKET_NAME ?? "";
          const accessKeyId = process.env.DNA_R2_ACCESS_KEY_ID ?? "";
          const secretAccessKey = process.env.DNA_R2_SECRET_ACCESS_KEY ?? "";
          const previewUrl = new URL(process.env.PREVIEW_URL ?? "");

          if (
            !/^[a-f0-9]{32}$/u.test(accountId) ||
            apiToken.length < 1 ||
            bucketName !== "dna-racing-import-preview" ||
            accessKeyId.length < 1 ||
            secretAccessKey.length < 1 ||
            previewUrl.protocol !== "https:" ||
            !/^dna-racing-website-[a-z0-9-]+-latinmaestros-projects\.vercel\.app$/u.test(
              previewUrl.hostname,
            ) ||
            previewUrl.pathname !== "/" ||
            previewUrl.search !== "" ||
            previewUrl.hash !== ""
          ) {
            throw new Error("Protected Preview R2 CORS authority is invalid.");
          }

          const origin = previewUrl.origin;
          const apiBase =
            "https://api.cloudflare.com/client/v4/accounts/" +
            accountId +
            "/r2/buckets/" +
            encodeURIComponent(bucketName);

          const headers = {
            Accept: "application/json",
            Authorization: "Bearer " + apiToken,
            "Content-Type": "application/json",
          };

          async function cloudflare(path, init = {}) {
            const response = await fetch(apiBase + path, {
              ...init,
              headers: { ...headers, ...(init.headers ?? {}) },
              cache: "no-store",
            });
            let body;
            try {
              body = await response.json();
            } catch {
              throw new Error("Cloudflare R2 CORS response is invalid.");
            }
            if (!response.ok || body?.success !== true) {
              throw new Error("Cloudflare R2 CORS request was rejected.");
            }
            return body.result;
          }

          const ruleId = "dna-private-preview-browser-put-v1";
          const desiredRule = {
            id: ruleId,
            allowed: {
              origins: [origin],
              methods: ["PUT"],
              headers: ["Content-Type"],
            },
            exposeHeaders: ["ETag"],
            maxAgeSeconds: 3600,
          };

          const before = await cloudflare("/cors", { method: "GET" });
          const existingRules = Array.isArray(before?.rules) ? before.rules : [];
          if (existingRules.length > 1) {
            throw new Error("Unexpected R2 CORS policy drift.");
          }
          if (existingRules.length === 1) {
            const existing = existingRules[0];
            const existingOrigin = existing?.allowed?.origins?.[0] ?? "";
            const stableShape =
              existing?.id === ruleId &&
              Array.isArray(existing?.allowed?.origins) &&
              existing.allowed.origins.length === 1 &&
              /^https:\/\/dna-racing-website-[a-z0-9-]+-latinmaestros-projects\.vercel\.app$/u.test(
                existingOrigin,
              ) &&
              JSON.stringify(existing?.allowed?.methods ?? []) ===
                JSON.stringify(["PUT"]) &&
              JSON.stringify(existing?.allowed?.headers ?? []) ===
                JSON.stringify(["Content-Type"]) &&
              JSON.stringify(existing?.exposeHeaders ?? []) ===
                JSON.stringify(["ETag"]) &&
              Number(existing?.maxAgeSeconds) === 3600;
            if (!stableShape) {
              throw new Error("Unexpected R2 CORS policy drift.");
            }
          }

          await cloudflare("/cors", {
            method: "PUT",
            body: JSON.stringify({ rules: [desiredRule] }),
          });

          const after = await cloudflare("/cors", { method: "GET" });
          const rules = Array.isArray(after?.rules) ? after.rules : [];
          if (
            rules.length !== 1 ||
            rules[0]?.id !== ruleId ||
            JSON.stringify(rules[0]?.allowed?.origins ?? []) !==
              JSON.stringify([origin]) ||
            JSON.stringify(rules[0]?.allowed?.methods ?? []) !==
              JSON.stringify(["PUT"]) ||
            JSON.stringify(rules[0]?.allowed?.headers ?? []) !==
              JSON.stringify(["Content-Type"]) ||
            JSON.stringify(rules[0]?.exposeHeaders ?? []) !==
              JSON.stringify(["ETag"]) ||
            Number(rules[0]?.maxAgeSeconds) !== 3600
          ) {
            throw new Error("R2 CORS verification failed.");
          }

          const [managed, custom] = await Promise.all([
            cloudflare("/domains/managed", { method: "GET" }),
            cloudflare("/domains/custom", { method: "GET" }),
          ]);
          if (
            managed?.enabled !== false ||
            !Array.isArray(custom?.domains) ||
            custom.domains.length !== 0
          ) {
            throw new Error(
              "R2 bucket privacy changed while configuring browser upload CORS.",
            );
          }

          const s3 = new S3Client({
            region: "auto",
            endpoint:
              "https://" + accountId + ".r2.cloudflarestorage.com",
            forcePathStyle: true,
            credentials: { accessKeyId, secretAccessKey },
          });
          const presigned = await getSignedUrl(
            s3,
            new PutObjectCommand({
              Bucket: bucketName,
              Key:
                "quarantine/cors-preflight/" +
                process.env.GITHUB_RUN_ID +
                ".csv",
              ContentType: "text/csv",
            }),
            { expiresIn: 600 },
          );

          let verified = false;
          for (let attempt = 0; attempt < 6; attempt += 1) {
            const response = await fetch(presigned, {
              method: "OPTIONS",
              headers: {
                Origin: origin,
                "Access-Control-Request-Method": "PUT",
                "Access-Control-Request-Headers": "content-type",
              },
            });
            const allowedOrigin =
              response.headers.get("access-control-allow-origin");
            const methods =
              response.headers
                .get("access-control-allow-methods")
                ?.split(",")
                .map((value) => value.trim().toUpperCase()) ?? [];
            const allowedHeaders =
              response.headers
                .get("access-control-allow-headers")
                ?.split(",")
                .map((value) => value.trim().toLowerCase()) ?? [];
            if (
              response.ok &&
              allowedOrigin === origin &&
              methods.includes("PUT") &&
              allowedHeaders.includes("content-type")
            ) {
              verified = true;
              break;
            }
            if (attempt < 5) {
              await new Promise((resolve) => setTimeout(resolve, 5000));
            }
          }
          if (!verified) {
            throw new Error("R2 browser CORS preflight verification failed.");
          }

          console.log(
            "Configured and verified exact-origin private R2 browser PUT CORS.",
          );
          NODE
      - name: Verify deployment is ready and private
        shell: bash
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        run: |
          vercel inspect "${PREVIEW_URL}" \
            --wait --timeout=10m --token="${VERCEL_TOKEN}"
          headers="$(mktemp)"
          trap 'rm -f "${headers}"' EXIT
          status="$(curl --silent --show-error --output /dev/null \
            --dump-header "${headers}" \
            --write-out '%{http_code}' "${PREVIEW_URL}/")"
          case "${status}" in
            401|403) ;;
            302|303|307|308)
              location="$(awk '
                BEGIN { IGNORECASE = 1 }
                /^location:/ {
                  sub(/^[^:]*:[[:space:]]*/, "")
                  sub(/\r$/, "")
                  print
                  exit
                }
              ' "${headers}")"
              case "${location}" in
                https://vercel.com/login*|https://vercel.com/sso-api*) ;;
                *)
                  echo "The Preview redirected without a verified Vercel authentication challenge."
                  exit 1
                  ;;
              esac
              ;;
            *)
              echo "The Preview did not fail closed to an unauthenticated request (HTTP ${status})."
              exit 1
              ;;
          esac
          echo "Verified the Preview is ready and unauthenticated access is blocked."
      - name: Prove exact main remained unchanged
        if: always()
        shell: bash
        run: |
          git fetch --no-tags origin main
          if [[ "$(git rev-parse origin/main)" != "${GITHUB_SHA}" ]]; then
            echo "Main changed during the protected Preview deployment."
            exit 1
          fi
